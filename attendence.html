</style></head><body><main id="app"><header><div class="brand"><h1>804 午休時光・湯姆與傑利<small>☾ 安靜休息，慢慢充電　✦</small></h1></div><div class="datebox"><input aria-label="紀錄日期" id="date" type="date"/> <span id="weekday"></span></div></header><section class="stats"><div class="stat">應到人數<strong>28</strong></div><div class="stat">實到人數<strong id="present">28</strong></div><div class="stat">未在教室<strong id="absent">0</strong></div></section><section class="main"><div aria-hidden="true" class="mascot watermark jerry-watermark"><img alt="午睡的傑利鼠" onerror="this.hidden=true;this.nextElementSibling.style.display='block'" src="./jerry.png"/><svg aria-label="午睡的傑利鼠" role="img" style="display:none" viewbox="0 0 180 100" xmlns="http://www.w3.org/2000/svg"><g stroke="#936c51" stroke-linejoin="round" stroke-width="2"><ellipse cx="88" cy="88" fill="#e4d8c7" rx="79" ry="8" stroke="none"></ellipse><rect fill="#fff4d9" height="30" rx="13" width="91" x="12" y="60"></rect><path d="M119 80 Q168 92 168 62" fill="none" stroke="#b68154" stroke-linecap="round" stroke-width="5"></path><ellipse cx="107" cy="70" fill="#b68154" rx="40" ry="21"></ellipse><circle cx="36" cy="30" fill="#b68154" r="22"></circle><circle cx="36" cy="30" fill="#e8b6a4" r="15" stroke="none"></circle><circle cx="86" cy="27" fill="#b68154" r="24"></circle><circle cx="86" cy="27" fill="#e8b6a4" r="17" stroke="none"></circle><path d="M34 48 Q41 22 68 27 Q94 29 100 53 L109 64 Q103 83 73 84 Q37 87 31 66Z" fill="#b68154"></path><path d="M45 61 Q53 52 65 62 Q82 50 96 61 Q111 75 88 82 Q58 90 42 74Z" fill="#f5dfb8" stroke="none"></path><path d="M43 51 Q50 58 57 51 M77 51 Q84 58 91 51" fill="none" stroke-linecap="round"></path><ellipse cx="69" cy="65" fill="#47352e" rx="6" ry="4"></ellipse><path d="M62 73 Q69 78 77 72" fill="none" stroke-linecap="round"></path><path d="M98 57 Q127 51 145 69 L145 86 L92 86 Q101 72 98 57Z" fill="#b8cdb4" stroke="#829c80"></path><path d="M110 63 L110 83 M125 63 L125 84" stroke="#dce8d7"></path><ellipse cx="94" cy="83" fill="#f5dfb8" rx="12" ry="6"></ellipse></g><text fill="#967eaa" font-size="16" font-weight="bold" x="122" y="25">Z z</text></svg></div><div aria-hidden="true" class="mascot watermark tom-watermark"><img alt="午睡的湯姆貓" onerror="this.hidden=true;this.nextElementSibling.style.display='block'" src="./tom.png"/><svg aria-label="熟睡的湯姆貓" role="img" style="display:none" viewbox="0 0 180 100" xmlns="http://www.w3.org/2000/svg"><g stroke="#526273" stroke-linejoin="round" stroke-width="2"><ellipse cx="88" cy="87" fill="#c7d9e1" rx="80" ry="9" stroke="none"></ellipse><rect fill="#f8f0d9" height="31" rx="14" width="105" x="9" y="59"></rect><path d="M99 72 Q125 38 151 61 Q169 75 154 86 L83 86Z" fill="#8298ad"></path><path d="M145 72 Q175 62 169 43" fill="none" stroke="#8298ad" stroke-linecap="round" stroke-width="9"></path><path d="M29 47 L24 10 L55 30 Q72 24 89 31 L111 9 L110 51 Q122 78 87 84 Q43 90 29 65Z" fill="#8298ad"></path><path d="M32 18 L48 34 L35 43Z M103 18 L91 35 L104 43Z" fill="#e7b9b8" stroke="none"></path><path d="M63 47 Q69 39 76 48 L85 64 Q105 62 106 74 Q89 89 67 80 Q42 84 37 70 Q42 61 58 64Z" fill="#fffdf4" stroke="none"></path><path d="M42 52 Q51 60 60 52 M82 52 Q91 60 100 52" fill="none" stroke-linecap="round"></path><ellipse cx="72" cy="64" fill="#34424e" rx="7" ry="5"></ellipse><path d="M72 69 Q65 77 59 71 M72 69 Q80 77 86 71 M40 65 L19 60 M40 70 L18 72 M103 65 L122 60 M103 70 L124 72" fill="none" stroke-linecap="round"></path><ellipse cx="105" cy="83" fill="#fffdf4" rx="19" ry="8"></ellipse></g><text fill="#647b91" font-size="16" font-weight="bold" x="125" y="24">Z z</text></svg></div><div class="column" id="left"></div><div class="column" id="right"></div></section><section aria-label="全班出席一覽" class="seats" id="seats"></section><footer><span id="status" role="status">綠色：在教室　紅色：未在教室</span><span class="rest-note">連湯姆與傑利都休息了，讓我們也安靜一下吧！</span><button id="today">今日</button><button id="clear">清空登記</button><button id="copy">複製紀錄</button><button id="full">全螢幕</button></footer></main><dialog id="returns"><strong id="returnTitle"></strong><div id="returnList"></div><button id="closeDialog">關閉</button></dialog><dialog id="custom"><strong>自訂去向與座號</strong><div id="customList"></div><button id="addCustom">＋ 新增原因</button> <button id="closeCustom">完成</button></dialog><script>
const cats=['事假','病假','公假','喪假','公差勤務','社團活動','導師室','輔導室','教務處','學務處','其他','健康中心','競賽練習','課業輔導','如廁'];const nums=Array.from({length:28},(_,i)=>i+1);const $=id=>document.getElementById(id);const key='804-lunch-attendance-v1:';const fresh=()=>({groups:cats.map(()=>[]),note:'',custom:[]});let data=fresh(),day='';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const pad=n=>String(n).padStart(2,'0');function load(d){day=d||today();$('date').value=day;try{const raw=JSON.parse(localStorage.getItem(key+day));data=fresh();if(raw&&Array.isArray(raw.groups)){const used=new Set();data.groups=cats.map((_,i)=>(Array.isArray(raw.groups[i])?raw.groups[i]:[]).filter(n=>nums.includes(n)&&!used.has(n)&&(used.add(n),true)));data.note=typeof raw.note==='string'?raw.note:'';data.custom=(Array.isArray(raw.custom)?raw.custom:[]).map(r=>({reason:String(r.reason||''),seats:(Array.isArray(r.seats)?r.seats:[]).filter(n=>nums.includes(n)&&!used.has(n)&&(used.add(n),true))}));if(data.note&&data.groups[10].length){data.custom.push({reason:data.note,seats:data.groups[10]});data.groups[10]=[];data.note=''}}}catch(e){data=fresh();$('status').textContent='無法讀取本機紀錄'}$('weekday').textContent='星期'+['日','一','二','三','四','五','六'][new Date(day+'T12:00:00').getDay()];render()}
function allOut(){return [...data.groups.flat(),...data.custom.flatMap(r=>r.seats)]}function save(){try{localStorage.setItem(key+day,JSON.stringify(data));$('status').textContent='已儲存｜綠：在教室　紅：未在教室'}catch(e){$('status').textContent='本機儲存失敗，請複製紀錄備份'}}function change(){save();render()}function remove(i,n){data.groups[i]=data.groups[i].filter(x=>x!==n);change()}function render(){const out=allOut();$('present').textContent=28-out.length;$('absent').textContent=out.length; $('left').replaceChildren();$('right').replaceChildren();[0,1,2,3,4,5,12,13,6,7,8,9,11,14,10].forEach((i,pos)=>{const c=cats[i];const row=document.createElement('div');row.className='entry';const label=document.createElement('label');label.textContent=c;label.htmlFor='select'+i;const sel=document.createElement('select');sel.id='select'+i;sel.add(new Option('選座號',''));nums.filter(n=>!out.includes(n)).forEach(n=>sel.add(new Option(pad(n)+' 號',n)));sel.disabled=out.length===28;sel.onchange=()=>{const n=Number(sel.value);if(nums.includes(n)&&!allOut().includes(n)){data.groups[i].push(n);data.groups[i].sort((a,b)=>a-b);change()}};const chips=document.createElement('div');chips.className='chips'+(data.groups[i].length>8?' dense':'');if(data.groups[i].length>5){const b=document.createElement('button');b.className='chip';b.textContent='查看 '+data.groups[i].length+' 人';b.onclick=()=>openReturns(i);chips.append(b)}else data.groups[i].forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=pad(n)+' ×';b.title='取消登記 '+n+' 號';b.onclick=()=>remove(i,n);chips.append(b)});const count=document.createElement('span');count.className='count';count.textContent=data.groups[i].length+' 人';row.append(label,sel,chips,count);$(pos<8?'left':'right').append(row)});const other=document.createElement('div');other.className='other';const l=document.createElement('span');l.textContent='自訂 '+data.custom.reduce((n,r)=>n+r.seats.length,0)+' 人：'+data.custom.filter(r=>r.seats.length).map(r=>(r.reason||'其他')+' '+r.seats.map(pad).join('、')).join('；');l.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0';l.title=l.textContent;const btn=document.createElement('button');btn.textContent='＋ 原因／座號';btn.onclick=()=>{if(!data.custom.length)data.custom.push({reason:'',seats:[]});renderCustom();$('custom').showModal()};other.append(l,btn);$('right').append(other);$('seats').replaceChildren();nums.forEach(n=>{const i=data.groups.findIndex(g=>g.includes(n));const ci=data.custom.findIndex(r=>r.seats.includes(n));const b=document.createElement('button');b.className='seat'+(i>=0||ci>=0?' out':'');b.textContent=pad(n);b.title=i>=0?cats[i]+'：點擊取消登記':ci>=0?(data.custom[ci].reason||'其他')+'：點擊取消登記':'在教室';b.setAttribute('aria-label',n+'號 '+b.title);if(i>=0||ci>=0)b.onclick=()=>{if(confirm(n+' 號已返回教室？')){if(i>=0)remove(i,n);else{data.custom[ci].seats=data.custom[ci].seats.filter(x=>x!==n);change()}}};$('seats').append(b)})}
function openReturns(i){$('returnTitle').textContent=cats[i]+'｜點選座號取消登記';$('returnList').replaceChildren();data.groups[i].forEach(n=>{const b=document.createElement('button');b.textContent=pad(n)+' ×';b.onclick=()=>{remove(i,n);if(data.groups[i].length)openReturns(i);else $('returns').close()};$('returnList').append(b)});if(!$('returns').open)$('returns').showModal()}
function renderCustom(){const list=$('customList');list.replaceChildren();data.custom.forEach((r,i)=>{const row=document.createElement('div');row.className='customrow';const input=document.createElement('input');input.placeholder='例如：圖書館';input.value=r.reason;input.oninput=()=>{r.reason=input.value;save()};const sel=document.createElement('select');sel.add(new Option('選座號',''));nums.filter(n=>!allOut().includes(n)).forEach(n=>sel.add(new Option(pad(n)+' 號',n)));sel.onchange=()=>{const n=Number(sel.value);if(nums.includes(n)&&!allOut().includes(n)){r.seats.push(n);change();renderCustom()}};row.append(input,sel);r.seats.forEach(n=>{const b=document.createElement('button');b.textContent=pad(n)+' ×';b.onclick=()=>{r.seats=r.seats.filter(x=>x!==n);change();renderCustom()};row.append(b)});const del=document.createElement('button');del.textContent='刪除原因';del.onclick=()=>{if(!r.seats.length||confirm('刪除此原因及座號？')){data.custom.splice(i,1);change();renderCustom()}};row.append(del);list.append(row)})} $('addCustom').onclick=()=>{data.custom.push({reason:'',seats:[]});renderCustom()};$('closeCustom').onclick=()=>{change();$('custom').close()};$('closeDialog').onclick=()=>$('returns').close();$('date').onchange=()=>load($('date').value);$('today').onclick=()=>load(today());$('clear').onclick=()=>{if(confirm('確定清空 '+day+' 的全部登記？')){data=fresh();change()}};$('copy').onclick=async()=>{const t=[day+' 804 午休出席紀錄','應到：28 人','實到：'+(28-allOut().length)+' 人','未在教室：'+allOut().length+' 人',...cats.map((c,i)=>c+'：'+(data.groups[i].map(pad).join('、')||'無')),...data.custom.map(r=>(r.reason||'其他')+'：'+(r.seats.map(pad).join('、')||'無')),'舊版備註：'+(data.note||'無')].join('\n');try{await navigator.clipboard.writeText(t);$('status').textContent='已複製紀錄'}catch(e){prompt('請手動複製紀錄',t)}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('status').textContent='此瀏覽器不支援全螢幕，請使用瀏覽器全螢幕功能'}};document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'退出全螢幕':'全螢幕');load(today());let lastToday=today();setInterval(()=>{const now=today();if(now!==lastToday){if(day===lastToday)load(now);lastToday=now}},15000);
</script></body></html>
