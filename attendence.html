function seatStates(raw){const v=normalize(raw),m=new Map();v.groups.forEach((g,i)=>g.forEach(n=>m.set(n,{kind:'group',i})));v.custom.forEach(r=>r.seats.forEach(n=>m.set(n,{kind:'custom',reason:r.reason})));return m}
function mergeChanges(current,old,payload){const before=seatStates(old),after=seatStates(payload),live=seatStates(current),result=normalize(current);let conflict=false;for(const n of nums){const a=before.get(n)||null,b=after.get(n)||null,c=live.get(n)||null;if(canonical(a)===canonical(b))continue;if(canonical(c)!==canonical(a)&&canonical(c)!==canonical(b)){conflict=true;continue}result.groups=result.groups.map(g=>g.filter(x=>x!==n));result.custom.forEach(r=>r.seats=r.seats.filter(x=>x!==n));if(b?.kind==='group')result.groups[b.i].push(n);else if(b?.kind==='custom'){let r=result.custom.find(r=>r.reason===b.reason);if(!r){r={reason:b.reason,seats:[]};result.custom.push(r)}r.seats.push(n)}}result.groups.forEach(g=>g.sort((a,b)=>a-b));result.custom=result.custom.filter(r=>r.seats.length);result.custom.forEach(r=>r.seats.sort((a,b)=>a-b));return {result,conflict}}
async function save(){if(!canEdit())return;const d=day,old=baseline,payload=JSON.parse(JSON.stringify(data));pending=true;lock();status('● 同步中…');try{localStorage.setItem('804-lunch-backup:'+d,JSON.stringify(payload))}catch(e){}try{let conflict=false;const result=await runTransaction(path(d),current=>{const merged=mergeChanges(current,old,payload);conflict=merged.conflict;return {...merged.result,updatedAt:serverTimestamp()}},{applyLocally:false});baseline=result.snapshot.val();data=normalize(baseline);status(!result.committed?'同步未完成，請重試':conflict?'● 已同步｜部分座號已有其他異動，請確認':'● 已同步｜'+new Date().toLocaleTimeString('zh-TW'))}catch(e){data=normalize(baseline);status('同步失敗，已保留本機備份：'+e.message)}finally{pending=false;render();lock()}}
function change(){save();render();lock()}function remove(i,n){data.groups[i]=data.groups[i].filter(x=>x!==n);change()}function render(){if($("seatView").open)queueMicrotask(drawSeat);const out=allOut();$('present').textContent=28-out.length;$('absent').textContent=out.length; $('left').replaceChildren();$('right').replaceChildren();[0,1,2,3,4,5,12,13,6,7,8,9,11,14,10].forEach((i,pos)=>{const c=cats[i];const row=document.createElement('div');row.className='entry';const label=document.createElement('label');label.textContent=c;label.htmlFor='select'+i;const sel=document.createElement('select');sel.id='select'+i;sel.add(new Option('選座號',''));nums.filter(n=>!out.includes(n)).forEach(n=>sel.add(new Option(pad(n)+' 號',n)));sel.disabled=out.length===28;sel.onchange=()=>{const n=Number(sel.value);if(nums.includes(n)&&!allOut().includes(n)){data.groups[i].push(n);data.groups[i].sort((a,b)=>a-b);change()}};const chips=document.createElement('div');chips.className='chips'+(data.groups[i].length>8?' dense':'');if(data.groups[i].length>5){const b=document.createElement('button');b.className='chip';b.textContent='查看 '+data.groups[i].length+' 人';b.title=data.groups[i].map(pad).join('、');b.onclick=()=>openReturns(i);chips.append(b)}else data.groups[i].forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=pad(n)+' ×';b.title='取消登記 '+n+' 號';b.onclick=()=>remove(i,n);chips.append(b)});const count=document.createElement('span');count.className='count';count.textContent=data.groups[i].length+' 人';row.append(label,sel,chips,count);$(pos<8?'left':'right').append(row)});const other=document.createElement('div');other.className='other';const l=document.createElement('span');l.textContent='自訂 '+data.custom.reduce((n,r)=>n+r.seats.length,0)+' 人：'+data.custom.filter(r=>r.seats.length).map(r=>(r.reason||'不知去向')+' '+r.seats.map(pad).join('、')).join('；');l.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0';l.title=l.textContent;const btn=document.createElement('button');btn.textContent='＋ 原因／座號';btn.onclick=()=>{if(!data.custom.length)data.custom.push({reason:'',seats:[]});renderCustom();$('custom').showModal()};other.append(l,btn);$('right').append(other);$('seats').replaceChildren();nums.forEach(n=>{const i=data.groups.findIndex(g=>g.includes(n));const ci=data.custom.findIndex(r=>r.seats.includes(n));const b=document.createElement('button');b.className='seat'+(i>=0||ci>=0?' out':'');b.textContent=pad(n);b.title=i>=0?cats[i]+'：點擊取消登記':ci>=0?(data.custom[ci].reason||'不知去向')+'：點擊取消登記':'在教室';b.setAttribute('aria-label',n+'號 '+b.title);if(i>=0||ci>=0)b.onclick=()=>{if(confirm(n+' 號已返回教室？')){if(i>=0)remove(i,n);else{data.custom[ci].seats=data.custom[ci].seats.filter(x=>x!==n);change()}}};$('seats').append(b)})}
function openReturns(i){$('returnTitle').textContent=cats[i]+'｜點選座號取消登記';$('returnList').replaceChildren();data.groups[i].forEach(n=>{const b=document.createElement('button');b.textContent=pad(n)+' ×';b.onclick=()=>{remove(i,n);if(data.groups[i].length)openReturns(i);else $('returns').close()};$('returnList').append(b)});if(!$('returns').open)$('returns').showModal()}
function renderCustom(){const list=$('customList');list.replaceChildren();data.custom.forEach((r,i)=>{const row=document.createElement('div');row.className='customrow';const input=document.createElement('input');input.placeholder='例如：圖書館';input.value=r.reason;input.oninput=()=>{r.reason=input.value};const sel=document.createElement('select');sel.add(new Option('選座號',''));nums.filter(n=>!allOut().includes(n)).forEach(n=>sel.add(new Option(pad(n)+' 號',n)));sel.onchange=()=>{const n=Number(sel.value);if(nums.includes(n)&&!allOut().includes(n)){r.seats.push(n);renderCustom()}};row.append(input,sel);r.seats.forEach(n=>{const b=document.createElement('button');b.textContent=pad(n)+' ×';b.onclick=()=>{r.seats=r.seats.filter(x=>x!==n);renderCustom()};row.append(b)});const del=document.createElement('button');del.textContent='刪除原因';del.onclick=()=>{if(!r.seats.length||confirm('刪除此原因及座號？')){data.custom.splice(i,1);renderCustom()}};row.append(del);list.append(row)})} $('addCustom').onclick=()=>{data.custom.push({reason:'',seats:[]});renderCustom()};$('closeCustom').onclick=()=>{$('custom').close();change()};$('closeDialog').onclick=()=>$('returns').close();$('date').onchange=()=>load($('date').value);$('today').onclick=()=>load(today());$('clear').onclick=()=>{if(confirm('確定清空 '+day+' 的全部登記？')){data=fresh();change()}};$('copy').onclick=async()=>{const t=[day+' 804 午休出席紀錄','應到：28 人','實到：'+(28-allOut().length)+' 人','未在教室：'+allOut().length+' 人',...cats.map((c,i)=>c+'：'+(data.groups[i].map(pad).join('、')||'無')),...data.custom.map(r=>(r.reason||'不知去向')+'：'+(r.seats.map(pad).join('、')||'無')),'舊版備註：'+(data.note||'無')].join('\n');try{await navigator.clipboard.writeText(t);$('status').textContent='已複製紀錄'}catch(e){prompt('請手動複製紀錄',t)}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('status').textContent='此瀏覽器不支援全螢幕，請使用瀏覽器全螢幕功能'}};document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'退出全螢幕':'全螢幕');$('custom').addEventListener('cancel',e=>{e.preventDefault();$('custom').close();data=normalize(baseline);render();lock()});$('copyUid').onclick=async()=>{try{await navigator.clipboard.writeText(uid)}catch(e){prompt('複製 UID',uid)}};
const importBtn=document.createElement('button');importBtn.textContent='匯入舊紀錄';$('copy').after(importBtn);importBtn.onclick=()=>{if(!canEdit()||remoteExists){alert('僅教室端且當日無雲端紀錄時可匯入');return}try{const raw=JSON.parse(localStorage.getItem(key+day));if(!raw){alert('此瀏覽器沒有當日舊紀錄');return}if(confirm('匯入 '+day+' 的舊版紀錄？')){data=normalize(raw);change()}}catch(e){alert('無法讀取舊紀錄')}};
let layout=null,layoutStop=null,layoutError='';
function drawSeat(){const grid=$('seatGrid');grid.replaceChildren();$('seatMissing').textContent='';$('seatInfo').textContent=day+'｜'+(layoutError||(!layout?'尚未取得座位配置':!ready?'等待出席紀錄':!connected?'離線：資料可能不是最新':'預計在班 '+(28-allOut().length)+' 人｜未到 '+allOut().length+' 人'));if(!role||!layout||!ready)return;const assigned=new Set();for(let i=0;i<30;i++){const n=layout['cell-'+i];const valid=nums.includes(n)&&!assigned.has(n);let reason='';if(valid){assigned.add(n);const j=data.groups.findIndex(g=>g.includes(n));const custom=data.custom.find(r=>r.seats.includes(n));reason=j>=0?cats[j]:custom?(custom.reason||'不知去向'):'';}const cell=document.createElement('div');cell.className=!valid?'empty':reason==='不知去向'?'unknown':reason?'away':'';const a=document.createElement('strong'),b=document.createElement('small');a.textContent=valid?pad(n):'—';b.textContent=valid?(reason||'預計在班'):'空位';cell.append(a,b);grid.append(cell)}$('seatMissing').textContent='未配置座位：'+(nums.filter(n=>!assigned.has(n)).map(pad).join('、')||'無')}
function watchLayout(){if(layoutStop)layoutStop();layout=null;layoutError='';if(!role){if($('seatView').open)$('seatView').close();return}layoutStop=onValue(ref(db,'seat_layout'),snap=>{layout=snap.val();layoutError='';if($('seatView').open)drawSeat()},()=>{layout=null;layoutError='無法讀取座位配置，請確認 Firebase 規則';if($('seatView').open)drawSeat()})}
$('seatOpen').onclick=()=>{if(role){$('seatView').showModal();drawSeat()}};$('seatClose').onclick=()=>$('seatView').close();
onValue(ref(db,'.info/connected'),snap=>{connected=snap.val()===true;lock();if($('seatView').open)drawSeat();if(role&&!connected)status('● 離線｜暫停修改')});
try{await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,user=>{if(!user)return;uid=user.uid;$('deviceUid').textContent=uid;onValue(ref(db,'authorized_devices/'+uid),snap=>{const v=snap.val();role=['editor','viewer'].includes(v)?v:'';$('cloudGate').hidden=!!role;$('app').inert=!role;watchLayout();$('gateMessage').textContent='尚未授權，請將 UID 加入 Firebase 授權名單。';if(role)load(day||today());else{if(unsub)unsub();generation++;ready=false;data=fresh();render();lock()}},e=>{$('gateMessage').textContent='授權讀取失敗：'+e.message})});if(!auth.currentUser)await signInAnonymously(auth)}catch(e){$('gateMessage').textContent='匿名驗證失敗：'+e.message}load(today());let lastToday=today();setInterval(()=>{const now=today();if(now!==lastToday){if(day===lastToday)load(now);lastToday=now}},15000);
</script></body></html>
