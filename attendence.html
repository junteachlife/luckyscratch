
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>804 午休時光・湯姆與傑利 V3.3</title>

<link rel="icon" type="image/png" href="./tom.png">

<style>
/* ========================================
   V3.3 星空靜謐｜深色午休版
   ======================================== */

:root {
    color-scheme: dark;
    --bg: #10151f;
    --panel: #1a2332;
    --border: #303c4e;
    --text: #b9c5d6;
    --muted: #8290a6;
    --green-bg: #203b32;
    --green-text: #a0c5ad;
    --red-bg: #482b35;
    --red-text: #dda4ab;
    --blue-bg: #202e44;
    --blue-text: #a5b9d8;
    --purple-bg: #2c293d;
    --purple-text: #bcb0d0;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft JhengHei",
                 "PingFang TC",
                 sans-serif;
}

/* 主畫面 */

#app {
    height: 100dvh;
    display: grid;
    grid-template-rows: 10fr 17fr 52fr 13fr 8fr;
    gap: .7vh;
    padding: 1.3vh 1.4vw;
    font-size: clamp(12px, 2vh, 30px);
}

/* 上方標題 */

header {
    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        clamp(85px, 12vw, 240px)
        auto;
    align-items: center;
    gap: 1vw;
    padding: .3vh 1vw;
    border: 1px solid #303c50;
    border-radius: 15px;
    background: linear-gradient(
        110deg,
        #192233,
        #232b40,
        #192233
    );
    overflow: hidden;
    position: relative;
    min-height: 0;
}

.brand {
    display: grid;
    grid-template-columns:
        clamp(85px, 12vw, 240px)
        minmax(0, 1fr);
    align-items: center;
    gap: 1vw;
    min-width: 0;
    min-height: 0;
    height: 100%;
}

.brand h1 {
    margin: 0;
    color: #bcc9e1;
    font-size: 1.38em;
    text-align: center;
    line-height: 1.2;
}

.brand small {
    display: block;
    font-size: .55em;
    font-weight: normal;
    color: #8e9db7;
    margin-top: .25em;
    letter-spacing: .08em;
}

/* 湯姆貓與傑利鼠 */

.mascot {
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.mascot img,
.mascot svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: brightness(.72) saturate(.85);
    pointer-events: none;
}

.mascot img[hidden] {
    display: none;
}

/* 日期 */

.datebox {
    display: flex;
    align-items: center;
    gap: .5em;
    white-space: nowrap;
    justify-self: end;
}

.datebox input {
    width: 9em;
    background: #202b3c;
    color: #b9c5d8 !important;
    -webkit-text-fill-color: #b9c5d8 !important;
    color-scheme: dark;
}

.datebox input::-webkit-datetime-edit {
    color: #b9c5d8;
}

#weekday {
    color: #93a3bd;
    font-weight: bold;
}

/* 共用操作元件 */

button, input, select {
    font: inherit;
    color: var(--text);
    background: #253043;
    border: 1px solid #3a475c;
    border-radius: 8px;
    padding: .35em .55em;
    min-width: 0;
}

button, select {
    cursor: pointer;
}

button {
    font-weight: bold;
    transition: filter .12s;
}

button:hover {
    filter: brightness(1.15);
}

button:active {
    filter: brightness(.9);
}

button:disabled,
select:disabled {
    opacity: .4;
    cursor: not-allowed;
}

select option {
    background: #202b3c;
    color: #bdc9dc;
}

input::placeholder {
    color: #78869d;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid #8297b4;
    outline-offset: 2px;
}

/* 三大人數統計 */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1vw;
    min-height: 0;
}

.stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--blue-bg);
    color: var(--blue-text);
    border: 1px solid #35445c;
    border-radius: 15px;
    font-weight: bold;
}

.stat:nth-child(2) {
    background: var(--green-bg);
    color: var(--green-text);
    border-color: #345044;
}

.stat:nth-child(3) {
    background: var(--red-bg);
    color: var(--red-text);
    border-color: #60404a;
}

.stat strong {
    font-size: 7vh;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
}

/* 未到原因登記 */

.main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1vw;
    min-height: 0;
}

.column {
    display: grid;
    grid-template-rows: repeat(8, minmax(0, 1fr));
    gap: .45vh;
    min-width: 0;
    min-height: 0;
}

.entry {
    display: grid;
    grid-template-columns:
        5.2em
        5.2em
        minmax(0, 1fr)
        2.5em;
    align-items: center;
    gap: .4em;
    padding: .15em .5em;
    min-height: 0;
    background: var(--panel);
    border: 1px solid #2e394b;
    border-radius: 11px;
}

.entry label {
    color: #aebbd0;
    font-weight: bold;
    white-space: nowrap;
}

.entry select {
    width: 100%;
    font-size: .9em;
    padding: .15em .25em;
    color: #99a9c1;
}

.chips {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 3px;
    min-width: 0;
    overflow: hidden;
}

.chip {
    color: #d5a0aa;
    background: #4d303b;
    border: 1px solid #61404b;
    border-radius: 6px;
    padding: .12em .3em;
    font-size: .85em;
    white-space: nowrap;
}

.count {
    text-align: right;
    white-space: nowrap;
    font-weight: bold;
    color: #8e9db5;
}

.dense {
    gap: 1px;
}

.dense .chip {
    font-size: .65em;
    padding: 0 .15em;
}

/* 自訂原因 */

.other {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5em;
    padding: .35em .55em;
    background: var(--purple-bg);
    color: var(--purple-text);
    border: 1px solid #423c55;
    border-radius: 11px;
    min-width: 0;
}

.other input {
    flex: 1;
    width: 0;
}

.other button {
    padding: .2em .5em;
    background: #39334b;
    color: #bfb3d5;
    border-color: #514761;
    white-space: nowrap;
}

/* 座號出席總覽 */

.seats {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: .5vh .4vw;
    min-height: 0;
}

.seat {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #223b33;
    color: #9bc0aa;
    border: 1px solid #345044;
    border-radius: 10px;
    font-size: 1.25em;
    font-weight: bold;
    padding: 0;
}

.seat.out {
    background: #52313b;
    color: #dda4ad;
    border: 1px solid #71444f;
}

/* 下方工具列 */

footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .7vw;
    font-size: .85em;
    min-width: 0;
}

footer button {
    background: #283447;
    color: #aebbd0;
    border: 1px solid #3a475b;
    white-space: nowrap;
}

#status {
    flex: 1;
    color: #8291a8;
}

.rest-note {
    color: #8b9bb3;
    font-size: .85em;
    white-space: nowrap;
}

/* 彈出視窗 */

dialog {
    border: 1px solid #42516a;
    border-radius: 16px;
    padding: 1.5em;
    max-width: 90vw;
    background: #1b2535;
    color: var(--text);
    box-shadow: 0 15px 60px #0008;
}

dialog::backdrop {
    background: #000a;
}

dialog strong {
    color: #bdc9dd;
}

#returnList {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 70vw;
    margin: 1em 0;
}

#returnList button {
    background: var(--red-bg);
    color: var(--red-text);
}

.customrow {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .5em;
    margin: .5em 0;
    padding: .6em;
    background: #222d3e;
    border-radius: 10px;
}

.customrow input {
    width: 12em;
}

.customrow select {
    max-width: 8em;
}

#customList {
    max-height: 60vh;
    overflow: auto;
    margin: 1em 0;
}

/* 螢幕尺寸適應 */

@media (max-width: 1000px) {
    .rest-note {
        display: none;
    }

    .brand h1 {
        font-size: 1.15em;
    }
}

@media (max-aspect-ratio: 5/4) {
    #app {
        height: auto;
        min-height: 100dvh;
        grid-template-rows: auto auto auto auto auto;
    }

    header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
    }

    .brand {
        display: flex;
        height: 65px;
        flex: 1;
    }

    .mascot {
        width: 85px;
        height: 65px;
    }

    .brand h1 {
        font-size: 1.2em;
    }

    .datebox {
        padding: .3em;
    }

    .main {
        grid-template-columns: 1fr;
    }

    .column {
        grid-template-rows: none;
    }

    .entry {
        min-height: 48px;
    }

    .stats {
        min-height: 100px;
    }

    .stat strong {
        font-size: 45px;
    }

    .seats {
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(4, 42px);
    }

    footer {
        flex-wrap: wrap;
    }
}
</style>
</head>

<script>

/* ========================================
   基本設定
   ======================================== */

const cats = [
    '事假',
    '病假',
    '公假',
    '喪假',
    '公差勤務',
    '社團活動',
    '導師室',
    '輔導室',
    '教務處',
    '學務處',
    '其他',
    '健康中心',
    '競賽練習',
    '課業輔導',
    '如廁'
];

const nums = Array.from(
    { length: 28 },
    (_, i) => i + 1
);

const $ = id => document.getElementById(id);

/* 保留原版儲存識別碼 */
const key = '804-lunch-attendance-v1:';

const fresh = () => ({
    groups: cats.map(() => []),
    note: '',
    custom: []
});

let data = fresh();
let day = '';

const pad = n => String(n).padStart(2, '0');

const today = () => {
    const d = new Date();

    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};

/* ========================================
   載入日期紀錄
   ======================================== */

function load(d) {

    day = d || today();
    $('date').value = day;

    data = fresh();

    try {

        const raw = JSON.parse(
            localStorage.getItem(key + day)
        );

        if (raw && Array.isArray(raw.groups)) {

            const used = new Set();

            data.groups = cats.map((_, i) => {

                const group = Array.isArray(raw.groups[i])
                    ? raw.groups[i]
                    : [];

                return group.filter(n =>
                    nums.includes(n) &&
                    !used.has(n) &&
                    (used.add(n), true)
                );

            });

            data.note = typeof raw.note === 'string'
                ? raw.note
                : '';

            data.custom = (
                Array.isArray(raw.custom)
                    ? raw.custom
                    : []
            ).map(r => ({

                reason: String(r.reason || ''),

                seats: (
                    Array.isArray(r.seats)
                        ? r.seats
                        : []
                ).filter(n =>
                    nums.includes(n) &&
                    !used.has(n) &&
                    (used.add(n), true)
                )

            }));

            /* 相容舊版自訂原因 */

            if (data.note && data.groups[10].length) {

                data.custom.push({
                    reason: data.note,
                    seats: data.groups[10]
                });

                data.groups[10] = [];
                data.note = '';

            }
        }

        $('status').textContent =
            '綠色：在教室　紅色：未在教室';

    } catch (e) {

        data = fresh();

        $('status').textContent =
            '無法讀取本機紀錄';

    }

    $('weekday').textContent =
        '星期' +
        ['日', '一', '二', '三', '四', '五', '六'][
            new Date(day + 'T12:00:00').getDay()
        ];

    render();

}

/* ========================================
   統計及儲存
   ======================================== */

function allOut() {

    return [...new Set([
        ...data.groups.flat(),
        ...data.custom.flatMap(r => r.seats)
    ])];

}

function save() {

    try {

        localStorage.setItem(
            key + day,
            JSON.stringify(data)
        );

        $('status').textContent =
            '已儲存｜綠：在教室　紅：未在教室';

    } catch (e) {

        $('status').textContent =
            '本機儲存失敗，請複製紀錄備份';

    }

}

function change() {
    save();
    render();
}

function remove(i, n) {

    data.groups[i] =
        data.groups[i].filter(x => x !== n);

    change();

}

/* ========================================
   更新主畫面
   ======================================== */

function render() {

    const out = allOut();

    $('present').textContent = 28 - out.length;
    $('absent').textContent = out.length;

    $('left').replaceChildren();
    $('right').replaceChildren();

    const order = [
        0, 1, 2, 3,
        4, 5, 12, 13,
        6, 7, 8, 9,
        11, 14, 10
    ];

    order.forEach((i, pos) => {

        const c = cats[i];

        const row = document.createElement('div');
        row.className = 'entry';

        const label = document.createElement('label');
        label.textContent = c;
        label.htmlFor = 'select' + i;

        const sel = document.createElement('select');
        sel.id = 'select' + i;
        sel.add(new Option('選座號', ''));

        nums.filter(n => !out.includes(n))
            .forEach(n => {
                sel.add(new Option(pad(n) + ' 號', n));
            });

        sel.disabled = out.length === 28;

        sel.onchange = () => {

            const n = Number(sel.value);

            if (
                nums.includes(n) &&
                !allOut().includes(n)
            ) {

                data.groups[i].push(n);

                data.groups[i].sort(
                    (a, b) => a - b
                );

                change();

            }

        };

        const chips = document.createElement('div');

        chips.className =
            'chips' +
            (data.groups[i].length > 8 ? ' dense' : '');

        if (data.groups[i].length > 5) {

            const b = document.createElement('button');

            b.className = 'chip';

            b.textContent =
                '查看 ' + data.groups[i].length + ' 人';

            b.onclick = () => openReturns(i);

            chips.append(b);

        } else {

            data.groups[i].forEach(n => {

                const b = document.createElement('button');

                b.className = 'chip';
                b.textContent = pad(n) + ' ×';

                b.title = '取消登記 ' + n + ' 號';

                b.onclick = () => remove(i, n);

                chips.append(b);

            });

        }

        const count = document.createElement('span');

        count.className = 'count';

        count.textContent =
            data.groups[i].length + ' 人';

        row.append(label, sel, chips, count);

        $(pos < 8 ? 'left' : 'right').append(row);

    });

    /* 自訂原因摘要 */

    const other = document.createElement('div');
    other.className = 'other';

    const l = document.createElement('span');

    l.textContent =
        '自訂 ' +
        data.custom.reduce(
            (n, r) => n + r.seats.length, 0
        ) +
        ' 人：' +
        data.custom
            .filter(r => r.seats.length)
            .map(r =>
                (r.reason || '其他') +
                ' ' +
                r.seats.map(pad).join('、')
            )
            .join('；');

    l.style.cssText =
        'overflow:hidden;' +
        'text-overflow:ellipsis;' +
        'white-space:nowrap;' +
        'min-width:0;';

    l.title = l.textContent;

    const btn = document.createElement('button');

    btn.textContent = '＋ 原因／座號';

    btn.onclick = () => {

        if (!data.custom.length) {

            data.custom.push({
                reason: '',
                seats: []
            });

        }

        renderCustom();

        $('custom').showModal();

    };

    other.append(l, btn);
    $('right').append(other);

    /* 座號總覽 */

    $('seats').replaceChildren();

    nums.forEach(n => {

        const i = data.groups.findIndex(
            g => g.includes(n)
        );

        const ci = data.custom.findIndex(
            r => r.seats.includes(n)
        );

        const b = document.createElement('button');

        b.className =
            'seat' +
            (i >= 0 || ci >= 0 ? ' out' : '');

        b.textContent = pad(n);

        b.title = i >= 0

            ? cats[i] + '：點擊取消登記'

            : ci >= 0

                ? (data.custom[ci].reason || '其他') +
                  '：點擊取消登記'

                : '在教室';

        b.setAttribute(
            'aria-label',
            n + '號 ' + b.title
        );

        if (i >= 0 || ci >= 0) {

            b.onclick = () => {

                if (confirm(n + ' 號已返回教室？')) {

                    if (i >= 0) {

                        remove(i, n);

                    } else {

                        data.custom[ci].seats =
                            data.custom[ci].seats.filter(
                                x => x !== n
                            );

                        change();

                    }

                }

            };

        }

        $('seats').append(b);

    });

}

/* ========================================
   多位學生返回教室
   ======================================== */

function openReturns(i) {

    $('returnTitle').textContent =
        cats[i] + '｜點選座號取消登記';

    $('returnList').replaceChildren();

    data.groups[i].forEach(n => {

        const b = document.createElement('button');

        b.textContent = pad(n) + ' ×';

        b.onclick = () => {

            remove(i, n);

            if (data.groups[i].length) {

                openReturns(i);

            } else {

                $('returns').close();

            }

        };

        $('returnList').append(b);

    });

    if (!$('returns').open) {
        $('returns').showModal();
    }

}

/* ========================================
   自訂原因管理
   ======================================== */

function renderCustom() {

    const list = $('customList');

    list.replaceChildren();

    data.custom.forEach((r, i) => {

        const row = document.createElement('div');

        row.className = 'customrow';

        const input = document.createElement('input');

        input.placeholder = '例如：圖書館';

        input.value = r.reason;

        input.oninput = () => {

            r.reason = input.value;

            save();

        };

        const sel = document.createElement('select');

        sel.add(new Option('選座號', ''));

        nums.filter(n => !allOut().includes(n))
            .forEach(n => {

                sel.add(
                    new Option(pad(n) + ' 號', n)
                );

            });

        sel.onchange = () => {

            const n = Number(sel.value);

            if (
                nums.includes(n) &&
                !allOut().includes(n)
            ) {

                r.seats.push(n);

                r.seats.sort((a, b) => a - b);

                change();
                renderCustom();

            }

        };

        row.append(input, sel);

        r.seats.forEach(n => {

            const b = document.createElement('button');

            b.textContent = pad(n) + ' ×';

            b.onclick = () => {

                r.seats = r.seats.filter(x => x !== n);

                change();
                renderCustom();

            };

            row.append(b);

        });

        const del = document.createElement('button');

        del.textContent = '刪除原因';

        del.onclick = () => {

            if (
                !r.seats.length ||
                confirm('刪除此原因及座號？')
            ) {

                data.custom.splice(i, 1);

                change();
                renderCustom();

            }

        };

        row.append(del);

        list.append(row);

    });

}

/* ========================================
   按鈕事件
   ======================================== */

$('addCustom').onclick = () => {

    data.custom.push({
        reason: '',
        seats: []
    });

    renderCustom();

};

$('closeCustom').onclick = () => {

    change();

    $('custom').close();

};

$('custom').addEventListener('close', () => {
    change();
});

$('closeDialog').onclick = () => {
    $('returns').close();
};

$('date').onchange = () => {
    load($('date').value);
};

$('today').onclick = () => {
    load(today());
};

/* 清空當日紀錄 */

$('clear').onclick = () => {

    if (
        confirm('確定清空 ' + day + ' 的全部登記？')
    ) {

        data = fresh();

        change();

    }

};

/* 複製當日紀錄 */

$('copy').onclick = async () => {

    const t = [

        day + ' 804 午休出席紀錄',

        '應到：28 人',

        '實到：' + (28 - allOut().length) + ' 人',

        '未在教室：' + allOut().length + ' 人',

        ...cats.map((c, i) =>
            c + '：' +
            (data.groups[i].map(pad).join('、') || '無')
        ),

        ...data.custom.map(r =>
            (r.reason || '其他') + '：' +
            (r.seats.map(pad).join('、') || '無')
        ),

        '舊版備註：' + (data.note || '無')

    ].join('\n');

    try {

        await navigator.clipboard.writeText(t);

        $('status').textContent = '已複製紀錄';

    } catch (e) {

        prompt('請手動複製紀錄', t);

    }

};

/* 全螢幕 */

$('full').onclick = async () => {

    try {

        if (document.fullscreenElement) {

            await document.exitFullscreen();

        } else {

            await document.documentElement.requestFullscreen();

        }

    } catch (e) {

        $('status').textContent =
            '此瀏覽器不支援全螢幕，請使用瀏覽器全螢幕功能';

    }

};

document.addEventListener('fullscreenchange', () => {

    $('full').textContent =
        document.fullscreenElement
            ? '退出全螢幕'
            : '全螢幕';

});

/* ========================================
   初始化及跨日自動更新
   ======================================== */

load(today());

let lastToday = today();

setInterval(() => {

    const now = today();

    if (now !== lastToday) {

        if (day === lastToday) {

            load(now);

        }

        lastToday = now;

    }

}, 15000);

</script>
</body>
</html>
