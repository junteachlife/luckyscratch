html{min-height:100%;background:#70c8ec}
body{

  background-attachment:fixed;
  color:var(--ink);
  position:relative;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 7px),
    radial-gradient(ellipse at 50% 118%,rgba(255,255,255,.18),transparent 45%);

  content:"⚓   ☠   🧭   ⚓";

}

.stat{background:#f8ebc5;border:1px solid #d5b56f;color:#5d4428}

.error{background:linear-gradient(180deg,#fff0ea,#ffdcd2);color:#a72e22;border-color:#df9a89}

.teacher-tools-title{color:#166b9c}
.table-wrap{border:1.5px solid #ceb06f;background:#fffdf4;box-shadow:0 4px 12px rgba(85,60,30,.07)}

.summary-table th,.summary-table td{border-bottom-color:#ddc792;border-right-color:#eadab8}

details{border:1px dashed #c6a666;border-radius:12px;padding:10px;background:rgba(255,249,228,.52)}

}

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],SYNTH_DOMAIN="class-datawork.local";

function esc(v=''){return String(v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function scopeKey(a){return `${a.semester}|${a.classId}|${a.scopeType}|${a.scopeName}`}

function isTeacherModeProfile(){return !!profile&&(profile.type==='teacher'||profile.type==='admin')}
function isHistoricalReadOnly(){return isTeacherModeProfile()&&viewSemester!==currentSemester}
function canCollection(a){return !!a?.canCollection&&!isHistoricalReadOnly()}

function canConfirm(a){return !!a&&(a.kind==='assistant'||a.kind==='teacher')&&!isHistoricalReadOnly()}
function isTeacherAssignment(a){return !!a&&a.kind==='teacher'}
function registryId(email){return String(email||'').trim().toLowerCase()}
function computeAccess(assignments=[],semester=currentSemester){
  const viewKeys=[],collectionWriteKeys=[],scoreWriteKeys=[],classAccess=[];
  assignments.filter(a=>a.semester===semester).forEach(a=>{
    const key=scopeKey(a);
    if(!viewKeys.includes(key))viewKeys.push(key);
    if(a.canCollection&&!collectionWriteKeys.includes(key))collectionWriteKeys.push(key);
    if(a.canScores&&!scoreWriteKeys.includes(key))scoreWriteKeys.push(key);
    if(!classAccess.includes(a.classId))classAccess.push(a.classId)
  });
  return{viewKeys,collectionWriteKeys,scoreWriteKeys,classAccess}
}

function weekRange(offset=0){const d=new Date();d.setHours(0,0,0,0);const day=d.getDay();const delta=day===0?-6:1-day;d.setDate(d.getDate()+delta+offset*7);const start=new Date(d),end=new Date(d);end.setDate(end.getDate()+6);const f=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;return{start:f(start),end:f(end)}}

function renderSemesterSwitch(){
  const box=$('#semesterSwitch');
  if(!box)return;
  box.innerHTML='';
  if(!isTeacherModeProfile()){viewSemester=currentSemester;updateSemesterLabel();return}
  const semesters=[...new Set((profile.assignments||[]).filter(a=>a.kind==='teacher'&&a.semester).map(a=>a.semester))].sort().reverse();
  if(!semesters.length){viewSemester=currentSemester;updateSemesterLabel();return}
  viewSemester=semesters.includes(viewSemester)?viewSemester:(semesters.includes(currentSemester)?currentSemester:semesters[0]);
  if(semesters.length===1&&semesters[0]===currentSemester){updateSemesterLabel();return}
  box.innerHTML=`<label class="sub" style="font-weight:800">查看學期
    <select id="teacherSemesterSelect" style="margin-left:5px;padding:6px 8px;border:1px solid #cfd4dc;border-radius:8px;background:#fff">
      ${semesters.map(s=>`<option value="${esc(s)}" ${s===viewSemester?'selected':''}>${esc(s)}${s===currentSemester?'（目前）':'（歷史唯讀）'}</option>`).join('')}
    </select>

  $('#teacherSemesterSelect').onchange=e=>{
    viewSemester=e.target.value;
    currentAssignment=null;
    if(unsubItems){unsubItems();unsubItems=null}
    if(unsubAssess){unsubAssess();unsubAssess=null}
    updateSemesterLabel();
    renderRoles()
  };
  updateSemesterLabel()
}

async function linkFromRegistry(user){
  const email=registryId(user.email);
  if(!email)throw new Error('Google 帳號沒有可辨識的 Email。');
  const regRef=doc(db,'identityRegistry',email);
  const regSnap=await getDoc(regRef);
  if(!regSnap.exists())throw new Error(`此 Google 帳號尚未列入導師後端對照名單：${email}`);
  const reg=regSnap.data();
  if(reg.active===false)throw new Error('此人員資料已被停用，請聯絡導師。');
  if(reg.linkedUid&&reg.linkedUid!==user.uid)throw new Error('此 Email 已連結到另一個登入身分，請聯絡導師處理連動。');
  const assignments=Array.isArray(reg.assignments)?reg.assignments:[];
  const access=computeAccess(assignments,currentSemester);
  const linkedAt=reg.linkedAt||serverTimestamp();
  const data={
    username:reg.username||email,
    displayName:reg.displayName||user.displayName||email,
    type:reg.type||'student',
    email,
    classId:reg.classId||'',
    seat:reg.seat??null,
    active:true,
    assignments,
    ...access,
    mustChangePassword:false,
    authProvider:'google',
    linkedAt,
    lastLoginAt:serverTimestamp(),
    updatedAt:serverTimestamp()
  };
  await setDoc(doc(db,'users',user.uid),data,{merge:true});
  await setDoc(regRef,{
    linked:true,
    linkedUid:user.uid,
    linkedAt,
    lastLoginAt:serverTimestamp(),
    updatedAt:serverTimestamp()
  },{merge:true});
  return{uid:user.uid,...data}
}

async function loadOrLinkProfile(user){
  let snap=await getDoc(doc(db,'users',user.uid));
  if(!snap.exists()){
    if(!user.providerData?.some(p=>p.providerId==='google.com')){
      throw new Error('此舊帳號尚未建立使用者資料，請聯絡導師。')
    }
    return await linkFromRegistry(user)
  }
  const data=snap.data();
  if(data.active!==true)throw new Error('此帳號尚未啟用或已被停用，請聯絡導師。');
  const p={uid:user.uid,...data};
  try{await updateDoc(doc(db,'users',user.uid),{lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()})}catch(e){console.warn('lastLoginAt',e)}
  if(user.email){
    const email=registryId(user.email);
    try{
      const regRef=doc(db,'identityRegistry',email),regSnap=await getDoc(regRef);
      if(regSnap.exists()){
        const reg=regSnap.data();
        if(!reg.linkedUid||reg.linkedUid===user.uid){
          await setDoc(regRef,{linked:true,linkedUid:user.uid,linkedAt:reg.linkedAt||serverTimestamp(),lastLoginAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true})
        }

        /* 管理員同時也是任課老師：保留 admin 身分，但同步 registry 裡的 teacher assignments */
        if(data.type==='admin'){
          const registryTeacherAssignments=(Array.isArray(reg.assignments)?reg.assignments:[]).filter(a=>a.kind==='teacher');
          if(registryTeacherAssignments.length){
            const preserved=(Array.isArray(data.assignments)?data.assignments:[]).filter(a=>a.kind!=='teacher');
            const mergedAssignments=[...preserved,...registryTeacherAssignments];
            const access=computeAccess(mergedAssignments,currentSemester);
            await updateDoc(doc(db,'users',user.uid),{
              assignments:mergedAssignments,
              ...access,
              updatedAt:serverTimestamp()
            });
            p.assignments=mergedAssignments;
            Object.assign(p,access);
          }
        }
      }
    }catch(e){console.warn('registry status',e)}
  }
  return p
}

async function changeOwnPassword(force=false){
  const p=prompt(force?'第一次登入，請設定新的個人密碼（至少 6 碼）：':'請輸入新的密碼（至少 6 碼）：');
  if(!p){if(force)await signOut(auth);return false}
  if(p.length<6){alert('密碼至少 6 碼。');return changeOwnPassword(force)}
  const p2=prompt('請再輸入一次新密碼：');
  if(p2!==p){alert('兩次密碼不同，請重新設定。');return changeOwnPassword(force)}
  try{await updatePassword(auth.currentUser,p)}catch(e){console.error(e);const code=e?.code||'unknown';let tip='密碼修改失敗。';if(code==='auth/requires-recent-login')tip+=' 請先登出，再重新登入後立即修改。';else if(code==='auth/weak-password')tip+=' 新密碼強度不足，請使用至少 6 碼。';else tip+=` 錯誤代碼：${code}`;alert(tip);if(force)await signOut(auth);return false}
  if(force||profile?.mustChangePassword===true){
    try{await updateDoc(doc(db,'users',auth.currentUser.uid),{mustChangePassword:false,updatedAt:serverTimestamp()});if(profile)profile.mustChangePassword=false}
    catch(e){console.error(e);alert('新密碼已修改成功，但第一次登入狀態尚未寫入。請記住新密碼後重新登入。錯誤：'+(e?.code||e.message));return false}
  }
  alert(force?'第一次登入密碼設定完成。':'密碼已更新。');return true
}

function startCollection(){if(unsubItems)unsubItems();const key=scopeKey(currentAssignment),q=query(collection(db,'collectionItems'),where('semester','==',viewSemester),where('scopeKey','==',key));unsubItems=onSnapshot(q,snap=>{const items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));currentCollectionItems=items;renderCollection(items);renderTeacherAggregatePanel()},e=>msg($('#appMsg'),'讀取收繳資料失敗：'+esc(e.message),'error'))}

function collectionCounts(it){const counts={submitted:0,missing:0,late:0,exempt:0,lateSubmitted:0};Object.entries(it.records||{}).forEach(([sid,v])=>{counts[v]=(counts[v]||0)+1;if(v==='submitted'&&(it.lateSubmitted||{})[sid])counts.lateSubmitted++});return counts}

function renderCollection(items){
  const p=$('#collectionPanel');let html='';
  if(canCollection(currentAssignment))html+='<div class="toolbar"><button id="newCollectionBtn" class="btn primary">＋新增收繳項目</button></div>';
  if(isTeacherAssignment(currentAssignment)&&items.length)html+=`<div class="teacher-tools"><div class="teacher-tools-title">👨‍🏫 任課老師工具</div><div class="sub">可直接列印或下載每一筆收繳名單。</div></div>`;
  if(!items.length)html+='<div class="empty">本學期目前沒有收繳紀錄。</div>';
  items.forEach(it=>{const c=collectionCounts(it),confirmed=it.reviewStatus==='confirmed';html+=`<div class="item ${confirmed?'confirmed':''}"><div class="item-head"><div><b>${esc(it.itemName)}</b><div class="meta">${esc(it.semester||viewSemester)}｜${esc(it.date||'')}${it.dueDate?`｜截止 ${esc(it.dueDate)}`:''}｜建立：${esc(it.createdByName||'')}</div></div><div><span class="pill ${confirmed?'good':'warn'}">${confirmed?'已確認':'尚未確認'}</span></div></div><div class="stats"><span class="stat">已繳 ${c.submitted}</span><span class="stat">未繳 ${c.missing}</span><span class="stat">補交 ${c.late}</span><span class="stat">免繳 ${c.exempt}</span>${c.lateSubmitted?`<span class="stat" style="color:#d92d20">遲交後已繳 ${c.lateSubmitted}</span>`:''}</div><div class="toolbar"><button class="btn gray small open-col" data-id="${it.id}">查看／登記</button>${canConfirm(currentAssignment)?`<button class="btn good small confirm-col" data-id="${it.id}">${confirmed?'取消確認':'確認'}</button>`:''}${isTeacherAssignment(currentAssignment)?`<button class="btn gray small print-col" data-id="${it.id}">🖨 列印</button><button class="btn gray small xlsx-col" data-id="${it.id}">📥 Excel</button>`:''}${!confirmed&&canCollection(currentAssignment)?`<button class="btn danger small del-col" data-id="${it.id}">刪除</button>`:''}</div><div id="col-${it.id}" class="hidden"></div></div>`});
  p.innerHTML=html;
  $('#newCollectionBtn')?.addEventListener('click',createCollectionPrompt);
  $$('.open-col').forEach(b=>b.onclick=()=>toggleCollectionEditor(items.find(x=>x.id===b.dataset.id)));
  $$('.confirm-col').forEach(b=>b.onclick=()=>confirmCollection(items.find(x=>x.id===b.dataset.id)));
  $$('.del-col').forEach(b=>b.onclick=()=>removeCollection(items.find(x=>x.id===b.dataset.id)));
  $$('.print-col').forEach(b=>b.onclick=()=>printCollection(items.find(x=>x.id===b.dataset.id)));
  $$('.xlsx-col').forEach(b=>b.onclick=()=>exportCollection(items.find(x=>x.id===b.dataset.id)));
}

async function createCollectionPrompt(){const name=prompt('收繳項目名稱：');if(!name)return;const due=prompt('截止日期（可留空，格式 YYYY-MM-DD）：','')||'',note=prompt('備註（可留空）：','')||'',a=currentAssignment,key=scopeKey(a),records={};roster.forEach(s=>records[s.id||String(s.seat)]='submitted');const ref=await addDoc(collection(db,'collectionItems'),{semester:a.semester||currentSemester,scopeKey:key,classId:a.classId,scopeType:a.scopeType,scopeName:a.scopeName,itemName:name.trim(),date:today(),dueDate:due.trim(),note:note.trim(),records,lateSubmitted:{},lockedRecords:{},createdBy:auth.currentUser.uid,createdByName:profile.displayName||profile.username,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),reviewStatus:'pending',locked:false});await audit('create','collection',ref.id,`新增收繳：${name}`)}

async function confirmCollection(it){
  const confirming=it.reviewStatus!=='confirmed';
  if(!confirm(confirming?`確定確認「${it.itemName}」？\n\n確認後：已繳與免繳會鎖定；未繳、補交仍可繼續修改。`:`確定取消確認「${it.itemName}」？`))return;
  const lockedRecords={};
  if(confirming)Object.entries(it.records||{}).forEach(([sid,status])=>lockedRecords[sid]=(status==='submitted'||status==='exempt'));
  await updateDoc(doc(db,'collectionItems',it.id),{reviewStatus:confirming?'confirmed':'pending',locked:false,lockedRecords:confirming?lockedRecords:{},confirmedBy:confirming?auth.currentUser.uid:null,confirmedByName:confirming?(profile.displayName||profile.username):null,confirmedAt:confirming?serverTimestamp():null,updatedAt:serverTimestamp()});
  await audit(confirming?'confirm':'unconfirm','collection',it.id,`${confirming?'確認':'取消確認'}收繳：${it.itemName}`)
}

function toggleCollectionEditor(it){
  const box=$(`#col-${it.id}`);if(!box.classList.contains('hidden')){box.classList.add('hidden');box.innerHTML='';return}box.classList.remove('hidden');
  const confirmed=it.reviewStatus==='confirmed',canWrite=canCollection(currentAssignment);
  box.innerHTML=`${it.note?`<div class="notice">備註：${esc(it.note)}</div>`:''}<div class="toolbar">${canWrite?'<button class="btn gray small all-submitted">將可修改者設為已繳</button>':''}<span class="sub">確認後：已繳／免繳鎖定；未繳／補交仍可修正。</span></div><div class="roster">${roster.map(s=>{const id=s.id||String(s.seat),v=(it.records||{})[id]||'submitted',locked=confirmed&&!!(it.lockedRecords||{})[id],late=v==='submitted'&&!!(it.lateSubmitted||{})[id],editable=canWrite&&!locked;return `<div class="student ${locked?'locked':''}"><div class="name">${s.seat}. ${esc(s.name)}</div><select class="status col-status" data-student="${esc(id)}" data-old="${esc(v)}" ${editable?'':'disabled'}>${statusOptions.map(([x,l])=>`<option value="${x}" ${x===v?'selected':''}>${l}</option>`).join('')}</select>${late?'<div class="late-note">已繳交（遲交）</div>':''}${locked?'<div class="lock-note">🔒 已確認鎖定</div>':''}</div>`}).join('')}</div>${canWrite?'<div class="toolbar"><button class="btn primary save-col">儲存收繳狀態</button></div>':''}`;
  box.querySelector('.all-submitted')?.addEventListener('click',()=>box.querySelectorAll('.col-status:not(:disabled)').forEach(s=>s.value='submitted'));
  box.querySelector('.save-col')?.addEventListener('click',async()=>{
    const records={...(it.records||{})},lateSubmitted={...(it.lateSubmitted||{})},lockedRecords={...(it.lockedRecords||{})};
    box.querySelectorAll('.col-status').forEach(sel=>{if(sel.disabled)return;const sid=sel.dataset.student,oldStatus=sel.dataset.old,newStatus=sel.value;records[sid]=newStatus;if(confirmed&&(oldStatus==='missing'||oldStatus==='late')&&newStatus==='submitted'){lateSubmitted[sid]=true;lockedRecords[sid]=true}else if(confirmed&&newStatus==='exempt'){lockedRecords[sid]=true}});
    await updateDoc(doc(db,'collectionItems',it.id),{records,lateSubmitted,lockedRecords,updatedAt:serverTimestamp()});await audit('update','collection',it.id,`更新收繳：${it.itemName}`);alert('已儲存')
  })
}

async function removeCollection(it){if(!confirm(`確定刪除「${it.itemName}」？`))return;await deleteDoc(doc(db,'collectionItems',it.id));await audit('delete','collection',it.id,`刪除收繳：${it.itemName}`)}

/* ========================= 成績 ========================= */
function startScores(){if(unsubAssess)unsubAssess();const key=scopeKey(currentAssignment),q=query(collection(db,'assessments'),where('semester','==',viewSemester),where('scopeKey','==',key));unsubAssess=onSnapshot(q,snap=>{currentAssessmentItems=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));renderScores(currentAssessmentItems);renderTeacherAggregatePanel()},e=>msg($('#appMsg'),'讀取成績資料失敗：'+esc(e.message),'error'))}
function calcStats(it){const vals=[];let absent=0,below=0;Object.values(it.scores||{}).forEach(r=>{if(r.status==='absent')absent++;if((r.status==='normal'||r.status==='makeup')&&hasScore(r)){const n=Number(r.score);vals.push(n);if(n<Number(it.passScore||0))below++}});return{avg:vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'-',high:vals.length?Math.max(...vals):'-',low:vals.length?Math.min(...vals):'-',below,absent,count:vals.length}}

function renderTeacherWeekTools(){
  if(!isTeacherAssignment(currentAssignment))return'';
  const w=weekRange(0);
  return `<div class="teacher-tools"><div class="teacher-tools-title">👨‍🏫 任課老師｜本週成績工具</div><div class="sub">${esc(currentAssignment.classId)}班｜${esc(currentAssignment.scopeName)}｜預設本週 ${w.start} ～ ${w.end}</div><div class="toolbar"><label>開始 <input id="teacherWeekStart" type="date" value="${w.start}"></label><label>結束 <input id="teacherWeekEnd" type="date" value="${w.end}"></label><button id="teacherWeekView" class="btn purple">📊 查看週成績</button><button id="teacherWeekExcel" class="btn primary">📥 下載週成績 Excel</button><button id="teacherWeekPrint" class="btn gray">🖨 列印週成績</button></div><div id="teacherWeekResult"></div></div>`
}

function renderScores(items){
  const p=$('#scoresPanel');let html=renderTeacherWeekTools();
  if(canScores(currentAssignment))html+='<div class="toolbar"><button id="newAssessBtn" class="btn primary">＋新增小考</button></div>';
  if(!items.length)html+='<div class="empty">本學期目前沒有小考紀錄。</div>';
  items.forEach(it=>{const st=calcStats(it),confirmed=it.reviewStatus==='confirmed';html+=`<div class="item ${confirmed?'confirmed':''}"><div class="item-head"><div><b>${esc(it.name)}</b><div class="meta">${esc(it.semester||viewSemester)}｜${esc(it.date||'')}｜滿分 ${it.maxScore}｜及格 ${it.passScore}｜建立：${esc(it.createdByName||'')}</div></div><div><span class="pill ${confirmed?'good':'warn'}">${confirmed?'已確認':'尚未確認'}</span></div></div><div class="stats"><span class="stat">平均 ${st.avg}</span><span class="stat">最高 ${st.high}</span><span class="stat">最低 ${st.low}</span><span class="stat">未達及格 ${st.below}</span><span class="stat">缺考 ${st.absent}</span></div><div class="toolbar"><button class="btn gray small open-score" data-id="${it.id}">查看／登記</button>${canConfirm(currentAssignment)?`<button class="btn good small confirm-score" data-id="${it.id}">${confirmed?'取消確認':'確認'}</button>`:''}${isTeacherAssignment(currentAssignment)?`<button class="btn gray small print-score" data-id="${it.id}">🖨 列印</button><button class="btn gray small xlsx-score" data-id="${it.id}">📥 Excel</button>`:''}${!confirmed&&canScores(currentAssignment)?`<button class="btn danger small del-score" data-id="${it.id}">刪除</button>`:''}</div><div id="score-${it.id}" class="hidden"></div></div>`});
  p.innerHTML=html;
  $('#newAssessBtn')?.addEventListener('click',createAssessmentPrompt);
  $$('.open-score').forEach(b=>b.onclick=()=>toggleScoreEditor(items.find(x=>x.id===b.dataset.id)));
  $$('.confirm-score').forEach(b=>b.onclick=()=>confirmAssessment(items.find(x=>x.id===b.dataset.id)));
  $$('.del-score').forEach(b=>b.onclick=()=>removeAssessment(items.find(x=>x.id===b.dataset.id)));
  $$('.print-score').forEach(b=>b.onclick=()=>printAssessment(items.find(x=>x.id===b.dataset.id)));
  $$('.xlsx-score').forEach(b=>b.onclick=()=>exportAssessment(items.find(x=>x.id===b.dataset.id)));
  $('#teacherWeekView')?.addEventListener('click',showTeacherWeekSummary);
  $('#teacherWeekExcel')?.addEventListener('click',exportTeacherWeekExcel);
  $('#teacherWeekPrint')?.addEventListener('click',printTeacherWeekSummary);
}

async function createAssessmentPrompt(){const name=prompt('小考名稱：');if(!name)return;const max=Number(prompt('滿分：','100'));if(!Number.isFinite(max)||max<=0)return alert('滿分格式不正確');const pass=Number(prompt('及格分數：',String(Math.round(max*.6))));if(!Number.isFinite(pass))return alert('及格分數格式不正確');const a=currentAssignment,scores={};roster.forEach(s=>scores[s.id||String(s.seat)]={status:'not_entered',score:null});const ref=await addDoc(collection(db,'assessments'),{semester:a.semester||currentSemester,scopeKey:scopeKey(a),classId:a.classId,scopeType:a.scopeType,scopeName:a.scopeName,name:name.trim(),date:today(),maxScore:max,passScore:pass,note:'',scores,scoreLocks:{},createdBy:auth.currentUser.uid,createdByName:profile.displayName||profile.username,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),reviewStatus:'pending',locked:false});await audit('create','assessment',ref.id,`新增小考：${name}`)}

async function confirmAssessment(it){
  const confirming=it.reviewStatus!=='confirmed';
  if(!confirm(confirming?`確定確認「${it.name}」？\n\n確認後：已有成績會鎖定；尚未登記的學生仍可補登。若要修改已存在成績，請先按「解鎖」。`:`確定取消確認「${it.name}」？`))return;
  const scoreLocks={};if(confirming)Object.entries(it.scores||{}).forEach(([sid,r])=>scoreLocks[sid]=hasScore(r));
  await updateDoc(doc(db,'assessments',it.id),{reviewStatus:confirming?'confirmed':'pending',locked:false,scoreLocks:confirming?scoreLocks:{},confirmedBy:confirming?auth.currentUser.uid:null,confirmedByName:confirming?(profile.displayName||profile.username):null,confirmedAt:confirming?serverTimestamp():null,updatedAt:serverTimestamp()});
  await audit(confirming?'confirm':'unconfirm','assessment',it.id,`${confirming?'確認':'取消確認'}成績：${it.name}`)
}

function toggleScoreEditor(it){
  const box=$(`#score-${it.id}`);if(!box.classList.contains('hidden')){box.classList.add('hidden');box.innerHTML='';return}box.classList.remove('hidden');
  const confirmed=it.reviewStatus==='confirmed',canWrite=canScores(currentAssignment);
  box.innerHTML=`${confirmed?'<div class="notice">此成績已確認：有成績者鎖定；空白仍可補登。要更改已存在分數，請先解鎖該生。</div>':''}<div>${roster.map(s=>{const id=s.id||String(s.seat),r=(it.scores||{})[id]||{status:'not_entered',score:null},locked=confirmed&&!!(it.scoreLocks||{})[id],editable=canWrite&&!locked;return `<div class="score-row"><b>${s.seat}</b><span>${esc(s.name)}</span><input class="score-input" data-student="${esc(id)}" type="number" inputmode="decimal" min="0" max="${it.maxScore}" value="${r.score??''}" ${editable?'':'disabled'}><select class="score-status" data-student="${esc(id)}" ${editable?'':'disabled'}>${scoreStatusOptions.map(([x,l])=>`<option value="${x}" ${x===(r.status||'not_entered')?'selected':''}>${l}</option>`).join('')}</select>${locked&&canWrite?`<button class="btn warn small unlock-score" data-student="${esc(id)}">🔓 解鎖</button>`:(locked?'<span class="lock-note">🔒 已鎖</span>':'')}</div>`}).join('')}</div>${canWrite?'<div class="toolbar"><button class="btn primary save-score">儲存成績</button></div>':''}`;
  const inputs=[...box.querySelectorAll('.score-input:not(:disabled)')];inputs.forEach((inp,i)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inputs[i+1]){e.preventDefault();inputs[i+1].focus();inputs[i+1].select()}}));
  box.querySelectorAll('.unlock-score').forEach(btn=>btn.onclick=async()=>{const sid=btn.dataset.student;if(!confirm('確定解鎖這位學生的既有成績？'))return;const scoreLocks={...(it.scoreLocks||{}),[sid]:false};await updateDoc(doc(db,'assessments',it.id),{scoreLocks,updatedAt:serverTimestamp()});await audit('unlock_score','assessment',it.id,`解鎖成績：${it.name}｜座號 ${sid}`);it.scoreLocks=scoreLocks;toggleScoreEditor(it);toggleScoreEditor(it)});
  box.querySelector('.save-score')?.addEventListener('click',async()=>{
    const scores={...(it.scores||{})},scoreLocks={...(it.scoreLocks||{})};
    try{for(const s of roster){const id=s.id||String(s.seat),inp=box.querySelector(`.score-input[data-student="${CSS.escape(id)}"]`),sel=box.querySelector(`.score-status[data-student="${CSS.escape(id)}"]`);if(!inp||inp.disabled)continue;let score=inp.value===''?null:Number(inp.value);if(score!==null&&(score<0||score>Number(it.maxScore)))throw new Error(`${s.name} 分數超出範圍`);let status=sel.value;if(score!==null&&status==='not_entered')status='normal';scores[id]={score,status};if(confirmed&&score!==null)scoreLocks[id]=true}
      await updateDoc(doc(db,'assessments',it.id),{scores,scoreLocks,updatedAt:serverTimestamp()});await audit('update','assessment',it.id,`更新小考：${it.name}`);alert('已儲存')
    }catch(e){alert(e.message)}
  })
}

async function removeAssessment(it){if(!confirm(`確定刪除「${it.name}」？`))return;await deleteDoc(doc(db,'assessments',it.id));await audit('delete','assessment',it.id,`刪除小考：${it.name}`)}

/* ========================= 任課老師週成績 ========================= */
function teacherWeekData(){
  const start=$('#teacherWeekStart')?.value||weekRange(0).start,end=$('#teacherWeekEnd')?.value||weekRange(0).end;
  const tests=currentAssessmentItems.filter(x=>(!start||x.date>=start)&&(!end||x.date<=end)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.name||'').localeCompare(b.name||''));
  const rows=roster.map(s=>{const sid=s.id||String(s.seat);return{seat:s.seat,name:s.name,sid,values:tests.map(t=>{const r=(t.scores||{})[sid]||{};if(hasScore(r))return Number(r.score);if(r.status==='absent')return'缺考';if(r.status==='makeup')return'補考';if(r.status==='exempt')return'免試';return''})}});
  return{start,end,tests,rows};
}

function showTeacherWeekSummary(){
  const d=teacherWeekData(),box=$('#teacherWeekResult');if(!box)return;
  box.innerHTML=`<div class="summary-title">📊 ${esc(currentAssignment.classId)}班｜${esc(currentAssignment.scopeName)}｜${d.start} ～ ${d.end}</div>${d.tests.length?`<div class="table-wrap"><table class="summary-table"><thead><tr><th>座號</th><th>姓名</th>${d.tests.map(t=>`<th>${esc(t.name)}<div class="meta">${esc(t.date||'')}</div></th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r.seat}</td><td>${esc(r.name)}</td>${r.values.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="notice">這個日期範圍沒有成績紀錄。</div>'}`
}

async function ensureXLSX(){if(window.XLSX)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Excel 元件載入失敗'));document.head.appendChild(s)})}

function excelColumnName(n){let s='';while(n>0){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function makeTitledSheet(title,meta,headers,rows,widths=[]){
  const aoa=[[title],[meta],[],headers,...rows],ws=XLSX.utils.aoa_to_sheet(aoa),last=Math.max(0,headers.length-1);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:last}},{s:{r:1,c:0},e:{r:1,c:last}}];
  ws['!cols']=widths.length?widths:[{wch:8},{wch:14},...headers.slice(2).map(()=>({wch:18}))];
  ws['!autofilter']={ref:`A4:${excelColumnName(headers.length)}4`};
  return ws;
}
function safeFileName(v){return String(v||'資料').replace(/[\\/:*?"<>|]/g,'-')}

async function exportTeacherWeekExcel(){
  const d=teacherWeekData();if(!d.tests.length)return alert('這個日期範圍沒有成績可下載。');
  try{
    await ensureXLSX();
    const title=`${currentAssignment.classId}班｜${currentAssignment.scopeName}｜週成績`;
    const meta=`學期：${viewSemester}｜期間：${d.start} ～ ${d.end}`;
    const headers=['座號','姓名',...d.tests.map(t=>`${t.name} (${t.date||''})`)];
    const rows=d.rows.map(r=>[r.seat,r.name,...r.values]);
    const ws=makeTitledSheet(title,meta,headers,rows,[{wch:7},{wch:12},...d.tests.map(()=>({wch:16}))]),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'週成績');
    XLSX.writeFile(wb,`${safeFileName(currentAssignment.classId)}-${safeFileName(currentAssignment.scopeName)}-週成績-${d.start}-${d.end}.xlsx`)
  }catch(e){alert('Excel 下載失敗：'+e.message)}
}
function printTeacherWeekSummary(){const d=teacherWeekData();if(!d.tests.length)return alert('這個日期範圍沒有成績可列印。');openPrint(`${currentAssignment.classId}班｜${currentAssignment.scopeName}｜週成績`,`期間：${d.start} ～ ${d.end}`,['座號','姓名',...d.tests.map(t=>t.name)],d.rows.map(r=>[r.seat,esc(r.name),...r.values]),true)}

function renderTeacherAggregatePanel(){

  if(!currentAssignment||!isTeacherAssignment(currentAssignment)||currentAssignment.scopeType!=='subject'){box.classList.add('hidden');box.innerHTML='';return}

  const scoreHtml=tests.length?tests.map(it=>{const k=`assessment:${it.id}`,checked=old.has(k)?'checked':'';return `<label style="display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid #d6c39a;border-radius:10px;background:rgba(255,255,255,.55)"><input class="aggregate-choice" data-kind="assessment" type="checkbox" value="${esc(it.id)}" ${checked}><span><b>📊 ${esc(it.name)}</b><span class="meta" style="display:block">${esc(it.date||'')}｜滿分 ${esc(it.maxScore??'')}</span></span></label>`}).join(''):'<div class="meta">目前沒有成績資料。</div>';
  box.innerHTML=`<div class="teacher-tools"><div class="teacher-tools-title">🧭 任課老師｜自選資料彙整</div><div class="sub">勾選你要的作業／收繳與成績，可合併成同一張學生總表，再下載 Excel 或列印。</div><details style="margin-top:10px"><summary style="cursor:pointer;font-weight:900">📚 選擇要彙整的資料</summary><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:10px"><div><div style="font-weight:900;margin-bottom:7px">📥 作業／收繳</div><div style="display:grid;gap:6px">${colHtml}</div></div><div><div style="font-weight:900;margin-bottom:7px">📊 成績</div><div style="display:grid;gap:6px">${scoreHtml}</div></div></div><div class="toolbar" style="margin-top:10px"><button id="aggregateSelectAll" class="btn gray small">☑ 全選</button><button id="aggregateClear" class="btn gray small">☐ 清除</button><button id="aggregatePreview" class="btn purple small">👀 預覽彙整</button><button id="aggregateExcel" class="btn primary small">📥 下載彙整 Excel</button><button id="aggregatePrint" class="btn gray small">🖨 列印彙整</button></div><div id="aggregatePreviewBox"></div></details></div>`;
  $('#aggregateSelectAll')?.addEventListener('click',()=>$$('#teacherAggregatePanel input.aggregate-choice').forEach(x=>x.checked=true));
  $('#aggregateClear')?.addEventListener('click',()=>{ $$('#teacherAggregatePanel input.aggregate-choice').forEach(x=>x.checked=false);const p=$('#aggregatePreviewBox');if(p)p.innerHTML=''; });
  $('#aggregatePreview')?.addEventListener('click',showAggregatePreview);
  $('#aggregateExcel')?.addEventListener('click',exportAggregateExcel);

function selectedAggregateData(){
  const chosen=$$('#teacherAggregatePanel input.aggregate-choice:checked');
  const selectedCollections=[],selectedTests=[];
  chosen.forEach(x=>{if(x.dataset.kind==='collection'){const it=currentCollectionItems.find(v=>v.id===x.value);if(it)selectedCollections.push(it)}else{const it=currentAssessmentItems.find(v=>v.id===x.value);if(it)selectedTests.push(it)}});
  selectedCollections.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.itemName||'').localeCompare(b.itemName||''));
  selectedTests.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.name||'').localeCompare(b.name||''));
  const columns=[...selectedCollections.map(it=>({kind:'collection',item:it,label:`作業｜${it.itemName}`,date:it.date||''})),...selectedTests.map(it=>({kind:'assessment',item:it,label:`成績｜${it.name}`,date:it.date||''}))];
  const rows=roster.map(s=>{const sid=s.id||String(s.seat),values=columns.map(c=>c.kind==='collection'?aggregateCollectionValue(c.item,sid):aggregateScoreValue(c.item,sid));return[s.seat,s.name,...values]});
  return{selectedCollections,selectedTests,columns,rows};
}
function aggregateCollectionValue(it,sid){
  const status=(it.records||{})[sid]||'submitted';
  if(status==='submitted'&&(it.lateSubmitted||{})[sid])return'已繳（遲交）';
  return labelOf(statusOptions,status);
}
function aggregateScoreValue(it,sid){
  const r=(it.scores||{})[sid]||{};
  if(hasScore(r)){const score=Number(r.score);if(r.status==='makeup')return`${score}（補考）`;return score}
  return labelOf(scoreStatusOptions,r.status||'not_entered');
}
function aggregateTitle(){return `${currentAssignment.classId}班｜${currentAssignment.scopeName}｜任課資料彙整`}
function aggregateMeta(d){return `學期：${viewSemester}｜作業／收繳 ${d.selectedCollections.length} 項｜成績 ${d.selectedTests.length} 項`}
function ensureAggregateSelected(){const d=selectedAggregateData();if(!d.columns.length){alert('請至少勾選一筆作業、收繳或成績資料。');return null}return d}

function printCollection(it){openPrint(`${it.classId}班｜${it.scopeName}｜${it.itemName}`,`日期：${it.date||''}${it.dueDate?`｜截止：${it.dueDate}`:''}`,['座號','姓名','狀態','備註'],collectionRows(it).map(r=>[r[0],esc(r[1]),r[2],r[3]]))}
async function exportCollection(it){
  try{
    await ensureXLSX();const title=`${it.classId}班｜${it.scopeName}｜${it.itemName}`,meta=`學期：${it.semester||viewSemester}｜日期：${it.date||''}${it.dueDate?`｜截止：${it.dueDate}`:''}`;
    const headers=['座號','姓名','狀態','備註'],rows=collectionRows(it),ws=makeTitledSheet(title,meta,headers,rows,[{wch:7},{wch:12},{wch:14},{wch:20}]),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'收繳');XLSX.writeFile(wb,`${safeFileName(it.classId)}-${safeFileName(it.scopeName)}-${safeFileName(it.itemName)}.xlsx`)
  }catch(e){alert('Excel 下載失敗：'+e.message)}
}
function assessmentRows(it){return roster.map(s=>{const sid=s.id||String(s.seat),r=(it.scores||{})[sid]||{};return[s.seat,s.name,hasScore(r)?Number(r.score):'',labelOf(scoreStatusOptions,r.status||'not_entered')]})}
function printAssessment(it){openPrint(`${it.classId}班｜${it.scopeName}｜${it.name}`,`日期：${it.date||''}｜滿分：${it.maxScore}｜及格：${it.passScore}`,['座號','姓名','成績','狀態'],assessmentRows(it).map(r=>[r[0],esc(r[1]),r[2],r[3]]))}
async function exportAssessment(it){
  try{
    await ensureXLSX();const title=`${it.classId}班｜${it.scopeName}｜${it.name}`,meta=`學期：${it.semester||viewSemester}｜日期：${it.date||''}｜滿分：${it.maxScore}｜及格：${it.passScore}`;
    const headers=['座號','姓名','成績','狀態'],rows=assessmentRows(it),ws=makeTitledSheet(title,meta,headers,rows,[{wch:7},{wch:12},{wch:12},{wch:14}]),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'成績');XLSX.writeFile(wb,`${safeFileName(it.classId)}-${safeFileName(it.scopeName)}-${safeFileName(it.name)}.xlsx`)
  }catch(e){alert('Excel 下載失敗：'+e.message)}
}
function openPrint(title,meta,headers,rows,landscape=false){const w=window.open('','_blank');if(!w)return alert('瀏覽器阻擋了列印視窗。');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4 ${landscape?'landscape':'portrait'};margin:10mm}body{font-family:"Microsoft JhengHei",sans-serif;color:#111;font-size:11px}h2{margin:0 0 5px}.info{margin-bottom:8px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:4px 6px;text-align:center}th{background:#eee}th:nth-child(1),th:nth-child(2),td:nth-child(1),td:nth-child(2){text-align:left}</style></head><body><h2>${esc(title)}</h2><div class="info">${esc(meta)}</div><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v??''}</td>`).join('')}</tr>`).join('')}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
</script>
