<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>班級工作回報系統</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

<style>

:root{
  --bg:#f5f7fb;
  --card:#fff;
  --ink:#172033;
  --muted:#667085;
  --line:#e4e7ec;
  --brand:#2563eb;
  --brand2:#1d4ed8;
  --good:#067647;
  --warn:#b54708;
  --bad:#b42318;
  --soft:#eff6ff;
  --purple:#6941c6;

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    system-ui,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #eef7ff,
      #f8fafc 38%,

  color:var(--ink);
}

button,
input,
select,
textarea{

}

.hidden{
  display:none!important;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:18px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.brand{
  font-size:24px;
  font-weight:900;
}

.sub{
  color:var(--muted);
  font-size:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;

  box-shadow:
    0 8px 24px
    rgba(16,24,40,.06);
}

.login{
  max-width:430px;
  margin:8vh auto;
}

.field{
  display:grid;
  gap:6px;
  margin:12px 0;
}

.field label{
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #cfd4dc;
  border-radius:10px;
  padding:11px 12px;
  background:#fff;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:800;
}

.btn.primary{
  background:var(--brand);
  color:#fff;
}

.btn.primary:hover{
  background:var(--brand2);
}

.btn.gray{
  background:#eef2f6;
}

.btn.danger{
  background:#fee4e2;
  color:var(--bad);
}

.btn.good{
  background:#dcfae6;
  color:var(--good);
}

.btn.warn{
  background:#fff4e5;
  color:var(--warn);
}

.btn.purple{
  background:#eee9ff;
  color:var(--purple);
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.grid{
  display:grid;
  gap:14px;
}

.roles{
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(220px,1fr)
    );
}

.role-card{
  cursor:pointer;
  border:2px solid transparent;
}

.role-card:hover{
  border-color:#bfdbfe;
}

.role-card.active{
  border-color:var(--brand);
  background:var(--soft);
}

.role-card.teacher-role{
  background:
    linear-gradient(
      135deg,
      #fff,
      #eef8ff

}

.pill{
  display:inline-flex;
  align-items:center;

  border-radius:999px;
  padding:5px 9px;

  font-size:12px;
  font-weight:800;

  background:#f2f4f7;
  color:#344054;

  margin-left:4px;
}

.pill.good{
  background:#dcfae6;
  color:var(--good);
}

.pill.warn{
  background:#fff4e5;
  color:var(--warn);
}

.pill.bad{
  background:#fee4e2;
  color:var(--bad);
}

.pill.purple{
  background:#eee9ff;
  color:var(--purple);
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin:14px 0;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tab{
  background:#eef2f6;
}

.tab.active{
  background:#dbeafe;
  color:#1d4ed8;
}

.section-title{
  font-size:20px;
  font-weight:900;
  margin:2px 0 12px;
}

.item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
  background:#fff;
}

.item.confirmed{
  border-color:#a7d7bd;
  background:#fbfffc;
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.meta{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.roster{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(170px,1fr)
    );

  gap:8px;
  margin-top:12px;
}

.student{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#fff;
}

.student.locked{
  background:#f8fafc;
}

.student .name{
  font-weight:700;
}

.status{
  width:100%;
  margin-top:7px;
  border-radius:9px;
  border:1px solid #d0d5dd;
  padding:7px;
}

.late-note{
  color:#d92d20;
  font-weight:900;
  font-size:13px;
  margin-top:6px;
}

.lock-note{
  color:#667085;
  font-size:12px;
  margin-top:5px;
}

.score-row{
  display:grid;

  grid-template-columns:
    64px
    minmax(120px,1fr)
    95px
    115px
    95px;

  gap:8px;
  align-items:center;

  padding:7px 0;
  border-bottom:1px solid #f0f2f5;
}

.score-row input,
.score-row select{
  width:100%;
  padding:8px;
  border:1px solid #d0d5dd;
  border-radius:8px;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.stat{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
}

.notice{
  padding:11px 12px;
  border-radius:10px;
  background:#fffaeb;
  color:#93370d;
  margin:10px 0;
}

.error{
  background:#fef3f2;
  color:#b42318;
}

.success{
  background:#ecfdf3;
  color:#067647;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.semester-badge{
  display:inline-block;

  background:#dbeafe;
  color:#1d4ed8;

  border-radius:999px;
  padding:5px 10px;

  font-size:13px;
  font-weight:800;

  margin-top:5px;
}

.footer-note{
  font-size:12px;
  color:var(--muted);
  margin-top:16px;
}

.teacher-tools{
  border:1px solid #b9d9ff;

  background:
    linear-gradient(
      135deg,
      #f8fbff,
      #eef7ff
    );

  border-radius:14px;
  padding:14px;
  margin:12px 0;
}

.teacher-tools-title{
  font-weight:900;
  color:#175cd3;
  margin-bottom:5px;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

.summary-table{
  border-collapse:collapse;
  width:100%;
  min-width:720px;
}

.summary-table th,
.summary-table td{
  padding:8px 9px;

  border-bottom:1px solid var(--line);
  border-right:1px solid #f0f2f5;

  text-align:center;

  font-size:13px;
  white-space:nowrap;
}

.summary-table th{
  background:#f8fafc;
  position:sticky;
  top:0;
  z-index:1;
}

.summary-table th:first-child,
.summary-table td:first-child,
.summary-table th:nth-child(2),
.summary-table td:nth-child(2){
  text-align:left;
}

.summary-title{
  font-weight:900;
  font-size:17px;
  margin:12px 0 8px;
}

.version{
  font-size:11px;
  color:#98a2b3;
  margin-top:6px;
}

@media(max-width:700px){

  .wrap{
    padding:12px;
  }

  .brand{
    font-size:20px;
  }

  .score-row{

  }

  .score-row .score-status{

    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .toolbar .btn{
    flex:0 0 auto;
  }

}

</style>

</head>

const firebaseConfig={

    "AIzaSyB56F4wJ-IMUiBsqJ5P33HoDK642h7671U",

    "class-datawork.firebaseapp.com",

  projectId:
    "class-datawork",

  storageBucket:
    "class-datawork.firebasestorage.app",

  messagingSenderId:
    "24186422479",

    "1:24186422479:web:8dee260f34b2e506fd63ba"

const app=

  );


const auth=

const db=

const $=
  s=>

const $$=
  s=>[
    ...document.querySelectorAll(s)
  ];


const SYNTH_DOMAIN=
  "class-datawork.local";


let profile=null;

let currentAssignment=null;

let roster=[];

let unsubItems=null;

let unsubAssess=null;

let currentSemester=
  "115-1";

let viewSemester=
  "115-1";

let currentAssessmentItems=[];


const statusOptions=[
  [
    "submitted",
    "已繳"
  ],
  [
    "missing",
    "未繳"
  ],
  [
    "late",
    "補交"
  ],
  [

    "免繳"
  ]
];


const scoreStatusOptions=[
  [
    "normal",
    "正常"
  ],
  [
    "absent",
    "缺考"
  ],
  [
    "makeup",
    "補考"
  ],
  [
    "exempt",
    "免試"
  ],
  [
    "not_entered",
    "未登記"
  ]
];


function emailFor(v){

  v=v.trim();

  return v.includes("@")
    ?v
    :`${v}@${SYNTH_DOMAIN}`;

}


function msg(
  el,
  text,
  type="notice"
){

  el.innerHTML=
    text
      ?`
        <div class="notice ${type}">
          ${text}
        </div>
      `
      :"";

}


function esc(v=""){

  return String(v)
    .replace(
      /[&<>"]/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[m])
    );

}


function scopeKey(a){

  return(
    `${a.semester}|${a.classId}|${a.scopeType}|${a.scopeName}`
  );

}


function assignmentLabel(a){

  return(
    a.scopeType==="subject"
      ?`${a.classId}班｜${a.scopeName}${a.kind==="teacher"?"任課老師":"小老師"}`
      :`${a.classId}班｜${a.scopeName}`
  );

}


function isHistoricalReadOnly(){

  return(
    !!profile
    &&
    profile.type==="teacher"
    &&
    viewSemester!==currentSemester
  );

}


function canCollection(a){

  return(
    !!a?.canCollection
    &&
    !isHistoricalReadOnly()
  );

}


function canScores(a){

  return(
    !!a?.canScores
    &&
    !isHistoricalReadOnly()
  );

}


function canConfirm(a){

  return(
    !!a
    &&
    (
      a.kind==="assistant"
      ||
      a.kind==="teacher"
    )
    &&
    !isHistoricalReadOnly()
  );

}


function isTeacherAssignment(a){

  return(
    !!a
    &&
    a.kind==="teacher"
  );

}


function registryId(email){

  return String(
    email||""
  )
  .trim()
  .toLowerCase();

}


function computeAccess(
  assignments=[],
  semester=currentSemester
){

  const viewKeys=[];

  const collectionWriteKeys=[];

  const scoreWriteKeys=[];

  const classAccess=[];


  assignments
    .filter(
      a=>a.semester===semester
    )
    .forEach(
      a=>{

        const key=
          scopeKey(a);


        if(
          !viewKeys.includes(key)
        ){

          viewKeys.push(key);

        }


        if(
          a.canCollection
          &&
          !collectionWriteKeys.includes(key)
        ){

          collectionWriteKeys.push(key);

        }


        if(
          a.canScores
          &&
          !scoreWriteKeys.includes(key)
        ){

          scoreWriteKeys.push(key);

        }


        if(
          !classAccess.includes(
            a.classId
          )
        ){

          classAccess.push(
            a.classId
          );

        }

      }
    );


  return{
    viewKeys,
    collectionWriteKeys,
    scoreWriteKeys,
    classAccess
  };

}


function today(){

  return new Date()
    .toLocaleDateString(
      "sv-SE"
    );

}


function hasScore(r){

  return(
    !!r
    &&
    r.score!==null
    &&
    r.score!==""
    &&
    Number.isFinite(
      Number(r.score)
    )
  );

}


function labelOf(
  list,
  value
){

  return(
    list.find(
      x=>x[0]===value
    )
    ||
    [
      value,
      value
    ]
  )[1];

}


function weekRange(
  offset=0
){

  const d=
    new Date();


  d.setHours(
    0,
    0,
    0,
    0
  );


  const day=
    d.getDay();


  const delta=
    day===0
      ?-6
      :1-day;


  d.setDate(
    d.getDate()
    +
    delta
    +
    offset*7
  );


  const start=
    new Date(d);


  const end=
    new Date(d);


  end.setDate(
    end.getDate()+6
  );


  const f=
    x=>
      `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;


  return{
    start:f(start),
    end:f(end)
  };

}


async function loadSystem(){

  const s=
    await getDoc(
      doc(
        db,
        "settings",
        "system"
      )
    );


  if(
    s.exists()
    &&
    s.data().currentSemester
  ){

    currentSemester=
      s.data().currentSemester;

  }


  viewSemester=
    currentSemester;


  updateSemesterLabel();

}


async function loadRoster(
  classId
){

  const s=
    await getDoc(
      doc(
        db,
        "classes",
        classId
      )
    );


  roster=
    s.exists()
      ?(
          s.data().students
          ||
          []
        )
      :[];


  return roster;

}


async function audit(
  action,
  targetType,
  targetId,
  detail
){

  try{

    await addDoc(
      collection(
        db,
        "auditLogs"
      ),
      {

        actorUid:
          auth.currentUser.uid,

        actorName:
          profile.displayName
          ||
          profile.username,

        semester:
          currentAssignment?.semester
          ||
          viewSemester
          ||
          currentSemester,

        action,

        targetType,

        targetId,

        detail,

        createdAt:
          serverTimestamp()

      }
    );

  }catch(e){

    console.warn(
      "audit",
      e
    );

  }

}


/* =========================================================
   Google 登入
========================================================= */

const googleProvider=
  new GoogleAuthProvider();


googleProvider
  .setCustomParameters({
    prompt:"select_account"
  });


$("#systemStatus")
  .textContent=
    "Firebase 已載入，可以登入";


$("#loginBtn")
  .disabled=
    false;


$("#googleLoginBtn")
  .disabled=
    false;


$("#googleLoginBtn")
  .onclick=
async()=>{

  msg(
    $("#loginMsg"),
    ""
  );


  const btn=
    $("#googleLoginBtn");


  btn.disabled=
    true;


  btn.textContent=
    "Google 登入中…";


  try{

    await signInWithPopup(
      auth,
      googleProvider
    );

  }catch(e){

    console.error(e);


    if(
      e?.code==="auth/popup-blocked"
    ){

      await signInWithRedirect(
        auth,
        googleProvider
      );

      return;

    }


    if(
      e?.code!=="auth/popup-closed-by-user"
      &&
      e?.code!=="auth/cancelled-popup-request"
    ){

      msg(
        $("#loginMsg"),
        `Google 登入失敗：${esc(e.code||e.message)}`,
        "error"
      );

    }

function updateSemesterLabel(){

  if(
    !$("#semesterLabel")
  ){

    return;

  }


  if(
    profile?.type==="teacher"
    &&
    viewSemester!==currentSemester
  ){

    $("#semesterLabel")
      .textContent=
        `目前學期：${currentSemester}｜正在查看：${viewSemester}（唯讀）`;

  }else{

    $("#semesterLabel")
      .textContent=
        `目前學期：${currentSemester}`;

  }

}


function renderSemesterSwitch(){

  const box=
    $("#semesterSwitch");


  if(!box){

    return;

  }


  box.innerHTML=
    "";


  if(
    profile?.type!=="teacher"
  ){

    viewSemester=
      currentSemester;


    updateSemesterLabel();

    return;

  }


  const semesters=[
    ...new Set(
      (
        profile.assignments
        ||
        []
      )
      .filter(
        a=>
          a.kind==="teacher"
          &&
          a.semester
      )
      .map(
        a=>a.semester
      )
    )
  ]
  .sort()
  .reverse();


  if(
    !semesters.length
  ){

    viewSemester=
      currentSemester;


    updateSemesterLabel();

    return;

  }


  viewSemester=
    semesters.includes(
      viewSemester
    )
      ?viewSemester
      :(
          semesters.includes(
            currentSemester
          )
            ?currentSemester
            :semesters[0]
        );


  if(
    semesters.length===1
    &&
    semesters[0]===currentSemester
  ){

    updateSemesterLabel();

    return;

  }


  box.innerHTML=`

    <label
      class="sub"
      style="font-weight:800"
    >

      查看學期

      <select
        id="teacherSemesterSelect"
        style="
          margin-left:5px;
          padding:6px 8px;
          border:1px solid #cfd4dc;
          border-radius:8px;
          background:#fff
        "
      >

        ${
          semesters.map(
            s=>`

              <option
                value="${esc(s)}"
                ${
                  s===viewSemester
                    ?"selected"
                    :""
                }
              >

                ${esc(s)}

                ${
                  s===currentSemester
                    ?"（目前）"
                    :"（歷史唯讀）"
                }

              </option>
            `
          )
          .join("")
        }

      </select>

    </label>
  `;


  $("#teacherSemesterSelect")
    .onchange=
    e=>{

      viewSemester=
        e.target.value;


      currentAssignment=
        null;


      if(unsubItems){

        unsubItems();

        unsubItems=
          null;

      }


      if(unsubAssess){

        unsubAssess();

        unsubAssess=
          null;

      }


      updateSemesterLabel();

      renderRoles();

    };


  updateSemesterLabel();

}


/* =========================================================
   identityRegistry 自動連動
========================================================= */

async function linkFromRegistry(
  user
){

  const email=
    registryId(
      user.email
    );


  if(!email){

    throw new Error(
      "Google 帳號沒有可辨識的 Email。"
    );

  }


  const regRef=
    doc(
      db,
      "identityRegistry",
      email
    );


  const regSnap=
    await getDoc(
      regRef
    );


  if(
    !regSnap.exists()
  ){

    throw new Error(
      `此 Google 帳號尚未列入導師後端對照名單：${email}`
    );

  }


  const reg=
    regSnap.data();


  if(
    reg.active===false
  ){

    throw new Error(
      "此人員資料已被停用，請聯絡導師。"
    );

  }


  if(
    reg.linkedUid
    &&
    reg.linkedUid!==user.uid
  ){

    throw new Error(
      "此 Email 已連結到另一個登入身分，請聯絡導師處理連動。"
    );

  }


  const assignments=
    Array.isArray(
      reg.assignments
    )
      ?reg.assignments
      :[];


  const access=
    computeAccess(
      assignments,
      currentSemester
    );


  const linkedAt=
    reg.linkedAt
    ||
    serverTimestamp();


  const data={

    username:
      reg.username
      ||
      email,

    displayName:
      reg.displayName
      ||
      user.displayName
      ||
      email,

    type:
      reg.type
      ||
      "student",

    email,

    classId:
      reg.classId
      ||
      "",

    seat:
      reg.seat
      ??
      null,

    active:true,

    assignments,

    ...access,

    mustChangePassword:false,

    authProvider:
      "google",

    linkedAt,

    lastLoginAt:
      serverTimestamp(),

    updatedAt:
      serverTimestamp()

  };


  await setDoc(
    doc(
      db,
      "users",
      user.uid
    ),
    data,
    {
      merge:true
    }
  );


  await setDoc(
    regRef,
    {

      linked:true,

      linkedUid:
        user.uid,

      linkedAt,

      lastLoginAt:
        serverTimestamp(),

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  return{
    uid:user.uid,
    ...data
  };

}


/* =========================================================
   載入使用者
========================================================= */

async function loadOrLinkProfile(
  user
){

  let snap=
    await getDoc(
      doc(
        db,
        "users",
        user.uid
      )
    );


  if(
    !snap.exists()
  ){

    const isGoogle=
      user.providerData
        ?.some(
          p=>
            p.providerId==="google.com"
        );


    if(!isGoogle){

      throw new Error(
        "此舊帳號尚未建立使用者資料，請聯絡導師。"
      );

    }


    return await linkFromRegistry(
      user
    );

  }


  const data=
    snap.data();


  if(
    data.active!==true
  ){

    throw new Error(
      "此帳號尚未啟用或已被停用，請聯絡導師。"
    );

  }


  const p={
    uid:user.uid,
    ...data
  };


  try{

    await updateDoc(
      doc(
        db,
        "users",
        user.uid
      ),
      {

        lastLoginAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );

  }catch(e){

    console.warn(
      "lastLoginAt",
      e
    );

  }


  if(
    user.email
  ){

    const email=
      registryId(
        user.email
      );


    try{

      const regRef=
        doc(
          db,
          "identityRegistry",
          email
        );


      const regSnap=
        await getDoc(
          regRef
        );


      if(
        regSnap.exists()
      ){

        const reg=
          regSnap.data();


        if(
          !reg.linkedUid
          ||
          reg.linkedUid===user.uid
        ){

          await setDoc(
            regRef,
            {

              linked:true,

              linkedUid:
                user.uid,

              linkedAt:
                reg.linkedAt
                ||
                serverTimestamp(),

              lastLoginAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()

            },
            {
              merge:true
            }
          );

        }

      }

    }catch(e){

      console.warn(
        "registry status",
        e
      );

    }

  }


  return p;

}


/* =========================================================
   舊帳號修改密碼
========================================================= */

async function changeOwnPassword(
  force=false
){

  const p=
    prompt(
      force
        ?"第一次登入，請設定新的個人密碼（至少 6 碼）："
        :"請輸入新的密碼（至少 6 碼）："
    );


  if(!p){

    if(force){

      await signOut(auth);

    }

    return false;

  }


  if(
    p.length<6
  ){

    alert(
      "密碼至少 6 碼。"
    );

    return changeOwnPassword(
      force
    );

  }


  const p2=
    prompt(
      "請再輸入一次新密碼："
    );


  if(
    p2!==p
  ){

    alert(
      "兩次密碼不同，請重新設定。"
    );

    return changeOwnPassword(
      force
    );

  }


  try{

    await updatePassword(
      auth.currentUser,
      p
    );

  }catch(e){

    console.error(e);


    const code=
      e?.code
      ||
      "unknown";


    let tip=
      "密碼修改失敗。";


    if(
      code==="auth/requires-recent-login"
    ){

      tip+=
        " 請先登出，再重新登入後立即修改。";

    }else if(
      code==="auth/weak-password"
    ){

      tip+=
        " 新密碼強度不足，請使用至少 6 碼。";

    }else{

      tip+=
        ` 錯誤代碼：${code}`;

    }


    alert(tip);


    if(force){

      await signOut(auth);

    }


    return false;

  }


  if(
    force
    ||
    profile?.mustChangePassword===true
  ){

    try{

      await updateDoc(
        doc(
          db,
          "users",
          auth.currentUser.uid
        ),
        {

          mustChangePassword:false,

          updatedAt:
            serverTimestamp()

        }
      );


      if(profile){

        profile.mustChangePassword=
          false;

      }

    }catch(e){

      console.error(e);


      alert(
        "新密碼已修改成功，但第一次登入狀態尚未寫入。請記住新密碼後重新登入。錯誤："
        +
        (
          e?.code
          ||
          e.message
        )
      );


      return false;

    }

  }


  alert(
    force
      ?"第一次登入密碼設定完成。"
      :"密碼已更新。"
  );


  return true;

}

function currentAssignments(){

  const sem=
    profile?.type==="student"
      ?currentSemester
      :viewSemester;


  let list=
    (
      profile.assignments
      ||
      []
    )
    .filter(
      a=>
        (
          a.semester
          ||
          ""
        )
        ===sem
    );


  /*
    教師查看舊學期時，
    只保留 teacher 任課紀錄，
    不讓以前曾是其他角色的權限混進來。
  */

  if(
    profile?.type==="teacher"
    &&
    sem!==currentSemester
  ){

    list=
      list.filter(
        a=>a.kind==="teacher"
      );

  }


  return list;

}

/* =========================================================
   收繳
========================================================= */

function startCollection(){

  if(unsubItems){

    unsubItems();

  }


  const key=
    scopeKey(
      currentAssignment
    );


  const q=
    query(
      collection(
        db,
        "collectionItems"
      ),
      where(
        "semester",
        "==",
        viewSemester
      ),
      where(
        "scopeKey",
        "==",
        key
      )
    );


  unsubItems=
    onSnapshot(
      q,
      snap=>{

        const items=
          snap.docs
            .map(
              d=>({
                id:d.id,
                ...d.data()
              })
            )
            .sort(
              (
                a,
                b
              )=>
                (
                  b.date
                  ||
                  ""
                )
                .localeCompare(
                  a.date
                  ||
                  ""
                )
            );


        renderCollection(
          items
        );

      },
      e=>
        msg(
          $("#appMsg"),
          "讀取收繳資料失敗："
          +
          esc(e.message),
          "error"
        )
    );

}


function collectionCounts(
  it
){

  const counts={

    submitted:0,
    missing:0,
    late:0,
    exempt:0,
    lateSubmitted:0

  };


  Object.entries(
    it.records
    ||
    {}
  )
  .forEach(
    (
      [
        sid,
        v
      ]
    )=>{

      counts[v]=
        (
          counts[v]
          ||
          0
        )
        +
        1;


      if(
        v==="submitted"
        &&
        (
          it.lateSubmitted
          ||
          {}
        )[sid]
      ){

        counts.lateSubmitted++;

      }

    }
  );


  return counts;

}

){

  if(

        </button>

      </div>
    `;

  }


  if(

    )

    items.length
  ){

    html+=`

      <div class="teacher-tools">

/* =========================================================
   確認收繳
========================================================= */

async function confirmCollection(
  it
){

  const confirming=
    it.reviewStatus!=="confirmed";


  if(
    !confirm(
      confirming
        ?`確定確認「${it.itemName}」？

確認後：已繳與免繳會鎖定；未繳、補交仍可繼續修改。`
        :`確定取消確認「${it.itemName}」？`
    )
  ){

    return;

  }


  const lockedRecords={};


  if(confirming){

    Object.entries(
      it.records
      ||
      {}
    )
    .forEach(
      (
        [
          sid,
          status
        ]
      )=>

        lockedRecords[sid]=
          status==="submitted"
          ||
          status==="exempt"

    );

  }


  await updateDoc(
    doc(
      db,
      "collectionItems",
      it.id
    ),
    {

      reviewStatus:
        confirming
          ?"confirmed"
          :"pending",

      locked:false,

      lockedRecords:
        confirming
          ?lockedRecords
          :{},

      confirmedBy:
        confirming
          ?auth.currentUser.uid
          :null,

      confirmedByName:
        confirming
          ?(
              profile.displayName
              ||
              profile.username
            )
          :null,

      confirmedAt:
        confirming
          ?serverTimestamp()
          :null,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    confirming
      ?"confirm"
      :"unconfirm",
    "collection",
    it.id,
    `${confirming?"確認":"取消確認"}收繳：${it.itemName}`
  );

}

      "hidden"
    )
  ){

    box.classList.add(
      "hidden"
    );


    box.innerHTML=
      "";


    return;

  }


  box.classList.remove(
    "hidden"
  );


  const confirmed=
    it.reviewStatus==="confirmed";


  const canWrite=
    canCollection(
      currentAssignment
    );


  box.innerHTML=`

    ${
      it.note
        ?`
          <div class="notice">
            備註：${esc(it.note)}
          </div>
        `
        :""
    }


    <div class="toolbar">

      ${
        canWrite
          ?`

            </button>
          `
          :""
      }


      <span class="sub">
        確認後：已繳／免繳鎖定；未繳／補交仍可修正。
      </span>

    </div>


    <div class="roster">

      ${
        roster.map(
          s=>{

            const id=
              s.id
              ||
              String(s.seat);


            const v=
              (
                it.records
                ||
                {}
              )[id]
              ||
              "submitted";


            const locked=
              confirmed
              &&
              !!(
                it.lockedRecords
                ||
                {}
              )[id];


            const late=
              v==="submitted"
              &&
              !!(
                it.lateSubmitted
                ||
                {}
              )[id];


            const editable=
              canWrite
              &&
              !locked;


            return`

              <div
                class="student ${
                  locked
                    ?"locked"
                    :""
                }"
              >

                <div class="name">
                  ${s.seat}. ${esc(s.name)}
                </div>


                <select
                  class="status col-status"
                  data-student="${esc(id)}"
                  data-old="${esc(v)}"
                  ${
                    editable
                      ?""
                      :"disabled"
                  }
                >

                  ${
                    statusOptions.map(
                      (
                        [
                          x,
                          l
                        ]
                      )=>`

                        <option
                          value="${x}"
                          ${
                            x===v
                              ?"selected"
                              :""
                          }
                        >
                          ${l}
                        </option>
                      `
                    )
                    .join("")
                  }

                </select>


                ${
                  late
                    ?`
                      <div class="late-note">
                        已繳交（遲交）
                      </div>
                    `
                    :""
                }


                ${
                  locked
                    ?`
                      <div class="lock-note">
                        🔒 已確認鎖定
                      </div>
                    `
                    :""
                }

              </div>
            `;

          }
        )
        .join("")
      }

    </div>


    ${
      canWrite
        ?`

          <div class="toolbar">

            <button
              class="btn primary save-col"
            >
              儲存收繳狀態
            </button>

          </div>
        `
        :""
    }
  `;


  box
    .querySelector(
      ".all-submitted"
    )
    ?.addEventListener(
      "click",
      ()=>{

        box
          .querySelectorAll(
            ".col-status:not(:disabled)"
          )
          .forEach(
            s=>
              s.value=
                "submitted"
          );

      }
    );


  box
    .querySelector(
      ".save-col"
    )
    ?.addEventListener(
      "click",
      async()=>{

        const records={
          ...(
            it.records
            ||
            {}
          )
        };


        const lateSubmitted={
          ...(
            it.lateSubmitted
            ||
            {}
          )
        };


        const lockedRecords={
          ...(
            it.lockedRecords
            ||
            {}
          )
        };


        box
          .querySelectorAll(
            ".col-status"
          )
          .forEach(
            sel=>{

              if(sel.disabled){

                return;

              }


              const sid=
                sel.dataset.student;


              const oldStatus=
                sel.dataset.old;


              const newStatus=
                sel.value;


              records[sid]=
                newStatus;


              if(
                confirmed
                &&
                (
                  oldStatus==="missing"
                  ||
                  oldStatus==="late"
                )
                &&
                newStatus==="submitted"
              ){

                lateSubmitted[sid]=
                  true;


                lockedRecords[sid]=
                  true;

              }


              else if(
                confirmed
                &&
                newStatus==="exempt"
              ){

                lockedRecords[sid]=
                  true;

              }

            }
          );


        await updateDoc(
          doc(
            db,
            "collectionItems",
            it.id
          ),
          {

            records,

            lateSubmitted,

            lockedRecords,

            updatedAt:
              serverTimestamp()

          }
        );


        await audit(
          "update",
          "collection",
          it.id,
          `更新收繳：${it.itemName}`
        );


        alert(
          "已儲存"
        );

      }
    );

}

function startScores(){

  if(unsubAssess){

    unsubAssess();

  }


  const key=
    scopeKey(
      currentAssignment
    );


  const q=
    query(
      collection(
        db,
        "assessments"
      ),
      where(
        "semester",
        "==",
        viewSemester
      ),
      where(
        "scopeKey",
        "==",
        key
      )
    );


  unsubAssess=
    onSnapshot(
      q,
      snap=>{

        currentAssessmentItems=
          snap.docs
            .map(
              d=>({
                id:d.id,
                ...d.data()
              })
            )
            .sort(
              (
                a,
                b
              )=>
                (
                  b.date
                  ||
                  ""
                )
                .localeCompare(
                  a.date
                  ||
                  ""
                )
            );


        renderScores(
          currentAssessmentItems
        );

      },
      e=>
        msg(
          $("#appMsg"),
          "讀取成績資料失敗："
          +
          esc(e.message),
          "error"
        )
    );

}


function calcStats(
  it
){

  const vals=[];

  let absent=0;

  let below=0;


  Object.values(
    it.scores
    ||
    {}
  )
  .forEach(
    r=>{

      if(
        r.status==="absent"
      ){

        absent++;

      }


      if(
        (
          r.status==="normal"
          ||
          r.status==="makeup"
        )
        &&
        hasScore(r)
      ){

        const n=
          Number(
            r.score
          );


        vals.push(n);


        if(
          n<
          Number(
            it.passScore
            ||
            0
          )
        ){

          below++;

        }

      }

    }
  );


  return{

    avg:
      vals.length
        ?(
            vals.reduce(
              (
                a,
                b
              )=>a+b,
              0
            )
            /
            vals.length
          )
          .toFixed(1)
        :"-",

    high:
      vals.length
        ?Math.max(...vals)
        :"-",

    low:
      vals.length
        ?Math.min(...vals)
        :"-",

    below,

    absent,

    count:
      vals.length

  };

}

async function createAssessmentPrompt(){

  const max=
    Number(
      prompt(
        "滿分：",

  if(
    !Number.isFinite(max)
    ||
    max<=0
  ){

    return alert(
      "滿分格式不正確"
    );

  }


  const pass=
    Number(
      prompt(
        "及格分數：",
        String(
          Math.round(
            max*.6
          )
        )
      )
    );


  if(
    !Number.isFinite(pass)
  ){

    return alert(
      "及格分數格式不正確"
    );

  }


  const a=
    currentAssignment;


  const scores={};


  roster.forEach(
    s=>

      scores[
        s.id
        ||
        String(s.seat)
      ]={

        status:
          "not_entered",

        score:null

      }

  );


  const ref=
    await addDoc(
      collection(
        db,
        "assessments"
      ),
      {

        semester:
          a.semester
          ||
          currentSemester,

        scopeKey:
          scopeKey(a),

        classId:
          a.classId,

        scopeType:
          a.scopeType,

        scopeName:
          a.scopeName,

        name:
          name.trim(),

        date:
          today(),

        maxScore:max,

  );

}


/* =========================================================
   確認成績
========================================================= */

async function confirmAssessment(
  it
){

  const confirming=
    it.reviewStatus!=="confirmed";


  if(
    !confirm(
      confirming
        ?`確定確認「${it.name}」？

確認後：已有成績會鎖定；尚未登記的學生仍可補登。
若要修改已存在成績，請先按「解鎖」。`
        :`確定取消確認「${it.name}」？`
    )
  ){

    return;

  }


  const scoreLocks={};


  if(confirming){

    Object.entries(
      it.scores
      ||
      {}
    )
    .forEach(
      (
        [
          sid,
          r
        ]
      )=>

        scoreLocks[sid]=
          hasScore(r)

    );

  }


  await updateDoc(
    doc(
      db,
      "assessments",
      it.id
    ),
    {

      reviewStatus:
        confirming
          ?"confirmed"
          :"pending",

      locked:false,

      scoreLocks:
        confirming
          ?scoreLocks
          :{},

      confirmedBy:
        confirming
          ?auth.currentUser.uid
          :null,

      confirmedByName:
        confirming
          ?(
              profile.displayName
              ||
              profile.username
            )
          :null,

      confirmedAt:
        confirming
          ?serverTimestamp()
          :null,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    confirming
      ?"confirm"
      :"unconfirm",
    "assessment",
    it.id,
    `${confirming?"確認":"取消確認"}成績：${it.name}`
  );

}


/* =========================================================
   編輯成績
========================================================= */

function toggleScoreEditor(
  it
){

  const box=
    $(`#score-${it.id}`);


  if(
    !box.classList.contains(
      "hidden"
    )
  ){

    box.classList.add(
      "hidden"
    );


    box.innerHTML=
      "";


    return;

  }


  box.classList.remove(
    "hidden"
  );


  const confirmed=
    it.reviewStatus==="confirmed";


  const canWrite=
    canScores(
      currentAssignment
    );


  box.innerHTML=`

    ${
      confirmed
        ?`
          <div class="notice">
            此成績已確認：有成績者鎖定；空白仍可補登。
            要更改已存在分數，請先解鎖該生。
          </div>
        `
        :""
    }


    <div>

      ${
        roster.map(
          s=>{

            const id=
              s.id
              ||
              String(s.seat);


            const r=
              (
                it.scores
                ||
                {}
              )[id]
              ||
              {

                status:
                  "not_entered",

                score:null

              };


            const locked=
              confirmed
              &&
              !!(
                it.scoreLocks
                ||
                {}
              )[id];


            const editable=
              canWrite
              &&
              !locked;


            return`

              <div class="score-row">

                <b>
                  ${s.seat}
                </b>

                <span>
                  ${esc(s.name)}
                </span>


                <input
                  class="score-input"
                  data-student="${esc(id)}"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  max="${it.maxScore}"
                  value="${r.score??""}"
                  ${
                    editable
                      ?""
                      :"disabled"
                  }
                >


                <select
                  class="score-status"
                  data-student="${esc(id)}"
                  ${
                    editable
                      ?""
                      :"disabled"
                  }
                >

                  ${
                    scoreStatusOptions.map(
                      (
                        [
                          x,
                          l
                        ]
                      )=>`

                        <option
                          value="${x}"
                          ${
                            x===
                            (
                              r.status
                              ||
                              "not_entered"
                            )
                              ?"selected"
                              :""
                          }
                        >
                          ${l}
                        </option>
                      `
                    )
                    .join("")
                  }

                </select>


                ${
                  locked
                  &&
                  canWrite
                    ?`

                      <button
                        class="btn warn small unlock-score"
                        data-student="${esc(id)}"
                      >
                        🔓 解鎖
                      </button>
                    `
                    :(
                        locked
                          ?`
                            <span class="lock-note">
                              🔒 已鎖
                            </span>
                          `
                          :""
                      )
                }

              </div>
            `;

          }
        )
        .join("")
      }

    </div>


    ${
      canWrite
        ?`

          <div class="toolbar">

            <button
              class="btn primary save-score"
            >
              儲存成績
            </button>

          </div>
        `
        :""
    }
  `;


  const inputs=[
    ...box.querySelectorAll(
      ".score-input:not(:disabled)"
    )
  ];


  inputs.forEach(
    (
      inp,
      i
    )=>

      inp.addEventListener(
        "keydown",
        e=>{

          if(
            e.key==="Enter"
            &&
            inputs[i+1]
          ){

            e.preventDefault();


            inputs[i+1]
              .focus();


            inputs[i+1]
              .select();

          }

        }
      )

  );


  box
    .querySelectorAll(
      ".unlock-score"
    )
    .forEach(
      btn=>

        btn.onclick=
        async()=>{

          const sid=
            btn.dataset.student;


          if(
            !confirm(
              "確定解鎖這位學生的既有成績？"
            )
          ){

            return;

          }


          const scoreLocks={

            ...(
              it.scoreLocks
              ||
              {}
            ),

            [sid]:false

          };


          await updateDoc(
            doc(
              db,
              "assessments",
              it.id
            ),
            {

              scoreLocks,

              updatedAt:
                serverTimestamp()

            }
          );


          await audit(
            "unlock_score",
            "assessment",
            it.id,
            `解鎖成績：${it.name}｜座號 ${sid}`
          );


          it.scoreLocks=
            scoreLocks;


          toggleScoreEditor(
            it
          );


          toggleScoreEditor(
            it
          );

        }
    );


  box
    .querySelector(
      ".save-score"
    )
    ?.addEventListener(
      "click",
      async()=>{

        const scores={

          ...(
            it.scores
            ||
            {}
          )

        };


        const scoreLocks={

          ...(
            it.scoreLocks
            ||
            {}
          )

        };


        try{

          for(
            const s
            of roster
          ){

            const id=
              s.id
              ||
              String(s.seat);


            const inp=
              box.querySelector(
                `.score-input[data-student="${CSS.escape(id)}"]`
              );


            const sel=
              box.querySelector(
                `.score-status[data-student="${CSS.escape(id)}"]`
              );


            if(
              !inp
              ||
              inp.disabled
            ){

              continue;

            }


            let score=
              inp.value===""
                ?null
                :Number(
                    inp.value
                  );


            if(
              score!==null
              &&
              (
                score<0
                ||
                score>
                Number(
                  it.maxScore
                )
              )
            ){

              throw new Error(
                `${s.name} 分數超出範圍`
              );

            }


            let status=
              sel.value;


            if(
              score!==null
              &&
              status==="not_entered"
            ){

              status=
                "normal";

            }


            scores[id]={

              score,

              status

            };


            if(
              confirmed
              &&
              score!==null
            ){

              scoreLocks[id]=
                true;

            }

          }


          await updateDoc(
            doc(
              db,
              "assessments",
              it.id
            ),
            {

              scores,

              scoreLocks,

              updatedAt:
                serverTimestamp()

            }
          );


          await audit(
            "update",
            "assessment",
            it.id,
            `更新小考：${it.name}`
          );


          alert(
            "已儲存"
          );

        }catch(e){

          alert(
            e.message
          );

        }

      }
    );

}

/* =========================================================
   任課老師週成績
========================================================= */

function teacherWeekData(){

  const start=
    $("#teacherWeekStart")
      ?.value
    ||
    weekRange(0)
      .start;


  const end=
    $("#teacherWeekEnd")
      ?.value
    ||
    weekRange(0)
      .end;


  const tests=
    currentAssessmentItems
      .filter(
        x=>

          (
            !start
            ||
            x.date>=start
          )
          &&
          (
            !end
            ||
            x.date<=end
          )

      )
      .sort(
        (
          a,
          b
        )=>

          (
            a.date
            ||
            ""
          )
          .localeCompare(
            b.date
            ||
            ""
          )
          ||
          (
            a.name
            ||
            ""
          )
          .localeCompare(
            b.name
            ||
            ""
          )

      );


  const rows=
    roster.map(
      s=>{

        const sid=
          s.id
          ||
          String(s.seat);


        return{

          seat:
            s.seat,

          name:
            s.name,

          sid,

          values:
            tests.map(
              t=>{

                const r=
                  (
                    t.scores
                    ||
                    {}
                  )[sid]
                  ||
                  {};


                if(
                  hasScore(r)
                ){

                  return Number(
                    r.score
                  );

                }


                if(
                  r.status==="absent"
                ){

                  return "缺考";

                }


                if(
                  r.status==="makeup"
                ){

                  return "補考";

                }


                if(
                  r.status==="exempt"
                ){

                  return "免試";

                }


                return "";

              }
            )

        };

      }
    );


  return{

    start,

    end,

    tests,

    rows

  };

}

/* =========================================================
   Excel 元件
========================================================= */

async function ensureXLSX(){

  if(
    window.XLSX
  ){

    return;

  }


  await new Promise(
    (
      resolve,
      reject
    )=>{

      const s=
        document.createElement(
          "script"
        );


      s.src=
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";


      s.onload=
        resolve;


      s.onerror=
        ()=>reject(
          new Error(
            "Excel 元件載入失敗"
          )
        );


      document.head
        .appendChild(s);

    }
  );

}

      "這個日期範圍沒有成績可下載。"
    );

  }


  try{

    const aoa=[

      [
        "座號",
        "姓名",

        ...d.tests.map(
          t=>
            `${t.name} (${t.date||""})`
        )

      ...d.rows.map(
        r=>[

          r.seat,

          r.name,

          ...r.values

        ]
      )

    ];


    const ws=
      XLSX.utils
        .aoa_to_sheet(
          aoa
        );


    ws["!cols"]=[

      {
        wch:7
      },

      {
        wch:12
      },

      ...d.tests.map(
        ()=>({
          wch:16
        })
      )

      XLSX.utils
        .book_new();


    XLSX.utils

        wb,

        "週成績"
      );


    XLSX.writeFile(
      wb,
      `${currentAssignment.classId}-${currentAssignment.scopeName}-週成績-${d.start}-${d.end}.xlsx`
    );

  }catch(e){

    );

  }

}
