<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>班級工作回報－管理後台</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">

<style>
:root{
  --sky:#58bdf5;
  --sea:#137fd1;
  --deep:#0d5e9d;

  --wood:#55321e;
  --wood2:#7c4b2d;
  --wood3:#3f2416;

  --paper:#fff7df;
  --paper2:#f9e4b6;

  --ink:#402819;
  --muted:#7a654f;
  --line:#dfc799;

  --blue:#1687ec;
  --green:#19b56b;
  --orange:#f79b1e;
  --red:#ef4c5c;
  --purple:#9068e8;

  --shadow:0 8px 22px rgba(67,40,20,.18);
}

*{
  box-sizing:border-box
}

html{
  min-height:100%
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    system-ui,
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.9),transparent 18%),
    radial-gradient(circle at 85% 5%,rgba(255,255,255,.8),transparent 15%),
    linear-gradient(
      180deg,
      #43b7f4 0,
      #a9e4ff 30%,
      #eefaff 58%,
      #dff4ff 100%
    );
}

button,
input,
select,
textarea{
  font:inherit
}

.hidden{
  display:none!important
}

a{
  color:inherit
}

/* =========================================================
   登入
========================================================= */

.login-shell{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  position:relative;
  overflow:hidden
}

.login-shell::before{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:-80px;
  height:240px;

  background:
    radial-gradient(
      ellipse at center,
      #2a9edb 0,
      #1277bd 48%,
      #075a98 100%
    );

  border-radius:50% 50% 0 0
}

.login-card{
  position:relative;
  z-index:2;
  width:min(460px,100%);
  padding:28px;

  border:3px solid #8b592e;
  border-radius:18px;

  background:
    linear-gradient(
      rgba(255,249,226,.97),
      rgba(248,222,166,.97)
    );

  box-shadow:
    0 16px 45px rgba(31,55,78,.3),
    inset 0 0 0 4px rgba(255,255,255,.45)
}

.login-brand{
  font-size:27px;
  font-weight:900;
  color:#55301c
}

.login-sub{
  color:#806448;
  margin-top:5px
}

.login-slogan{
  text-align:center;
  font-weight:800;
  color:#805629;
  margin-top:18px
}

/* =========================================================
   主畫面
========================================================= */

.app-layout{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  min-height:100vh
}

.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  padding:18px 12px;

  color:#fff;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.025) 0 2px,
      rgba(0,0,0,.04) 2px 5px
    ),
    linear-gradient(
      90deg,
      var(--wood3),
      var(--wood2) 55%,
      #4e2d1c
    );

  border-right:5px solid #9c6b37;
  box-shadow:8px 0 24px rgba(35,22,14,.2);
  overflow:auto;
  z-index:20
}

.sidebar-title{
  text-align:center;
  padding:14px 8px 18px;
  border-bottom:1px solid rgba(255,255,255,.17);
  margin-bottom:12px
}

.wheel{
  font-size:46px
}

.sidebar-title b{
  font-size:19px
}

.sidebar-sub{
  font-size:12px;
  color:#f9d7a4;
  margin-top:5px
}

.nav{
  display:grid;
  gap:8px
}

.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;

  border:1px solid transparent;
  border-radius:9px;
  padding:12px;

  color:#fff8ea;
  background:transparent;

  cursor:pointer;
  font-weight:800;
  font-size:15px
}

.nav button.active{
  background:
    linear-gradient(
      180deg,
      #2197f1,
      #1072cf
    );

  border-color:#8dd5ff;
  box-shadow:0 4px 10px rgba(0,78,145,.35)
}

.nav-icon{
  width:26px;
  text-align:center;
  font-size:21px
}

.sidebar-quote{
  margin-top:20px;
  padding:13px;

  color:#5c381c;
  text-align:center;
  line-height:1.7;
  font-weight:800;

  background:
    linear-gradient(
      #fff3c9,
      #eac57f
    );

  border:2px solid #9a6533;
  border-radius:8px;

  box-shadow:0 5px 12px rgba(0,0,0,.2)
}

.main-area{
  min-width:0
}

.hero{
  min-height:176px;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  padding:24px 32px;

  background:
    radial-gradient(
      circle at 76% -25%,
      #fff7aa 0,
      rgba(255,245,161,.45) 13%,
      transparent 30%
    ),
    linear-gradient(
      165deg,
      #1f9ff0 0,
      #60c5f8 55%,
      #d5f4ff 100%
    );

  border-bottom:5px solid #b47736
}

.hero-sign{
  max-width:710px;
  padding:17px 24px;

  background:
    linear-gradient(
      180deg,
      #fff7d8,
      #f4d59a
    );

  border:3px solid #996431;
  border-radius:12px;

  box-shadow:
    0 7px 0 #76451f,
    0 15px 26px rgba(50,67,87,.23)
}

.hero-title{
  font-size:31px;
  font-weight:950;
  letter-spacing:2px
}

.hero-sub{
  margin-top:7px;
  color:#795231;
  font-weight:800
}

.hero-user{
  min-width:190px;
  padding:12px 15px;
  border-radius:13px;

  background:rgba(255,255,255,.92);
  box-shadow:0 6px 17px rgba(24,85,132,.25)
}

.user-name{
  font-weight:900
}

.semester-badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 9px;

  border-radius:999px;

  background:#e5f3ff;
  color:#176baf;

  font-size:12px;
  font-weight:850
}

.header-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap
}

.content{
  padding:18px 20px 38px
}

.page-title{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:14px;

  font-size:22px;
  font-weight:950
}

.page-title::before{
  content:"☸️";
  font-size:27px
}

/* =========================================================
   卡片
========================================================= */

.card{
  position:relative;

  background:
    linear-gradient(
      180deg,
      rgba(255,252,237,.98),
      rgba(255,246,216,.98)
    );

  border:2px solid #d5ae6e;
  border-radius:13px;

  padding:16px;

  box-shadow:var(--shadow)
}

.section-title{
  font-size:20px;
  font-weight:950;
  margin-bottom:10px
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
  margin-bottom:16px
}

.dashboard-stat{
  min-height:128px;
  border-radius:13px;
  padding:17px;
  background:#fff;
  border:2px solid
}

.stat-blue{
  border-color:#80c8f7;
  background:linear-gradient(145deg,#fff,#e8f6ff)
}

.stat-green{
  border-color:#86dfae;
  background:linear-gradient(145deg,#fff,#ebfff3)
}

.stat-orange{
  border-color:#ffc167;
  background:linear-gradient(145deg,#fff,#fff4dd)
}

.stat-purple{
  border-color:#aaa0f3;
  background:linear-gradient(145deg,#fff,#f3efff)
}

.stat-label{
  font-weight:800
}

.stat-number{
  display:block;
  margin-top:3px;
  font-size:34px;
  font-weight:950
}

.stat-blue .stat-number{color:#126bc3}
.stat-green .stat-number{color:#0c8850}
.stat-orange .stat-number{color:#d3670a}
.stat-purple .stat-number{color:#6852c5}

.stat-msg{
  margin-top:8px;
  color:#796d62;
  font-size:13px;
  font-weight:700
}

/* =========================================================
   控制項
========================================================= */

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:end;
  margin:10px 0
}

.toolbar label{
  display:grid;
  gap:4px;
  font-size:13px;
  font-weight:800
}

.btn{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:850;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 2px 5px rgba(60,47,36,.12)
}

.primary{
  color:#fff;
  background:linear-gradient(#2197f4,#1175cf)
}

.gray{
  color:#55483c;
  background:linear-gradient(#f9f6ef,#e8dfcf);
  border:1px solid #cdbd9e
}

.good{
  color:#fff;
  background:linear-gradient(#27c67a,#13a75f)
}

.warn{
  color:#fff;
  background:linear-gradient(#ffad35,#ec8613)
}

.danger{
  color:#fff;
  background:linear-gradient(#f35e6e,#dc364d)
}

.purple{
  color:#fff;
  background:linear-gradient(#9a74eb,#7453cd)
}

.small{
  font-size:13px;
  padding:7px 9px
}

.field{
  display:grid;
  gap:5px;
  margin:10px 0
}

.field label{
  font-weight:800
}

.field input,
.field select,
.field textarea,
.toolbar input,
.toolbar select{
  width:100%;
  border:1px solid #c8a979;
  border-radius:8px;
  padding:9px 10px;
  background:#fffdf5
}

.notice{
  padding:11px 13px;
  border-radius:9px;

  background:#fff0c9;
  color:#80531f;
  border-left:5px solid #e99c2d;

  margin:10px 0
}

.notice.success{
  background:#e4f9eb;
  color:#087540;
  border-color:#19ad64
}

.notice.error{
  background:#ffe5e7;
  color:#aa2937;
  border-color:#dc4052
}

.sub,
.meta{
  color:#7f6c57;
  font-size:13px
}

/* =========================================================
   item
========================================================= */

.item{
  border:1px solid #dfc693;
  border-radius:10px;
  padding:13px;
  margin:9px 0;
  background:rgba(255,255,255,.66)
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start
}

.pill{
  display:inline-block;
  padding:4px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:850
}

.pill.good{
  background:#d9f7e7;
  color:#087747
}

.pill.warn{
  background:#fff0ce;
  color:#b1650c
}

.pill.bad{
  background:#ffe0e3;
  color:#b02b3a
}

/* =========================================================
   表格
========================================================= */

.table-wrap{
  overflow:auto;
  border:1px solid #d8bd8d;
  border-radius:10px;
  background:#fffdf6
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px
}

th,
td{
  padding:8px 9px;
  border-bottom:1px solid #ead9b9;
  text-align:left;
  vertical-align:top;
  font-size:14px
}

th{
  position:sticky;
  top:0;
  z-index:1;

  background:
    linear-gradient(
      #f5dbab,
      #e9c787
    )
}

tbody tr:nth-child(even){
  background:#fffaf0
}

.summary-table th,
.summary-table td{
  text-align:center;
  white-space:nowrap
}

.summary-table th:nth-child(1),
.summary-table th:nth-child(2),
.summary-table td:nth-child(1),
.summary-table td:nth-child(2){
  text-align:left
}

.summary-table .subject-head{
  background:#e9c57d;
  font-size:15px;
  font-weight:900;
  border-right:2px solid #bc8d43
}

.summary-table .test-head{
  background:#fff1c9;
  font-size:12px;
  white-space:normal;
  min-width:90px
}

.bad-text{
  color:#d92d20;
  font-weight:900
}

.good-text{
  color:#087747;
  font-weight:800
}

.student-link{
  border:0;
  padding:4px 7px;
  border-radius:7px;
  background:#e7f3ff;
  color:#1268a8;
  font-weight:850;
  cursor:pointer
}

.student-link:hover{
  background:#cfe8ff
}

/* =========================================================
   學生詳情
========================================================= */

.student-detail-box{
  margin-top:16px;
  padding:15px;

  border:2px solid #89bee3;
  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #f4fbff,
      #e8f6ff
    );

  box-shadow:0 5px 15px rgba(26,114,170,.12)
}

.detail-header{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:10px
}

.detail-title{
  font-size:19px;
  font-weight:950;
  color:#1f5e89
}

.detail-subject{
  margin:10px 0;
  padding:11px 12px;

  background:#fff;
  border:1px solid #c8deed;
  border-radius:9px
}

.detail-subject-title{
  font-weight:900;
  color:#4c341f;
  margin-bottom:7px
}

.detail-line{
  display:flex;
  justify-content:space-between;
  gap:10px;

  padding:6px 0;
  border-bottom:1px dashed #e4d7bf
}

.detail-line:last-child{
  border-bottom:0
}

.detail-date{
  color:#8b7d6c;
  font-size:12px
}

.status-submitted{
  color:#087747;
  font-weight:900
}

.status-missing{
  color:#d92d20;
  font-weight:900
}

.status-late{
  color:#e06b00;
  font-weight:900
}

.status-exempt{
  color:#6750a4;
  font-weight:900
}

.score-empty{
  color:#a65b00;
  font-weight:800
}

/* =========================================================
   學生 / 權限
========================================================= */

.student-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:7px
}

.student{
  border:1px solid #dcc396;
  border-radius:9px;
  padding:8px;
  background:#fffdf7
}

.student select,
.student input{
  width:100%;
  padding:7px;
  border:1px solid #ccb286;
  border-radius:7px;
  margin-top:5px
}

.assign{
  background:#fff9e9;
  border:1px solid #e1c799;
  padding:8px 10px;
  border-radius:8px;
  margin:6px 0
}

.role-row{
  display:grid;
  grid-template-columns:minmax(150px,1fr) minmax(180px,1.4fr);
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px dashed #dfc89e
}

.role-row select{
  width:100%;
  padding:8px;
  border:1px solid #ccb184;
  border-radius:7px
}

.late-note{
  color:#d72638;
  font-weight:900;
  font-size:13px;
  margin-top:5px
}

.lock-note{
  color:#7d6d5b;
  font-size:12px;
  margin-top:4px
}

/* =========================================================
   Modal
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:14px;

  background:rgba(35,24,17,.62);
  backdrop-filter:blur(3px)
}

.modal-card{
  width:min(1180px,100%);
  max-height:92vh;
  overflow:auto;

  padding:17px;

  background:
    linear-gradient(#fff9e7,#f8e2b7);

  border:3px solid #88562d;
  border-radius:14px;

  box-shadow:0 20px 55px rgba(0,0,0,.35)
}

/* =========================================================
   彙整
========================================================= */

.summary-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0
}

.summary-note{
  padding:10px;
  border-radius:8px;
  background:#e8f6ff;
  color:#23628e;
  font-size:13px;
  font-weight:700
}

.subject-chip{
  display:inline-block;
  margin:2px;
  padding:3px 7px;

  background:#e6f3ff;
  color:#176ca9;

  border-radius:999px;
  font-size:12px;
  font-weight:800
}

/* =========================================================
   手機
========================================================= */

@media(max-width:900px){

  .app-layout{
    display:block
  }

  .sidebar{
    position:relative;
    height:auto;

    border-right:0;
    border-bottom:4px solid #9c6b37
  }

  .sidebar-title,
  .sidebar-quote{
    display:none
  }

  .nav{
    display:flex;
    overflow:auto
  }

  .nav button{
    flex:0 0 auto;
    width:auto;
    white-space:nowrap
  }

  .hero{
    min-height:auto;
    padding:17px;
    flex-direction:column;
    align-items:stretch
  }

  .hero-title{
    font-size:24px
  }

  .stats-grid{
    grid-template-columns:1fr 1fr
  }

  .two{
    grid-template-columns:1fr
  }

}

@media(max-width:560px){

  .content{
    padding:12px
  }

  .stats-grid{
    grid-template-columns:1fr
  }

  .hero-title{
    font-size:21px
  }

  .role-row{
    grid-template-columns:1fr
  }

}
</style>
</head>

<body>

<section id="loginView" class="login-shell">

  <div class="login-card">

    <div class="login-brand">
      ⚓ 班級工作回報－管理後台
    </div>

    <div class="login-sub">
      導師專屬航海指揮中心
    </div>

    <div id="loginMsg"></div>

    <div class="field">

      <label>
        管理員帳號／Email
      </label>

      <input
        id="loginUser"
        autocomplete="username"
      >

    </div>

    <div class="field">

      <label>
        密碼
      </label>

      <input
        id="loginPass"
        type="password"
        autocomplete="current-password"
      >

    </div>

    <button
      id="loginBtn"
      class="btn primary"
      style="width:100%"
    >
      ⛵ 登入管理後台
    </button>

    <div class="login-slogan">
      航向更好的班級！每一份努力，都讓未來更閃亮！
    </div>

  </div>

</section>


<main
  id="appView"
  class="hidden"
>

<div class="app-layout">

  <aside class="sidebar">

    <div class="sidebar-title">

      <div class="wheel">
        ☸️
      </div>

      <b>
        班級航海管理站
      </b>

      <div class="sidebar-sub">
        一起航向更棒的班級！
      </div>

    </div>


    <div class="nav">

      <button
        class="active"
        data-page="dashboard"
      >
        <span class="nav-icon">🏠</span>
        總覽／學期
      </button>


      <button data-page="roles">
        <span class="nav-icon">📜</span>
        職務派發總表
      </button>


      <button data-page="records">
        <span class="nav-icon">📝</span>
        收繳／成績
      </button>


      <button data-page="accounts">
        <span class="nav-icon">🔑</span>
        帳號與權限
      </button>


      <button data-page="classes">
        <span class="nav-icon">👥</span>
        班級名單
      </button>


      <button data-page="audit">
        <span class="nav-icon">🧾</span>
        操作紀錄
      </button>

    </div>


    <div class="sidebar-quote">
      小小的努力<br>
      也能成就<br>
      偉大的航程！<br>
      — 加油！ —
    </div>

  </aside>


  <div class="main-area">

    <header class="hero">

      <div class="hero-sign">

        <div class="hero-title">
          ☸️ 班級工作回報－管理後台
        </div>

        <div class="hero-sub">
          一起航向更棒的班級！每一份努力，都讓未來更閃亮！
        </div>

      </div>


      <div class="hero-user">

        <div class="user-name">
          👨‍🏫 <span id="who"></span>
        </div>

        <div
          id="semesterBadge"
          class="semester-badge"
        ></div>


        <div class="header-actions">

          <a
            href="class-work.html"
            style="text-decoration:none"
          >
            <button class="btn gray small">
              📋 回報頁
            </button>
          </a>

          <button
            id="logoutBtn"
            class="btn danger small"
          >
            🚪 登出
          </button>

        </div>

      </div>

    </header>


    <div class="content">

function esc(v=""){

  return String(v)
    .replace(
      /[&<>"]/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[m])
    );

}


function emailFor(v){

function dateString(date){

  const y=
    date.getFullYear();

  const m=
    String(
      date.getMonth()+1
    )
    .padStart(
      2,
      "0"
    );

  const d=
    String(
      date.getDate()
    )
    .padStart(
      2,
      "0"
    );


  return `${y}-${m}-${d}`;

}


function startOfWeek(
  offsetWeeks=0
){

  const d=
    new Date();


  d.setHours(
    0,
    0,
    0,
    0
  );


  const day=
    d.getDay();


  const mondayOffset=
    day===0
      ?-6
      :1-day;


  d.setDate(
    d.getDate()
    +
    mondayOffset
    +
    offsetWeeks*7
  );


  return d;

}


function endOfWeek(
  offsetWeeks=0
){

  const d=
    startOfWeek(
      offsetWeeks
    );


  d.setDate(
    d.getDate()+6
  );


  return d;

}


function randomPwd(){

  const chars=
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";


  return Array.from(
    {length:8},
    ()=>
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ]
  )
  .join("");

}

function computeAccess(
  assignments=[],
  semester=currentSemester
){

  const viewKeys=[];
  const collectionWriteKeys=[];
  const scoreWriteKeys=[];
  const classAccess=[];


  assignments
    .filter(
      a=>a.semester===semester
    )
    .forEach(
      a=>{

        const key=
          scopeKey(a);


        if(
          !viewKeys.includes(key)
        ){
          viewKeys.push(key);
        }


        if(
          a.canCollection
          &&
          !collectionWriteKeys.includes(key)
        ){
          collectionWriteKeys.push(key);
        }


        if(
          a.canScores
          &&
          !scoreWriteKeys.includes(key)
        ){
          scoreWriteKeys.push(key);
        }


        if(
          !classAccess.includes(
            a.classId
          )
        ){
          classAccess.push(
            a.classId
          );
        }

      }
    );


  return{
    viewKeys,
    collectionWriteKeys,
    scoreWriteKeys,
    classAccess
  };

}

async function ensureSystemSettings(){

  const ref=
    doc(
      db,
      "settings",
      "system"
    );


  const snap=
    await getDoc(ref);


  if(!snap.exists()){

    await setDoc(
      ref,
      {

        currentSemester:
          "115-1",

        semesterHistory:[
          "115-1"
        ],

        updatedAt:
          serverTimestamp()

      }
    );


    currentSemester=
      "115-1";


    semesterHistory=[
      "115-1"
    ];

  }else{

    const d=
      snap.data();


    currentSemester=
      d.currentSemester
      ||
      "115-1";


    semesterHistory=
      Array.isArray(
        d.semesterHistory
      )
      &&
      d.semesterHistory.length
        ?d.semesterHistory
        :[
            currentSemester
          ];


    if(
      !semesterHistory.includes(
        currentSemester
      )
    ){

      semesterHistory.push(
        currentSemester
      );

    }

  }


  recordSemester=
    currentSemester;

      `本學期 ${currentSemester}`;

}

    !/^\d{2,3}-[12]$/
      .test(semester)
  ){

    );

  }


  if(

    );

  }


  if(
    !confirm(
      `確定切換為 ${semester}？`
    )
  ){

    return;

  }


  const old=
    currentSemester;


  const history=[
    ...new Set(
      [
        ...semesterHistory,
        old,
        semester
      ]
    )
  ];


  await setDoc(
    doc(
      db,
      "settings",
      "system"
    ),
    {

      currentSemester:
        semester,

      semesterHistory:
        history,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  currentSemester=
    semester;

  semesterHistory=
    history;

  recordSemester=
    semester;


  await recalcAllAccess();


  await audit(
    "change_semester",
    "settings",
    "system",
    `${old} → ${semester}`,
    semester
  );


  $("#semesterBadge")
    .textContent=
      `本學期 ${semester}`;


  await refreshAll();

}


async function recalcAllAccess(){

  for(
    const user
    of users.filter(
      x=>x.type!=="admin"
    )
  ){

    const access=
      computeAccess(
        user.assignments||[],
        currentSemester
      );


    await updateDoc(
      doc(
        db,
        "users",
        user.uid
      ),
      {

        ...access,

        updatedAt:
          serverTimestamp()

      }
    );


    Object.assign(
      user,
      access
    );

  }

}

function setSummaryDates(
  weekId,
  startId,
  endId
){

  const value=
    $(`#${weekId}`).value;


  if(value==="custom"){

    $(`#${startId}`)
      .disabled=false;


    $(`#${endId}`)
      .disabled=false;


    return;

  }


  const offset=
    Number(value);


  $(`#${startId}`).value=
    dateString(
      startOfWeek(offset)
    );


  $(`#${endId}`).value=
    dateString(
      endOfWeek(offset)
    );


  $(`#${startId}`)
    .disabled=true;


  $(`#${endId}`)
    .disabled=true;

}


function generateHomeworkSummary(){

  const semester=
    $("#summarySemester").value;


  const classId=
    $("#summaryClass").value;


  const start=
    $("#summaryStart").value;


  const end=
    $("#summaryEnd").value;


  const roster=
    getRosterForClass(
      classId
    );


  const items=
    collections.filter(
      x=>
        x.semester===semester
        &&
        x.classId===classId
        &&
        subjects.includes(
          x.scopeName
        )
        &&
        (!start||x.date>=start)
        &&
        (!end||x.date<=end)
    )
    .sort(
      (
        a,
        b
      )=>
        String(a.date||"")
          .localeCompare(
            String(b.date||"")
          )
    );


  const usedSubjects=[
    ...new Set(
      items.map(
        x=>x.scopeName
      )
    )
  ]
  .sort(
    (
      a,
      b
    )=>
      subjects.indexOf(a)
      -
      subjects.indexOf(b)
  );


  const rows=
    roster.map(
      student=>{

        const sid=
          student.id
          ||
          String(student.seat);


        let totalMissing=0;
        let totalLate=0;


        const subjectData={};


        usedSubjects.forEach(
          subject=>{

            const subjectItems=
              items.filter(
                x=>x.scopeName===subject
              );


            let submitted=0;
            let missing=0;
            let late=0;


            subjectItems.forEach(
              item=>{

                const status=
                  (
                    item.records
                    ||
                    {}
                  )[sid]
                  ||
                  "submitted";


                const lateSubmitted=
                  status==="submitted"
                  &&
                  !!(
                    item.lateSubmitted
                    ||
                    {}
                  )[sid];


                if(
                  status==="submitted"
                  ||
                  status==="exempt"
                ){

                  submitted++;

                }


                if(
                  status==="missing"
                  ||
                  status==="late"
                ){

                  missing++;
                  totalMissing++;

                }


                if(
                  status==="late"
                  ||
                  lateSubmitted
                ){

                  late++;
                  totalLate++;

                }

              }
            );


            subjectData[subject]={
              submitted,
              total:subjectItems.length,
              missing,
              late
            };

          }
        );


        return{
          sid,
          seat:student.seat,
          name:student.name,
          subjectData,
          totalMissing,
          totalLate
        };

      }
    );


  currentHomeworkSummary={
    semester,
    classId,
    start,
    end,
    subjects:usedSubjects,
    items,
    rows
  };


  renderHomeworkSummary();

}

function statusClass(
  status,
  lateSubmitted
){

  if(
    status==="submitted"
    &&
    lateSubmitted
  ){

    return "status-late";

  }


  if(status==="submitted"){
    return "status-submitted";
  }


  if(status==="missing"){
    return "status-missing";
  }


  if(status==="late"){
    return "status-late";
  }


  if(status==="exempt"){
    return "status-exempt";
  }


  return "";

}


function homeworkStatusText(
  status,
  lateSubmitted
){

  if(
    status==="submitted"
    &&
    lateSubmitted
  ){

    return "已繳交（遲交）";

  }


  return dictLabel(
    statusOptions,
    status
  );

}

  const d=

          收起
        </button>

      </div>
  `;


  d.subjects.forEach(
    subject=>{

      const subjectItems=
        d.items.filter(
          x=>x.scopeName===subject
        );


      if(!subjectItems.length){

        return;

      }


      html+=`

        <div class="detail-subject">

                    {}

                return`

                  <div class="detail-line">

                    <div>

                      <b>
                        ${esc(item.itemName)}

function homeworkTableText(){

  const d=
    currentHomeworkSummary;


  const headers=[
    "座號",
    "姓名",
    ...d.subjects,
    "未繳",
    "遲交"
  ];


  const rows=
    d.rows.map(
      row=>[

        row.seat,

        row.name,

        ...d.subjects.map(
          subject=>{

            const x=
              row.subjectData[
                subject
              ];


            return x.total
              ?`${x.submitted}/${x.total}`
              :"";

          }
        ),

        row.totalMissing,

        row.totalLate

      ]
    );


  return[
    headers,
    ...rows
  ]
  .map(
    row=>
      row.join("\t")
  )
  .join("\n");

}

async function copyHomeworkText(){

  const d=
    currentHomeworkSummary;


  const missing=
    d.rows
      .filter(
        x=>x.totalMissing>0
      )
      .sort(
        (
          a,
          b
        )=>
          b.totalMissing
          -
          a.totalMissing
      );


  const late=
    d.rows
      .filter(
        x=>x.totalLate>0
      )
      .sort(
        (
          a,
          b
        )=>
          b.totalLate
          -
          a.totalLate
      );


  let text=
`【${d.classId}班 各科作業收繳週紀錄】
期間：${d.start}～${d.end}
作業／收繳紀錄：${d.items.length}筆

未繳紀錄：
`;


  text+=
    missing.length
      ?missing.map(
          x=>
            `${String(x.seat).padStart(2,"0")} ${x.name}：${x.totalMissing}件`
        )
        .join("\n")
      :"無";


  text+=
    `\n\n遲交紀錄：\n`;


  text+=
    late.length
      ?late.map(
          x=>
            `${String(x.seat).padStart(2,"0")} ${x.name}：${x.totalLate}件`
        )
        .join("\n")
      :"無";


  await copyText(text);


  alert(
    "文字摘要已複製。"
  );

}

function exportHomeworkSummary(){

  const d=
    currentHomeworkSummary;


  const rows=
    d.rows.map(
      row=>{

        const obj={
          座號:row.seat,
          姓名:row.name
        };


        d.subjects.forEach(
          subject=>{

            const x=
              row.subjectData[
                subject
              ];


            obj[subject]=
              x.total
                ?`${x.submitted}/${x.total}`
                :"";

          }
        );


        obj["未繳件數"]=
          row.totalMissing;


        obj["遲交件數"]=
          row.totalLate;


        return obj;

      }
    );


  downloadXlsx(
    `${d.classId}-各科作業收繳-${d.start}-${d.end}.xlsx`,
    "作業收繳",
    rows
  );

}

function generateScoreSummary(){

  const semester=
    $("#scoreSummarySemester").value;


  const classId=
    $("#scoreSummaryClass").value;


  const start=
    $("#scoreSummaryStart").value;


  const end=
    $("#scoreSummaryEnd").value;


  const roster=
    getRosterForClass(
      classId
    );


  const tests=
    assessments.filter(
      x=>
        x.semester===semester
        &&
        x.classId===classId
        &&
        subjects.includes(
          x.scopeName
        )
        &&
        (!start||x.date>=start)
        &&
        (!end||x.date<=end)
    )
    .sort(
      (
        a,
        b
      )=>{

        const subjectDiff=
          subjects.indexOf(
            a.scopeName
          )
          -
          subjects.indexOf(
            b.scopeName
          );


        if(subjectDiff!==0){

          return subjectDiff;

        }


        const dateDiff=
          String(a.date||"")
            .localeCompare(
              String(b.date||"")
            );


        if(dateDiff!==0){

          return dateDiff;

        }


        return String(a.name||"")
          .localeCompare(
            String(b.name||"")
          );

      }
    );


  const usedSubjects=[
    ...new Set(
      tests.map(
        x=>x.scopeName
      )
    )
  ]
  .sort(
    (
      a,
      b
    )=>
      subjects.indexOf(a)
      -
      subjects.indexOf(b)
  );


  const testsBySubject={};


  usedSubjects.forEach(
    subject=>{

      testsBySubject[subject]=
        tests.filter(
          x=>x.scopeName===subject
        );

    }
  );


  const rows=
    roster.map(
      student=>{

        const sid=
          student.id
          ||
          String(student.seat);


        const scoreData={};


        tests.forEach(
          test=>{

            const r=
              (
                test.scores
                ||
                {}
              )[sid]
              ||
              {};


            scoreData[
              test.id
            ]={

              score:
                hasScore(r)
                  ?Number(r.score)
                  :null,

              status:
                r.status
                ||
                "not_entered"

            };

          }
        );


        return{
          sid,
          seat:student.seat,
          name:student.name,
          scoreData
        };

      }
    );


  currentScoreSummary={
    semester,
    classId,
    start,
    end,
    subjects:usedSubjects,
    tests,
    testsBySubject,
    rows
  };


  renderScoreSummary();

}


function scoreDisplayText(
  scoreData
){

  if(
    scoreData
    &&
    scoreData.score!==null
  ){

    return String(
      scoreData.score
    );

  }


  if(!scoreData){

    return "";

  }


  if(
    scoreData.status==="absent"
  ){

    return "缺考";

  }


  if(
    scoreData.status==="exempt"
  ){

    return "免試";

  }


  if(
    scoreData.status==="makeup"
  ){

    return "補考";

  }


  return "";

}

/* =========================================================
   成績複製表格
========================================================= */

function scoreTableText(){

  const d=
    currentScoreSummary;


  const subjectHeader=[
    "座號",
    "姓名"
  ];


  const testHeader=[
    "",
    ""
  ];


  d.subjects.forEach(
    subject=>{

      const subjectTests=
        d.testsBySubject[
          subject
        ];


      subjectTests.forEach(
        (
          test,
          index
        )=>{

          subjectHeader.push(
            index===0
              ?subject
              :""
          );


          testHeader.push(
            test.name
          );

        }
      );

    }
  );


  const rows=
    d.rows.map(
      row=>[

        row.seat,

        row.name,

        ...d.subjects.flatMap(
          subject=>
            d.testsBySubject[
              subject
            ]
            .map(
              test=>
                scoreDisplayText(
                  row.scoreData[
                    test.id
                  ]
                )
            )
        )

      ]
    );


  return[
    subjectHeader,
    testHeader,
    ...rows
  ]
  .map(
    row=>
      row.join("\t")
  )
  .join("\n");

}

  await copyText(

  alert(

  );

}

async function copyScoreText(){

  const d=
    currentScoreSummary;


  const lines=[

/* =========================================================
   成績 Excel
========================================================= */

async function exportScoreSummary(){

  const d=
    currentScoreSummary;


  try{

    await ensureXLSX();


    /*
      使用 aoa_to_sheet 做兩層表頭：

      第一列：
      座號 姓名 國文 國文 數學 數學

      第二列：
              第一課 第二課 第一章 第二章
    */

    const firstRow=[
      "座號",
      "姓名"
    ];


    const secondRow=[
      "",
      ""
    ];


    const merges=[];


    let colIndex=2;


    d.subjects.forEach(
      subject=>{

        const subjectTests=
          d.testsBySubject[
            subject
          ];


        if(!subjectTests.length){

          return;

        }


        firstRow.push(
          subject
        );


        for(
          let i=1;
          i<subjectTests.length;
          i++
        ){

          firstRow.push("");

        }


        subjectTests.forEach(
          test=>
            secondRow.push(
              test.name
            )
        );


        if(
          subjectTests.length>1
        ){

          merges.push({

            s:{
              r:0,
              c:colIndex
            },

            e:{
              r:0,
              c:
                colIndex
                +
                subjectTests.length
                -
                1
            }

          });

        }


        colIndex+=
          subjectTests.length;

      }
    );


    const body=
      d.rows.map(
        row=>[

          row.seat,

          row.name,

          ...d.subjects.flatMap(
            subject=>
              d.testsBySubject[
                subject
              ]
              .map(
                test=>{

                  const r=
                    row.scoreData[
                      test.id
                    ];


                  if(
                    r
                    &&
                    r.score!==null
                  ){

                    return Number(
                      r.score
                    );

                  }


                  return scoreDisplayText(r);

                }
              )
          )

        ]
      );


    const aoa=[
      firstRow,
      secondRow,
      ...body
    ];


    const ws=
      XLSX.utils
        .aoa_to_sheet(
          aoa
        );


    ws["!merges"]=
      merges;


    ws["!cols"]=[
      {wch:7},
      {wch:12},
      ...d.tests.map(
        ()=>({
          wch:12
        })
      )
    ];


    const wb=
      XLSX.utils
        .book_new();


    XLSX.utils
      .book_append_sheet(
        wb,
        ws,
        "成績週紀錄"
      );


    XLSX.writeFile(
      wb,
      `${d.classId}-各科成績週紀錄-${d.start}-${d.end}.xlsx`
    );

  }catch(e){

    alert(
      `Excel 下載失敗：${e.message}`
    );

  }

}

   確認
========================================================= */

async function confirmRecord(
  type,
  id
){

  const col=
    type==="collection"
      ?"collectionItems"
      :"assessments";


  const source=
    type==="collection"
      ?collections
      :assessments;


  const record=
    source.find(
      x=>x.id===id
    );


  if(!record){

    return;

  }


  const confirming=
    record.reviewStatus!=="confirmed";


  if(
    !confirm(
      confirming
        ?type==="collection"
          ?`確定確認「${record.itemName}」？

確認後已繳／免繳鎖定，未繳／補交仍可修改。`
          :`確定確認「${record.name}」？

確認後已有成績鎖定，空白仍可補登。`
        :"確定取消確認？"
    )
  ){

    return;

  }


  if(type==="collection"){

    const lockedRecords={};


    if(confirming){

      Object.entries(
        record.records||{}
      )
      .forEach(
        (
          [
            sid,
            status
          ]
        )=>{

          lockedRecords[sid]=
            status==="submitted"
            ||
            status==="exempt";

        }
      );

    }


    await updateDoc(
      doc(
        db,
        col,
        id
      ),
      {

        reviewStatus:
          confirming
            ?"confirmed"
            :"pending",

        locked:false,

        lockedRecords:
          confirming
            ?lockedRecords
            :{},

        confirmedBy:
          confirming
            ?auth.currentUser.uid
            :null,

        confirmedByName:
          confirming
            ?me.displayName||me.username
            :null,

        confirmedAt:
          confirming
            ?serverTimestamp()
            :null,

        updatedAt:
          serverTimestamp()

      }
    );

  }else{

    const scoreLocks={};


    if(confirming){

      Object.entries(
        record.scores||{}
      )
      .forEach(
        (
          [
            sid,
            r
          ]
        )=>{

          scoreLocks[sid]=
            hasScore(r);

        }
      );

    }


    await updateDoc(
      doc(
        db,
        col,
        id
      ),
      {

        reviewStatus:
          confirming
            ?"confirmed"
            :"pending",

        locked:false,

        scoreLocks:
          confirming
            ?scoreLocks
            :{},

        confirmedBy:
          confirming
            ?auth.currentUser.uid
            :null,

        confirmedByName:
          confirming
            ?me.displayName||me.username
            :null,

        confirmedAt:
          confirming
            ?serverTimestamp()
            :null,

        updatedAt:
          serverTimestamp()

      }
    );

  }


  await audit(
    confirming
      ?"confirm"
      :"unconfirm",
    type,
    id,
    `${confirming?"確認":"取消確認"}：${record.itemName||record.name}`,
    record.semester
  );


  await refreshAll();

}

async function editRecord(
  type,
  id
){

  const source=
    type==="collection"
      ?collections
      :assessments;


  const record=
    source.find(
      x=>x.id===id
    );


  if(!record){

    return;

  }


  const roster=
    getRosterForClass(
      record.classId
    );


  let html=`

    <div class="item-head">

      <div>

        <div class="section-title">
          ${esc(
            record.itemName
            ||
            record.name
          )}
        </div>

        <div class="meta">
          ${esc(record.classId)}班
          ｜${esc(record.scopeName)}
          ｜${esc(record.date||"")}
        </div>

      </div>

      <button class="btn gray close-modal">
        ✖ 關閉
      </button>

    </div>
  `;


  if(type==="collection"){

    const confirmed=
      record.reviewStatus==="confirmed";


    html+=`

      <div class="notice">

        ${
          confirmed
            ?"已確認：已繳／免繳鎖定；未繳／補交仍可修改。"
            :"尚未確認：全部可修改。"
        }

      </div>


      <div class="student-grid">

        ${
          roster.map(
            student=>{

              const sid=
                student.id
                ||
                String(student.seat);


              const status=
                (
                  record.records
                  ||
                  {}
                )[sid]
                ||
                "submitted";


              const locked=
                confirmed
                &&
                !!(
                  record.lockedRecords
                  ||
                  {}
                )[sid];


              const late=
                status==="submitted"
                &&
                !!(
                  record.lateSubmitted
                  ||
                  {}
                )[sid];


              return`

                <div class="student">

                  <b>
                    ${student.seat}.
                    ${esc(student.name)}
                  </b>


                  <select
                    class="m-col"
                    data-id="${esc(sid)}"
                    data-old="${esc(status)}"
                    ${
                      locked
                        ?"disabled"
                        :""
                    }
                  >

                    ${
                      statusOptions.map(
                        (
                          [
                            code,
                            label
                          ]
                        )=>`

                          <option
                            value="${code}"
                            ${
                              code===status
                                ?"selected"
                                :""
                            }
                          >
                            ${label}
                          </option>
                        `
                      )
                      .join("")
                    }

                  </select>


                  ${
                    late
                      ?`
                        <div class="late-note">
                          🔴 已繳交（遲交）
                        </div>
                      `
                      :""
                  }


                  ${
                    locked
                      ?`
                        <div class="lock-note">
                          🔒 已確認鎖定
                        </div>
                      `
                      :""
                  }

                </div>
              `;

            }
          )
          .join("")
        }

      </div>


      <div class="toolbar">

        <button class="btn primary save-modal">
          💾 儲存修改
        </button>

      </div>
    `;

  }else{

    const confirmed=
      record.reviewStatus==="confirmed";


    html+=`

      <div class="notice">

        ${
          confirmed
            ?"已確認：已有成績鎖定；空白仍可補登。"
            :"尚未確認：全部成績可修改。"
        }

      </div>


      <div class="student-grid">

        ${
          roster.map(
            student=>{

              const sid=
                student.id
                ||
                String(student.seat);


              const r=
                (
                  record.scores
                  ||
                  {}
                )[sid]
                ||
                {};


              const locked=
                confirmed
                &&
                !!(
                  record.scoreLocks
                  ||
                  {}
                )[sid];


              return`

                <div class="student">

                  <b>
                    ${student.seat}.
                    ${esc(student.name)}
                  </b>


                  <input
                    class="m-score"
                    data-id="${esc(sid)}"
                    type="number"
                    value="${r.score??""}"
                    min="0"
                    max="${record.maxScore}"
                    ${
                      locked
                        ?"disabled"
                        :""
                    }
                  >


                  <select
                    class="m-status"
                    data-id="${esc(sid)}"
                    ${
                      locked
                        ?"disabled"
                        :""
                    }
                  >

                    ${
                      scoreStatusOptions.map(
                        (
                          [
                            code,
                            label
                          ]
                        )=>`

                          <option
                            value="${code}"
                            ${
                              code===
                              (
                                r.status
                                ||
                                "not_entered"
                              )
                                ?"selected"
                                :""
                            }
                          >
                            ${label}
                          </option>
                        `
                      )
                      .join("")
                    }

                  </select>


                  ${
                    locked
                      ?`
                        <button
                          class="btn warn small unlock-score-admin"
                          data-id="${esc(sid)}"
                        >
                          🔓 解鎖修改
                        </button>
                      `
                      :""
                  }

                </div>
              `;

            }
          )
          .join("")
        }

      </div>


      <div class="toolbar">

        <button class="btn primary save-modal">
          💾 儲存成績
        </button>

      </div>
    `;

  }


  showModal(html);


  if(type==="assessment"){

    $$(".unlock-score-admin")
      .forEach(
        button=>
          button.onclick=
          async()=>{

            const sid=
              button.dataset.id;


            if(
              !confirm(
                "確定解鎖這位學生的成績？"
              )
            ){

              return;

            }


            const scoreLocks={
              ...(
                record.scoreLocks
                ||
                {}
              ),
              [sid]:false
            };


            await updateDoc(
              doc(
                db,
                "assessments",
                id
              ),
              {

                scoreLocks,

                updatedAt:
                  serverTimestamp()

              }
            );


            record.scoreLocks=
              scoreLocks;


            await audit(
              "unlock_score",
              "assessment",
              id,
              `${record.name} 座號 ${sid} 解鎖`,
              record.semester
            );


            editRecord(
              type,
              id
            );

          }
      );

  }


  $(".save-modal")
    .onclick=
    async()=>{

      if(type==="collection"){

        const records={
          ...(
            record.records
            ||
            {}
          )
        };


        const lateSubmitted={
          ...(
            record.lateSubmitted
            ||
            {}
          )
        };


        const lockedRecords={
          ...(
            record.lockedRecords
            ||
            {}
          )
        };


        const confirmed=
          record.reviewStatus==="confirmed";


        $$(".m-col")
          .forEach(
            select=>{

              if(select.disabled){

                return;

              }


              const sid=
                select.dataset.id;


              const oldStatus=
                select.dataset.old;


              const newStatus=
                select.value;


              records[sid]=
                newStatus;


              if(
                confirmed
                &&
                (
                  oldStatus==="missing"
                  ||
                  oldStatus==="late"
                )
                &&
                newStatus==="submitted"
              ){

                lateSubmitted[sid]=true;
                lockedRecords[sid]=true;

              }


              if(
                confirmed
                &&
                newStatus==="exempt"
              ){

                lockedRecords[sid]=true;

              }

            }
          );


        await updateDoc(
          doc(
            db,
            "collectionItems",
            id
          ),
          {

            records,
            lateSubmitted,
            lockedRecords,

            updatedAt:
              serverTimestamp()

          }
        );

      }else{

        const scores={
          ...(
            record.scores
            ||
            {}
          )
        };


        const scoreLocks={
          ...(
            record.scoreLocks
            ||
            {}
          )
        };


        const confirmed=
          record.reviewStatus==="confirmed";


        for(
          const input
          of $$(".m-score")
        ){

          if(input.disabled){

            continue;

          }


          const sid=
            input.dataset.id;


          const statusEl=
            document.querySelector(
              `.m-status[data-id="${CSS.escape(sid)}"]`
            );


          const score=
            input.value===""
              ?null
              :Number(
                  input.value
                );


          if(
            score!==null
            &&
            (
              score<0
              ||
              score>
              Number(
                record.maxScore
              )
            )
          ){

            return alert(
              `座號 ${sid} 成績超出範圍。`
            );

          }


          let status=
            statusEl.value;


          if(
            score!==null
            &&
            status==="not_entered"
          ){

            status="normal";

          }


          scores[sid]={
            score,
            status
          };


          if(confirmed){

            scoreLocks[sid]=
              score!==null;

          }

        }


        await updateDoc(
          doc(
            db,
            "assessments",
            id
          ),
          {

            scores,
            scoreLocks,

            updatedAt:
              serverTimestamp()

          }
        );

      }


      hideModal();


      await refreshAll();


      alert(
        "✅ 已儲存。"
      );

    };

}

   Excel

async function ensureXLSX(){

  if(window.XLSX){

    return;

  }


  await new Promise(
    (
      resolve,
      reject
    )=>{

      const script=
        document.createElement(
          "script"
        );


      script.src=
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";


      script.onload=
        resolve;


      script.onerror=
        ()=>reject(
          new Error(
            "Excel 元件載入失敗"
          )
        );


      document.head
        .appendChild(
          script
        );

    }
  );

}


async function downloadXlsx(
  filename,
  sheetName,
  rows
){

  try{

    await ensureXLSX();


    const ws=
      XLSX.utils
        .json_to_sheet(
          rows
        );


    const wb=
      XLSX.utils
        .book_new();


    XLSX.utils
      .book_append_sheet(
        wb,
        ws,
        sheetName
      );


    XLSX.writeFile(
      wb,
      filename
    );

  }catch(e){

    alert(
      `Excel 下載失敗：${e.message}`
    );

  }

}


/* =========================================================
   複製
========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard
      .writeText(
        text
      );

  }catch{

    const textarea=
      document.createElement(
        "textarea"
      );


    textarea.value=
      text;


    document.body
      .appendChild(
        textarea
      );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();

  }

}

async function saveRoleTable(){

  const classId=
    $("#roleClass").value;


  const semester=
    $("#roleSemester").value;


  if(
    !confirm(
      `確定儲存 ${classId} 班 ${semester} 的職務表？`
    )
  ){

    return;

  }


  const selections=
    $$(".role-select")
      .map(
        select=>({

          uid:select.value,
          kind:select.dataset.kind,
          scopeType:select.dataset.type,
          scopeName:select.dataset.name

        })
      );


  const keys=
    new Set(
      standardRoles.map(
        r=>
          `${r.kind}|${r.scopeType}|${r.scopeName}`
      )
    );


  for(
    const user
    of users.filter(
      x=>x.type==="student"
    )
  ){

    let assignments=
      (
        user.assignments
        ||
        []
      )
      .filter(
        a=>
          !(
            a.semester===semester
            &&
            a.classId===classId
            &&
            keys.has(
              `${a.kind}|${a.scopeType}|${a.scopeName}`
            )
          )
      );


    selections
      .filter(
        x=>x.uid===user.uid
      )
      .forEach(
        s=>{

          const base=
            standardRoles.find(
              r=>
                r.kind===s.kind
                &&
                r.scopeType===s.scopeType
                &&
                r.scopeName===s.scopeName
            );


          assignments.push({

            semester,
            classId,
            kind:s.kind,
            scopeType:s.scopeType,
            scopeName:s.scopeName,
            canCollection:base.canCollection,
            canScores:base.canScores

          });

        }
      );


    const access=
      computeAccess(
        assignments,
        currentSemester
      );


    await updateDoc(
      doc(
        db,
        "users",
        user.uid
      ),
      {

        assignments,

        ...access,

        updatedAt:
          serverTimestamp()

      }
    );


    user.assignments=
      assignments;


    Object.assign(
      user,
      access
    );

  }


  await audit(
    "save_role_table",
    "roles",
    `${semester}-${classId}`,
    `儲存 ${semester} ${classId} 職務表`,
    semester
  );


  await refreshAll();


  alert(
    "✅ 職務表已儲存。"
  );

}

async function createAuthAndProfile(
  username,
  displayName,
  type,
  pwd
){

  let secondary;


  try{

    secondary=
      initializeApp(
        firebaseConfig,
        `secondary-${Date.now()}-${Math.random().toString(36).slice(2)}`
      );


    const sa=
      getAuth(secondary);


    const cred=
      await createUserWithEmailAndPassword(
        sa,
        emailFor(username),
        pwd
      );


    await setDoc(
      doc(
        db,
        "users",
        cred.user.uid
      ),
      {

        username,
        displayName,
        type,

        active:true,

        assignments:[],

        viewKeys:[],
        collectionWriteKeys:[],
        scoreWriteKeys:[],
        classAccess:[],

        mustChangePassword:true,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );


    return{
      uid:cred.user.uid
    };

  }finally{

    if(secondary){

      try{
        await deleteApp(secondary);
      }catch{}

    }

  }

}


async function createAccount(){

  const username=
    $("#newUsername")
      .value
      .trim();


  const name=
    $("#newName")
      .value
      .trim();


  const type=
    $("#newType").value;


  const pwd=
    $("#newPwd").value;


  if(
    !username
    ||
    !name
    ||
    pwd.length<6
  ){

    return alert(
      "資料未填完整，密碼至少 6 碼。"
    );

  }


  try{

    const r=
      await createAuthAndProfile(
        username,
        name,
        type,
        pwd
      );


    await audit(
      "create_user",
      "user",
      r.uid,
      `建立帳號 ${username}`
    );


    await refreshAll();


    const box=
      $("#createdInfo");


    if(box){

      box.innerHTML=`

        <div class="notice success">

          帳號：
          <b>${esc(username)}</b>

          <br>

          初始密碼：
          <b>${esc(pwd)}</b>

        </div>
      `;

    }

  }catch(e){

    alert(
      e.message
    );

  }

}


async function batchCreateAccounts(){

  const selected=
    $$(".batch-check:checked")
      .map(
        x=>({

          username:
            x.dataset.user,

          displayName:
            x.dataset.name

        })
      );


  if(!selected.length){

    return alert(
      "請勾選學生。"
    );

  }


  const result=[];


  for(
    const s
    of selected
  ){

    const pwd=
      randomPwd();


    try{

      await createAuthAndProfile(
        s.username,
        s.displayName,
        "student",
        pwd
      );


      result.push({
        ...s,
        pwd
      });

    }catch(e){

      console.error(e);

    }

  }


  await refreshAll();


  const box=
    $("#batchResult");


  if(box){

    box.innerHTML=`

      <div class="notice success">

        ${
          result.map(
            x=>
              `${x.username} ${x.displayName}｜${x.pwd}`
          )
          .join("<br>")
        }

      </div>
    `;

  }

}

          type="checkbox"

      </label>

        <input
          id="aScores"
          type="checkbox"
          checked
        >
        可登記成績
      </label>

    </div>


    <button
      id="addAssignment"
      class="btn primary"
    >
      ➕ 加入權限
    </button>
  `);


  function rerender(){

    $("#currentAssignments")
      .innerHTML=
        assignments.map(
          (
            a,
            i
          )=>`

            <div class="assign">

              ${a.semester}
              ｜${a.classId}
              ｜${esc(a.scopeName)}

              <button
                class="btn danger small remove-assignment"
                data-i="${i}"
              >

              </button>

            </div>
          `
        )
        .join("")
        ||
        "目前沒有權限";


    $$(".remove-assignment")
      .forEach(
        b=>
          b.onclick=
          async()=>{

            assignments.splice(
              Number(
                b.dataset.i
              ),
              1
            );


            await saveAssignments(
              user,
              assignments
            );


            rerender();

          }
      );

  }


  $("#aKind")

    ()=>{

      $("#aName")

              :subjects

          .map(

          .join("");

        .checked=

        scopeType:

        canCollection:
          $("#aCollection").checked,

        canScores:
          kind==="officer"
            ?false

      };


      if(

          x=>
            x.semester===a.semester
            &&
            x.classId===a.classId
            &&
            x.kind===a.kind
            &&
            x.scopeName===a.scopeName

        );

      }


      assignments.push(a);


      await saveAssignments(
        user,
        assignments
      );


      rerender();

    };


  rerender();

}


async function saveAssignments(

  assignments
){

  const access=

      assignments,
      currentSemester

  await updateDoc(
    doc(

      "users",
      user.uid
    ),
    {

      assignments,

      ...access,

      updatedAt:
        serverTimestamp()

    }

  user.assignments=

  Object.assign(
    user,
    access
  );


  await audit(
    "permissions",
    "user",
    user.uid,
    `更新權限 ${user.username}`
  );

function parseRoster(text){

  return text
    .split(/\r?\n/)
    .map(
      x=>x.trim()
    )
    .filter(Boolean)
    .map(
      line=>{

        const[
          seat,
          ...rest
        ]=
          line.split(
            /[,，\t]/
          );


        return{

          id:String(
            Number(seat)
          ),

          seat:
            Number(seat),

          name:
            rest
              .join("")
              .trim()

        };

      }
    )
    .filter(
      x=>
        x.seat
        &&
        x.name
    )
    .sort(
      (
        a,
        b
      )=>
        a.seat-b.seat
    );

}


async function saveClass(
  id,
  text
){

  id=id.trim();


  const students=
    parseRoster(text);


  if(
    !id
    ||
    !students.length
  ){

    return alert(
      "請輸入班級與名單。"
    );

  }


  await setDoc(
    doc(
      db,
      "classes",
      id
    ),
    {

      classId:id,
      students,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  await audit(
    "save_class",
    "class",
    id,
    `更新班級 ${id}`
  );


  await refreshAll();

}


function editClass(id){

  const c=
    classes.find(
      x=>x.id===id
    );


  if(!c){

    return;

  }


  const text=
    (
      c.students
      ||
      []
    )
    .map(
      s=>
        `${s.seat},${s.name}`
    )
    .join("\n");


  showModal(`

    <div class="item-head">

      <div class="section-title">
        編輯 ${id} 班
      </div>

      <button class="btn gray close-modal">
        關閉
      </button>

    </div>


    <textarea
      id="editRoster"
      style="
        width:100%;
        min-height:400px;
        padding:10px
      "
    >${esc(text)}</textarea>


    <button
      id="saveEditRoster"
      class="btn primary"
      style="margin-top:10px"
    >
      儲存
    </button>
  `);


  $("#saveEditRoster")
    .onclick=
    async()=>{

      await saveClass(
        id,
        $("#editRoster").value
      );


      hideModal();

    };

}


/* =========================================================
   Audit
========================================================= */

async function renderAudit(){

  let logs=[];


  try{

    const snap=
      await getDocs(
        query(
          collection(
            db,
            "auditLogs"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        )
      );


    logs=
      snap.docs
        .slice(
          0,
          250
        )
        .map(
          d=>d.data()
        );

  }catch(e){

    try{

      const snap=
        await getDocs(
          collection(
            db,
            "auditLogs"
          )
        );


      logs=
        snap.docs
          .map(
            d=>d.data()
          )
          .slice(
            -250
          )
          .reverse();

    }catch(err){

      console.error(err);

    }

  }


  $("#page-audit")
    .innerHTML=`

      <div class="page-title">
        操作紀錄
      </div>


      <div class="card">

        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th>時間</th>
                <th>學期</th>
                <th>操作者</th>
                <th>動作</th>
                <th>內容</th>
              </tr>

            </thead>


            <tbody>

              ${
                logs.map(
                  l=>`

                    <tr>

                      <td>
                        ${
                          l.createdAt
                          ?.toDate
                            ?l.createdAt
                              .toDate()
                              .toLocaleString(
                                "zh-TW"
                              )
                            :""
                        }
                      </td>

                      <td>
                        ${esc(l.semester||"")}
                      </td>

                      <td>
                        ${esc(l.actorName||"")}
                      </td>

                      <td>
                        ${esc(l.action||"")}
                      </td>

                      <td>
                        ${esc(l.detail||"")}
                      </td>

                    </tr>
                  `
                )
                .join("")
              }

            </tbody>

          </table>

        </div>

      </div>
    `;

}


/* =========================================================
   Modal
========================================================= */

function showModal(html){

  $("#modalBody")
    .innerHTML=
      html;


  $("#modal")
    .classList
    .remove(
      "hidden"
    );


  $(".close-modal")
    ?.addEventListener(
      "click",
      hideModal
    );

}


function hideModal(){

  $("#modal")
    .classList
    .add(
      "hidden"
    );


  $("#modalBody")
    .innerHTML=
      "";

}

</script>
