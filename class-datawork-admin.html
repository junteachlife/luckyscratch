<body>

import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,addDoc,getDocs,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyB56F4wJ-IMUiBsqJ5P33HoDK642h7671U",authDomain:"class-datawork.firebaseapp.com",projectId:"class-datawork",storageBucket:"class-datawork.firebasestorage.app",messagingSenderId:"24186422479",appId:"1:24186422479:web:8dee260f34b2e506fd63ba"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],DOMAIN='class-datawork.local';
let me=null,users=[],classes=[],collections=[],assessments=[],currentSemester='115-1',semesterHistory=['115-1'],recordSemester='115-1';

const defaultRosters={
'804':[[1,'王禹涵'],[2,'江育緹'],[3,'呂思儀'],[4,'李詠騏'],[5,'林子歆'],[6,'林禹萱'],[7,'張馨勻'],[8,'陳昕樂'],[9,'陳梓安'],[10,'陳筠蓁'],[11,'陳苙絜'],[12,'楊錚諭'],[13,'趙安褕'],[14,'魏語潔'],[15,'江靚恩'],[16,'王洋振'],[17,'吳昊丞'],[18,'李祐誠'],[19,'林宸陞'],[20,'林維辰'],[21,'林鈺棟'],[22,'洪楷祥'],[23,'陳兆楷'],[24,'陳沂璟'],[25,'黑肚·尤明'],[26,'賴震宇'],[27,'戴震龍'],[28,'謝宇哲']],
'802':[[1,'李芯玥'],[2,'李星緹'],[3,'林子歆'],[4,'林品妍'],[5,'林品彤'],[6,'林靛清'],[7,'陳又暄'],[8,'陳佳淇'],[9,'陳昕亞'],[10,'陳禹棠'],[11,'陳梓心'],[12,'黃衣芯'],[13,'劉妤妡'],[14,'賴芊忻'],[16,'王君晏'],[17,'王星尹'],[18,'田宇恩'],[19,'吳育承'],[20,'張立揚'],[21,'許宇曜'],[22,'陳宥禾'],[23,'陳昭瑒'],[24,'游育瑋'],[25,'游翔'],[26,'黃宇辰'],[27,'簡翊展'],[28,'羅泓棣']],
'904':[[1,'戴嘉妤'],[2,'陳資晴'],[3,'傅詩穎'],[4,'張瞳恩'],[5,'黃宇婕'],[6,'吳沛媛'],[7,'李妍芯'],[8,'鄭羽恩'],[9,'林子桐'],[10,'許詠晴'],[11,'吳宸彤'],[12,'林品妍'],[13,'蘇佳君'],[15,'趙右群'],[16,'林定毅'],[17,'潘子堯'],[18,'郭羿楷'],[19,'張明哲'],[20,'吳宇曜'],[21,'魏永聖'],[22,'游承恩'],[23,'胡琮浩'],[24,'李柏沅'],[25,'許育政'],[26,'宗旻恩'],[27,'吳博硯']],
'906':[[1,'陳亮妤'],[3,'董宜洳'],[4,'林庭瑜'],[5,'許淯淳'],[6,'陳鈺軒'],[7,'林郁庭'],[8,'陳雅竹'],[9,'陳睿瑤'],[10,'楊淇暄'],[11,'陳雨萱'],[12,'江霈穎'],[15,'陳逸恩'],[16,'劉哲皓'],[17,'陳士愷'],[18,'李開哲'],[19,'林翊凱'],[20,'林晉宇'],[21,'林釉荏'],[22,'林均昊'],[23,'賴羿軒'],[24,'鄧仲喆'],[25,'吳羽翔'],[26,'林擎宇'],[27,'林旻勳'],[28,'鄭凱軒'],[29,'李秉叡'],[31,'曾群文'],[32,'吳立丞']]
};
const subjects=['國文','英文','數學','自然','歷史','地理','公民','表藝','視藝','聽藝','童軍','家政','輔導','生科','資訊','健教'];
const officerRoles=['班長','副班長','風紀股長','學藝股長','衛生股長','副衛生股長','康樂股長','保健股長','食勤股長','事務股長','輔導股長','圖書志工(一)','圖書志工(二)'];
const standardRoles=[...officerRoles.map(name=>({kind:'officer',scopeType:'officer',scopeName:name,label:name,canCollection:true,canScores:false})),...subjects.map(name=>({kind:'assistant',scopeType:'subject',scopeName:name,label:`${name}小老師`,canCollection:true,canScores:true}))];

function esc(v=''){return String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function emailFor(v){v=v.trim();return v.includes('@')?v:`${v}@${DOMAIN}`}
function msg(el,t,c='notice'){el.innerHTML=t?`<div class="notice ${c}">${t}</div>`:''}
function today(){return new Date().toLocaleDateString('sv-SE')}
function randomPwd(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';return Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join('')}
function scopeKey(a){return `${a.semester}|${a.classId}|${a.scopeType}|${a.scopeName}`}
function semesterOptions(selected=currentSemester){const list=[...new Set([...semesterHistory,currentSemester,selected])].filter(Boolean).sort().reverse();return list.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function computeAccess(assignments=[],semester=currentSemester){const viewKeys=[],collectionWriteKeys=[],scoreWriteKeys=[],classAccess=[];for(const a of assignments.filter(x=>x.semester===semester)){const k=scopeKey(a);if(!viewKeys.includes(k))viewKeys.push(k);if(a.canCollection&&!collectionWriteKeys.includes(k))collectionWriteKeys.push(k);if(a.canScores&&!scoreWriteKeys.includes(k))scoreWriteKeys.push(k);if(!classAccess.includes(a.classId))classAccess.push(a.classId)}return{viewKeys,collectionWriteKeys,scoreWriteKeys,classAccess}}
async function audit(action,targetType,targetId,detail,semester=currentSemester){await addDoc(collection(db,'auditLogs'),{actorUid:auth.currentUser.uid,actorName:me.displayName||me.username,semester,action,targetType,targetId,detail,createdAt:serverTimestamp()})}
function activePage(){return $('.nav .active')?.dataset.page||'dashboard'}

$('#loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,emailFor($('#loginUser').value),$('#loginPass').value)}catch(e){msg($('#loginMsg'),'登入失敗，請確認管理員帳號與密碼。','error')}};
$('#logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  if(!u){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');return}
  const s=await getDoc(doc(db,'users',u.uid));
  if(!s.exists()||s.data().active!==true||s.data().type!=='admin'){await signOut(auth);msg($('#loginMsg'),'此帳號沒有管理員權限。','error');return}
  me={uid:u.uid,...s.data()};$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#who').textContent=`${me.displayName||me.username}｜管理員`;
  await ensureSystemSettings();await refreshAll();
});

$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['dashboard','roles','records','accounts','classes','audit'].forEach(p=>$(`#page-${p}`).classList.toggle('hidden',p!==b.dataset.page));renderPage(b.dataset.page)});

async function ensureSystemSettings(){const ref=doc(db,'settings','system'),s=await getDoc(ref);if(!s.exists()){await setDoc(ref,{currentSemester:'115-1',semesterHistory:['115-1'],updatedAt:serverTimestamp()});currentSemester='115-1';semesterHistory=['115-1']}else{const d=s.data();currentSemester=d.currentSemester||'115-1';semesterHistory=Array.isArray(d.semesterHistory)&&d.semesterHistory.length?d.semesterHistory:[currentSemester];if(!semesterHistory.includes(currentSemester))semesterHistory.push(currentSemester)}recordSemester=currentSemester;$('#semesterBadge').textContent=`目前學期：${currentSemester}`}
async function refreshAll(){const[us,cs,co,as]=await Promise.all([getDocs(collection(db,'users')),getDocs(collection(db,'classes')),getDocs(collection(db,'collectionItems')),getDocs(collection(db,'assessments'))]);users=us.docs.map(d=>({uid:d.id,...d.data()}));classes=cs.docs.map(d=>({id:d.id,...d.data()}));collections=co.docs.map(d=>({id:d.id,...d.data()}));assessments=as.docs.map(d=>({id:d.id,...d.data()}));$('#semesterBadge').textContent=`目前學期：${currentSemester}`;renderPage(activePage())}
function renderPage(p){if(p==='dashboard')renderDashboard();if(p==='roles')renderRoleAssignments();if(p==='records')renderRecords();if(p==='accounts')renderAccounts();if(p==='classes')renderClasses();if(p==='audit')renderAudit()}

function renderDashboard(){
  const cc=collections.filter(x=>x.semester===currentSemester),aa=assessments.filter(x=>x.semester===currentSemester),pending=cc.filter(x=>x.reviewStatus!=='confirmed').length+aa.filter(x=>x.reviewStatus!=='confirmed').length,activeUsers=users.filter(x=>x.active&&x.type!=='admin').length;
  $('#page-dashboard').innerHTML=`
  <div class="grid g4">
    <div class="card stat"><div class="sub">使用中帳號</div><b>${activeUsers}</b></div>
    <div class="card stat"><div class="sub">${esc(currentSemester)} 收繳項目</div><b>${cc.length}</b></div>
    <div class="card stat"><div class="sub">${esc(currentSemester)} 小考紀錄</div><b>${aa.length}</b></div>
    <div class="card stat"><div class="sub">本學期待確認</div><b>${pending}</b></div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="card">
      <div class="section-title">📅 學期設定</div>
      <div class="notice"><b>目前學期：${esc(currentSemester)}</b><br>學生與小老師登入後，只會讀取目前學期的職務與資料；上一學期的權限不會出現，也無法讀取上一學期收繳／成績。</div>
      <div class="field"><label>切換／建立目前學期</label><input id="newSemester" value="${esc(currentSemester)}" placeholder="例如 115-1、115-2"></div>
      <button id="changeSemesterBtn" class="btn primary">設定為目前學期</button>
      <div class="meta" style="margin-top:8px">切換學期不會刪除舊資料，也不會刪除舊職務；舊職務保留作歷史，但學生端只載入目前學期。</div>
    </div>
    <div class="card">
      <div class="section-title">本學期待確認資料</div>
      ${[...cc.map(x=>({...x,_type:'collection'})),...aa.map(x=>({...x,_type:'assessment'}))].filter(x=>x.reviewStatus!=='confirmed').slice(0,10).map(recordCard).join('')||'<div class="sub">目前沒有待確認資料。</div>'}
    </div>
  </div>`;
  $('#changeSemesterBtn').onclick=changeCurrentSemester;bindRecordButtons();
}

async function changeCurrentSemester(){const sem=$('#newSemester').value.trim();if(!/^\d{2,3}-[12]$/.test(sem))return alert('學期格式建議使用 115-1 或 115-2。');if(sem===currentSemester)return alert('目前已經是這個學期。');if(!confirm(`確定把目前學期從「${currentSemester}」切換為「${sem}」？\n\n舊資料會保留；學生登入後只會看到 ${sem} 的職務與資料。`))return;
  const history=[...new Set([...semesterHistory,currentSemester,sem])];await setDoc(doc(db,'settings','system'),{currentSemester:sem,semesterHistory:history,updatedAt:serverTimestamp()},{merge:true});const old=currentSemester;currentSemester=sem;semesterHistory=history;recordSemester=sem;await recalcAllAccess();await audit('change_semester','settings','system',`目前學期：${old} → ${sem}`,sem);$('#semesterBadge').textContent=`目前學期：${currentSemester}`;await refreshAll();alert(`已切換為 ${sem}。現在可到「職務派發總表」分配本學期幹部與小老師。`)}
async function recalcAllAccess(){for(const u of users.filter(x=>x.type!=='admin')){const access=computeAccess(u.assignments||[],currentSemester);await updateDoc(doc(db,'users',u.uid),{...access,updatedAt:serverTimestamp()});Object.assign(u,access)}}

async function confirmRecord(type,id){const col=type==='collection'?'collectionItems':'assessments',arr=type==='collection'?collections:assessments,x=arr.find(y=>y.id===id),confirming=x.reviewStatus!=='confirmed';await updateDoc(doc(db,col,id),{reviewStatus:confirming?'confirmed':'pending',locked:confirming,confirmedBy:confirming?auth.currentUser.uid:null,confirmedAt:confirming?serverTimestamp():null,updatedAt:serverTimestamp()});await audit(confirming?'confirm':'unconfirm',type,id,`${confirming?'確認並鎖定':'取消確認'}：${x.itemName||x.name}`,x.semester||currentSemester);await refreshAll()}

// ===== 各科作業／成績彙整 =====
let lastSummaryState=null;
function pad2(n){return String(n).padStart(2,'0')}
function dateStr(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function weekRange(base=new Date()){
  const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()),day=(d.getDay()+6)%7;
  const st=new Date(d);st.setDate(d.getDate()-day);const ed=new Date(st);ed.setDate(st.getDate()+6);return[dateStr(st),dateStr(ed)]
}
function previousWeekRange(){const d=new Date();d.setDate(d.getDate()-7);return weekRange(d)}
function monthRange(){const d=new Date(),st=new Date(d.getFullYear(),d.getMonth(),1),ed=new Date(d.getFullYear(),d.getMonth()+1,0);return[dateStr(st),dateStr(ed)]}
function classOptions(selected){const ids=[...new Set([...classes.map(c=>c.id),...Object.keys(defaultRosters)])].sort();return ids.map(id=>`<option value="${esc(id)}" ${id===selected?'selected':''}>${esc(id)}</option>`).join('')}
function summaryRangeByPeriod(period){if(period==='lastweek')return previousWeekRange();if(period==='month')return monthRange();return weekRange()}
function getRoster(classId){const c=classes.find(x=>x.id===classId);if(c?.students?.length)return [...c.students].sort((a,b)=>Number(a.seat)-Number(b.seat));return(defaultRosters[classId]||[]).map(([seat,name])=>({id:String(seat),seat,name}))}
function sidCandidates(s){return [...new Set([s.id,String(s.seat),pad2(s.seat),`${s.seat}`].filter(v=>v!==undefined&&v!==null).map(String))]}
function lookupMap(map,s){for(const k of sidCandidates(s)){if(map&&Object.prototype.hasOwnProperty.call(map,k))return map[k]}return undefined}
function inRange(x,start,end){const d=String(x.date||'');return d&&d>=start&&d<=end}
function subjectOnly(x){return x.scopeType==='subject'||subjects.includes(x.scopeName)}
function collectionInfo(item,s){const raw=lookupMap(item.records||{},s);let status=raw||'submitted';const late=!!lookupMap(item.lateSubmitted||{},s)||status==='late';if(status==='late')status='submitted';const labels={submitted:'已繳',missing:'未繳',exempt:'免繳'};return{status,late,label:late?'補交':(labels[status]||status)}}
function scoreInfo(item,s){const r=lookupMap(item.scores||{},s)||{};const status=r.status||((r.score!==null&&r.score!==undefined&&r.score!=='')?'normal':'not_entered');const labels={normal:'正常',absent:'缺考',makeup:'補考',exempt:'免試',not_entered:'未登記'};const has=r.score!==null&&r.score!==undefined&&r.score!==''&&!Number.isNaN(Number(r.score));return{score:has?Number(r.score):null,status,label:labels[status]||status}}
function openSummary(type,state={}){
  const defaultClass=state.classId||classes.find(c=>c.id==='804')?.id||classes[0]?.id||'804';
  const period=state.period||'week';let[start,end]=state.start&&state.end?[state.start,state.end]:summaryRangeByPeriod(period);
  const sem=state.semester||recordSemester||currentSemester;
  const title=type==='collection'?'📚 各科作業收繳彙整':'📊 各科成績彙整（週紀錄）';
  showModal(`<div class="summary-head"><div><div class="section-title">${title}</div><div class="sub">${type==='assessment'?'顯示每一筆成績：例如「國文 → 第一課、第二課」，不計算各科平均。':'統整指定期間各科作業收繳狀況。'}</div></div><button class="btn gray close-modal">✖ 關閉</button></div>
    <div class="summary-filters">
      <label>學期<select id="sumSemester">${semesterOptions(sem)}</select></label>
      <label>班級<select id="sumClass">${classOptions(defaultClass)}</select></label>
      <label>期間<select id="sumPeriod"><option value="week" ${period==='week'?'selected':''}>本週</option><option value="lastweek" ${period==='lastweek'?'selected':''}>上週</option><option value="month" ${period==='month'?'selected':''}>本月</option><option value="custom" ${period==='custom'?'selected':''}>自訂</option></select></label>
      <label>開始<input id="sumStart" type="date" value="${start}"></label>
      <label>結束<input id="sumEnd" type="date" value="${end}"></label>
      <button class="btn good" id="makeSummary">📚 產生彙整</button>
    </div><div id="summaryResult"></div>`);
  const rerange=()=>{const p=$('#sumPeriod').value;if(p!=='custom'){const r=summaryRangeByPeriod(p);$('#sumStart').value=r[0];$('#sumEnd').value=r[1]}};
  $('#sumPeriod').onchange=rerange;
  const make=()=>{const st={type,semester:$('#sumSemester').value,classId:$('#sumClass').value,period:$('#sumPeriod').value,start:$('#sumStart').value,end:$('#sumEnd').value};lastSummaryState=st;renderSummaryResult(st)};
  $('#makeSummary').onclick=make;make();
}
function renderSummaryResult(st){
  const box=$('#summaryResult');if(!box)return;const roster=getRoster(st.classId);
  const src=(st.type==='collection'?collections:assessments).filter(x=>(x.semester||'')===st.semester&&x.classId===st.classId&&subjectOnly(x)&&inRange(x,st.start,st.end));
  const usedSubjects=subjects.filter(sub=>src.some(x=>x.scopeName===sub));
  const extra=[...new Set(src.map(x=>x.scopeName).filter(x=>x&&!subjects.includes(x)))].sort();const subs=[...usedSubjects,...extra];
  const title=st.type==='collection'?'各科作業收繳彙整':'各科成績彙整（逐筆成績）';
  box.innerHTML=`<div class="summary-info">${esc(st.classId)}班 ｜ ${esc(st.start)} ～ ${esc(st.end)} ｜ 共 ${src.length} 筆${st.type==='collection'?'作業／收繳紀錄':'成績紀錄'}</div>
    <div class="toolbar no-print"><button class="btn primary" id="printSummary">🖨️ 列印彙整</button><button class="btn gray" id="downloadSummary">📥 下載 Excel</button><button class="btn good" id="copySummaryTable">📋 複製表格</button><button class="btn gray" id="copySummaryText">📝 複製文字摘要</button></div>
    ${!src.length?'<div class="notice">此期間沒有符合的資料。</div>':st.type==='collection'?collectionSummaryTable(roster,src,subs):scoreSummaryTable(roster,src,subs)}
    ${src.length?'<div class="click-hint">👆 點選任一學生列，可查看該生在這段期間的作業與每一筆成績細節。</div>':''}`;
  if(src.length){$$('.summary-student-row').forEach(tr=>tr.onclick=()=>openStudentSummaryDetail(st,tr.dataset.seat));$('#printSummary').onclick=()=>printSummary(st,title);$('#downloadSummary').onclick=()=>downloadSummaryExcel(st);$('#copySummaryTable').onclick=()=>copySummary(st,'table');$('#copySummaryText').onclick=()=>copySummary(st,'text')}
}
function collectionSummaryTable(roster,src,subs){
  return `<div class="table-wrap"><table class="summary-table"><thead><tr><th>座號</th><th>姓名</th>${subs.map(s=>`<th>${esc(s)}</th>`).join('')}<th>未繳</th><th>遲交</th></tr></thead><tbody>${roster.map(s=>{let missingTotal=0,lateTotal=0;const cells=subs.map(sub=>{const items=src.filter(x=>x.scopeName===sub).sort((a,b)=>(a.date||'').localeCompare(b.date||''));let done=0;const notes=[];for(const it of items){const inf=collectionInfo(it,s);if(inf.status!=='missing')done++;if(inf.status==='missing'){missingTotal++;notes.push(`<div class="summary-item-line bad">未繳 ${esc(it.itemName||'未命名')}</div>`)}if(inf.late){lateTotal++;notes.push(`<div class="summary-item-line late">補交 ${esc(it.itemName||'未命名')}</div>`)}}return `<td><div class="summary-cell">${done}/${items.length}${notes.join('')}</div></td>`}).join('');return `<tr class="summary-student-row" data-seat="${s.seat}" tabindex="0"><td>${s.seat}</td><td class="name">${esc(s.name)}</td>${cells}<td class="${missingTotal?'summary-total-bad':'summary-total-good'}">${missingTotal}</td><td>${lateTotal}</td></tr>`}).join('')}</tbody></table></div>`
}
function scoreSummaryTable(roster,src,subs){
  return `<div class="table-wrap"><table class="summary-table"><thead><tr><th>座號</th><th>姓名</th>${subs.map(s=>`<th>${esc(s)}</th>`).join('')}</tr></thead><tbody>${roster.map(s=>{const cells=subs.map(sub=>{const items=src.filter(x=>x.scopeName===sub).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.name||'').localeCompare(String(b.name||''),'zh-Hant'));return `<td>${items.map(it=>{const inf=scoreInfo(it,s);const val=inf.score!==null?inf.score:inf.label;const extra=inf.score!==null&&inf.status!=='normal'?`（${inf.label}）`:'';return `<span class="summary-score"><b>${esc(it.name||'未命名')}：</b>${esc(val)}${esc(extra)}</span>`}).join('')||'—'}</td>`}).join('');return `<tr class="summary-student-row" data-seat="${s.seat}" tabindex="0"><td>${s.seat}</td><td class="name">${esc(s.name)}</td>${cells}</tr>`}).join('')}</tbody></table></div>`
}
function openStudentSummaryDetail(st,seat){
  const roster=getRoster(st.classId),student=roster.find(s=>String(s.seat)===String(seat));if(!student)return alert('找不到學生資料。');
  const cols=collections.filter(x=>(x.semester||'')===st.semester&&x.classId===st.classId&&subjectOnly(x)&&inRange(x,st.start,st.end));

姓名：${u.displayName||''}
帳號：${u.username||''}

這一步會刪除 Firestore 中的帳號資料與目前權限。
歷史收繳、成績與操作紀錄會保留。

注意：
Firebase Authentication 的登入帳號不會被這個網頁直接刪除。
刪除完成後，系統會提供 UID，
請再到 Firebase Authentication 刪除同一 UID。

請輸入完整帳號「${u.username}」確認刪除：`
  );

  if(typed===null){
    return;
  }

  if(typed.trim()!==String(u.username||'')){
    return alert('輸入的帳號不一致，已取消永久刪除。');
  }

  if(!confirm(
`最後確認：

永久刪除 ${u.displayName||''}（${u.username||''}）
的 Firestore 帳號資料與權限？

歷史收繳、成績與操作紀錄會保留。`
  )){
    return;
  }

  try{

    await audit(
      'permanent_delete_user',
      'user',
      uid,
      `永久刪除系統帳號：${u.username} ${u.displayName||''}｜Auth UID：${uid}`
    );

    await deleteDoc(
      doc(db,'users',uid)
    );

    await refreshAll();

    showDeletedUserNotice(
      u,
      uid
    );

  }catch(e){

    console.error(e);

    alert(
      '永久刪除失敗：'
      +(e?.code||e?.message||'未知錯誤')
    );

  }
}


function showDeletedUserNotice(u,uid){

  showModal(`

    <div class="item-head">

      <div>

        <div class="section-title">
          ✅ Firestore 帳號資料已永久刪除
        </div>

        <div class="meta">
          ${esc(u.displayName||'')}
          ｜${esc(u.username||'')}
        </div>

      </div>

      <button class="btn gray close-modal">
        關閉
      </button>

    </div>


    <div class="notice success">

      <b>第一步完成：</b>

      Firestore 的使用者資料與目前權限已刪除。

      <br>

      過去的收繳、成績與操作紀錄仍保留。

    </div>


    <div class="notice">

      <b>還需要完成第二步：</b>

      <br>

      請到 Firebase Authentication → Users，

      找到下方相同 UID 的登入帳號並刪除。

      <br><br>

      完成後，
      才可以用相同帳號重新建立新使用者與新初始密碼。

    </div>


    <div class="field">

      <label>
        要在 Firebase Authentication 尋找的 UID
      </label>

      <input
        id="deletedUid"
        value="${esc(uid)}"
        readonly
      >

    </div>


    <div class="toolbar">

      <button
        class="btn gray"
        id="copyDeletedUid"
      >
        📋 複製 UID
      </button>


      <button
        class="btn primary"
        id="openFirebaseAuth"
      >
        🔥 開啟 Firebase Authentication
      </button>

    </div>


    <div class="meta">

      Authentication 刪除完成後，
      回到「帳號與權限」即可重新建立同樣帳號，
      之後再重新派發本學期權限。

    </div>

  `);


  $('#copyDeletedUid').onclick=
  async()=>{

    try{

      await navigator.clipboard.writeText(uid);

      alert('UID 已複製。');

    }catch{

      $('#deletedUid').select();

      document.execCommand('copy');

      alert('UID 已複製。');

    }

  };


  $('#openFirebaseAuth').onclick=
  ()=>window.open(
    'https://console.firebase.google.com/project/class-datawork/authentication/users',
    '_blank'
  );

}


function editUserPermissions(uid){const u=users.find(x=>x.uid===uid),assigns=[...(u.assignments||[])],classOpts=(classes.length?classes.map(c=>c.id):Object.keys(defaultRosters)).sort().map(c=>`<option value="${c}">${c}</option>`).join('');showModal(`<div class="item-head"><div><div class="section-title">${esc(u.displayName)}｜${esc(u.username)}</div><div class="meta">帳號跟著人保留；這裡可做個別補充權限。大量換學期職務請優先使用「職務派發總表」。</div></div><button class="btn gray close-modal">關閉</button></div><div id="currentAssignments"></div><hr style="border:none;border-top:1px solid #e4e7ec;margin:15px 0"><b>新增一個權限</b><div class="two"><div class="field"><label>學期</label><select id="aSemester">${semesterOptions(currentSemester)}</select></div><div class="field"><label>班級</label><select id="aClass">${classOpts}</select></div></div><div class="field"><label>身分類型</label><select id="aKind"><option value="assistant">學科小老師</option><option value="teacher">任課老師</option><option value="officer">班級幹部</option></select></div><div class="field"><label>科目／職務</label><select id="aName">${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="toolbar"><label><input type="checkbox" id="aCollection" checked> 可登記收繳</label><label><input type="checkbox" id="aScores" checked> 可登記成績</label></div><button class="btn primary" id="addAssignment">加入權限</button>`);
  function rerender(){const box=$('#currentAssignments');box.innerHTML=assigns.sort((a,b)=>(b.semester||'').localeCompare(a.semester||'')).map((a,i)=>`<div class="assign"><b>${esc(a.semester||'舊')}</b>｜${esc(a.classId)}｜${esc(a.scopeName)}｜${a.kind==='teacher'?'任課老師':a.scopeType==='subject'?'小老師':'班級幹部'}｜${a.canCollection?'收繳可寫':'收繳唯讀'}｜${a.canScores?'成績可寫':'成績唯讀'} <button class="btn danger small remove-assignment" data-i="${i}">移除</button></div>`).join('')||'<div class="sub">目前尚未指派職務。</div>';$$('.remove-assignment').forEach(b=>b.onclick=async()=>{assigns.splice(Number(b.dataset.i),1);await saveAssignments(u,assigns);rerender()})}
  $('#aKind').onchange=()=>{const k=$('#aKind').value,n=$('#aName');n.innerHTML=(k==='officer'?officerRoles:subjects).map(s=>`<option>${s}</option>`).join('');$('#aScores').checked=k!=='officer';if(k==='teacher')$('#aScores').checked=false};
  $('#addAssignment').onclick=async()=>{const kind=$('#aKind').value,name=$('#aName').value,sem=$('#aSemester').value,a={semester:sem,kind,classId:$('#aClass').value,scopeType:kind==='officer'?'officer':'subject',scopeName:name,canCollection:$('#aCollection').checked,canScores:kind==='officer'?false:$('#aScores').checked};if(assigns.some(x=>x.semester===a.semester&&x.classId===a.classId&&x.kind===a.kind&&x.scopeType===a.scopeType&&x.scopeName===a.scopeName))return alert('這筆權限已經存在。');assigns.push(a);await saveAssignments(u,assigns);rerender()};rerender();
}
async function saveAssignments(u,assignments){const access=computeAccess(assignments,currentSemester);await updateDoc(doc(db,'users',u.uid),{assignments,...access,updatedAt:serverTimestamp()});await audit('permissions','user',u.uid,`更新權限：${u.username}`);u.assignments=assignments;Object.assign(u,access)}

function renderClasses(){const cards=classes.sort((a,b)=>a.id.localeCompare(b.id)).map(c=>`<div class="item"><div class="item-head"><div><b>${c.id} 班</b><div class="meta">${(c.students||[]).length} 人</div></div><button class="btn gray small edit-class" data-id="${c.id}">編輯</button></div></div>`).join('');$('#page-classes').innerHTML=`<div class="two"><div class="card"><div class="section-title">班級名單</div>${cards||'<div class="sub">尚未建立任何班級。</div>'}</div><div class="card"><div class="section-title">快速建立</div><div class="notice">第一次使用可直接匯入目前預設的 804、802、904、906 名單；之後都能在後台修改。</div><button id="seedClasses" class="btn primary">建立／更新預設班級名單</button><hr style="border:none;border-top:1px solid #e4e7ec;margin:15px 0"><b>新增自訂班級</b><div class="field"><label>班級</label><input id="classId" placeholder="例如 805"></div><div class="field"><label>名單（每行：座號,姓名）</label><textarea id="classRoster" rows="10" placeholder="1,王小明\n2,李小華"></textarea></div><button id="saveClass" class="btn primary">儲存班級</button></div></div>`;$('#seedClasses').onclick=seedClasses;$('#saveClass').onclick=()=>saveClass($('#classId').value,$('#classRoster').value);$$('.edit-class').forEach(b=>b.onclick=()=>editClass(b.dataset.id))}
async function seedClasses(){for(const[id,arr]of Object.entries(defaultRosters)){await setDoc(doc(db,'classes',id),{classId:id,students:arr.map(([seat,name])=>({id:String(seat),seat,name})),updatedAt:serverTimestamp()},{merge:true})}await audit('seed','classes','default','建立／更新預設班級名單');await refreshAll();alert('預設班級名單已建立。')}
function parseRoster(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const[seat,...rest]=line.split(/[,，\t]/);return{id:String(Number(seat)),seat:Number(seat),name:rest.join('').trim()}}).filter(x=>x.seat&&x.name).sort((a,b)=>a.seat-b.seat)}
async function saveClass(id,text){id=id.trim();if(!id)return alert('請輸入班級');const students=parseRoster(text);if(!students.length)return alert('請輸入名單');await setDoc(doc(db,'classes',id),{classId:id,students,updatedAt:serverTimestamp()},{merge:true});await audit('save_class','class',id,`更新班級名單 ${id}`);await refreshAll();alert('已儲存')}
function editClass(id){const c=classes.find(x=>x.id===id),text=(c.students||[]).map(s=>`${s.seat},${s.name}`).join('\n');showModal(`<div class="item-head"><div class="section-title">編輯 ${id} 班名單</div><button class="btn gray close-modal">關閉</button></div><div class="field"><textarea id="editRoster" rows="18">${esc(text)}</textarea></div><button class="btn primary" id="saveEditRoster">儲存</button>`);$('#saveEditRoster').onclick=async()=>{await saveClass(id,$('#editRoster').value);hideModal()}}

async function renderAudit(){let logs=[];try{const s=await getDocs(query(collection(db,'auditLogs'),orderBy('createdAt','desc')));logs=s.docs.slice(0,250).map(d=>d.data())}catch(e){const s=await getDocs(collection(db,'auditLogs'));logs=s.docs.map(d=>d.data()).slice(-250).reverse()}$('#page-audit').innerHTML=`<div class="card"><div class="section-title">最近操作紀錄</div><div class="table-wrap"><table><thead><tr><th>時間</th><th>學期</th><th>操作者</th><th>動作</th><th>內容</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${l.createdAt?.toDate?l.createdAt.toDate().toLocaleString('zh-TW'):''}</td><td>${esc(l.semester||'')}</td><td>${esc(l.actorName||'')}</td><td>${esc(l.action||'')}</td><td>${esc(l.detail||'')}</td></tr>`).join('')}</tbody></table></div></div>`}

function showModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden');$('.close-modal')?.addEventListener('click',hideModal)}
function hideModal(){$('#modal').classList.add('hidden');$('#modalBody').innerHTML=''}
</script>
</body>
</html>
