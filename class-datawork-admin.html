function classDocLocal(classId){
  return classes.find(c=>String(c.id)===String(classId))||null;
}

function rolePresetFor(classId,semester){
  return classDocLocal(classId)?.roleAssignments?.[semester]||{};
}

function presetAssignmentsForStudent(classId,seat){
  const c=classDocLocal(classId);
  const out=[];
  if(!c?.roleAssignments)return out;

  for(const[semester,roles]of Object.entries(c.roleAssignments)){
    for(const[roleKey,who]of Object.entries(roles||{})){
      if(Number(who?.seat)!==Number(seat))continue;

      const[kind,scopeType,scopeName]=roleKey.split('|');

      const base=standardRoles.find(r=>
        r.kind===kind &&
        r.scopeType===scopeType &&
        r.scopeName===scopeName
      );

      if(base){
        out.push({
          semester,
          classId,
          kind,
          scopeType,
          scopeName,
          canCollection:base.canCollection,
          canScores:base.canScores
        });
      }
    }
  }

  return out;
}

function linkedUserForRegistry(reg){

function assignmentKey(a){
  return `${a.semester}|${a.classId}|${a.kind}|${a.scopeType}|${a.scopeName}`;
}

function mergeAssignments(base=[],extra=[]){
  const m=new Map();

  [...base,...extra].forEach(a=>{
    if(a&&a.semester&&a.classId&&a.scopeName){
      m.set(assignmentKey(a),a);
    }
  });

  return [...m.values()];
}

function computeAccess(assignments=[],semester=currentSemester){
  const viewKeys=[];
  const collectionWriteKeys=[];
  const scoreWriteKeys=[];
  const classAccess=[];

  for(const a of assignments.filter(x=>x.semester===semester)){
    const k=scopeKey(a);

    if(!viewKeys.includes(k))viewKeys.push(k);

    if(a.canCollection&&!collectionWriteKeys.includes(k)){
      collectionWriteKeys.push(k);
    }

    if(a.canScores&&!scoreWriteKeys.includes(k)){
      scoreWriteKeys.push(k);
    }

    if(!classAccess.includes(a.classId)){
      classAccess.push(a.classId);
    }
  }

  return{
    viewKeys,
    collectionWriteKeys,
    scoreWriteKeys,
    classAccess
  };
}

async function syncLinkedRegistry(reg){
  if(!reg?.linkedUid)return;

  const userRef=doc(db,'users',reg.linkedUid);
  const oldSnap=await getDoc(userRef);
  const oldData=oldSnap.exists()?oldSnap.data():{};

  const assignments=Array.isArray(reg.assignments)
    ?reg.assignments
    :[];

  const access=computeAccess(assignments,currentSemester);

  const finalType=
    oldData.type==='admin'
      ?'admin'
      :(reg.type||'student');

  await setDoc(userRef,{
    username:reg.username||reg.email,
    displayName:reg.displayName||reg.email,
    type:finalType,
    email:reg.email||reg.id,
    classId:reg.classId||'',
    seat:reg.seat??null,
    active:reg.active!==false,
    assignments,
    ...access,
    mustChangePassword:false,
    authProvider:'google',
    updatedAt:serverTimestamp()
  },{merge:true});
}

async function saveRegistry(reg){
  const id=registryId(reg.email||reg.id);

  if(!id){
    throw new Error('Email 不可空白');
  }

  const data={
    ...reg,
    email:id,
    updatedAt:serverTimestamp()
  };

  delete data.id;

  await setDoc(
    doc(db,'identityRegistry',id),
    data,
    {merge:true}
  );

  const idx=registries.findIndex(r=>r.id===id);

  if(idx>=0){
    registries[idx]={
      ...registries[idx],
      ...reg,
      id,
      email:id
    };
  }else{
    registries.push({
      ...reg,
      id,
      email:id
    });
  }

  await syncLinkedRegistry({
    ...reg,
    id,
    email:id
  });

  return id;
}

let authBusy=false;

async function loginAdminWithGoogle(){
  if(authBusy)return;

  authBusy=true;

  const btn=$('#googleLoginBtn');

  if(btn){
    btn.disabled=true;
    btn.textContent='⏳ 正在開啟 Google 登入…';
  }

  msg($('#loginMsg'),'');

  try{
    await signInWithPopup(
      auth,
      googleProvider
    );

  }catch(e){

    const code=e?.code||'';

    if(
      code==='auth/popup-blocked'||
      code==='auth/cancelled-popup-request'||
      code==='auth/operation-not-supported-in-this-environment'
    ){

      try{
        await signInWithRedirect(
          auth,
          googleProvider
        );

        return;

      }catch(re){

        msg(
          $('#loginMsg'),
          `Google 登入失敗：${esc(re?.code||re?.message||'未知錯誤')}`,
          'error'
        );
      }

    }else if(code==='auth/popup-closed-by-user'){

      msg(
        $('#loginMsg'),
        '已取消 Google 登入。',
        ''
      );

    }else{

      msg(
        $('#loginMsg'),
        `Google 登入失敗：${esc(code||e?.message||'未知錯誤')}`,
        'error'
      );
    }

  }finally{

    authBusy=false;

    if(btn){
      btn.disabled=false;
      btn.textContent='🔵 使用 Google 帳號登入管理後台';
    }
  }
}

$('#googleLoginBtn').onclick=

async function ensureSystemSettings(){
  const ref=doc(db,'settings','system');

  const s=await getDoc(ref);

  if(!s.exists()){

    await setDoc(ref,{
      currentSemester:'115-1',
      semesterHistory:['115-1'],

      schoolClassConfig:{
        '7':['701','702','703','704','705','706'],
        '8':['801','802','803','804','805','806'],
        '9':['901','902','903','904','905','906','907']
      },

      updatedAt:serverTimestamp()
    });

    currentSemester='115-1';

    semesterHistory=['115-1'];

  }else{

    const d=s.data();

    currentSemester=
      d.currentSemester||
      '115-1';

    semesterHistory=
      Array.isArray(d.semesterHistory)&&
      d.semesterHistory.length
        ?d.semesterHistory
        :[currentSemester];

    if(!semesterHistory.includes(currentSemester)){
      semesterHistory.push(currentSemester);
    }

    if(
      d.schoolClassConfig&&
      typeof d.schoolClassConfig==='object'
    ){

      schoolClassConfig={

        7:Array.isArray(d.schoolClassConfig['7'])
          ?d.schoolClassConfig['7'].map(String)
          :schoolClassConfig[7],

        8:Array.isArray(d.schoolClassConfig['8'])
          ?d.schoolClassConfig['8'].map(String)
          :schoolClassConfig[8],

        9:Array.isArray(d.schoolClassConfig['9'])
          ?d.schoolClassConfig['9'].map(String)
          :schoolClassConfig[9]
      };
    }
  }

  recordSemester=currentSemester;

  $('#semesterBadge').textContent=
    `目前學期：${currentSemester}`;
}

async function safeDocs(q){
  try{
    const s=await getDocs(q);

    return s.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

  }catch(e){
    console.warn(
      'safeDocs',
      e?.code||e?.message
    );

    return[];
  }
}

async function safeDoc(ref){
  try{
    const s=await getDoc(ref);

    return s.exists()
      ?{
        id:s.id,
        ...s.data()
      }
      :null;

  }catch(e){

    console.warn(
      'safeDoc',
      e?.code||e?.message
    );

    return null;
  }
}

async function refreshAll(){

  const globalPrivilege=
    hasGlobalPrivilege();

  if(globalPrivilege){

    const[
      us,
      rs,
      cs,
      co,
      as,
      sm,
      sr,
      sd,
      se,
      ub,
      crh
    ]=await Promise.all([

      safeDocs(
        collection(db,'users')
      ),

      safeDocs(
        collection(db,'identityRegistry')
      ),

      safeDocs(
        collection(db,'classes')
      ),

      safeDocs(
        collection(db,'collectionItems')
      ),

      safeDocs(
        collection(db,'assessments')
      ),

      safeDocs(
        collection(db,'subjectClassManagers')
      ),

      safeDocs(
        collection(db,'subjectClassRosters')
      ),

      safeDocs(
        collection(db,'studentDirectory')
      ),

      safeDocs(
        collection(db,'studentEnrollments')
      ),

      safeDocs(
        collection(db,'upgradeBatches')
      ),

      safeDocs(
        collection(db,'classRosterHistory')
      )
    ]);

    users=us;
    registries=rs;
    classes=cs;
    collections=co;
    assessments=as;

    subjectManagers=sm;
    subjectRosters=sr;
    studentDirectory=sd;
    studentEnrollments=se;
    upgradeBatches=ub;
    classRosterHistory=crh;

  }else{

    const ids=[
      ...new Set(
        (me?.adminClassIds||[])
          .map(String)
      )
    ];

    users=[me];
    registries=[];
    classes=[];
    collections=[];
    assessments=[];

    // 一般導師需要共用全校教師主檔
    const teacherRegs=
      await safeDocs(
        query(
          collection(db,'identityRegistry'),
          where('type','==','teacher')
        )
      );

    registries.push(...teacherRegs);

    for(const classId of ids){

      const c=
        await safeDoc(
          doc(db,'classes',classId)
        );

      if(c)classes.push(c);

      const classRegs=
        await safeDocs(
          query(
            collection(db,'identityRegistry'),
            where('classId','==',classId)
          )
        );

      classRegs.forEach(r=>{
        if(!registries.some(x=>x.id===r.id)){
          registries.push(r);
        }
      });

      collections.push(
        ...await safeDocs(
          query(
            collection(db,'collectionItems'),
            where('classId','==',classId)
          )
        )
      );

      assessments.push(
        ...await safeDocs(
          query(
            collection(db,'assessments'),
            where('classId','==',classId)
          )
        )
      );
    }

    subjectManagers=
      await safeDocs(
        collection(db,'subjectClassManagers')
      );

    subjectRosters=
      await safeDocs(
        collection(db,'subjectClassRosters')
      );

    studentDirectory=[];
    studentEnrollments=[];
    upgradeBatches=[];
    classRosterHistory=[];
  }

  try{
    await claimPendingSubjectManagersForMe();
  }catch(e){
    console.warn(e);
  }

  configureAdminUI();

  $('#semesterBadge').textContent=
    `目前學期：${currentSemester}`;

  const page=activePage();

  if(
    $('.nav button.active')
      ?.classList
      .contains('hidden')
  ){
    $('.nav button[data-page="dashboard"]')
      ?.click();

  }else{
    renderPage(page);
  }
}

async function changeCurrentSemester(){

  if(!isGlobalAdmin()){
    return alert(
      '只有最高管理員模式可以切換全系統學期。'
    );
  }

  const sem=
    $('#newSemester')
      .value
      .trim();

  if(!/^\d{2,3}-[12]$/.test(sem)){
    return alert(
      '學期格式請使用例如 115-1 或 115-2。'
    );
  }

  if(sem===currentSemester){
    return alert(
      '目前已經是這個學期。'
    );
  }

  const old=currentSemester;

  if(!confirm(
    `確定建立／切換為「${sem}」？\n\n舊資料會完整保留。`
  )){
    return;
  }

  const copy=confirm(
    `是否把「${old}」的任課教師、幹部與小老師設定複製到「${sem}」？\n\n建議按「確定」，之後只需要修改有變動的人。`
  );

  if(copy){

    for(const reg of registries){

      const oldAssignments=
        (reg.assignments||[])
          .filter(
            a=>a.semester===old
          );

      if(!oldAssignments.length){
        continue;
      }

      const copied=
        oldAssignments.map(
          a=>({
            ...a,
            semester:sem
          })
        );

      reg.assignments=
        mergeAssignments(
          reg.assignments||[],
          copied
        );

      await saveRegistry(reg);
    }
  }

  const history=[
    ...new Set([
      ...semesterHistory,
      old,
      sem
    ])
  ];

  await setDoc(
    doc(db,'settings','system'),
    {
      currentSemester:sem,
      semesterHistory:history,
      updatedAt:serverTimestamp()
    },
    {merge:true}
  );

  currentSemester=sem;
  semesterHistory=history;
  recordSemester=sem;

  await audit(
    'change_semester',
    'settings',
    'system',
    `${old} → ${sem}${copy?'（複製設定）':'（不複製設定）'}`,
    sem
  );

  await refreshAll();

  alert(
    copy
      ?`✅ 已切換為 ${sem}，並複製 ${old} 的設定。`
      :`✅ 已切換為 ${sem}。`
  );
}

function configuredClassIds(){
  return[7,8,9]
    .flatMap(g=>
      Array.isArray(schoolClassConfig[g])
        ?schoolClassConfig[g]
        :[]
    )
    .map(String);
}

function schoolClassOptions(selected=''){

  const known=new Set([
    ...configuredClassIds(),
    ...classes.map(c=>String(c.id)),
    ...subjectManagers.map(
      x=>String(x.classId)
    )
  ]);

  return[...known]
    .sort()
    .map(id=>`
      <option
        value="${esc(id)}"
        ${id===String(selected)?'selected':''}
      >
        ${esc(id)}
      </option>
    `)
    .join('');
}

function subjectManagerId(
  semester,
  classId,
  subject
){
  return[
    semester,
    String(classId),
    subject
  ]
  .map(x=>
    encodeURIComponent(
      String(x)
    )
  )
  .join('__');
}

function mySubjectManagers(
  semester=null
){

  const myEmail=
    String(
      me?.email||
      auth.currentUser?.email||
      ''
    )
    .toLowerCase();

  return subjectManagers.filter(x=>

    x.status!=='released'&&

    (
      !semester||
      x.semester===semester
    )&&

    (
      x.managerUid===me?.uid||

      (
        myEmail&&
        String(x.managerEmail||'')
          .toLowerCase()===myEmail
      )
    )
  );
}

function teacherRegistries(){

  return registries
    .filter(r=>
      r.type==='teacher'&&
      r.active!==false
    )
    .sort(
      (a,b)=>
        String(
          a.displayName||
          a.email||
          ''
        )
        .localeCompare(
          String(
            b.displayName||
            b.email||
            ''
          ),
          'zh-Hant'
        )
    );
}

function teacherIdentityMatchesManager(
  reg,
  sm
){

  if(!reg||!sm){
    return false;
  }

  const email=
    String(
      reg.email||
      reg.id||
      ''
    )
    .toLowerCase();

  return(
    (
      reg.linkedUid&&
      sm.managerUid===reg.linkedUid
    )||

    (
      email&&
      String(
        sm.managerEmail||
        ''
      )
      .toLowerCase()===email
    )
  );
}

async function claimPendingSubjectManagersForMe(){

  if(!me)return;

  const myEmail=
    String(
      me.email||
      auth.currentUser?.email||
      ''
    )
    .toLowerCase();

  if(!myEmail)return;

  const mine=
    subjectManagers.filter(sm=>

      sm.status!=='released'&&

      String(
        sm.managerEmail||
        ''
      )
      .toLowerCase()===myEmail&&

      sm.managerUid!==me.uid
    );

  for(const sm of mine){

    await setDoc(
      doc(
        db,
        'subjectClassManagers',
        sm.id
      ),
      {
        managerUid:me.uid,
        managerName:
          me.displayName||
          me.username||
          sm.managerName||
          '',
        updatedAt:
          serverTimestamp()
      },
      {merge:true}
    );

    sm.managerUid=
      me.uid;
  }
}

function myTeacherAssignments(
  semester=currentSemester
){

  const fromUser=
    (me?.assignments||[])
      .filter(a=>

        a.kind==='teacher'&&
        a.scopeType==='subject'&&
        a.semester===semester&&
        a.classId&&
        a.scopeName
      );

  const myReg=
    registries.find(r=>

      r.type==='teacher'&&

      (
        (
          r.linkedUid&&
          r.linkedUid===me?.uid
        )||

        (
          registryId(
            r.email||
            r.id
          )===
          registryId(
            me?.email||
            auth.currentUser?.email
          )
        )
      )
    );

  const fromRegistry=
    (myReg?.assignments||[])
      .filter(a=>

        a.kind==='teacher'&&
        a.scopeType==='subject'&&
        a.semester===semester&&
        a.classId&&
        a.scopeName
      );

  return mergeAssignments(
    fromUser,
    fromRegistry
  );
}

async function syncMyTeacherAssignmentsToSubjectManagers(
  {
    silent=true
  }={}
){

  const assignments=
    myTeacherAssignments(
      currentSemester
    );

  let created=0;
  const conflicts=[];

  for(const a of assignments){

    const id=
      subjectManagerId(
        a.semester,
        a.classId,
        a.scopeName
      );

    let sm=
      subjectManagers.find(
        x=>x.id===id
      );

    if(!sm){

      sm=
        await safeDoc(
          doc(
            db,
            'subjectClassManagers',
            id
          )
        );

      if(sm){
        subjectManagers.push(sm);
      }
    }

    if(
      sm&&
      sm.status!=='released'
    ){

      const mine=
        sm.managerUid===me.uid||

        (
          me.email&&
          registryId(
            sm.managerEmail
          )===
          registryId(
            me.email
          )
        );

      if(!mine){
        conflicts.push(
          `${a.classId} ${a.scopeName}`
        );
      }

      continue;
    }

    await setDoc(
      doc(
        db,
        'subjectClassManagers',
        id
      ),
      {
        semester:a.semester,
        classId:String(a.classId),
        subject:a.scopeName,
        managerUid:me.uid,
        managerEmail:
          me.email||
          auth.currentUser?.email||
          '',
        managerName:
          me.displayName||
          me.username||
          '',
        status:'active',
        createdAt:
          serverTimestamp(),
        updatedAt:
          serverTimestamp()
      },
      {merge:true}
    );

    created++;
  }

  if(
    !silent&&
    conflicts.length
  ){
    alert(
      `⚠️ 以下任課班已有其他老師管理，因此沒有覆蓋：\n\n${conflicts.join('\n')}`
    );
  }

  return{
    created,
    conflicts
  };
}

async function createSubjectClass(){

  if(!canUseSubjectClassManagement()){
    return alert(
      '目前帳號沒有建立任課班的權限。'
    );
  }

  const semester=
    $('#scSemester').value;

  const classId=
    $('#scClass').value;

  const subject=
    $('#scSubject').value;

  if(
    !semester||
    !classId||
    !subject
  ){
    return alert(
      '請選擇學期、班級與科目。'
    );
  }

  const id=
    subjectManagerId(
      semester,
      classId,
      subject
    );

  const existing=
    subjectManagers.find(
      x=>x.id===id
    )||
    await safeDoc(
      doc(
        db,
        'subjectClassManagers',
        id
      )
    );

  if(
    existing&&
    existing.status!=='released'
  ){

    const mine=
      existing.managerUid===me.uid||

      (
        me.email&&
        registryId(
          existing.managerEmail
        )===
        registryId(
          me.email
        )
      );

    if(mine){
      return alert(
        '這個任課班已經是你的。'
      );
    }

    return alert(
      `這個任課班已由「${existing.managerName||existing.managerEmail||'其他老師'}」管理。`
    );
  }

  await setDoc(
    doc(
      db,
      'subjectClassManagers',
      id
    ),
    {
      semester,
      classId,
      subject,
      managerUid:me.uid,
      managerEmail:
        me.email||
        auth.currentUser?.email||
        '',
      managerName:
        me.displayName||
        me.username||
        '',
      status:'active',
      createdAt:
        serverTimestamp(),
      updatedAt:
        serverTimestamp()
    },
    {merge:true}
  );

  await audit(
    'create_subject_class',
    'subjectClassManagers',
    id,
    `建立任課班：${semester} ${classId} ${subject}`,
    semester
  );

  try{
    await syncSubjectRosterFromSharedClass(
      {
        id,
        semester,
        classId,
        subject
      },
      {
        silent:true
      }
    );
  }catch(e){
    console.warn(e);
  }

  await refreshAll();

  renderSubjectClasses();

  alert(
    `✅ 已建立 ${classId}｜${subject}。\n\n接下來可直接進入「任課名單 / Email」，以及指定本科小老師。`
  );
}

function sharedRosterForSubjectManager(sm){

  const c=
    classes.find(
      x=>String(x.id)===String(sm.classId)
    );

  if(c?.students?.length){

    return c.students
      .filter(
        s=>s.active!==false
      )
      .sort(
        (a,b)=>
          Number(a.seat)-
          Number(b.seat)
      );
  }

  const sr=
    subjectRosters.find(
      r=>r.id===sm.id
    );

  if(sr?.students?.length){

    return sr.students
      .filter(
        s=>s.active!==false
      )
      .sort(
        (a,b)=>
          Number(a.seat)-
          Number(b.seat)
      );
  }

  return[];
}

async function syncSubjectRosterFromSharedClass(
  sm,
  {
    silent=false
  }={}
){

  const classId=
    String(sm.classId);

  const c=
    classes.find(
      x=>String(x.id)===classId
    )||
    await safeDoc(
      doc(
        db,
        'classes',
        classId
      )
    );

  if(
    !c||
    !Array.isArray(c.students)
  ){

    if(!silent){
      alert(
        `${classId} 班尚未建立正式班級名單。`
      );
    }

    return false;
  }

  const students=
    c.students
      .filter(
        s=>s.active!==false
      )
      .map(s=>{

        const reg=
          registries.find(r=>

            r.type==='student'&&

            String(
              r.classId
            )===classId&&

            Number(
              r.seat
            )===Number(
              s.seat
            )
          );

        return{
          id:
            s.id||
            s.studentId||
            String(s.seat),

          studentId:
            s.studentId||
            s.id||
            '',

          seat:
            Number(s.seat),

          name:
            s.name,

          email:
            reg?.email||
            '',

          active:true
        };
      });

  await setDoc(
    doc(
      db,
      'subjectClassRosters',
      sm.id
    ),
    {
      semester:sm.semester,
      classId,
      subject:sm.subject,
      students,
      updatedAt:
        serverTimestamp()
    },
    {merge:true}
  );

  const idx=
    subjectRosters.findIndex(
      x=>x.id===sm.id
    );

  if(idx>=0){

    subjectRosters[idx]={
      ...subjectRosters[idx],
      semester:sm.semester,
      classId,
      subject:sm.subject,
      students
    };

  }else{

    subjectRosters.push({
      id:sm.id,
      semester:sm.semester,
      classId,
      subject:sm.subject,
      students
    });
  }

  return true;
}

function subjectAssistantInfo(sm){

  const c=
    classes.find(
      x=>String(x.id)===String(sm.classId)
    );

  const key=
    `assistant|subject|${sm.subject}`;

  const preset=
    c?.roleAssignments?.[sm.semester]?.[key];

  if(!preset){
    return{
      student:null,
      registry:null,
      linked:false,
      label:''
    };
  }

  const student=
    sharedRosterForSubjectManager(sm)
      .find(
        s=>
          Number(s.seat)===
          Number(preset.seat)
      );

  const registry=
    student
      ?registryByStudent(
        sm.classId,
        student.seat
      )
      :null;

  return{
    student,
    registry,
    linked:
      !!registry?.linkedUid,
    label:
      student
        ?`${student.seat}號 ${student.name}`
        :`${preset.seat}號 ${preset.name||''}`
  };
}

async function openSubjectRosterEditor(id){

  const sm=
    subjectManagers.find(
      x=>x.id===id
    );

  if(!sm){
    return alert(
      '找不到這個任課班。'
    );
  }

  try{
    await syncSubjectRosterFromSharedClass(
      sm,
      {
        silent:true
      }
    );
  }catch(e){
    console.warn(e);
  }

  let students=
    sharedRosterForSubjectManager(sm);

  if(!students.length){

    return showModal(`
      <div class="section-title">
        👥 ${esc(sm.classId)}
        ｜
        ${esc(sm.subject)}
        任課名單 / Email
      </div>

      <div class="notice warn">
        目前後台尚未建立
        ${esc(sm.classId)}
        班正式名單，因此沒有可同步的學生。
        請先建立班級名單。
      </div>

      <div class="toolbar">
        <button class="btn gray close-modal">
          關閉
        </button>
      </div>
    `);
  }

  // 每次直接用正式班級名單 + identityRegistry 重新組合
  students=
    students
      .filter(
        s=>s.active!==false
      )
      .sort(
        (a,b)=>
          Number(a.seat)-
          Number(b.seat)
      );

  const rows=
    students.map(s=>{

      const reg=
        registries.find(r=>

          r.type==='student'&&

          (
            (
              s.studentId&&
              r.studentId===s.studentId
            )||

            (
              s.email&&
              r.id===registryId(s.email)
            )||

            (
              String(r.classId)===
              String(sm.classId)&&

              Number(r.seat)===
              Number(s.seat)
            )
          )
        )
        ||null;

      const linked=
        !!(
          reg?.linkedUid||
          reg?.linked===true
        );

      const email=
        reg?.email||
        s.email||
        '';

      return`
        <tr>

          <td>
            ${esc(s.seat)}
          </td>

          <td>
            <b>
              ${esc(s.name)}
            </b>
          </td>

          <td>
            <input
              class="subject-student-email"
              data-seat="${esc(s.seat)}"
              data-name="${esc(s.name)}"
              data-oldid="${esc(reg?.id||'')}"
              data-studentid="${esc(s.studentId||s.id||'')}"
              type="email"
              value="${esc(email)}"
              placeholder="學校 Google Email"
              style="min-width:230px"
            >
          </td>

          <td>

            ${
              linked

                ?`
                  <span class="assistant-linked">
                    ✅ 已連動
                  </span>
                `

                :email

                  ?`
                    <span class="assistant-unlinked">
                      ⚠️ Email已建／尚未連動
                    </span>
                  `

                  :`
                    <span class="assistant-none">
                      尚未設定 Email
                    </span>
                  `
            }

          </td>

        </tr>
      `;
    })
    .join('');

  showModal(`
    <div class="item-head">

      <div>

        <div class="section-title">
          👥 ${esc(sm.classId)}
          ｜
          ${esc(sm.subject)}
          任課名單 / Email
        </div>

        <div class="meta">
          ${esc(sm.semester)}
          ｜
          ${students.length} 人
        </div>

      </div>

      <button class="btn gray close-modal">
        ✖ 關閉
      </button>

    </div>

    <div class="notice success">

      <b>
        同班學生 Email 是共用資料。
      </b>
      <br>

      任何一位有權限的導師或任課老師補上學生 Email 後，
      其他科老師都會直接共用，不需要重複輸入。
      <br><br>

      若學生已完成 Google UID 連動，
      系統不允許直接改成另一個 Email，
      避免帳號綁錯人。

    </div>

    <div class="toolbar">

      <button
        id="saveSubjectRosterEmails"
        class="btn primary"
      >
        💾 儲存學生 Email
      </button>

    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>座號</th>
            <th>姓名</th>
            <th>Google Email</th>
            <th>連動狀態</th>
          </tr>

        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>

    <details style="margin-top:12px">

      <summary
        style="cursor:pointer;font-weight:900"
      >
        📥 批次貼上 Email
      </summary>

      <div class="field">

        <label>
          每行格式：
          座號,姓名,Email
        </label>

        <textarea
          id="subjectRosterPaste"
          rows="7"
          placeholder="1,王小明,xxx@smail.ilc.edu.tw&#10;2,李小華,yyy@smail.ilc.edu.tw"
        ></textarea>

      </div>

      <button
        id="applySubjectRosterPaste"
        class="btn good"
      >
        套用到上方名單
      </button>

    </details>
  `);

  $('#applySubjectRosterPaste')
    ?.addEventListener(
      'click',
      ()=>{

        const text=
          $('#subjectRosterPaste')
            .value
            .trim();

        if(!text)return;

        const map=new Map();

        text
          .split(/\r?\n/)
          .map(x=>x.trim())
          .filter(Boolean)
          .forEach(line=>{

            const p=
              line
                .split(/[,，\t]/)
                .map(x=>x.trim());

            if(p.length>=3){
              map.set(
                Number(p[0]),
                p[p.length-1]
              );
            }
          });

        $$('.subject-student-email')
          .forEach(inp=>{

            const e=
              map.get(
                Number(inp.dataset.seat)
              );

            if(e){
              inp.value=e;
            }
          });

        alert(
          '已套用到上方欄位，請再按「儲存學生 Email」。'
        );
      }
    );

  $('#saveSubjectRosterEmails')
    ?.addEventListener(
      'click',
      async()=>{

        if(!confirm(
          `確定儲存 ${sm.classId} 班學生 Google Email？\n\n同班其他科老師與導師會共用這份資料。`
        )){
          return;
        }

        const inputs=
          $$('.subject-student-email');

        for(const inp of inputs){

          const email=
            registryId(
              inp.value
            );

          const seat=
            Number(
              inp.dataset.seat
            );

          const name=
            inp.dataset.name;

          const oldId=
            inp.dataset.oldid;

          const studentId=
            inp.dataset.studentid||
            '';

          if(!email){
            continue;
          }

          let oldReg=
            oldId
              ?registries.find(
                r=>r.id===oldId
              )
              :registryByStudent(
                sm.classId,
                seat
              );

          if(
            oldReg?.linkedUid&&
            oldReg.id!==email
          ){

            alert(
              `${seat}號 ${name} 已完成 Google 連動，不能直接更換 Email。`
            );

            continue;
          }

          const assignments=
            mergeAssignments(
              oldReg?.assignments||[],
              presetAssignmentsForStudent(
                sm.classId,
                seat
              )
            );

          await setDoc(
            doc(
              db,
              'identityRegistry',
              email
            ),
            {
              email,

              username:
                `${sm.classId}${String(seat).padStart(2,'0')}`,

              displayName:name,

              type:'student',

              classId:
                String(sm.classId),

              seat,

              studentId:
                studentId||
                oldReg?.studentId||
                '',

              active:
                oldReg?.active!==false,

              linked:
                !!oldReg?.linkedUid,

              linkedUid:
                oldReg?.linkedUid||
                null,

              linkedAt:
                oldReg?.linkedAt||
                null,

              lastLoginAt:
                oldReg?.lastLoginAt||
                null,

              assignments,

              updatedAt:
                serverTimestamp()
            },
            {merge:true}
          );

          if(
            oldId&&
            oldId!==email&&
            !oldReg?.linkedUid
          ){

            await deleteDoc(
              doc(
                db,
                'identityRegistry',
                oldId
              )
            );
          }
        }

        await audit(
          'subject_roster_email',
          'identityRegistry',
          sm.id,
          `${sm.classId} ${sm.subject} 任課老師更新學生 Email`,
          sm.semester
        );

        await refreshAll();

        const updated=
          subjectManagers.find(
            x=>x.id===id
          );

        if(updated){
          await openSubjectRosterEditor(
            id
          );
        }

        alert(
          '✅ 學生 Email 已儲存，同班其他科老師與導師會共用。'
        );
      }
    );
}

async function setSubjectAssistant(id){

  const sm=
    subjectManagers.find(
      x=>x.id===id
    );

  if(!sm){
    return alert(
      '找不到這個任課班。'
    );
  }

  const roster=
    sharedRosterForSubjectManager(sm);

  if(!roster.length){
    return alert(
      '這個班目前沒有學生名單。'
    );
  }

  const current=
    subjectAssistantInfo(sm);

  const options=[
    `<option value="">— 尚未指派 —</option>`,
    ...roster.map(s=>`
      <option
        value="${esc(s.seat)}"
        ${
          current.student&&
          Number(current.student.seat)===
          Number(s.seat)
            ?'selected'
            :''
        }
      >
        ${String(s.seat).padStart(2,'0')}
        ${esc(s.name)}
      </option>
    `)
  ].join('');

  showModal(`
    <div class="item-head">

      <div>

        <div class="section-title">
          ⭐ 指定本科小老師
        </div>

        <div class="meta">
          ${esc(sm.semester)}
          ｜
          ${esc(sm.classId)}
          ｜
          ${esc(sm.subject)}
        </div>

      </div>

      <button class="btn gray close-modal">
        ✖ 關閉
      </button>

    </div>

    <div class="notice">
      任課老師可以自行指定自己科目的小老師。
      不會影響其他科目的小老師設定。
    </div>

    <div class="field">

      <label>
        ${esc(sm.subject)}小老師
      </label>

      <select id="subjectAssistantSeat">
        ${options}
      </select>

    </div>

    <button
      id="saveSubjectAssistant"
      class="btn primary"
    >
      💾 儲存本科小老師
    </button>
  `);

  $('#saveSubjectAssistant').onclick=
    async()=>{

      const seatRaw=
        $('#subjectAssistantSeat').value;

      const c=
        classes.find(
          x=>
            String(x.id)===
            String(sm.classId)
        )||
        await safeDoc(
          doc(
            db,
            'classes',
            String(sm.classId)
          )
        );

      if(!c){
        return alert(
          '找不到班級資料。'
        );
      }

      const roleAssignments=
        structuredClone(
          c.roleAssignments||
          {}
        );

      const semesterMap={
        ...(
          roleAssignments[sm.semester]||
          {}
        )
      };

      const key=
        `assistant|subject|${sm.subject}`;

      if(!seatRaw){

        delete semesterMap[key];

      }else{

        const student=
          roster.find(
            s=>
              Number(s.seat)===
              Number(seatRaw)
          );

        if(!student){
          return alert(
            '找不到這位學生。'
          );
        }

        semesterMap[key]={
          seat:
            Number(student.seat),
          name:
            student.name
        };
      }

      roleAssignments[sm.semester]=
        semesterMap;

      await setDoc(
        doc(
          db,
          'classes',
          String(sm.classId)
        ),
        {
          classId:
            String(sm.classId),

          roleAssignments,

          updatedAt:
            serverTimestamp()
        },
        {merge:true}
      );

      const localIndex=
        classes.findIndex(
          x=>
            String(x.id)===
            String(sm.classId)
        );

      if(localIndex>=0){
        classes[localIndex].roleAssignments=
          roleAssignments;
      }

      // 若該學生已有 Email registry，
      // 同步小老師 assignment
      const allClassRegs=
        registries.filter(r=>
          r.type==='student'&&
          String(r.classId)===
          String(sm.classId)
        );

      for(const reg of allClassRegs){

        let assignments=
          (reg.assignments||[])
            .filter(a=>!
              (
                a.semester===sm.semester&&
                String(a.classId)===
                  String(sm.classId)&&
                a.kind==='assistant'&&
                a.scopeType==='subject'&&
                a.scopeName===sm.subject
              )
            );

        if(
          seatRaw&&
          Number(reg.seat)===
          Number(seatRaw)
        ){

          assignments.push({
            semester:sm.semester,
            classId:
              String(sm.classId),
            kind:'assistant',
            scopeType:'subject',
            scopeName:
              sm.subject,
            canCollection:true,
            canScores:true
          });
        }

        reg.assignments=
          assignments;

        await saveRegistry(reg);
      }

      await audit(
        'set_subject_assistant',
        'class',
        sm.classId,
        seatRaw
          ?`${sm.classId} ${sm.subject}小老師：${seatRaw}號`
          :`${sm.classId} ${sm.subject}小老師取消指派`,
        sm.semester
      );

    subjectManagers.find(

  if(!confirm(

  await setDoc(

      id
    ),
    {
      status:'released',
      releasedAt:
        serverTimestamp(),
      updatedAt:

function getRosterForClass(classId){

  const c=
    classes.find(
      x=>String(x.id)===String(classId)
    );

  if(
    c&&
    Array.isArray(c.students)
  ){

    return c.students
      .filter(
        s=>s.active!==false
      )
      .sort(
        (a,b)=>
          Number(a.seat)-
          Number(b.seat)
      );
  }

  return(
    defaultRosters[classId]||
    []
  )
  .map(([seat,name])=>({
    seat,
    name,
    id:String(seat),
    active:true
  }));
}

async function saveStudentRegistryClass(){

  const classId=
    $('#registryClass').value;

  if(!canAdminClass(classId)){
    return alert(
      '你目前沒有這個班級的導師管理權限。'
    );
  }

  const inputs=
    $$('.student-reg-email');

  if(!confirm(
    `確定儲存 ${classId} 班的 Google Email 對照名單？`
  )){
    return;
  }

  for(const inp of inputs){

    const email=
      registryId(
        inp.value
      );

    const seat=
      Number(
        inp.dataset.seat
      );

    const name=
      inp.dataset.name;

    const oldId=
      inp.dataset.oldid;

    const studentId=
      inp.dataset.studentid||
      '';

    if(!email){
      continue;
    }

    const oldReg=
      oldId
        ?registries.find(
          r=>r.id===oldId
        )
        :registryByStudent(
          classId,
          seat
        );

    if(
      oldReg?.linkedUid&&
      oldReg.id!==email
    ){

      alert(
        `${seat}號 ${name} 已完成連動，不能直接更換 Email。`
      );

      continue;
    }

    const assignments=
      mergeAssignments(
        oldReg?.assignments||[],
        presetAssignmentsForStudent(
          classId,
          seat
        )
      );

    await setDoc(
      doc(
        db,
        'identityRegistry',
        email
      ),
      {
        email,

        username:
          `${classId}${String(seat).padStart(2,'0')}`,

        displayName:name,

        type:'student',

        classId,

        seat,

        studentId:
          studentId||
          oldReg?.studentId||
          '',

        active:
          oldReg?.active!==false,

        linked:
          !!oldReg?.linkedUid,

        linkedUid:
          oldReg?.linkedUid||
          null,

        linkedAt:
          oldReg?.linkedAt||
          null,

        lastLoginAt:
          oldReg?.lastLoginAt||
          null,

        assignments,

        updatedAt:
          serverTimestamp()
      },
      {merge:true}
    );

    if(
      oldId&&
      oldId!==email&&
      !oldReg?.linkedUid
    ){

      await deleteDoc(
        doc(
          db,
          'identityRegistry',
          oldId
        )
      );
    }
  }

  await audit(
    'save_student_registry',
    'identityRegistry',
    classId,
    `更新 ${classId} 學生 Google Email 對照`
  );

  await refreshAll();

  alert(
    '✅ 學生 Email 對照名單已儲存。'
  );
}

function applyStudentRegistryPaste(){

  const text=
    $('#studentRegistryPaste')
      .value
      .trim();

  if(!text)return;

  const map=
    new Map();

  text
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean)
    .forEach(line=>{

      const p=
        line
          .split(/[,，\t]/)
          .map(x=>x.trim());

      if(p.length>=3){
        map.set(
          Number(p[0]),
          p[p.length-1]
        );
      }
    });

  $$('.student-reg-email')
    .forEach(inp=>{

      const e=
        map.get(
          Number(inp.dataset.seat)
        );

      if(e){
        inp.value=e;
      }
    });

  alert(
    '已套用到上方欄位，請再按「儲存這班 Email」。'
  );
}

async function assignTeacherToHomeroom(
  teacherId,
  classId,
  subject
){

  if(!canAdminClass(classId)){
    return alert(
      '只能替自己的導師班指定任課老師。'
    );
  }

  const reg=
    registries.find(
      r=>r.id===teacherId
    );

  if(!reg){
    return alert(
      '找不到這位老師。'
    );
  }

  const a={
    semester:
      currentSemester,

    classId:
      String(classId),

    kind:'teacher',

    scopeType:'subject',

    scopeName:
      subject,

    canCollection:true,

    canScores:true
  };

  const assignments=[
    ...(reg.assignments||[])
  ];

  if(
    !assignments.some(
      x=>
        assignmentKey(x)===
        assignmentKey(a)
    )
  ){
    assignments.push(a);
  }

  reg.assignments=
    assignments;

  await saveRegistry(reg);

  const smId=
    subjectManagerId(
      currentSemester,
      classId,
      subject
    );

  let sm=
    subjectManagers.find(
      x=>x.id===smId
    )||
    await safeDoc(
      doc(
        db,
        'subjectClassManagers',
        smId
      )
    );

  if(
    sm&&
    sm.status!=='released'&&
    !teacherIdentityMatchesManager(
      reg,
      sm
    )
  ){

    return alert(
      `⚠️ ${classId}班 ${subject} 已由「${sm.managerName||sm.managerEmail||'其他老師'}」管理。\n\n已保留老師任課權限，但沒有覆蓋既有任課班管理者。`
    );
  }

  await setDoc(
    doc(
      db,
      'subjectClassManagers',
      smId
    ),
    {
      semester:
        currentSemester,

      classId:
        String(classId),

      subject,

      managerUid:
        reg.linkedUid||
        null,

      managerEmail:
        reg.email||
        reg.id,

      managerName:
        reg.displayName||
        reg.email,

      status:'active',

      updatedAt:
        serverTimestamp(),

      ...(
        sm
          ?{}
          :{
            createdAt:
              serverTimestamp()
          }
      )
    },
    {merge:true}
  );

  await audit(
    'homeroom_assign_teacher',
    'identityRegistry',
    reg.id,
    `${classId} 班 ${subject} 指定 ${reg.displayName}`,
    currentSemester
  );

  alert(
    `✅ 已指定：${reg.displayName}｜${classId}班｜${subject}`
  );

  await refreshAll();
}

function roleSelectedSeat(
  role,
  classId,
  sem
){

  const preset=
    rolePresetFor(
      classId,
      sem
    );

  const key=
    `${role.kind}|${role.scopeType}|${role.scopeName}`;

  if(
    preset[key]?.seat!=null
  ){
    return String(
      preset[key].seat
    );
  }

  const reg=
    registries.find(r=>

      r.type==='student'&&

      (r.assignments||[])
        .some(a=>

          a.semester===sem&&
          String(a.classId)===
            String(classId)&&
          a.kind===role.kind&&
          a.scopeType===role.scopeType&&
          a.scopeName===role.scopeName
        )
    );

  return reg?.seat!=null
    ?String(reg.seat)
    :'';
}

async function persistRolePreset(
  classId,
  sem,
  selections
){

  assertAdminClass(
    classId
  );

  let c=
    classDocLocal(
      classId
    );

  if(!c){
    throw new Error(
      `找不到 ${classId} 班級資料，請先建立班級名單。`
    );
  }

  const roleAssignments={
    ...(c.roleAssignments||{})
  };

  const map={};

  const roster=
    getRosterForClass(
      classId
    );

  for(const sel of selections){

    if(!sel.seat)continue;

    const student=
      roster.find(
        s=>
          Number(s.seat)===
          Number(sel.seat)
      );

    if(!student)continue;

    map[
      `${sel.kind}|${sel.scopeType}|${sel.scopeName}`
    ]={
      seat:
        Number(student.seat),

      name:
        student.name
    };
  }

  roleAssignments[sem]=
    map;

  await setDoc(
    doc(
      db,
      'classes',
      classId
    ),
    {
      roleAssignments,
      updatedAt:
        serverTimestamp()
    },
    {merge:true}
  );

  c.roleAssignments=
    roleAssignments;
}

async function applyRoleSelectionsToRegistries(
  classId,
  sem,
  selections
){

  const roleKeys=
    new Set(
      standardRoles.map(
        r=>
          `${r.kind}|${r.scopeType}|${r.scopeName}`
      )
    );

  const classRegs=
    registries.filter(r=>
      r.type==='student'&&
      String(r.classId)===
      String(classId)
    );

  for(const reg of classRegs){

    let assignments=
      (reg.assignments||[])
        .filter(a=>!

          (
            a.semester===sem&&
            String(a.classId)===
              String(classId)&&

            roleKeys.has(
              `${a.kind}|${a.scopeType}|${a.scopeName}`
            )
          )
        );

    selections
      .filter(
        x=>
          Number(x.seat)===
          Number(reg.seat)
      )
      .forEach(sel=>{

        const base=
          standardRoles.find(r=>
            r.kind===sel.kind&&
            r.scopeType===sel.scopeType&&
            r.scopeName===sel.scopeName
          );

        if(base){

          assignments.push({

            semester:sem,

            classId:
              String(classId),

            kind:
              sel.kind,

            scopeType:
              sel.scopeType,

            scopeName:
              sel.scopeName,

            canCollection:
              base.canCollection,

            canScores:
              base.canScores
          });
        }
      });

    reg.assignments=
      assignments;

    await saveRegistry(reg);
  }
}

async function ensureSeatLogin(){

  if(seatAuth.currentUser){
    return true;
  }

  const account=
    prompt(
      '第一次從 seat.html 同步時，請輸入 seat.html 的登入帳號／Email：'
    );

  if(!account){
    return false;
  }

  const password=
    prompt(
      '請輸入 seat.html 的登入密碼：'
    );

  if(password===null){
    return false;
  }

  const email=
    account.includes('@')
      ?account
      :`${account}@seat804.com`;

  try{

    await signInWithEmailAndPassword(
      seatAuth,
      email,
      password
    );

    return true;

  }catch(e){

    alert(
      `seat.html 登入失敗：${e.code||e.message}`
    );

    return false;
  }
}

function seatRoleToStandard(label){

  const exact=
    standardRoles.find(
      r=>r.label===label
    );

  if(exact){
    return exact;
  }

  if(
    label.endsWith(
      '小老師'
    )
  ){

    const subject=
      label.replace(
        /小老師$/,
        ''
      );

    return standardRoles.find(
      r=>
        r.kind==='assistant'&&
        r.scopeName===subject
    )||null;
  }

  return null;
}

async function syncRolesFromSeat(){

  if(
    $('#roleClass').value!=='804'
  ){
    return alert(
      'seat.html 目前只連動 804 班。'
    );
  }

  if(!canAdminClass('804')){
    return alert(
      '目前工作身分沒有 804 導師權限。'
    );
  }

  const sem=
    $('#roleSemester').value;

  if(!await ensureSeatLogin()){
    return;
  }

  const status=
    $('#seatSyncStatus');

  if(status){
    status.textContent=
      '正在讀取 seat.html 雲端設定…';
  }

  try{

    const snap=
      await rtdbGet(
        rtdbRef(
          seatDb,
          'class_804/seat_data/staffAssignments'
        )
      );

    if(!snap.exists()){
      throw new Error(
        'seat.html 尚未儲存幹部／小老師資料。'
      );
    }

    const staff=
      snap.val()||
      {};

    const roster=
      getRosterForClass(
        '804'
      );

    const selections=[];
    const unmatched=[];

    for(
      const[
        label,
        rawName
      ]
      of
      Object.entries(staff)
    ){

      if(!rawName){
        continue;
      }

      const role=
        seatRoleToStandard(
          label
        );

      if(!role){
        continue;
      }

      const name=
        normalizeStudentName(
          rawName
        );

      const student=
        roster.find(
          s=>
            normalizeStudentName(
              s.name
            )===name
        );

      if(!student){

        unmatched.push(
          `${label}：${rawName}`
        );

        continue;
      }

      selections.push({

        seat:
          Number(student.seat),

        kind:
          role.kind,

        scopeType:
          role.scopeType,

        scopeName:
          role.scopeName
      });
    }

    $$('.role-select')
      .forEach(
        sel=>sel.value=''
      );

    for(const sel of selections){

      const control=
        $$('.role-select')
          .find(x=>
            x.dataset.kind===
              sel.kind&&
            x.dataset.type===
              sel.scopeType&&
            x.dataset.name===
              sel.scopeName
          );

      if(control){
        control.value=
          String(sel.seat);
      }
    }

    const allSelections=
      $$('.role-select')
        .map(sel=>({

          seat:
            sel.value
              ?Number(sel.value)
              :null,

          kind:
            sel.dataset.kind,

          scopeType:
            sel.dataset.type,

          scopeName:
            sel.dataset.name
        }));

    await persistRolePreset(
      '804',
      sem,
      allSelections
    );

    await applyRoleSelectionsToRegistries(
      '804',
      sem,
      allSelections
    );

    await audit(
      'sync_seat_roles',
      'roles',
      `${sem}-804`,
      `從 seat.html 同步 804 幹部／小老師，共 ${selections.length} 筆`,
      sem
    );

    if(status){

      status.innerHTML=
        `✅ 已從 seat.html 同步 ${selections.length} 筆到 ${esc(sem)}。${
          unmatched.length
            ?`<br>⚠️ 找不到名單對應：${esc(unmatched.join('、'))}`
            :''
        }`;
    }

    await refreshAll();

    alert(
      `✅ 已從 seat.html 同步 804 班 ${sem} 職務。`
    );

  }catch(e){

    console.error(e);

    if(status){
      status.textContent=
        `❌ 同步失敗：${e.message}`;
    }

    alert(
      `從 seat.html 同步失敗：${e.message}`
    );
  }
}

function parseRoster(text){

  return text
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean)
    .map(line=>{

      const[
        seat,
        ...rest
      ]=
        line.split(/[,，\t]/);

      return{
        id:
          String(Number(seat)),

        seat:
          Number(seat),

        name:
          rest.join('')
            .trim(),

        active:true
      };
    })
    .filter(
      x=>x.seat&&x.name
    )
    .sort(
      (a,b)=>
        a.seat-b.seat
    );
}

async function addStudentToClass(id){

  const c=
    classDocLocal(id);

  if(!c)return;

  const seat=
    Number(
      prompt(
        `新增 ${id} 班學生\n請輸入座號：`
      )
    );

  if(
    !Number.isInteger(seat)||
    seat<=0
  ){

    return alert(
      '座號格式不正確。'
    );
  }

  if(
    (c.students||[])
      .some(
        s=>
          Number(s.seat)===
          seat
      )
  ){

    return alert(
      `${seat} 號已存在。`
    );
  }

  const name=
    (
      prompt(
        '請輸入學生姓名：'
      )||
      ''
    )
    .trim();

  if(!name)return;

  const students=[
    ...(c.students||[]),
    {
      id:String(seat),
      seat,
      name,
      active:true,
      joinedSemester:
        currentSemester
    }
  ];

  await saveClassStudents(
    id,
    students,
    `新增學生：${seat} ${name}`
  );

  editClass(id);

  alert(
    `✅ 已新增 ${id} 班 ${seat}號 ${name}。`
  );
}

async function transferOutStudent(
  id,
  seat
){

  const c=
    classDocLocal(id);

  const student=
    c?.students
      ?.find(
        s=>
          Number(s.seat)===
          seat
      );

  if(!student)return;

  if(!confirm(
    `確定將 ${seat}號 ${student.name} 標記為「已轉出」？`
  )){
    return;
  }

  const students=
    c.students.map(s=>
      Number(s.seat)===seat
        ?{
          ...s,
          active:false,
          transferredOutSemester:
            currentSemester,
          transferredOutAt:
            new Date().toISOString()
        }
        :s
    );

  const reg=
    registryByStudent(
      id,
      seat
    );

  if(reg){
    reg.active=false;
    await saveRegistry(reg);
  }

  await saveClassStudents(
    id,
    students,
    `學生轉出：${seat} ${student.name}`
  );

  editClass(id);
}

async function restoreStudent(
  id,
  seat
){

  const c=
    classDocLocal(id);

  const student=
    c?.students
      ?.find(
        s=>
          Number(s.seat)===
          seat
      );

  if(!student)return;

  if(!confirm(
    `確定恢復 ${seat}號 ${student.name} 為目前在班學生？`
  )){
    return;
  }

  const students=
    c.students.map(s=>
      Number(s.seat)===seat

        ?{
          ...s,
          active:true,
          transferredOutSemester:null,
          transferredOutAt:null
        }

        :s
    );

  const reg=
    registryByStudent(
      id,
      seat
    );

  if(reg){
    reg.active=true;
    await saveRegistry(reg);
  }

  await saveClassStudents(
    id,
    students,
    `恢復學生：${seat} ${student.name}`
  );

  editClass(id);
}

async function editStudentInClass(
  id,
  oldSeat
){

  const c=
    classDocLocal(id);

  const student=
    c?.students
      ?.find(
        s=>
          Number(s.seat)===
          oldSeat
      );

  if(!student)return;

  const newSeat=
    Number(
      prompt(
        '修改座號：',
        String(student.seat)
      )
    );

  if(
    !Number.isInteger(newSeat)||
    newSeat<=0
  ){

    return alert(
      '座號格式不正確。'
    );
  }

  if(
    newSeat!==oldSeat&&
    (c.students||[])
      .some(
        s=>
          Number(s.seat)===
          newSeat
      )
  ){

    return alert(
      `${newSeat} 號已有人使用。`
    );
  }

  const newName=
    (
      prompt(
        '修改姓名：',
        student.name
      )||
      ''
    )
    .trim();

  if(!newName)return;

  const students=
    c.students.map(s=>
      Number(s.seat)===oldSeat

        ?{
          ...s,
          id:String(newSeat),
          seat:newSeat,
          name:newName
        }

        :s
    );

  const roleAssignments=
    structuredClone(
      c.roleAssignments||
      {}
    );

  for(
    const roles
    of
    Object.values(roleAssignments)
  ){

    for(
      const who
      of
      Object.values(roles||{})
    ){

      if(
        Number(who?.seat)===
        oldSeat
      ){

        who.seat=
          newSeat;

        who.name=
          newName;
      }
    }
  }

  await setDoc(
    doc(
      db,
      'classes',
      id
    ),
    {
      classId:id,
      students,
      roleAssignments,
      updatedAt:
        serverTimestamp()
    },
    {merge:true}
  );

  c.students=
    students;

  c.roleAssignments=
    roleAssignments;

  const reg=
    registryByStudent(
      id,
      oldSeat
    );

  if(reg){

    reg.seat=
      newSeat;

    reg.displayName=
      newName;

    reg.username=
      `${id}${String(newSeat).padStart(2,'0')}`;

    await saveRegistry(reg);
  }

  await audit(
    'edit_student',
    'class',
    id,
    `修改學生：${oldSeat} ${student.name} → ${newSeat} ${newName}`
  );

  await refreshAll();

  editClass(id);

  alert(
    '✅ 學生資料已更新。'
  );
}

function myTeacherScopePairs(
  semester=currentSemester
){

  const assignments=
    myTeacherAssignments(
      semester
    );

  const managers=
    mySubjectManagers(
      semester
    );

  const pairs=[];

  assignments.forEach(a=>
    pairs.push({
      classId:
        String(a.classId),
      subject:
        a.scopeName
    })
  );

  managers.forEach(sm=>
    pairs.push({
      classId:
        String(sm.classId),
      subject:
        sm.subject
    })
  );

  const m=
    new Map();

  pairs.forEach(x=>
    m.set(
      `${x.classId}|${x.subject}`,
      x
    )
  );

  return[
    ...m.values()
  ];
}

function canViewRecord(x){

  if(isGlobalAdmin()){
    return true;
  }

  if(isHomeroomMode()){
    return(
      String(x.classId)===
      String(homeroomClassId())
    );
  }

  const pairs=
    myTeacherScopePairs(
      x.semester||
      currentSemester
    );

  return pairs.some(
    p=>
      String(p.classId)===
      String(x.classId)&&
      p.subject===x.scopeName
  );
}

function canWriteRecord(x){

  if(isGlobalAdmin()){
    return true;
  }

  if(isHomeroomMode()){
    return(
      String(x.classId)===
      String(homeroomClassId())
    );
  }

  const pairs=
    myTeacherScopePairs(
      x.semester||
      currentSemester
    );

  return pairs.some(
    p=>
      String(p.classId)===
      String(x.classId)&&
      p.subject===x.scopeName
  );
}

  const type=

      ?.value

  return all.filter(x=>

    (
      subject==='all'||
      x.scopeName===subject
    )&&

    (
      type==='all'||
      x._type===type
    )&&

    (
      classId==='all'||

      .toLowerCase()
      .includes(q)
  );

async function confirmRecord(
  type,
  id
){

  const col=
    type==='collection'
      ?'collectionItems'
      :'assessments';

  const arr=
    type==='collection'
      ?collections
      :assessments;

  const x=
    arr.find(
      y=>y.id===id
    );

  if(
    !x||
    !canWriteRecord({
      ...x,
      _type:type
    })
  ){
    return alert(
      '目前身分沒有這筆資料的修改權限。'
    );
  }

  const confirming=
    x.reviewStatus!=='confirmed';

  await updateDoc(
    doc(
      db,
      col,
      id
    ),
    {
      reviewStatus:
        confirming
          ?'confirmed'
          :'pending',

      locked:
        confirming,

      confirmedBy:
        confirming
          ?auth.currentUser.uid
          :null,

      confirmedAt:
        confirming
          ?serverTimestamp()
          :null,

      updatedAt:
        serverTimestamp()
    }
  );

  await audit(
    confirming
      ?'confirm'
      :'unconfirm',

    type,

    id,

    `${confirming?'確認並鎖定':'取消確認'}：${x.itemName||x.name}`,

    x.semester||
    currentSemester
  );

  await refreshAll();
}

async function deleteRecord(
  type,
  id
){

  const col=

  const arr=

function getRoster(classId){

  const c=
    classes.find(
      x=>
        String(x.id)===
        String(classId)
    );

  if(c?.students?.length){

    return[
      ...c.students
    ]
    .filter(
      s=>s.active!==false
    )
    .sort(
      (a,b)=>
        Number(a.seat)-
        Number(b.seat)
    );
  }

  const sm=
    subjectManagers.find(
      x=>
        String(x.classId)===
        String(classId)
    );

  if(sm){

    const sr=
      subjectRosters.find(
        r=>
          String(r.classId)===
          String(classId)
      );

    if(sr?.students?.length){

      return[
        ...sr.students
      ]
      .filter(
        s=>s.active!==false
      )
      .sort(
        (a,b)=>
          Number(a.seat)-
          Number(b.seat)
      );
    }
  }

  return(
    defaultRosters[classId]||
    []
  )
  .map(([seat,name])=>({
    id:String(seat),
    seat,
    name
  }));
}

function sidCandidates(s){

  return[
    ...new Set([
      s.id,
      s.studentId,
      String(s.seat),
      String(s.seat).padStart(2,'0')
    ]
    .filter(
      v=>
        v!==undefined&&
        v!==null&&
        v!==''
    )
    .map(String))
  ];
}

function lookupMap(
  map,
  s
){

  for(
    const k
    of
    sidCandidates(s)
  ){

    if(
      map&&
      Object.prototype.hasOwnProperty.call(
        map,
        k
      )
    ){
      return map[k];
    }
  }

  return undefined;
}

async function editRecord(
  type,
  id
){

  const arr=
    type==='collection'
      ?collections
      :assessments;

  const x=
    arr.find(
      y=>y.id===id
    );

  if(!x){
    return alert(
      '找不到這筆資料。'
    );
  }

  const writable=
    canWriteRecord({
      ...x,
      _type:type
    });

  const students=
    getRoster(
      x.classId
    );

  let body=`
    <div class="item-head">

      <div>

        <div class="section-title">
          ${esc(x.itemName||x.name)}
        </div>

        <div class="meta">
          ${esc(x.semester||'')}
          ｜
          ${esc(x.classId)}
          ｜
          ${esc(x.scopeName)}
          ｜
          ${esc(x.date||'')}
        </div>

      </div>

      <button class="btn gray close-modal">
        關閉
      </button>

    </div>

    ${
      writable
        ?''
        :`
          <div class="notice">
            目前工作身分只有查看權限，不能修改這筆資料。
          </div>
        `
    }
  `;

  if(type==='collection'){

    const opts=[
      ['submitted','已繳'],
      ['missing','未繳'],
      ['late','補交'],
      ['exempt','免繳']
    ];

    body+=`
      <div class="student-grid">

        ${
          students.map(s=>{

            const sid=
              s.id||
              s.studentId||
              String(s.seat);

            const raw=
              lookupMap(
                x.records||{},
                s
              );

            const v=
              raw||
              'submitted';

            return`
              <div class="student">

                <b>
                  ${s.seat}.
                  ${esc(s.name)}
                </b>

                <select
                  class="m-col"
                  data-id="${esc(sid)}"
                  ${writable?'':'disabled'}
                >

                  ${
                    opts.map(([a,l])=>`
                      <option
                        value="${a}"
                        ${a===v?'selected':''}
                      >
                        ${l}
                      </option>
                    `).join('')
                  }

                </select>

              </div>
            `;
          }).join('')
        }

      </div>

      ${
        writable
          ?`
            <div class="toolbar">
              <button
                class="btn primary save-modal"
              >
                儲存修改
              </button>
            </div>
          `
          :''
      }
    `;

  }else{

    const opts=[
      ['normal','正常'],
      ['absent','缺考'],
      ['makeup','補考'],
      ['exempt','免試'],
      ['not_entered','未登記']
    ];

    body+=`
      <div class="student-grid">

        ${
          students.map(s=>{

            const sid=
              s.id||
              s.studentId||
              String(s.seat);

            const r=
              lookupMap(
                x.scores||{},
                s
              )
              ||{};

            return`
              <div class="student">

                <b>
                  ${s.seat}.
                  ${esc(s.name)}
                </b>

                <input
                  class="m-score"
                  data-id="${esc(sid)}"
                  type="number"
                  value="${r.score??''}"
                  min="0"
                  max="${x.maxScore}"
                  ${writable?'':'disabled'}
                >

                <select
                  class="m-status"
                  data-id="${esc(sid)}"
                  ${writable?'':'disabled'}
                >

                  ${
                    opts.map(([a,l])=>`
                      <option
                        value="${a}"
                        ${
                          a===
                          (
                            r.status||
                            'not_entered'
                          )
                            ?'selected'
                            :''
                        }
                      >
                        ${l}
                      </option>
                    `).join('')
                  }

                </select>

              </div>
            `;
          }).join('')
        }

      </div>

      ${
        writable
          ?`
            <div class="toolbar">
              <button
                class="btn primary save-modal"
              >
                儲存修改
              </button>
            </div>
          `
          :''
      }
    `;
  }

  showModal(body);

  if(!writable){
    return;
  }

  $('.save-modal').onclick=
    async()=>{

      if(type==='collection'){

        const records={};

        $$('.m-col')
          .forEach(s=>
            records[s.dataset.id]=
              s.value
          );

        await updateDoc(
          doc(
            db,
            'collectionItems',
            id
          ),
          {
            records,
            updatedAt:
              serverTimestamp()
          }
        );

      }else{

        const scores={};

        $$('.m-score')
          .forEach(inp=>{

            const sid=
              inp.dataset.id;

            const sel=
              document.querySelector(
                `.m-status[data-id="${CSS.escape(sid)}"]`
              );

            scores[sid]={
              score:
                inp.value===''
                  ?null
                  :Number(inp.value),

              status:
                sel.value
            };
          });

        await updateDoc(
          doc(
            db,
            'assessments',
            id
          ),
          {
            scores,
            updatedAt:
              serverTimestamp()
          }
        );
      }

      await audit(
        'admin_update',
        type,
        id,
        `修改：${x.itemName||x.name}`,
        x.semester||
        currentSemester
      );

      hideModal();

      await refreshAll();
    };
}

function collectionInfo(
  item,
  s
){

  const raw=
    lookupMap(
      item.records||{},
      s
    );

  let status=
    raw||
    'submitted';

  const late=
    status==='late';

  if(
    status==='late'
  ){
    status='submitted';
  }

  const labels={
    submitted:'已繳',
    missing:'未繳',
    exempt:'免繳'
  };

  return{
    status,
    late,
    label:
      late
        ?'補交'
        :(
          labels[status]||
          status
        )
  };
}

function scoreInfo(
  item,
  s
){

  const r=
    lookupMap(
      item.scores||{},
      s
    )
    ||{};

  const status=
    r.status||
    (
      r.score!==null&&
      r.score!==undefined&&
      r.score!==''
        ?'normal'
        :'not_entered'
    );

  const labels={
    normal:'正常',
    absent:'缺考',
    makeup:'補考',
    exempt:'免試',
    not_entered:'未登記'
  };

  const has=
    r.score!==null&&
    r.score!==undefined&&
    r.score!==''&&
    !Number.isNaN(
      Number(r.score)
    );

  return{
    score:
      has
        ?Number(r.score)
        :null,

    status,

    label:
      labels[status]||
      status
  };
}

function selectedRecordValue(
  x,
  s
){

  if(
    x._type==='collection'
  ){

    const inf=
      collectionInfo(
        x,
        s
      );

    return inf.label;
  }

  const inf=
    scoreInfo(
      x,
      s
    );

  return inf.score!==null
    ?String(inf.score)
    :inf.label;
}

){

  const items=

        )
    );

    return row;
  });
}

async function ensureAdminXLSX(){

  if(window.XLSX){
    return;
  }

  await new Promise(
    (
      resolve,
      reject
    )=>{

      const e=
        document.createElement(
          'script'
        );

      e.src=
        'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

      e.onload=
        resolve;

      e.onerror=
        ()=>reject(
          new Error(
            'Excel 元件載入失敗'
          )
        );

      document.head
        .appendChild(e);
    }
  );
}

async function downloadSelectedRecordsExcel(){

  const list=
    selectedExportRecords();

  if(!list.length){
    return alert(
      '請先勾選要下載的作業或成績。'
    );
  }

  try{

    await ensureAdminXLSX();

    const wb=
      XLSX.utils.book_new();

    const allWide=[];

    selectedExportClassIds(list)
      .forEach(classId=>
        allWide.push(
          ...selectedWideRowsForClass(
            list,
            classId
          )
        )
      );

    const wsAll=
      XLSX.utils.json_to_sheet(
        allWide
      );

    XLSX.utils.book_append_sheet(
      wb,
      wsAll,
      '勾選資料總表'
    );

    XLSX.writeFile(
      wb,
      `${recordSemester||currentSemester}-後台勾選資料-${today()}.xlsx`
    );

  }catch(e){

    console.error(e);

    alert(
      e.message||
      '下載 Excel 失敗'
    );
  }
}

          font-family:"Microsoft JhengHei",sans-serif;
          margin:0;
          font-size:9px
        }

        table{
          width:100%;
          border-collapse:collapse
        }

        th,td{
          border:1px solid #888;
          padding:2px;
          text-align:center
        }

        th{
          background:#f3e2b5
        }

        .class-section{
          page-break-after:always
        }

        .class-section:last-child{

    </head>

    <body>

      ${sections}

      <script>
        window.onload=()=>window.print()
      <\/script>

    </body>

    </html>
  `);

  w.document.close();
}

// ============================================================================
// 管理員授權
// ============================================================================

function adminTeacherCandidates(){

  return registries
    .filter(r=>

      r.type==='teacher'&&
      r.active!==false&&
      r.linkedUid&&
      r.linkedUid!==me.uid
    )
    .sort(
      (a,b)=>
        String(a.displayName||'')
          .localeCompare(
            String(b.displayName||''),
            'zh-Hant'
          )
    );
}

function currentClassAdminUsers(){

  return users
    .filter(u=>

      u.uid!==me.uid&&
      u.type==='admin'&&
      u.adminScope==='class'
    )
    .sort(
      (a,b)=>
        String(a.displayName||'')
          .localeCompare(
            String(b.displayName||''),
            'zh-Hant'
          )
    );
}

async function grantClassAdmin(){

  if(!isGlobalAdmin()){
    return alert(
      '只有最高管理員模式可以授予管理者權限。'
    );
  }

  const regId=
    $('#adminTeacherSelect')
      ?.value;

  const classId=
    $('#adminClassSelect')
      ?.value;

  const reg=
    registries.find(
      r=>r.id===regId
    );

  if(
    !reg||
    !reg.linkedUid
  ){

    return alert(
      '請選擇一位已完成 Google 連動的老師。'
    );
  }

  if(!classId){
    return alert(
      '請選擇導師班。'
    );
  }

  if(!confirm(
    `確定授予 ${reg.displayName}「${classId} 班班級管理員」權限？`
  )){
    return;
  }

  await setDoc(
    doc(
      db,
      'users',
      reg.linkedUid
    ),
    {
      type:'admin',
      adminScope:'class',
      adminClassIds:[
        classId
      ],
      homeroomClassId:
        classId,
      updatedAt:
        serverTimestamp()
    },
    {merge:true}
  );

  await audit(
    'grant_class_admin',
    'user',
    reg.linkedUid,
    `授予 ${reg.displayName} ${classId} 班班級管理員`
  );

  await refreshAll();

  renderAdminPermissions();

  alert(
    `✅ ${reg.displayName} 已成為 ${classId} 班班級管理員。`
  );
}

async function revokeClassAdmin(uid){

  if(!isGlobalAdmin()){
    return;
  }

  const u=
    users.find(
      x=>x.uid===uid
    );

  if(!u)return;

  if(!confirm(
    `確定取消 ${u.displayName||u.email} 的班級管理員權限？`
  )){
    return;
  }

  await setDoc(
    doc(
      db,
      'users',
      uid
    ),
    {
      type:'teacher',
      adminScope:null,
      adminClassIds:[],
      homeroomClassId:null,
      updatedAt:
        serverTimestamp()
    },
    {merge:true}
  );

  await audit(
    'revoke_class_admin',
    'user',
    uid,
    `取消 ${u.displayName||u.email} 班級管理員權限`
  );

  await refreshAll();

  renderAdminPermissions();
}

function renderAdminPermissions(){

  if(!isGlobalAdmin()){

    $('#page-adminPermissions').innerHTML=
      '<div class="notice error">只有最高管理員模式可以管理其他班級管理員。</div>';

    return;
  }

  const candidates=
    adminTeacherCandidates();

  const admins=
    currentClassAdminUsers();

  const classIds=[
    ...new Set([
      ...configuredClassIds(),
      ...classes.map(
        c=>String(c.id)
      )
    ])
  ]
  .sort();

  $('#page-adminPermissions').innerHTML=`
    <div class="page-title">
      管理者權限
    </div>

    <div class="card">

      <div class="section-title">
        🔐 授予班級管理員

        一般導師管理員登入後，
        只會管理自己的導師班；
        但可以自行新增全校共用教師主檔，
        並替自己的班指定任課老師。
      </div>

      <div class="toolbar">

        <label>
          老師

          <select id="adminTeacherSelect">

            ${
              candidates.map(r=>`
                <option value="${esc(r.id)}">
                  ${esc(r.displayName||r.email)}
                  ｜
                  ${esc(r.email||r.id)}
                </option>
              `).join('')
            }

          </select>

        </label>

        <label>
          導師班

          <select id="adminClassSelect">

            ${
              classIds.map(id=>`
                <option value="${esc(id)}">
                  ${esc(id)}
                </option>
              `).join('')
            }

          </select>

        </label>

        <button
          id="grantClassAdminBtn"
          class="btn primary"
          ${candidates.length?'':'disabled'}
        >
          🔐 授予班級管理員
        </button>

      </div>

    </div>

    <div
      class="card"
      style="margin-top:14px"
    >

      <div class="section-title">
        👨‍🏫 目前班級管理員
      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>姓名</th>
              <th>Email</th>
              <th>管理班級</th>
              <th>操作</th>
            </tr>

          </thead>

          <tbody>

            ${
              admins.map(u=>`

                <tr>

                  <td>
                    <b>
                      ${esc(u.displayName||'')}
                    </b>
                  </td>

                  <td>
                    ${esc(u.email||'')}
                  </td>

                  <td>
                    ${esc((u.adminClassIds||[]).join('、'))}
                  </td>

                  <td>

                    <button
                      class="btn danger small revoke-class-admin"
                      data-uid="${esc(u.uid)}"
                    >
                      取消管理權限
                    </button>

                  </td>

                </tr>

              `).join('')

              ||

              `
                <tr>
                  <td colspan="4">
                    尚未授予其他班級管理員。
                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>
  `;

  $('#grantClassAdminBtn')
    ?.addEventListener(
      'click',
      grantClassAdmin
    );

  $$('.revoke-class-admin')
    .forEach(b=>
      b.onclick=
        ()=>revokeClassAdmin(
          b.dataset.uid
        )
    );
}

// ============================================================================
// 操作紀錄
// ============================================================================

async function renderAudit(){

  let logs=[];

  try{

    if(isGlobalAdmin()){

      const s=
        await getDocs(
          query(
            collection(db,'auditLogs'),
            orderBy('createdAt','desc')
          )
        );

      logs=
        s.docs
          .slice(0,250)
          .map(
            d=>d.data()
          );

    }else{

      const s=
        await getDocs(
          query(
            collection(db,'auditLogs'),
            where(
              'actorUid',
              '==',
              auth.currentUser.uid
            )
          )
        );

      logs=
        s.docs
          .map(
            d=>d.data()
          )
          .sort(
            (a,b)=>
              (
                b.createdAt?.seconds||
                0
              )-
              (
                a.createdAt?.seconds||
                0
              )
          )
          .slice(
            0,
            250
          );
    }

  }catch(e){

    console.error(e);

    logs=[];
  }

  $('#page-audit').innerHTML=`
    <div class="card">

      <div class="section-title">
        最近操作紀錄
      </div>

      <div class="notice">

        ${
          isGlobalAdmin()
            ?'最高管理員可查看全系統操作紀錄。'
            :'目前只顯示自己執行的操作紀錄。'
        }

      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>時間</th>
              <th>學期</th>
              <th>操作者</th>
              <th>動作</th>
              <th>內容</th>
            </tr>

          </thead>

          <tbody>

            ${
              logs.map(l=>`

                <tr>

                  <td>
                    ${
                      l.createdAt?.toDate
                        ?l.createdAt
                          .toDate()
                          .toLocaleString('zh-TW')
                        :''
                    }
                  </td>

                  <td>
                    ${esc(l.semester||'')}
                  </td>

                  <td>
                    ${esc(l.actorName||'')}
                  </td>

                  <td>
                    ${esc(l.action||'')}
                  </td>

                  <td>
                    ${esc(l.detail||'')}
                  </td>

                </tr>

              `).join('')

              ||

              `
                <tr>
                  <td colspan="5">
                    目前沒有可顯示的操作紀錄。
                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>
  `;
}

function showModal(h){

  $('#modalBody').innerHTML=
    h;

  $('#modal')
    .classList
    .remove('hidden');

  $('.close-modal')
    ?.addEventListener(
      'click',
      hideModal
    );
}

function hideModal(){

  $('#modal')
    .classList
    .add('hidden');

  $('#modalBody').innerHTML=
    '';
}
