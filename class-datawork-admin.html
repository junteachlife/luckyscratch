async function changeCurrentSemester(){
  if(!isGlobalAdmin())return alert('只有最高管理員可以切換全系統學期。');
  const sem=$('#newSemester').value.trim();
  if(!/^\d{2,3}-[12]$/.test(sem))return alert('學期格式請使用例如 115-1 或 115-2。');
  if(sem===currentSemester)return alert('目前已經是這個學期。');
  const old=currentSemester;
  if(!confirm(`確定建立／切換為「${sem}」？\n\n舊資料會完整保留。`))return;
  const copy=confirm(`是否把「${old}」的任課教師、幹部與小老師設定複製到「${sem}」？\n\n建議按「確定」，之後只需要修改有變動的人。`);

    for(const reg of registries){
      const oldAssignments=(reg.assignments||[]).filter(a=>a.semester===old);
      if(!oldAssignments.length)continue;
      const copied=oldAssignments.map(a=>({...a,semester:sem}));
      reg.assignments=mergeAssignments(reg.assignments||[],copied);
      await saveRegistry(reg);
    }
  }
  const history=[...new Set([...semesterHistory,old,sem])];

}

async function applyRoleSelectionsToRegistries(classId,sem,selections){

    selections.filter(x=>Number(x.seat)===Number(reg.seat)).forEach(sel=>{const base=standardRoles.find(r=>r.kind===sel.kind&&r.scopeType===sel.scopeType&&r.scopeName===sel.scopeName);if(base)assignments.push({semester:sem,classId,kind:sel.kind,scopeType:sel.scopeType,scopeName:sel.scopeName,canCollection:base.canCollection,canScores:base.canScores})});

async function editRecord(type,id){
  const arr=type==='collection'?collections:assessments;
  const x=arr.find(y=>y.id===id);
  if(!x)return alert('找不到這筆資料。');

  const cl=classes.find(c=>String(c.id)===String(x.classId));
  const students=(cl?.students||[]).filter(s=>s.active!==false).sort((a,b)=>Number(a.seat)-Number(b.seat));

  let body=`<div class="item-head"><div><div class="section-title">${esc(x.itemName||x.name)}</div><div class="meta">${esc(x.semester||'')}｜${x.classId}｜${esc(x.scopeName)}｜${esc(x.date||'')}</div></div><button class="btn gray close-modal">關閉</button></div>`;

  if(type==='collection'){
    const opts=[['submitted','已繳'],['missing','未繳'],['late','補交'],['exempt','免繳']];
    body+=`<div class="student-grid">${students.map(s=>{
      const sid=s.id||s.studentId||String(s.seat),v=(x.records||{})[sid]||'submitted';
      return `<div class="student"><b>${s.seat}. ${esc(s.name)}</b><select class="m-col" data-id="${esc(sid)}">${opts.map(([a,l])=>`<option value="${a}" ${a===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
    }).join('')}</div><div class="toolbar"><button class="btn primary save-modal">儲存修改</button></div>`;
  }else{
    const opts=[['normal','正常'],['absent','缺考'],['makeup','補考'],['exempt','免試'],['not_entered','未登記']];
    const initialStats=scoreStatsFromAssessment(x,students);

    body+=`
      <div class="notice">
        滿分：<b>${esc(x.maxScore??'')}</b>｜及格分數：<b>${esc(x.passScore??60)}</b>
      </div>
      <div id="scoreStatsHost">${scoreStatsHtml(initialStats)}</div>
      <div class="student-grid">${students.map(s=>{
        const sid=s.id||s.studentId||String(s.seat),r=(x.scores||{})[sid]||{};
        return `<div class="student">
          <b>${s.seat}. ${esc(s.name)}</b>
          <input class="m-score" data-id="${esc(sid)}" type="number" value="${r.score??''}" min="0" max="${x.maxScore}">
          <select class="m-status" data-id="${esc(sid)}">${opts.map(([a,l])=>`<option value="${a}" ${a===(r.status||'not_entered')?'selected':''}>${l}</option>`).join('')}</select>
        </div>`;
      }).join('')}</div>
      <div class="toolbar"><button class="btn primary save-modal">儲存修改</button></div>`;
  }

  showModal(body);

  if(type==='assessment'){
    const recalcStats=()=>{
      const tempScores={};
      $$('.m-score').forEach(inp=>{
        const sid=inp.dataset.id;
        const sel=document.querySelector(`.m-status[data-id="${CSS.escape(sid)}"]`);
        tempScores[sid]={
          score:inp.value===''?null:Number(inp.value),
          status:sel?.value||'not_entered'
        };
      });
      $('#scoreStatsHost').innerHTML=scoreStatsHtml(scoreStatsFromAssessment({...x,scores:tempScores},students));
    };

    $$('.m-score').forEach(inp=>inp.oninput=recalcStats);
    $$('.m-status').forEach(sel=>sel.onchange=recalcStats);
  }

  $('.save-modal').onclick=async()=>{
    if(type==='collection'){
      const records={};
      $$('.m-col').forEach(s=>records[s.dataset.id]=s.value);
      await updateDoc(doc(db,'collectionItems',id),{records,updatedAt:serverTimestamp()});
    }else{
      const scores={};
      $$('.m-score').forEach(inp=>{
        const sid=inp.dataset.id;
        const sel=document.querySelector(`.m-status[data-id="${CSS.escape(sid)}"]`);
        scores[sid]={score:inp.value===''?null:Number(inp.value),status:sel.value};
      });
      await updateDoc(doc(db,'assessments',id),{scores,updatedAt:serverTimestamp()});
    }
    await audit('admin_update',type,id,`管理員修改：${x.itemName||x.name}`,x.semester||currentSemester);
    hideModal();
    await refreshAll();
  };
}

function safeSheetName(name,used){
  let base=String(name||'資料').replace(/[\\\/\?\*\[\]\:]/g,' ').trim().slice(0,31)||'資料';
  let out=base,n=2;
  while(used.has(out)){const suffix=` ${n++}`;out=(base.slice(0,31-suffix.length)+suffix)}
  used.add(out);return out
}

let lastSummaryState=null;
function pad2(n){return String(n).padStart(2,'0')}
function dateStr(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function weekRange(base=new Date()){
  const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()),day=(d.getDay()+6)%7;
  const st=new Date(d);st.setDate(d.getDate()-day);const ed=new Date(st);ed.setDate(st.getDate()+6);return[dateStr(st),dateStr(ed)]
}
function previousWeekRange(){const d=new Date();d.setDate(d.getDate()-7);return weekRange(d)}
function monthRange(){const d=new Date(),st=new Date(d.getFullYear(),d.getMonth(),1),ed=new Date(d.getFullYear(),d.getMonth()+1,0);return[dateStr(st),dateStr(ed)]}
function classOptions(selected){const ids=scopedClassIds();return ids.map(id=>`<option value="${esc(id)}" ${id===selected?'selected':''}>${esc(id)}</option>`).join('')}
function summaryRangeByPeriod(period){if(period==='lastweek')return previousWeekRange();if(period==='month')return monthRange();return weekRange()}
function getRoster(classId){const c=classes.find(x=>x.id===classId);if(c?.students?.length)return [...c.students].sort((a,b)=>Number(a.seat)-Number(b.seat));return(defaultRosters[classId]||[]).map(([seat,name])=>({id:String(seat),seat,name}))}
function sidCandidates(s){return [...new Set([s.id,String(s.seat),pad2(s.seat),`${s.seat}`].filter(v=>v!==undefined&&v!==null).map(String))]}
function lookupMap(map,s){for(const k of sidCandidates(s)){if(map&&Object.prototype.hasOwnProperty.call(map,k))return map[k]}return undefined}
function inRange(x,start,end){const d=String(x.date||'');return d&&d>=start&&d<=end}
function subjectOnly(x){return x.scopeType==='subject'||subjects.includes(x.scopeName)}
function collectionInfo(item,s){const raw=lookupMap(item.records||{},s);let status=raw||'submitted';const late=!!lookupMap(item.lateSubmitted||{},s)||status==='late';if(status==='late')status='submitted';const labels={submitted:'已繳',missing:'未繳',exempt:'免繳'};return{status,late,label:late?'補交':(labels[status]||status)}}
function scoreInfo(item,s){const r=lookupMap(item.scores||{},s)||{};const status=r.status||((r.score!==null&&r.score!==undefined&&r.score!=='')?'normal':'not_entered');const labels={normal:'正常',absent:'缺考',makeup:'補考',exempt:'免試',not_entered:'未登記'};const has=r.score!==null&&r.score!==undefined&&r.score!==''&&!Number.isNaN(Number(r.score));return{score:has?Number(r.score):null,status,label:labels[status]||status}}
function openSummary(type,state={}){

function collectionSummaryTable(roster,src,subs){

      <button id="addTeacherAssignment" class="btn primary">➕ 加入任課</button>
    </div>`);

  const rerender=()=>{
    const merged=[...(reg.assignments||[])];
    for(const sm of subjectManagers.filter(sm=>sm.status!=='released'&&teacherIdentityMatchesManager(reg,sm))){
      const a={semester:sm.semester,classId:String(sm.classId),kind:'teacher',scopeType:'subject',scopeName:sm.subject,canCollection:true,canScores:true};
      if(!merged.some(x=>assignmentKey(x)===assignmentKey(a)))merged.push(a);
    }
    $('#teacherAssignments').innerHTML=merged.filter(a=>a.kind==='teacher')
      .sort((a,b)=>String(b.semester).localeCompare(String(a.semester))||String(a.classId).localeCompare(String(b.classId)))
      .map(a=>`<div class="assign">${esc(a.semester)}｜${esc(a.classId)}班｜${esc(a.scopeName)}</div>`).join('')
      ||'<div class="meta">尚未設定任課。</div>';
  };

  $('#addTeacherAssignment').onclick=async()=>{
    const semester=$('#taSemester').value,classId=$('#taClass').value,subject=$('#taSubject').value;
    const result=await assignTeacherToSubject(reg,semester,classId,subject,{source:'教師任課設定'});
    if(!result.ok)return alert(result.message);
    await refreshAll();
    rerender();
    alert(result.message);
  };
  rerender();
}

function renderTeacherDirectory(){

  const teacherMatchesUser=(reg,u)=>{
    if(!reg||!u)return false;
    const re=String(reg.email||reg.id||'').toLowerCase(),ue=String(u.email||'').toLowerCase();
    return (!!reg.linkedUid&&reg.linkedUid===u.uid)||!!(re&&ue&&re===ue);
  };
  const isHomeroomTeacher=reg=>homeroomUsers.some(u=>teacherMatchesUser(reg,u));

    const list=[];
    for(const a of (reg.assignments||[]).filter(a=>a.kind==='teacher'&&a.semester===currentSemester)){
      const k=`${a.classId}|${a.scopeName}`;
      if(!list.some(x=>x.k===k))list.push({k,classId:String(a.classId),subject:String(a.scopeName||'')});
    }
    for(const sm of subjectManagers.filter(sm=>sm.status!=='released'&&sm.semester===currentSemester&&teacherIdentityMatchesManager(reg,sm))){
      const k=`${sm.classId}|${sm.subject}`;
      if(!list.some(x=>x.k===k))list.push({k,classId:String(sm.classId),subject:String(sm.subject||'')});
    }
    return list.sort((a,b)=>String(a.subject).localeCompare(String(b.subject),'zh-Hant')||String(a.classId).localeCompare(String(b.classId),undefined,{numeric:true}));
  };
  const allSubjects=[...new Set([
    ...subjects.map(String),

    <div class="card">
      <div class="notice success"><b>教師主檔只記錄老師本人與學校 Google Email。</b><br>
        科目不是老師的固定屬性；同一位老師可以同時教不同班、不同科。任課內容由「學期 × 班級 × 科目」另外管理。<br>
        教師主檔僅由最高管理員維護；導師只在「帳號連動／任課」替自己的導師班設定任課，不顯示或維護全校教師主檔。</div>

        <div>
          <div class="field"><label>老師姓名</label><input id="directoryTeacherName" placeholder="例如 王老師"></div>
          <div class="field"><label>學校 Google Email</label><input id="directoryTeacherEmail" type="email" placeholder="teacher@tmail.ilc.edu.tw"></div>
          <button id="directoryAddTeacherBtn" class="btn primary">➕ 新增／更新教師主檔</button>
        </div>
        <div>
          <div class="section-title">共用原則</div>
          <div class="meta">同一 Email 只保留一份教師主檔。Google 連動一次後，所有班級與科目沿用同一 UID。任課老師可跨班、跨科，不會產生重複教師帳號。</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="section-title">🔎 教師分類與篩選</div>
      <div class="teacher-filter-tabs">
        <button class="teacher-filter-tab ${state.role==='all'?'active':''}" data-role="all">全部教師</button>

        <button class="teacher-filter-tab ${state.role==='none'?'active':''}" data-role="none">尚未任課</button>
        <button class="teacher-filter-tab ${state.role==='unlinked'?'active':''}" data-role="unlinked">⚠️ 尚未連動</button>
      </div>
      <div class="teacher-filter-grid">
        <div class="field teacher-search-wrap"><label>搜尋</label><input id="teacherDirectorySearch" placeholder="搜尋姓名或 Email"></div>
        <div class="field"><label>年級</label><select id="teacherDirectoryGrade"><option value="all">全部年級</option><option value="7">七年級</option><option value="8">八年級</option><option value="9">九年級</option><option value="cross">跨年級</option></select></div>
        <div class="field"><label>科目</label><select id="teacherDirectorySubject"><option value="all">全部科目</option>${allSubjects.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>

        <tbody id="teacherDirectoryBody"></tbody>
      </table></div>
    </div>`;

  $('#teacherDirectoryGrade').value=state.grade||'all';
  $('#teacherDirectorySubject').value=allSubjects.includes(state.subject)?state.subject:'all';

  const paint=()=>{
    const q=($('#teacherDirectorySearch').value||'').trim().toLowerCase();
    state.grade=$('#teacherDirectoryGrade').value||'all';

    let rows=teachers.map(r=>{

      return {r,list,grades,isHomeroom:isHomeroomTeacher(r)};
    });
    rows=rows.filter(x=>{
      const {r,list,grades,isHomeroom}=x;
      if(q&&!`${r.displayName||''} ${r.email||r.id||''}`.toLowerCase().includes(q))return false;
      if(state.role==='homeroom'&&!isHomeroom)return false;
      if(state.role==='subject'&&!list.length)return false;
      if(state.role==='none'&&list.length)return false;
      if(state.role==='unlinked'&&r.linkedUid)return false;
      if(state.grade==='cross'&&grades.length<2)return false;

        <td>${esc(r.email||r.id)}</td>

    $$('.teacher-view-assignments').forEach(b=>b.onclick=()=>{

      const list=assignmentList(reg),grouped={};
      for(const x of list)(grouped[x.subject]??=[]).push(x.classId);

        <div>${groups.map(([subject,classIds])=>`<div class="teacher-detail-group"><div class="teacher-detail-title">${esc(subject)}｜${[...new Set(classIds)].length} 班</div><div class="teacher-class-chips">${[...new Set(classIds)].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).map(c=>`<span class="teacher-class-chip">${esc(c)} 班</span>`).join('')}</div></div>`).join('')||'<div class="meta">尚未設定任課。</div>'}</div>
        <div class="toolbar"><button class="btn gray close-modal">關閉</button></div>`);
    });

  $$('.teacher-filter-tab').forEach(b=>b.onclick=()=>{
    state.role=b.dataset.role;
    $$('.teacher-filter-tab').forEach(x=>x.classList.toggle('active',x.dataset.role===state.role));

    await refreshAll();renderTeacherDirectory();alert('✅ 教師主檔已儲存。');
  };
  paint();

async function seedClasses(){if(!isGlobalAdmin())return alert('只有最高管理員可以建立／更新預設班級。');
  for(const[id,arr]of Object.entries(defaultRosters)){
    const existing=classDocLocal(id),oldStudents=existing?.students||[];
    const bySeat=new Map(oldStudents.map(s=>[Number(s.seat),s]));
    for(const[seat,name0]of arr){
      const name=normalizeStudentName(name0),old=bySeat.get(Number(seat));
      if(old){
        const sid=old.studentId||((String(old.id||'').startsWith('stu_'))?old.id:'');
        bySeat.set(Number(seat),{...old,id:sid||old.id||String(seat),studentId:sid||old.studentId||null,seat:Number(seat),name:old.name||name});
      }else bySeat.set(Number(seat),{id:String(seat),seat:Number(seat),name,active:true});
    }
    await setDoc(doc(db,'classes',id),{classId:id,students:[...bySeat.values()].sort((a,b)=>Number(a.seat)-Number(b.seat)),updatedAt:serverTimestamp()},{merge:true});
  }
  await audit('seed','classes','default','建立／更新預設班級名單（保留固定 studentId）');await refreshAll();alert('預設班級名單已建立／補齊；既有 studentId 與轉出狀態不會被覆蓋。');
}
function parseRoster(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const[seat,...rest]=line.split(/[,，\t]/);return{seat:Number(seat),name:normalizeStudentName(rest.join('').trim()),active:true}}).filter(x=>x.seat&&x.name).sort((a,b)=>a.seat-b.seat)}
async function saveClass(id,text){
  if(!isGlobalAdmin())return alert('只有最高管理員可以新增自訂班級。');id=id.trim();if(!id)return alert('請輸入班級');
  const parsed=parseRoster(text);if(!parsed.length)return alert('請輸入名單');
  const old=classDocLocal(id)?.students||[],students=[];
  for(const row of parsed){
    const existing=old.find(s=>Number(s.seat)===Number(row.seat) && normalizeStudentName(s.name||'')===normalizeStudentName(row.name));
    if(existing){
      const sid=existing.studentId||((String(existing.id||'').startsWith('stu_'))?existing.id:'');
      students.push({...existing,...row,id:sid||existing.id||String(row.seat),studentId:sid||existing.studentId||null,active:existing.active!==false});
    }else{
      const exact=chooseBestDirectoryStudent(directoryExactCandidates(id,row.seat,row.name),{classId:id,seat:row.seat});
      if(exact)students.push({...row,id:exact.id,studentId:exact.id,email:exact.email||'',active:true});
      else students.push({...row,id:String(row.seat),active:true});
    }
  }
  await setDoc(doc(db,'classes',id),{classId:id,students,updatedAt:serverTimestamp()},{merge:true});
  await audit('save_class','class',id,`更新班級名單 ${id}（保留既有 studentId）`);await refreshAll();alert('✅ 已儲存班級名單；既有學生固定 studentId 會保留，不會因重新貼名單而重建。')
}

function hasGlobalPrivilege(){
  return !!me && me.type==='admin' && (!me.adminScope || me.adminScope==='global');
}

  if(me.homeroomClassId)return String(me.homeroomClassId);
  if(Array.isArray(me.adminClassIds)&&me.adminClassIds.length)return String(me.adminClassIds[0]);
  // 現有最高管理員帳號向下相容：目前導師班為 804；之後可在「管理者權限」修改。
  return hasGlobalPrivilege()?'804':'';
}
function initializeWorkMode(){
  if(!me)return;
  workMode='homeroom';
  modeChosenThisLogin=false;
}
function isGlobalAdmin(){
  return hasGlobalPrivilege() && workMode==='global';
}
function isHomeroomMode(){return workMode==='homeroom'}
function isTeacherMode(){return workMode==='teacher'}
function availableModes(){
  const out=[];
  if(homeroomClassId())out.push({id:'homeroom',icon:'🏫',title:`${homeroomClassId()} 導師`,desc:`只管理 ${homeroomClassId()} 導師班，避免誤碰全校設定。`});

  return out;
}

  hideModal();
  configureAdminUI();

  // 大改版相容：
  // 原本「帳號連動／任課」已設定的 assignments，

function activeModeLabel(){

  return `${homeroomClassId()||'未設定'} 導師`;
}
function allowedAdminClassIds(){
  if(workMode==='global'&&hasGlobalPrivilege())return [...new Set([...configuredClassIds(),...classes.map(c=>String(c.id)),...Object.keys(defaultRosters)])].sort();
  if(workMode==='homeroom'){

function adminLabel(){return activeModeLabel()}

function isClassAdminAccount(){

function canUseSubjectClassManagement(){

  // 一般導師管理員固定使用導師工作區；最高管理員切到導師模式時使用完全相同的工作區。

  if(!me)return;

function schoolYearFromSemester(sem=currentSemester){return String(sem||'').split('-')[0]||''}
function gradeFromClassId(classId){const n=Number(String(classId||'').charAt(0));return [7,8,9].includes(n)?n:null}
function promotedClassId(classId){
  const s=String(classId||''),g=gradeFromClassId(s);
  if(!(g===7||g===8))return null;
  const target=String(g+1)+s.slice(1);
  return (schoolClassConfig[g+1]||[]).includes(target)?target:null;
}
function subjectManagerId(semester,classId,subject){
  return [semester,String(classId),subject].map(x=>encodeURIComponent(String(x))).join('__');
}

function newStudentId(){
  try{return `stu_${crypto.randomUUID().replaceAll('-','')}`}catch{return `stu_${Date.now().toString(36)}${Math.random().toString(36).slice(2,14)}`}
}
function directoryStudentById(id){return studentDirectory.find(s=>s.id===id)||null}
function directoryExactCandidates(classId,seat,name){
  const n=normalizeStudentName(name);
  return studentDirectory.filter(s=>
    s.status!=='merged' &&
    String(s.currentClassId||'')===String(classId) &&
    Number(s.currentSeat)===Number(seat) &&
    normalizeStudentName(s.displayName||'')===n
  );
}
async function findDirectoryByEmail(email){
  const key=registryId(email);if(!key)return null;
  return studentDirectory.find(s=>registryId(s.email)===key&&s.status!=='merged')||null;
}
function chooseBestDirectoryStudent(candidates,{classId='',seat=null,email=''}={}){
  if(!candidates?.length)return null;
  const emailKey=registryId(email);
  const classObj=classDocLocal(String(classId));
  const classSid=classObj?.students?.find(x=>Number(x.seat)===Number(seat))?.studentId || classObj?.students?.find(x=>Number(x.seat)===Number(seat))?.id || '';
  const score=s=>{
    let n=0;
    if(s.id===classSid)n+=100;
    if(registries.some(r=>r.studentId===s.id&&r.linkedUid))n+=80;
    if(emailKey&&registryId(s.email)===emailKey)n+=60;
    if(registries.some(r=>r.studentId===s.id&&r.email))n+=40;
    if(collections.some(x=>x.records&&Object.prototype.hasOwnProperty.call(x.records,s.id)))n+=30;
    if(assessments.some(x=>x.scores&&Object.prototype.hasOwnProperty.call(x.scores,s.id)))n+=30;
    if(s.active!==false&&s.status!=='transferred'&&s.status!=='graduated')n+=10;
    return n;
  };
  return [...candidates].sort((a,b)=>score(b)-score(a))[0]||candidates[0];
}
async function upsertDirectoryStudent(row,classId,semester=currentSemester,creator='管理員'){
  const seat=Number(row.seat),name=normalizeStudentName(row.name||''),email=registryId(row.email||'');
  let sid=(String(row.studentId||'').startsWith('stu_')?String(row.studentId):'')||((String(row.id||'').startsWith('stu_'))?String(row.id):'');
  let sd=sid?directoryStudentById(sid):null;
  if(!sd&&email)sd=await findDirectoryByEmail(email);
  if(!sd){
    const exact=directoryExactCandidates(classId,seat,name);
    sd=chooseBestDirectoryStudent(exact,{classId,seat,email});
  }
  if(!sid)sid=sd?.id||newStudentId();
  const existing=directoryStudentById(sid)||sd;
  await setDoc(doc(db,'studentDirectory',sid),{
    displayName:name,email:email||existing?.email||'',currentClassId:String(classId),currentSeat:seat,
    grade:gradeFromClassId(classId),status:row.active===false?'transferred':'enrolled',active:row.active!==false,
    createdByUid:existing?.createdByUid||me?.uid||null,createdByName:existing?.createdByName||creator,
    createdAt:existing?.createdAt||serverTimestamp(),updatedAt:serverTimestamp()
  },{merge:true});
  const sy=schoolYearFromSemester(semester);
  await setDoc(doc(db,'studentEnrollments',`${sy}__${sid}`),{
    studentId:sid,schoolYear:sy,semester,classId:String(classId),grade:gradeFromClassId(classId),seat,
    displayName:name,email:email||existing?.email||'',status:row.active===false?'transferred':'active',updatedAt:serverTimestamp()
  },{merge:true});
  return {...row,id:sid,studentId:sid,seat,name,email:email||existing?.email||'',active:row.active!==false};
}
function mySubjectManagers(semester=null){
  const myEmail=String(me?.email||auth.currentUser?.email||'').toLowerCase();
  return subjectManagers.filter(x=>
    x.status!=='released' &&
    (!semester||x.semester===semester) &&
    (
      x.managerUid===me?.uid ||
      (myEmail && String(x.managerEmail||'').toLowerCase()===myEmail)
    )
  );
}

function currentUserOwnsSubjectManager(sm){
  if(!sm||!me)return false;
  const myEmail=String(me.email||auth.currentUser?.email||'').toLowerCase();
  return sm.managerUid===me.uid || (!!myEmail && String(sm.managerEmail||'').toLowerCase()===myEmail);

function canEditSubjectRosterEmails(sm){
  if(!sm||!me)return false;
  if(isGlobalAdmin())return true;
  if(isTeacherMode())return currentUserOwnsSubjectManager(sm);
  if(hasHomeroomWorkspace())return canAdminClass(sm.classId) || currentUserOwnsSubjectManager(sm);

function teacherRegistries(){

    .filter(r=>r.type==='teacher'&&r.active!==false)

function teacherIdentityMatchesManager(reg,sm){

async function claimPendingSubjectManagersForMe(){
  if(!me)return;
  const myEmail=String(me.email||auth.currentUser?.email||'').toLowerCase();
  if(!myEmail)return;
  const mine=subjectManagers.filter(sm=>
    sm.status!=='released' &&
    String(sm.managerEmail||'').toLowerCase()===myEmail &&
    sm.managerUid!==me.uid
  );
  for(const sm of mine){
    try{
      await setDoc(doc(db,'subjectClassManagers',sm.id),{
        managerUid:me.uid,
        managerName:me.displayName||me.username||sm.managerName||myEmail,
        claimedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      },{merge:true});
      sm.managerUid=me.uid;

async function ensureSubjectManagerForTeacher(reg,semester,classId,subject,{createdByLabel='管理員指派'}={}){
  if(!reg)throw new Error('找不到教師主檔。');
  const email=String(reg.email||reg.id||'').toLowerCase();
  const managerUid=reg.linkedUid||null;
  const id=subjectManagerId(semester,classId,subject);
  const ref=doc(db,'subjectClassManagers',id);
  let result='created';

  await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);
    if(snap.exists() && snap.data().status!=='released'){
      const d=snap.data();
      const same=
        (managerUid && d.managerUid===managerUid) ||
        (email && String(d.managerEmail||'').toLowerCase()===email);
      if(same){
        result='same';
        tx.set(ref,{
          managerUid:managerUid||d.managerUid||null,
          managerEmail:email,
          managerName:reg.displayName||d.managerName||email,
          updatedAt:serverTimestamp()
        },{merge:true});
        return;
      }
      throw new Error(`MANAGER_CONFLICT::${d.managerName||d.managerEmail||'其他老師'}`);
    }
    tx.set(ref,{
      semester,classId:String(classId),subject,
      managerUid,managerEmail:email,
      managerName:reg.displayName||email,
      status:'active',
      createdBy:me.uid,
      createdByName:me.displayName||me.username||'',
      createdByLabel,
      createdByRole:isGlobalAdmin()?'global_admin':'homeroom_admin',
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    },{merge:false});
    tx.set(doc(db,'subjectClassRosters',id),{
      semester,classId:String(classId),subject,
      managerUid,managerEmail:email,
      studentIds:[],students:[],
      rosterSource:'sharedClass',
      updatedAt:serverTimestamp()
    },{merge:true});
  });

  const sm={id,semester,classId:String(classId),subject,managerUid,managerEmail:email,managerName:reg.displayName||email,status:'active'};
  try{await syncSubjectRosterFromSharedClass(sm,{silent:true})}catch(e){console.warn(e)}
  return {id,result,sm};
}
async function addAssignmentToTeacherRegistry(reg,semester,classId,subject){
  const a={semester,classId:String(classId),kind:'teacher',scopeType:'subject',scopeName:subject,canCollection:true,canScores:true};
  reg.assignments=mergeAssignments(reg.assignments||[],[a]);
  await saveRegistry(reg);

  if(reg.linkedUid){
    try{
      const uref=doc(db,'users',reg.linkedUid),usnap=await getDoc(uref);
      if(usnap.exists()){
        const ud=usnap.data(),assignments=mergeAssignments(ud.assignments||[],[a]),access=computeAccess(assignments,currentSemester);
        await setDoc(uref,{assignments,...access,updatedAt:serverTimestamp()},{merge:true});
      }
    }catch(e){console.warn('sync linked teacher user failed',e)}
  }
  return a;
}
async function assignTeacherToSubject(reg,semester,classId,subject,{source='導師指派'}={}){
  try{
    const ensured=await ensureSubjectManagerForTeacher(reg,semester,classId,subject,{createdByLabel:source});
    await addAssignmentToTeacherRegistry(reg,semester,classId,subject);
    await audit('teacher_assignment','subjectClassManagers',ensured.id,`${source}：${reg.displayName||reg.email}｜${semester}｜${classId}｜${subject}`,semester);
    return {
      ok:true,
      existed:ensured.result==='same',
      message:ensured.result==='same'
        ?`✅ ${semester}｜${classId}｜${subject} 原本就已由 ${reg.displayName||reg.email} 負責，已直接共用現有設定。`
        :`✅ 已設定：${reg.displayName||reg.email}｜${semester}｜${classId}｜${subject}`
    };
  }catch(e){
    const msg=String(e?.message||e);
    if(msg.startsWith('MANAGER_CONFLICT::')){
      return {ok:false,message:`⚠️ ${semester}｜${classId}｜${subject} 已由 ${msg.split('::')[1]} 負責，不能重複指定。`};
    }
    return {ok:false,message:`設定失敗：${msg}`};
  }
}

async function removeTeacherSubjectAssignment(reg,semester,classId,subject){

    String(a.classId)===String(classId) && a.scopeName===subject
  ));
  await saveRegistry(reg);

  if(reg.linkedUid){
    try{
      const uref=doc(db,'users',reg.linkedUid),usnap=await getDoc(uref);
      if(usnap.exists()){
        const ud=usnap.data();
        const assignments=(ud.assignments||[]).filter(a=>!(
          a.kind==='teacher' && a.scopeType==='subject' && a.semester===semester &&
          String(a.classId)===String(classId) && a.scopeName===subject
        ));
        const access=computeAccess(assignments,currentSemester);
        await setDoc(uref,{assignments,...access,updatedAt:serverTimestamp()},{merge:true});
      }
    }catch(e){console.warn('remove linked teacher assignment failed',e)}
  }
}

        status:'active',updatedAt:serverTimestamp()
      },{merge:true});

      await addAssignmentToTeacherRegistry(newReg,sm.semester,sm.classId,newSubject);

async function safeDocs(q){
  try{const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}))}
  catch(e){console.warn('safeDocs',e?.code||e?.message);return []}
}
async function safeDoc(ref){
  try{const s=await getDoc(ref);return s.exists()?{id:s.id,...s.data()}:null}catch(e){console.warn('safeDoc',e?.code||e?.message);return null}
}

// 覆寫資料載入：舊集合與新集合並存，Rules 尚未更新時新集合讀取失敗也不會讓舊後台整頁掛掉。
async function syncAllLegacyTeacherAssignmentsToSubjectManagers(){
  if(!hasGlobalPrivilege())return 0;
  let created=0;
  const teachers=registries.filter(r=>r.type==='teacher'&&r.active!==false);
  for(const reg of teachers){
    for(const a of (reg.assignments||[]).filter(a=>a.kind==='teacher'&&a.scopeType==='subject'&&a.semester&&a.classId&&a.scopeName)){
      const id=subjectManagerId(a.semester,a.classId,a.scopeName);
      if(subjectManagers.some(sm=>sm.id===id&&sm.status!=='released'))continue;
      try{
        await ensureSubjectManagerForTeacher(reg,a.semester,String(a.classId),a.scopeName,{createdByLabel:'舊任課設定自動整併'});
        created++;
      }catch(e){console.warn('legacy teacher assignment migration skipped',id,e)}
    }
  }
  return created;
}
async function refreshAll(){
  const globalPrivilege=hasGlobalPrivilege();
  if(globalPrivilege){
    const [us,rs,cs,co,as,sm,sr,sd,se,ub,crh]=await Promise.all([
      safeDocs(collection(db,'users')),safeDocs(collection(db,'identityRegistry')),safeDocs(collection(db,'classes')),
      safeDocs(collection(db,'collectionItems')),safeDocs(collection(db,'assessments')),
      safeDocs(collection(db,'subjectClassManagers')),safeDocs(collection(db,'subjectClassRosters')),
      safeDocs(collection(db,'studentDirectory')),safeDocs(collection(db,'studentEnrollments')),
      safeDocs(collection(db,'upgradeBatches')),safeDocs(collection(db,'classRosterHistory'))
    ]);
    users=us;registries=rs;classes=cs;collections=co;assessments=as;
    subjectManagers=sm;subjectRosters=sr;studentDirectory=sd;studentEnrollments=se;upgradeBatches=ub;classRosterHistory=crh;
    const migrated=await syncAllLegacyTeacherAssignmentsToSubjectManagers();
    if(migrated){subjectManagers=await safeDocs(collection(db,'subjectClassManagers'));subjectRosters=await safeDocs(collection(db,'subjectClassRosters'))}
  }else{
    const ids=[...new Set((me?.adminClassIds||[]).map(String))];
    users=[me];registries=[];classes=[];collections=[];assessments=[];
    for(const classId of ids){
      const c=await safeDoc(doc(db,'classes',classId));if(c)classes.push(c);
      registries.push(...await safeDocs(query(collection(db,'identityRegistry'),where('classId','==',classId))));
      collections.push(...await safeDocs(query(collection(db,'collectionItems'),where('classId','==',classId))));
      assessments.push(...await safeDocs(query(collection(db,'assessments'),where('classId','==',classId))));
    }

    const teacherRegs=await safeDocs(query(collection(db,'identityRegistry'),where('type','==','teacher')));
    for(const r of teacherRegs)if(!registries.some(x=>x.id===r.id))registries.push(r);

    const ownManagers=await safeDocs(query(collection(db,'subjectClassManagers'),where('managerUid','==',me.uid)));
    const emailManagers=me?.email
      ?await safeDocs(query(collection(db,'subjectClassManagers'),where('managerEmail','==',String(me.email).toLowerCase())))
      :[];
    const classManagers=[];
    for(const classId of ids){
      classManagers.push(...await safeDocs(query(collection(db,'subjectClassManagers'),where('classId','==',String(classId)))));
    }
    subjectManagers=[];
    for(const sm of [...ownManagers,...emailManagers,...classManagers]){
      if(!subjectManagers.some(x=>x.id===sm.id))subjectManagers.push(sm);
    }

    subjectRosters=[];
    for(const sm of subjectManagers){
      const r=await safeDoc(doc(db,'subjectClassRosters',sm.id));
      if(r&&!subjectRosters.some(x=>x.id===r.id))subjectRosters.push(r);
      if(!classes.some(c=>c.id===sm.classId)){
        const c=await safeDoc(doc(db,'classes',String(sm.classId)));
        if(c)classes.push(c);
      }
    }

    // ★ 共用班級學生身分資料：
    // 除了導師班，也要把「自己任課班」以及「自己導師班已建立的任課班」
    // 所涉及班級的 student identityRegistry 全部載入。
    // 如此 802 的 Email/linkedUid 只要任何老師建立過，所有有 802 權限的老師都讀同一份。
    const relatedClassIds=[...new Set([
      ...ids.map(String),
      ...subjectManagers.map(sm=>String(sm.classId))
    ])];

    for(const classId of relatedClassIds){
      const regs=await safeDocs(query(
        collection(db,'identityRegistry'),
        where('classId','==',String(classId))
      ));
      for(const r of regs){
        if(!registries.some(x=>x.id===r.id))registries.push(r);
      }
      if(!classes.some(c=>String(c.id)===String(classId))){
        const c=await safeDoc(doc(db,'classes',String(classId)));
        if(c)classes.push(c);
      }
    }

    studentDirectory=[];studentEnrollments=[];upgradeBatches=[];classRosterHistory=[];
  }
  try{await claimPendingSubjectManagersForMe()}catch(e){console.warn(e)}
  configureAdminUI();
  $('#semesterBadge').textContent=`目前學期：${currentSemester}`;
  const page=activePage();
  if($('.nav button.active')?.classList.contains('hidden')){
    $('.nav button[data-page="dashboard"]')?.click();
  }else renderPage(page);
}

function myTeacherAssignments(semester=currentSemester){

    a.kind==='teacher' &&

    a.scopeName
  );

    a.kind==='teacher' &&

  );

async function syncMyTeacherAssignmentsToSubjectManagers({silent=false}={}){
  if(!me)return {created:0,conflicts:[]};

  const assignments=myTeacherAssignments(currentSemester);
  if(!assignments.length)return {created:0,conflicts:[]};

  let created=0;
  const conflicts=[];

  for(const a of assignments){
    const classId=String(a.classId);
    const subject=a.scopeName;
    const id=subjectManagerId(a.semester,classId,subject);
    const ref=doc(db,'subjectClassManagers',id);

    try{
      await runTransaction(db,async tx=>{
        const snap=await tx.get(ref);

        if(snap.exists()){
          const d=snap.data();

          // 已由自己管理：保持即可。
          if(d.managerUid===me.uid && d.status!=='released'){
            return;
          }

          // 自己曾解除，但舊 assignments 仍存在：重新啟用。
          if(d.managerUid===me.uid && d.status==='released'){
            tx.set(ref,{
              semester:a.semester,
              classId,
              subject,
              managerUid:me.uid,
              managerName:me.displayName||me.username||me.email,
              status:'active',
              reactivatedFromAssignment:true,
              releasedBy:null,
              releasedAt:null,
              updatedAt:serverTimestamp()
            },{merge:true});

            tx.set(doc(db,'subjectClassRosters',id),{
              semester:a.semester,
              classId,
              subject,
              managerUid:me.uid,
              studentIds:[],
              students:[],
              updatedAt:serverTimestamp()
            },{merge:true});
            created++;
            return;
          }

          // 已被另一位老師使用中，不可直接搶走。
          if(d.status!=='released' && d.managerUid!==me.uid){
            throw new Error(`ASSIGNMENT_CONFLICT::${classId}::${subject}::${d.managerName||'其他老師'}`);
          }

          // 對方已解除，可由目前既有任課 assignment 接手。
          tx.set(ref,{
            semester:a.semester,
            classId,
            subject,
            managerUid:me.uid,
            managerName:me.displayName||me.username||me.email,
            status:'active',
            createdBy:me.uid,
            claimedFromLegacyAssignment:true,
            createdAt:serverTimestamp(),
            releasedBy:null,
            releasedAt:null,
            updatedAt:serverTimestamp()
          },{merge:false});

          tx.set(doc(db,'subjectClassRosters',id),{
            semester:a.semester,
            classId,
            subject,
            managerUid:me.uid,
            studentIds:[],
            students:[],
            updatedAt:serverTimestamp()
          },{merge:true});
          created++;
          return;
        }

        // 還沒有人建立：把原本後台任課設定轉成新版任課班管理關聯。
        tx.set(ref,{
          semester:a.semester,
          classId,
          subject,
          managerUid:me.uid,
          managerName:me.displayName||me.username||me.email,
          status:'active',
          createdBy:me.uid,
          importedFromAssignment:true,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        },{merge:false});

        tx.set(doc(db,'subjectClassRosters',id),{
          semester:a.semester,
          classId,
          subject,
          managerUid:me.uid,
          studentIds:[],
          students:[],
          updatedAt:serverTimestamp()
        },{merge:true});
        created++;
      });
    }catch(e){
      const msg=String(e?.message||e);
      if(msg.startsWith('ASSIGNMENT_CONFLICT::')){
        const [,classId2,subject2,owner]=msg.split('::');
        conflicts.push({classId:classId2,subject:subject2,owner});
        continue;
      }
      console.error('sync assignment -> subject manager failed',a,e);
    }
  }

  if(created){
    await audit(
      'sync_teacher_assignments',
      'subjectClassManagers',
      me.uid,
      `同步既有任課權限到任課班管理，共 ${created} 組`,
      currentSemester
    );
  }

  if(!silent && conflicts.length){
    alert(
      '⚠️ 有任課權限與目前任課班管理者重疊：\n\n' +
      conflicts.map(x=>`${x.classId}｜${x.subject}：目前由 ${x.owner} 管理`).join('\n') +
      '\n\n系統沒有直接覆蓋其他老師，請由最高管理員確認後再處理。'
    );
  }

  return {created,conflicts};
}

async function createSubjectClass(){
  if(!canUseSubjectClassManagement())return alert('這個帳號目前沒有新增任課班的權限。');
  const semester=$('#scSemester').value,classId=$('#scClass').value,subject=$('#scSubject').value;
  if(!semester||!classId||!subject)return alert('請選擇學期、班級與科目。');
  const id=subjectManagerId(semester,classId,subject);
  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,'subjectClassManagers',id),snap=await tx.get(ref);
      if(snap.exists()&&snap.data().status!=='released'){
        const d=snap.data();
        const myEmail=String(me.email||auth.currentUser?.email||'').toLowerCase();
        const same=d.managerUid===me.uid || (myEmail && String(d.managerEmail||'').toLowerCase()===myEmail);
        if(same)throw new Error('ALREADY_MINE');
        throw new Error(`DUPLICATE::${d.managerName||d.managerEmail||'其他老師'}`);
      }
      tx.set(ref,{semester,classId,subject,managerUid:me.uid,managerEmail:String(me.email||auth.currentUser?.email||'').toLowerCase(),managerName:me.displayName||me.username||me.email,status:'active',createdBy:me.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:false});
      tx.set(doc(db,'subjectClassRosters',id),{semester,classId,subject,managerUid:me.uid,managerEmail:String(me.email||auth.currentUser?.email||'').toLowerCase(),studentIds:[],students:[],rosterSource:'sharedClass',updatedAt:serverTimestamp()},{merge:true});
    });
  }catch(e){
    const msg=String(e.message||'');
    if(msg==='ALREADY_MINE'){
      await refreshAll();renderSubjectClasses();
      return alert(`✅ ${classId}班｜${subject} 原本就已經是你的任課班，已直接載入共用設定，不會重複建立。`);
    }
    if(msg.startsWith('DUPLICATE::')){
      return alert(`⚠️ ${classId}班｜${subject} 已由 ${msg.split('::')[1]} 建立。\n\n同一學期、同一班、同一科不可由不同老師重複建立。`);
    }
    const raw=String(e?.code||e?.message||e);
    if(raw.includes('permission-denied')||raw.includes('PERMISSION_DENIED')){
      return alert('建立失敗：目前 Firestore Rules 尚未開放「導師管理員／任課老師自行建立任課班」的寫入權限。\n\n前端功能已具備，下一步需要同步更新 Firestore Rules。');
    }
    return alert(`建立失敗：${e.message||e}`);
  }

  // 同步為 class-work.html 可辨識的 teacher assignment
  const a={semester,classId,kind:'teacher',scopeType:'subject',scopeName:subject,canCollection:true,canScores:true,selfManaged:true};
  const assignments=mergeAssignments(me.assignments||[],[a]);
  const access=computeAccess(assignments,currentSemester);
  await setDoc(doc(db,'users',me.uid),{assignments,...access,updatedAt:serverTimestamp()},{merge:true});
  me.assignments=assignments;Object.assign(me,access);
  const reg=registries.find(r=>r.linkedUid===me.uid&&r.type==='teacher');
  if(reg){reg.assignments=mergeAssignments(reg.assignments||[],[a]);await saveRegistry(reg)}
  // 建立完成後，若 classes/{classId} 已有正式名單，直接套用共用班級名單。
  const createdManager={id,semester,classId,subject,managerUid:me.uid,managerName:me.displayName||me.username||me.email,status:'active'};
  try{await syncSubjectRosterFromSharedClass(createdManager,{silent:false})}catch(e){console.warn('共用班級名單同步未完成',e)}

  await audit('create_subject_class','subjectClassManagers',id,`自行建立任課班：${semester}｜${classId}｜${subject}`,semester);
  await refreshAll();renderSubjectClasses();
}
async function releaseSubjectClass(id){
  const sm=subjectManagers.find(x=>x.id===id);if(!sm)return;
  if(!(isGlobalAdmin()||sm.managerUid===me.uid))return alert('只能解除自己建立的任課班；最高管理員可解除全部。');
  if(!confirm(`確定解除 ${sm.semester}｜${sm.classId}｜${sm.subject}？\n\n學生共用主檔、歷史作業與成績不會刪除。`))return;
  await setDoc(doc(db,'subjectClassManagers',id),{status:'released',releasedBy:me.uid,releasedAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
  if(sm.managerUid===me.uid){
    const assignments=(me.assignments||[]).filter(a=>!(a.semester===sm.semester&&a.classId===sm.classId&&a.scopeName===sm.subject&&a.kind==='teacher'));
    const access=computeAccess(assignments,currentSemester);
    await setDoc(doc(db,'users',me.uid),{assignments,...access,updatedAt:serverTimestamp()},{merge:true});
    me.assignments=assignments;Object.assign(me,access);
  }
  await audit('release_subject_class','subjectClassManagers',id,`解除任課班：${sm.semester}｜${sm.classId}｜${sm.subject}`,sm.semester);
  await refreshAll();renderSubjectClasses();
}
function subjectRosterFor(id){return subjectRosters.find(x=>x.id===id)||null}

function sharedRosterForSubjectManager(sm){
  if(!sm)return [];

  // 第一優先：正式班級 classes/{classId}。
  // 只要後台已建置過這個班級，所有科目直接共用，不重複建名單。
  const classRoster=getRosterForClass(String(sm.classId));
  if(classRoster.length){
    return classRoster.map(s=>({
      ...s,
      studentId:s.studentId||s.id||String(s.seat),
      id:s.id||s.studentId||String(s.seat),
      active:s.active!==false
    })).filter(s=>s.active!==false)
      .sort((a,b)=>Number(a.seat)-Number(b.seat));
  }

  // 相容舊資料：班級主檔真的不存在時，才退回 subjectClassRosters。
  const r=subjectRosterFor(sm.id);
  return (r?.students||[])
    .filter(s=>s.active!==false)
    .sort((a,b)=>Number(a.seat)-Number(b.seat));
}

async function syncSubjectRosterFromSharedClass(sm,{silent=true}={}){
  if(!sm)return 0;
  const students=sharedRosterForSubjectManager(sm);

  // classes 沒有正式名單時，不反向覆蓋舊任課名單。
  const classObj=classes.find(c=>String(c.id)===String(sm.classId));
  if(!classObj || !Array.isArray(classObj.students) || !classObj.students.length){
    return students.length;
  }

  const normalized=students.map(s=>({
    studentId:s.studentId||s.id||String(s.seat),
    id:s.id||s.studentId||String(s.seat),
    seat:s.seat,
    name:s.name||'',
    email:s.email||'',
    active:s.active!==false
  }));

  await setDoc(doc(db,'subjectClassRosters',sm.id),{
    semester:sm.semester,
    classId:String(sm.classId),
    subject:sm.subject,
    managerUid:sm.managerUid,
    studentIds:normalized.map(s=>s.studentId),
    students:normalized,
    rosterSource:'sharedClass',
    syncedAt:serverTimestamp(),
    updatedAt:serverTimestamp()
  },{merge:true});

  if(!silent)alert(`✅ 已同步 ${sm.classId} 班共用名單，共 ${normalized.length} 人。`);
  return normalized.length;
}
function subjectAssistantInfo(sm){
  const c=classes.find(x=>String(x.id)===String(sm.classId));
  const roles=c?.roleAssignments?.[sm.semester]||{};
  const key=`assistant|subject|${sm.subject}`;
  const who=roles[key]||null;
  if(!who)return {student:null,registry:null,linked:false,label:'尚未指派小老師'};

  const rosterStudents=sharedRosterForSubjectManager(sm);
  const student=rosterStudents.find(s=>
    (who.studentId && (s.studentId===who.studentId || s.id===who.studentId)) ||
    Number(s.seat)===Number(who.seat)
  ) || {studentId:who.studentId||'',seat:who.seat,name:who.name,email:''};

  const registry=registries.find(r=>
    (student.studentId && r.studentId===student.studentId) ||
    (student.email && r.id===registryId(student.email)) ||
    (String(r.classId)===String(sm.classId) && Number(r.seat)===Number(student.seat))
  ) || null;

  const linked=!!(registry?.linkedUid || registry?.linked===true);
  return {
    student,
    registry,
    linked,
    label:`${student.seat??''} ${student.name||who.name||''}`.trim()
  };
}

function scoreStatsFromAssessment(x,students){
  const values=[];
  let passed=0,failed=0,notEntered=0;
  const passScore=Number.isFinite(Number(x.passScore))?Number(x.passScore):60;

  for(const s of students){
    const sid=s.id||s.studentId||String(s.seat);
    const r=(x.scores||{})[sid]||{};
    const status=r.status||'not_entered';
    const score=(r.score===null||r.score===undefined||r.score==='')?null:Number(r.score);

    if(score!==null && Number.isFinite(score) && !['absent','exempt','not_entered'].includes(status)){
      values.push(score);
      if(score>=passScore)passed++;else failed++;
    }else{
      notEntered++;
    }
  }

  const avg=values.length?values.reduce((a,b)=>a+b,0)/values.length:null;
  return {
    total:students.length,
    entered:values.length,
    passed,
    failed,
    notEntered,
    avg,
    max:values.length?Math.max(...values):null,
    min:values.length?Math.min(...values):null,
    passScore
  };
}

function scoreStatsHtml(stats){
  const fmt=v=>v===null||v===undefined?'—':(Number.isInteger(v)?String(v):Number(v).toFixed(1));
  return `<div class="score-stats" id="scoreStatsBox">
    <div class="score-stat"><b>${stats.entered}</b><span>已登記</span></div>
    <div class="score-stat"><b>${stats.passed}</b><span>及格（≥${fmt(stats.passScore)}）</span></div>
    <div class="score-stat"><b>${stats.failed}</b><span>不及格</span></div>
    <div class="score-stat"><b>${fmt(stats.avg)}</b><span>平均</span></div>
    <div class="score-stat"><b>${fmt(stats.max)}</b><span>最高</span></div>
    <div class="score-stat"><b>${fmt(stats.min)}</b><span>最低</span></div>
  </div><div class="meta">未登記／缺考／免試：${stats.notEntered} 人；平均、最高、最低只計算有實際數字且可列入成績的學生。</div>`;
}

}
async function openSubjectRosterEditor(id){
  const sm=subjectManagers.find(x=>x.id===id);
  if(!sm)return alert('找不到這個任課班。');
  if(!canEditSubjectRosterEmails(sm))return alert('目前工作身分沒有這個任課班的學生 Email 編輯權限。');

  // 每次開啟先以正式班級名單更新任課班快照；Email 本身仍以 identityRegistry 為共用主來源。
  try{await syncSubjectRosterFromSharedClass(sm,{silent:true})}catch(e){console.warn(e)}

  const students=sharedRosterForSubjectManager(sm);
  if(!students.length){
    return showModal(`<div class="section-title">👥 ${esc(sm.classId)}｜${esc(sm.subject)} 共用班級名單</div>
      <div class="notice warn">目前後台尚未建立 ${esc(sm.classId)} 班正式名單，因此沒有可設定 Email 的學生。請先由該班導師／管理者建立班級名單。</div>
      <div class="toolbar"><button class="btn gray close-modal">關閉</button></div>`);
  }

  const rows=students.map(s=>{
    const reg=registries.find(r=>
      (s.studentId && r.studentId===s.studentId) ||
      (s.email && r.id===registryId(s.email)) ||
      (String(r.classId)===String(sm.classId) && Number(r.seat)===Number(s.seat))
    )||null;
    const linked=!!(reg?.linkedUid||reg?.linked===true);
    const email=reg?.email||s.email||'';
    return `<tr>
      <td>${esc(s.seat)}</td>
      <td><b>${esc(s.name)}</b></td>
      <td><input class="subject-student-email" data-seat="${esc(s.seat)}" data-name="${esc(s.name)}" data-studentid="${esc(s.studentId||s.id||String(s.seat))}" data-oldid="${esc(reg?.id||'')}" type="email" value="${esc(email)}" placeholder="學校 Google Email" style="min-width:250px" ${linked?'title="已連動；若要更換 Email 會被系統阻擋"':''}></td>
      <td>${linked?'<span class="assistant-linked">✅ 已連動</span>':email?'<span class="assistant-unlinked">⚠️ Email已建／尚未連動</span>':'<span class="assistant-none">尚未設定 Email</span>'}</td>
    </tr>`;
  }).join('');

  showModal(`<div class="item-head">
      <div>
        <div class="section-title">👥 ${esc(sm.classId)}｜${esc(sm.subject)} 任課名單 / Email</div>
        <div class="meta">${esc(sm.semester)}｜共 ${students.length} 人｜目前身分：${esc(activeModeLabel())}</div>
      </div>
      <button class="btn gray close-modal">關閉</button>
    </div>
    <div class="notice success">
      此處使用 <b>${esc(sm.classId)} 班共用學生資料</b>。任課老師可以直接補上尚未設定的學生 Google Email；儲存一次後，同班其他科老師與導師都會讀到同一份資料。<br>
      <b>已完成 Google UID 連動的學生不能在這裡直接改成另一個 Email</b>，避免把帳號連到錯的人。
    </div>
    <div class="toolbar">
      <button id="saveSubjectEmailsBtn" class="btn primary">💾 儲存學生 Email</button>
      <button id="resyncSharedRosterBtn" class="btn good">🔄 重新同步班級主檔</button>
    </div>
    <details style="margin:10px 0"><summary style="cursor:pointer;font-weight:900">📥 批次貼上 Email</summary>
      <div class="field"><label>每行格式：座號,姓名,Email</label><textarea id="subjectEmailPaste" rows="6" placeholder="1,王小明,xxx@smail.ilc.edu.tw"></textarea></div>
      <button id="applySubjectEmailPasteBtn" class="btn gray">套用到上方欄位</button>
    </details>
    <div style="overflow:auto;max-height:58vh">
      <table>
        <thead><tr><th>座號</th><th>姓名</th><th>Google Email</th><th>Google 連動</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="toolbar">
      <button id="saveSubjectEmailsBtnBottom" class="btn primary">💾 儲存學生 Email</button>
      <button class="btn gray close-modal">關閉</button>
    </div>`);

  const applyPaste=()=>{
    const text=($('#subjectEmailPaste')?.value||'').trim();
    if(!text)return alert('請先貼上 Email 名單。');
    const map=new Map();
    text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
      const p=line.split(/[,，\t]/).map(x=>x.trim());
      if(p.length>=3)map.set(Number(p[0]),p[p.length-1]);
    });
    $$('.subject-student-email').forEach(inp=>{const email=map.get(Number(inp.dataset.seat));if(email)inp.value=email});
    alert('已套用到名單欄位，請再按「儲存學生 Email」。');
  };

  const saveEmails=async()=>{
    if(!canEditSubjectRosterEmails(sm))return alert('目前工作身分沒有儲存這個任課班 Email 的權限。');
    if(!confirm(`確定儲存 ${sm.classId} 班學生 Google Email？\n\n這是班級共用資料，其他有權限的導師與任課老師會同步看到。`))return;
    let saved=0,skipped=0;
    for(const inp of $$('.subject-student-email')){
      const email=registryId(inp.value),seat=Number(inp.dataset.seat),name=inp.dataset.name,studentId=inp.dataset.studentid,oldId=inp.dataset.oldid;
      if(!email)continue;
      const oldReg=(oldId?registries.find(r=>r.id===oldId):null)||registryByStudent(String(sm.classId),seat);
      if(oldReg?.linkedUid && oldReg.id!==email){
        skipped++;
        alert(`${seat}號 ${name} 已完成 Google 連動，不能直接更換 Email。這一筆已略過。`);
        continue;
      }
      const assignments=mergeAssignments(oldReg?.assignments||[],presetAssignmentsForStudent(String(sm.classId),seat));
      await setDoc(doc(db,'identityRegistry',email),{
        email,
        studentId:studentId||oldReg?.studentId||String(seat),
        username:`${sm.classId}${String(seat).padStart(2,'0')}`,
        displayName:name,
        type:'student',
        classId:String(sm.classId),
        seat,
        active:oldReg?.active!==false,
        linked:!!oldReg?.linkedUid,
        linkedUid:oldReg?.linkedUid||null,
        linkedAt:oldReg?.linkedAt||null,
        lastLoginAt:oldReg?.lastLoginAt||null,
        assignments,
        updatedAt:serverTimestamp()
      },{merge:true});
      if(oldId&&oldId!==email&&!oldReg?.linkedUid)await deleteDoc(doc(db,'identityRegistry',oldId));
      saved++;
    }
    await audit('subject_roster_email_save','identityRegistry',String(sm.classId),`${sm.classId}｜${sm.subject} 任課老師更新學生 Email ${saved} 筆${skipped?`，略過 ${skipped} 筆已連動資料`:''}`,sm.semester);
    try{await syncSubjectRosterFromSharedClass(sm,{silent:true})}catch(e){console.warn(e)}
    hideModal();
    await refreshAll();
    renderSubjectClasses();
    alert(`✅ 已儲存 ${saved} 筆學生 Email。${skipped?`\n另有 ${skipped} 筆因已完成 Google 連動而未變更。`:''}`);
  };

  $('#applySubjectEmailPasteBtn')?.addEventListener('click',applyPaste);
  $('#saveSubjectEmailsBtn')?.addEventListener('click',saveEmails);
  $('#saveSubjectEmailsBtnBottom')?.addEventListener('click',saveEmails);
  $('#resyncSharedRosterBtn').onclick=async()=>{
    try{
      await syncSubjectRosterFromSharedClass(sm,{silent:false});
      hideModal();
      await refreshAll();
      renderSubjectClasses();
    }catch(e){
      alert(`同步失敗：${e.message||e}`);
    }
  };
}

async function setSubjectAssistant(id){
  const sm=subjectManagers.find(x=>x.id===id);if(!sm)return;
  const students=sharedRosterForSubjectManager(sm);
  if(!students.length)return alert('目前這個班級尚未建立正式共用名單，請先由導師／管理者建立班級名單。');

  const c=await safeDoc(doc(db,'classes',String(sm.classId)));
  const preset=c?.roleAssignments?.[sm.semester]||{};
  const key=`assistant|subject|${sm.subject}`;
  const current=preset[key]?.studentId||'';

  const studentRegistry=(s)=>registries.find(reg=>
    (s.studentId && reg.studentId===s.studentId) ||
    (s.email && reg.id===registryId(s.email)) ||
    (String(reg.classId)===String(sm.classId) && Number(reg.seat)===Number(s.seat))
  )||null;

  showModal(`<div class="section-title">⭐ 指定 ${esc(sm.classId)}｜${esc(sm.subject)} 小老師</div>
    <div class="notice">下拉選單會直接顯示學生是否已完成 Google 帳號連動。尚未連動也可以先指派，但學生要完成連動後才能用自己的 Google 帳號正常取得小老師權限。</div>
    <div class="field"><label>學生</label><select id="subjectAssistantStudent">
      <option value="">— 未指派 —</option>
      ${students.map(s=>{
        const reg=studentRegistry(s);
        const linked=!!(reg?.linkedUid||reg?.linked===true);
        return `<option value="${esc(s.studentId)}" ${s.studentId===current?'selected':''}>${String(s.seat).padStart(2,'0')} ${esc(s.name)}｜${linked?'✅ 已連動':'⚠️ 尚未連動'}</option>`;
      }).join('')}
    </select></div>
    <div id="subjectAssistantLinkStatus" class="assistant-status"></div>
    <div class="toolbar"><button id="saveSubjectAssistantBtn" class="btn primary">儲存</button><button class="btn gray close-modal">取消</button></div>`);

  const refreshLinkStatus=()=>{
    const sid=$('#subjectAssistantStudent').value;
    const s=students.find(x=>x.studentId===sid);
    if(!s){
      $('#subjectAssistantLinkStatus').innerHTML='<span class="assistant-none">尚未指派小老師</span>';
      return;
    }
    const reg=studentRegistry(s);
    const linked=!!(reg?.linkedUid||reg?.linked===true);
    $('#subjectAssistantLinkStatus').innerHTML=
      `<b>${String(s.seat).padStart(2,'0')} ${esc(s.name)}</b>｜
       ${linked?'<span class="assistant-linked">✅ Google 已連動</span>':'<span class="assistant-unlinked">⚠️ Google 尚未連動</span>'}
       ${reg?.email?`<div class="meta">Email：${esc(reg.email)}</div>`:''}`;
  };
  $('#subjectAssistantStudent').onchange=refreshLinkStatus;
  refreshLinkStatus();

  $('#saveSubjectAssistantBtn').onclick=async()=>{
    const sid=$('#subjectAssistantStudent').value,student=students.find(s=>s.studentId===sid);
    const cls=await safeDoc(doc(db,'classes',String(sm.classId)))||{id:String(sm.classId),roleAssignments:{}};
    const roleAssignments=structuredClone(cls.roleAssignments||{}),roles=roleAssignments[sm.semester]||{};
    if(student)roles[key]={studentId:student.studentId,seat:student.seat,name:student.name};else delete roles[key];
    roleAssignments[sm.semester]=roles;
    await setDoc(doc(db,'classes',String(sm.classId)),{roleAssignments,updatedAt:serverTimestamp()},{merge:true});

    // 同步學生 identityRegistry assignment
    for(const s of students.filter(x=>x.email)){
      const reg=registries.find(x=>x.id===registryId(s.email));if(!reg)continue;
      let as=(reg.assignments||[]).filter(a=>!(a.semester===sm.semester&&a.classId===sm.classId&&a.kind==='assistant'&&a.scopeName===sm.subject));
      if(student&&s.studentId===student.studentId)as.push({semester:sm.semester,classId:sm.classId,kind:'assistant',scopeType:'subject',scopeName:sm.subject,canCollection:true,canScores:true});
      reg.assignments=as;await saveRegistry(reg);
    }
    await audit('set_subject_assistant','roles',id,`${sm.classId}｜${sm.subject} 小老師：${student?`${student.seat} ${student.name}`:'取消指派'}`,sm.semester);
    hideModal();await refreshAll();renderSubjectClasses();alert('✅ 本科小老師已更新。');
  }
}
// 作業／成績：依「本次工作模式」篩選
function renderRecords(){
  const sem=recordSemester||currentSemester;

  // 真正已存在的作業／成績資料
  const all=[
    ...collections.map(x=>({...x,_type:'collection'})),
    ...assessments.map(x=>({...x,_type:'assessment'}))
  ]
    .filter(x=>(x.semester||'')===sem&&canViewRecord(x))
    .sort((a,b)=>
      (a.classId||'').localeCompare(b.classId||'') ||
      (a.scopeName||'').localeCompare(b.scopeName||'','zh-Hant') ||
      (b.date||'').localeCompare(a.date||'')
    );

  // ------------------------------------------------------------
  // 任課權限來源不能只看「已經有作業／成績的 all」。
  // 必須同時合併：
  // 1. 原本 users / identityRegistry 的 teacher assignments
  // 2. 新版 subjectClassManagers
  // 3. 已存在的作業／成績
  // ------------------------------------------------------------
  const assignmentPairs=myTeacherAssignments(sem);

  const managerPairs=subjectManagers.filter(x=>
    x.semester===sem &&
    x.status!=='released' &&
    (
      isGlobalAdmin() ||
      x.managerUid===me?.uid
    )
  );

  let classIds=[];

  if(isTeacherMode()){
    classIds=[...new Set([
      ...assignmentPairs.map(x=>String(x.classId)),
      ...managerPairs.map(x=>String(x.classId)),
      ...all.map(x=>String(x.classId||'')).filter(Boolean)
    ])].sort();
  }
  else if(isHomeroomMode()){
    const h=homeroomClassId();
    if(me?.type==='admin' && !hasGlobalPrivilege()){
      classIds=[...new Set([
        ...(h?[String(h)]:[]),
        ...mySubjectManagers(sem).map(x=>String(x.classId)),
        ...all.map(x=>String(x.classId||'')).filter(Boolean)
      ])].sort();
    }else{
      classIds=h?[String(h)]:[];
    }
  }
  else{
    // 最高管理員模式可看目前學校設定班級、已存在班級、任課班與既有資料
    classIds=[...new Set([
      ...configuredClassIds(),
      ...classes.map(x=>String(x.id)),
      ...subjectManagers
        .filter(x=>x.semester===sem&&x.status!=='released')
        .map(x=>String(x.classId)),
      ...all.map(x=>String(x.classId||'')).filter(Boolean)
    ])].sort();
  }

  const countCollection=all.filter(x=>x._type==='collection').length;
  const countAssessment=all.filter(x=>x._type==='assessment').length;

  const scopeNote=isGlobalAdmin()
    ?'全校可見'
    :isTeacherMode()
      ?'只顯示自己管理的班級 × 科目'
      :`只顯示 ${homeroomClassId()} 導師班`;

  $('#page-records').innerHTML=`
    <div class="card">
      <div class="section-title">作業繳交／成績資料</div>

      <div class="notice success">
        <b>${esc(scopeNote)}</b><br>
        工作模式只限制後台操作範圍；不會刪除你帳號原本擁有的其他角色。
        ${isTeacherMode()
          ?'<br><b>任課班選單會直接讀取你的任課權限與「我的任課班」，即使目前 0 筆作業、0 筆成績也會顯示。</b>'
          :''
        }
      </div>

      <div class="record-filter-row">
        <label>查看學期
          <select id="recordSemester">${semesterOptions(sem)}</select>
        </label>

        <label>班級
          <select id="recordClass">
            <option value="all">全部班級</option>
            ${classIds.map(id=>`<option value="${esc(id)}">${esc(id)}</option>`).join('')}
          </select>
        </label>

        <label>科目
          <select id="recordSubject"></select>
        </label>

        <label>類型
          <select id="recordType">
            <option value="all">全部</option>
            <option value="collection">作業繳交</option>
            <option value="assessment">成績</option>
          </select>
        </label>

        <input id="recordSearch" placeholder="搜尋班級、科目、項目">
        <button class="btn gray" id="refreshRecords">重新整理</button>
      </div>

      <div class="export-panel">
        <div class="export-title">☑️ 資料勾選匯出</div>
        <div class="export-summary">
          ${esc(sem)}｜作業 ${countCollection} 項｜成績 ${countAssessment} 項｜
          <span id="selectedExportCount">已勾選 0 項</span>
        </div>

        <div class="export-toolbar">
          <button class="btn gray" id="selectVisibleRecords">☑ 全選目前顯示</button>
          <button class="btn gray" id="clearSelectedRecords">□ 清除勾選</button>
          <button class="btn good" id="previewSelectedRecords">👀 預覽</button>
          <button class="btn primary" id="downloadSelectedRecords">📥 Excel</button>
          <button class="btn gray" id="printSelectedRecords">🖨️ 列印</button>
        </div>
      </div>

      <div class="summary-launch">
        <button class="btn good" id="openCollectionSummary">📚 作業繳交彙整</button>
        <button class="btn primary" id="openScoreSummary">📊 成績彙整</button>
      </div>

      <div id="recordList" class="record-export-list">
        ${all.map(recordCard).join('')||'<div class="sub">這個範圍目前尚無作業或成績資料；但已授權的任課班仍會保留在上方班級／科目選單。</div>'}
      </div>
    </div>`;

  // ------------------------------------------------------------
  // 科目選單同樣不能只從既有 records 產生。
  // 選 802 就應該看到「數學」，即使 802 還沒有任何成績。
  // ------------------------------------------------------------
  const recordSubjectsForClass=(classId='all')=>{
    let list=[];

    if(isTeacherMode()){
      list=[
        ...assignmentPairs
          .filter(x=>classId==='all'||String(x.classId)===String(classId))
          .map(x=>x.scopeName),

        ...managerPairs
          .filter(x=>classId==='all'||String(x.classId)===String(classId))
          .map(x=>x.subject),

        ...all
          .filter(x=>classId==='all'||String(x.classId)===String(classId))
          .map(x=>x.scopeName)
      ];
    }
    else if(isHomeroomMode()){
      if(me?.type==='admin' && !hasGlobalPrivilege()){
        const h=String(homeroomClassId()||'');
        if(classId==='all' || String(classId)===h){
          list=[
            ...subjects,
            ...mySubjectManagers(sem).map(x=>x.subject),
            ...all.filter(x=>classId==='all'||String(x.classId)===String(classId)).map(x=>x.scopeName)
          ];
        }else{
          list=[
            ...mySubjectManagers(sem)
              .filter(x=>String(x.classId)===String(classId))
              .map(x=>x.subject),
            ...all.filter(x=>String(x.classId)===String(classId)).map(x=>x.scopeName)
          ];
        }
      }else{
        list=[
          ...subjects,
          ...all.map(x=>x.scopeName)
        ];
      }
    }
    else{
      list=[
        ...subjects,

        ...subjectManagers
          .filter(x=>
            x.semester===sem &&
            x.status!=='released' &&
            (classId==='all'||String(x.classId)===String(classId))
          )
          .map(x=>x.subject),

        ...all
          .filter(x=>classId==='all'||String(x.classId)===String(classId))
          .map(x=>x.scopeName)
      ];
    }

    return [...new Set(list.filter(Boolean))]
      .sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant'));
  };

  const refreshRecordSubjectOptions=()=>{
    const classId=$('#recordClass')?.value||'all';
    const previous=$('#recordSubject')?.value||'all';
    const list=recordSubjectsForClass(classId);

    $('#recordSubject').innerHTML=

async function migrateLegacyStudentsToDirectory(){
  if(!isGlobalAdmin())return alert('只有最高管理員模式可執行。');
  if(!confirm('這會把現有班級學生建立／校正固定 studentId。\n\n系統會優先沿用：既有 studentId → Email → 同班同座號同姓名；只有全部找不到才建立新 studentId。\n\n確定開始？'))return;
  let changed=0,reused=0,created=0;
  for(const c of classes){
    let classChanged=false;const students=[];
    for(const old of (c.students||[])){
      const oldKey=old.id||String(old.seat),oldSid=old.studentId||((String(old.id||'').startsWith('stu_'))?old.id:'');
      const reg=registryByStudent(c.id,old.seat),email=registryId(old.email||reg?.email||'');
      const beforeCount=studentDirectory.length;
      const row=await upsertDirectoryStudent({...old,email},c.id,currentSemester,me.displayName||'最高管理員');
      const sid=row.studentId;
      if(oldSid&&oldSid===sid)reused++;else if(directoryStudentById(sid))reused++;else created++;
      students.push(row);
      if(oldKey!==sid || old.studentId!==sid){
        for(const x of collections.filter(x=>String(x.classId)===String(c.id))){
          if(x.records&&Object.prototype.hasOwnProperty.call(x.records,oldKey)&&!Object.prototype.hasOwnProperty.call(x.records,sid)){
            const records={...x.records,[sid]:x.records[oldKey]};delete records[oldKey];await updateDoc(doc(db,'collectionItems',x.id),{records,updatedAt:serverTimestamp()});x.records=records;
          }
        }
        for(const x of assessments.filter(x=>String(x.classId)===String(c.id))){
          if(x.scores&&Object.prototype.hasOwnProperty.call(x.scores,oldKey)&&!Object.prototype.hasOwnProperty.call(x.scores,sid)){
            const scores={...x.scores,[sid]:x.scores[oldKey]};delete scores[oldKey];await updateDoc(doc(db,'assessments',x.id),{scores,updatedAt:serverTimestamp()});x.scores=scores;
          }
        }
        if(reg){reg.studentId=sid;await saveRegistry(reg)}
        classChanged=true;changed++;
      }
    }
    if(classChanged)await setDoc(doc(db,'classes',c.id),{students,updatedAt:serverTimestamp()},{merge:true});
  }
  await audit('migrate_student_ids','studentDirectory','all',`固定 studentId 同步，共校正 ${changed} 筆；同步時優先辨識既有學生`);
  await refreshAll();renderDirectory();alert(`✅ 學生主檔同步完成。\n校正班級名單 ${changed} 筆。\n接著可使用「掃描重複學生」清理先前已產生的重複主檔。`);
}

function duplicateStudentGroups(classId=''){

    const key=`${s.currentClassId||''}|${Number(s.currentSeat)||0}|${normalizeStudentName(s.displayName||'')}`;

async function mergeStudentRecords(sourceId,targetId,{silent=false}={}){
  if(sourceId===targetId)return;
  const src=studentDirectory.find(x=>x.id===sourceId),target=studentDirectory.find(x=>x.id===targetId);if(!src||!target)return;
  const srcLinked=registries.find(r=>r.studentId===sourceId&&r.linkedUid),tarLinked=registries.find(r=>r.studentId===targetId&&r.linkedUid);
  if(srcLinked&&tarLinked&&srcLinked.linkedUid!==tarLinked.linkedUid)throw new Error(`兩筆資料都已連動不同 Google UID：${src.displayName}`);
  for(const r of subjectRosters.filter(x=>(x.studentIds||[]).includes(sourceId))){
    const ids=[...new Set((r.studentIds||[]).map(x=>x===sourceId?targetId:x))];
    const students=(r.students||[]).map(x=>x.studentId===sourceId?{...x,studentId:targetId,id:targetId}:x).filter((x,i,a)=>a.findIndex(y=>y.studentId===x.studentId)===i);
    await updateDoc(doc(db,'subjectClassRosters',r.id),{studentIds:ids,students,updatedAt:serverTimestamp()});
  }
  for(const c of classes.filter(c=>(c.students||[]).some(x=>(x.studentId||x.id)===sourceId))){
    const students=c.students.map(x=>(x.studentId||x.id)===sourceId?{...x,id:targetId,studentId:targetId,name:target.displayName||x.name,email:target.email||x.email}:x).filter((x,i,a)=>a.findIndex(y=>(y.studentId||y.id)===(x.studentId||x.id))===i);
    await updateDoc(doc(db,'classes',c.id),{students,updatedAt:serverTimestamp()});
  }
  for(const x of collections){if(x.records&&Object.prototype.hasOwnProperty.call(x.records,sourceId)){const records={...x.records};if(!Object.prototype.hasOwnProperty.call(records,targetId))records[targetId]=records[sourceId];delete records[sourceId];await updateDoc(doc(db,'collectionItems',x.id),{records,updatedAt:serverTimestamp()})}}
  for(const x of assessments){if(x.scores&&Object.prototype.hasOwnProperty.call(x.scores,sourceId)){const scores={...x.scores};if(!Object.prototype.hasOwnProperty.call(scores,targetId))scores[targetId]=scores[sourceId];delete scores[sourceId];await updateDoc(doc(db,'assessments',x.id),{scores,updatedAt:serverTimestamp()})}}
  for(const e of studentEnrollments.filter(x=>x.studentId===sourceId)){const newId=`${e.schoolYear}__${targetId}`;await setDoc(doc(db,'studentEnrollments',newId),{...e,studentId:targetId,mergedFrom:sourceId,updatedAt:serverTimestamp()},{merge:true});await deleteDoc(doc(db,'studentEnrollments',e.id))}
  const srcReg=registries.find(r=>r.studentId===sourceId);if(srcReg&&!tarLinked){srcReg.studentId=targetId;srcReg.displayName=target.displayName;await saveRegistry(srcReg)}
  await setDoc(doc(db,'studentDirectory',sourceId),{active:false,status:'merged',mergedInto:targetId,mergedAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
  await audit('merge_duplicate_student','studentDirectory',sourceId,`合併重複學生：${src.displayName} → ${target.displayName}（保留 ${targetId}）`);
  if(!silent){await refreshAll();renderDirectory();alert('✅ 重複學生已合併。')}
}
async function scanAndMergeDuplicateStudents(){
  if(!isGlobalAdmin())return;
  const classId=window.__directorySelectedClass||'';
  const groups=duplicateStudentGroups(classId);
  if(!groups.length)return alert(`✅ ${classId||'目前範圍'} 沒有偵測到「同班＋同座號＋同姓名」的重複學生。`);
  const preview=groups.slice(0,8).map(g=>`${g[0].currentClassId}班 ${g[0].currentSeat}號 ${g[0].displayName}（${g.length}筆）`).join('\n');
  if(!confirm(`偵測到 ${groups.length} 組高度確定的重複學生：\n\n${preview}${groups.length>8?'\n…':''}\n\n系統會優先保留：目前班級正在使用 → 已連動 Google UID → 有 Email → 有作業／成績資料 的 studentId，其他筆標記 merged。\n\n確定執行安全整併？`))return;
  let merged=0,blocked=[];
  for(const group of groups){
    const target=chooseBestDirectoryStudent(group,{classId:group[0].currentClassId,seat:group[0].currentSeat,email:group.find(x=>x.email)?.email||''});
    for(const src of group.filter(x=>x.id!==target.id)){
      try{await mergeStudentRecords(src.id,target.id,{silent:true});merged++}catch(e){blocked.push(`${src.displayName}：${e.message||e}`)}
    }
  }
  await refreshAll();renderDirectory();
  alert(`✅ 重複學生整併完成：${merged} 筆來源主檔已合併。${blocked.length?`\n\n有 ${blocked.length} 筆因 Google UID 衝突未自動處理：\n${blocked.slice(0,6).join('\n')}`:''}`);
}

async function executeSchoolYearUpgrade(){
  if(!isGlobalAdmin())return;
  const p=upgradePreviewData();
  const legacy=classes.flatMap(c=>(c.students||[]).filter(s=>!(s.studentId||String(s.id||'').startsWith('stu_'))).map(s=>`${c.id}-${s.seat}`));
  if(legacy.length)return alert(`目前仍有 ${legacy.length} 位學生尚未建立固定 studentId。\n\n請先到「全校學生主檔」按「同步既有班級到學生主檔」，完成後再升級。`);
  if(!p.classes.length)return alert('沒有可升級班級。');
  const missingTargets=p.promote.filter(x=>!x.target);
  if(missingTargets.length)return alert(`以下班級在下一年級沒有對應班級：\n${missingTargets.map(x=>x.classId).join('、')}\n\n請先到「管理者權限 → 學校班級結構設定」調整班級清單，再執行學年升級。`);

  const typed=prompt(`最後確認：請輸入新學年「${p.toYear}」`);
  if(typed!==p.toYear)return alert('確認文字不符，已取消。');

  const batchId=`upgrade_${p.fromYear}_to_${p.toYear}_${Date.now()}`;
  const prevSemester=currentSemester;
  const adminChanges=[];
  const oldClasses=classes.filter(c=>gradeFromClassId(c.id));
  // 先快照，避免 804→904 覆蓋原904
  for(const c of oldClasses){
    await setDoc(doc(db,'classRosterHistory',`${p.fromYear}__${c.id}`),{schoolYear:p.fromYear,classId:c.id,students:c.students||[],roleAssignments:c.roleAssignments||{},snapshotAt:serverTimestamp(),upgradeBatchId:batchId},{merge:true});
  }

  // 先清除目前 7/8/9 年級 class docs，再依舊快照建立升級後班級
  for(const c of oldClasses)await deleteDoc(doc(db,'classes',c.id));
  for(const c of oldClasses){
    const g=gradeFromClassId(c.id),active=(c.students||[]).filter(s=>s.active!==false);
    if(g<9){
      const target=promotedClassId(c.id);
      const students=(c.students||[]).map(s=>({...s,id:s.studentId||s.id,studentId:s.studentId||s.id,active:s.active!==false,joinedSchoolYear:p.toYear}));
      await setDoc(doc(db,'classes',target),{classId:target,students,roleAssignments:{},schoolYear:p.toYear,updatedAt:serverTimestamp()},{merge:false});
      for(const s of active){
        const sid=s.studentId||s.id;
        await setDoc(doc(db,'studentDirectory',sid),{currentClassId:target,currentSeat:Number(s.seat),grade:g+1,status:'enrolled',active:true,updatedAt:serverTimestamp()},{merge:true});
        await setDoc(doc(db,'studentEnrollments',`${p.toYear}__${sid}`),{studentId:sid,schoolYear:p.toYear,semester:`${p.toYear}-1`,classId:target,grade:g+1,seat:Number(s.seat),displayName:s.name,email:s.email||'',status:'active',upgradeBatchId:batchId,updatedAt:serverTimestamp()},{merge:true});
      }
    }else{
      for(const s of active){
        const sid=s.studentId||s.id;
        await setDoc(doc(db,'studentDirectory',sid),{status:'graduated',active:false,graduationSchoolYear:p.fromYear,updatedAt:serverTimestamp()},{merge:true});
        await setDoc(doc(db,'studentEnrollments',`${p.fromYear}__${sid}`),{status:'graduated',graduatedAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
      }
    }
  }
  // 導師管理員班級跟著升級；原九年級導師清空導師班，等待新學年重新指定
  for(const u of users.filter(x=>x.type==='admin'&&x.adminScope==='class')){
    const old=String((u.adminClassIds||[])[0]||u.homeroomClassId||'');if(!old)continue;
    const g=gradeFromClassId(old),next=g&&g<9?promotedClassId(old):'';
    adminChanges.push({uid:u.uid,oldClassId:old,newClassId:next});
    await setDoc(doc(db,'users',u.uid),{adminClassIds:next?[next]:[],homeroomClassId:next||null,updatedAt:serverTimestamp()},{merge:true});
  }
  // 最高管理員自己的導師模式也升級
  const myHome=homeroomClassId(),myGrade=gradeFromClassId(myHome);
  if(myGrade){
    const next=myGrade<9?promotedClassId(myHome):'';
    adminChanges.push({uid:me.uid,oldClassId:myHome,newClassId:next});
    await setDoc(doc(db,'users',me.uid),{homeroomClassId:next||null,updatedAt:serverTimestamp()},{merge:true});
    me.homeroomClassId=next||null;
  }
  // 舊學期自行建立任課班封存
  for(const sm of subjectManagers.filter(x=>String(x.semester||'').startsWith(`${p.fromYear}-`)&&x.status==='active')){
    await setDoc(doc(db,'subjectClassManagers',sm.id),{status:'archived',archivedAt:serverTimestamp(),upgradeBatchId:batchId,updatedAt:serverTimestamp()},{merge:true});
  }
  const newSemester=`${p.toYear}-1`,history=[...new Set([...semesterHistory,currentSemester,newSemester])];
  await setDoc(doc(db,'settings','system'),{currentSemester:newSemester,semesterHistory:history,updatedAt:serverTimestamp()},{merge:true});
  await setDoc(doc(db,'upgradeBatches',batchId),{fromSchoolYear:p.fromYear,toSchoolYear:p.toYear,previousSemester:prevSemester,newSemester,status:'completed',adminChanges,createdBy:me.uid,createdByName:me.displayName||'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:false});
  currentSemester=newSemester;semesterHistory=history;recordSemester=newSemester;
  await audit('school_year_upgrade','upgradeBatches',batchId,`${p.fromYear} → ${p.toYear} 學年升級完成；九年級畢業、舊班級已快照`,newSemester);
  await refreshAll();renderUpgrade();alert(`✅ ${p.fromYear} → ${p.toYear} 學年升級完成。\n舊資料仍可從「歷史資料」查詢。`);
}
async function undoSchoolYearUpgrade(batchId){
  if(!isGlobalAdmin())return;
  const ub=upgradeBatches.find(x=>x.id===batchId);if(!ub||ub.status!=='completed')return alert('這筆升級無法還原。');
  const prefix=`${ub.toSchoolYear}-`;
  const hasNew=collections.some(x=>String(x.semester||'').startsWith(prefix))||assessments.some(x=>String(x.semester||'').startsWith(prefix));
  if(hasNew)return alert(`⚠️ ${ub.toSchoolYear} 學年已經有作業或成績正式資料。\n\n為避免誤刪新資料，系統停止整批還原。請改用個別修正。`);
  if(!confirm(`確定安全還原 ${ub.fromSchoolYear} → ${ub.toSchoolYear}？\n\n目前檢查不到新學年作業／成績，將恢復升級前班級與九年級在校狀態。`))return;
  const snapshots=classRosterHistory.filter(x=>x.schoolYear===ub.fromSchoolYear&&x.upgradeBatchId===batchId);
  // 移除目前年級班級
  for(const c of classes.filter(c=>gradeFromClassId(c.id)))await deleteDoc(doc(db,'classes',c.id));
  for(const s of snapshots){
    await setDoc(doc(db,'classes',s.classId),{classId:s.classId,students:s.students||[],roleAssignments:s.roleAssignments||{},schoolYear:ub.fromSchoolYear,updatedAt:serverTimestamp()},{merge:false});
    for(const st of (s.students||[])){
      const sid=st.studentId||st.id;
      await setDoc(doc(db,'studentDirectory',sid),{currentClassId:s.classId,currentSeat:Number(st.seat),grade:gradeFromClassId(s.classId),status:st.active===false?'transferred':'enrolled',active:st.active!==false,graduationSchoolYear:null,updatedAt:serverTimestamp()},{merge:true});
      const toEnroll=`${ub.toSchoolYear}__${sid}`;const exists=await safeDoc(doc(db,'studentEnrollments',toEnroll));if(exists)await deleteDoc(doc(db,'studentEnrollments',toEnroll));
      await setDoc(doc(db,'studentEnrollments',`${ub.fromSchoolYear}__${sid}`),{status:st.active===false?'transferred':'active',updatedAt:serverTimestamp()},{merge:true});
    }
  }
  for(const ch of (ub.adminChanges||[])){
    const target=users.find(x=>x.uid===ch.uid);
    const payload={homeroomClassId:ch.oldClassId||null,updatedAt:serverTimestamp()};
    if(target?.adminScope==='class')payload.adminClassIds=ch.oldClassId?[ch.oldClassId]:[];
    await setDoc(doc(db,'users',ch.uid),payload,{merge:true});
  }
  for(const sm of subjectManagers.filter(x=>x.upgradeBatchId===batchId&&x.status==='archived')){
    await setDoc(doc(db,'subjectClassManagers',sm.id),{status:'active',archivedAt:null,upgradeBatchId:null,updatedAt:serverTimestamp()},{merge:true});
  }
  await setDoc(doc(db,'settings','system'),{currentSemester:ub.previousSemester,updatedAt:serverTimestamp()},{merge:true});
  await setDoc(doc(db,'upgradeBatches',batchId),{status:'reverted',revertedBy:me.uid,revertedAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
  currentSemester=ub.previousSemester;recordSemester=currentSemester;
  await audit('undo_school_year_upgrade','upgradeBatches',batchId,`安全還原 ${ub.fromSchoolYear} → ${ub.toSchoolYear}`,currentSemester);
  await refreshAll();renderUpgrade();alert('✅ 已安全還原到升級前狀態。');
}

function parseClassList(raw,grade){
  const arr=[...new Set(String(raw||'').split(/[\s,，、;；]+/).map(x=>x.trim()).filter(Boolean))];
  for(const id of arr){
    if(!/^\d{3}$/.test(id)||Number(id.charAt(0))!==Number(grade)){
      throw new Error(`${grade}年級班級「${id}」格式不正確，請輸入例如 ${grade}01、${grade}02。`);
    }
  }
  return arr.sort();
}
