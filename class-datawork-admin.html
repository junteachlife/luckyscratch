<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>班級工作回報－管理後台</title>

<link
  rel="icon"
  href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>"
>

<style>
/* =========================================================
   海洋冒險風格
========================================================= */
:root{
  --sky:#58bdf5;
  --sky2:#d9f4ff;
  --sea:#137fd1;
  --deep:#0d5e9d;

  --wood:#55321e;
  --wood2:#7c4b2d;
  --wood3:#3f2416;

  --paper:#fff7df;
  --paper2:#f9e4b6;
  --paper3:#f2cf86;

  --ink:#402819;
  --muted:#7a654f;

  --blue:#1687ec;
  --green:#19b56b;
  --orange:#f79b1e;
  --red:#ef4c5c;
  --purple:#9068e8;

  --line:#dfc799;
  --shadow:0 8px 22px rgba(67,40,20,.18);
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    system-ui,
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.9),transparent 18%),
    radial-gradient(circle at 85% 5%,rgba(255,255,255,.8),transparent 15%),
    linear-gradient(
      180deg,
      #43b7f4 0,
      #a9e4ff 30%,
      #eefaff 58%,
      #dff4ff 100%
    );
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  touch-action:manipulation;
}

.hidden{
  display:none!important;
}


/* =========================================================
   登入
========================================================= */
.login-shell{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}

.login-shell::before{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:-80px;
  height:240px;
  background:
    radial-gradient(
      ellipse at center,
      #2a9edb 0,
      #1277bd 48%,
      #075a98 100%
    );
  border-radius:50% 50% 0 0;
}

.login-card{
  position:relative;
  z-index:2;
  width:min(460px,100%);
  padding:28px;
  border:3px solid #8b592e;
  border-radius:18px;

  background:
    linear-gradient(
      rgba(255,249,226,.96),
      rgba(248,222,166,.96)
    );

  box-shadow:
    0 16px 45px rgba(31,55,78,.3),
    inset 0 0 0 4px rgba(255,255,255,.45);
}

.login-card::before{
  content:"⚓";
  position:absolute;
  right:20px;
  top:14px;
  font-size:48px;
  opacity:.12;
}

.login-brand{
  font-size:27px;
  font-weight:900;
  color:#55301c;
  margin-bottom:6px;
}

.login-sub{
  color:#806448;
  margin-bottom:18px;
}

.login-slogan{
  text-align:center;
  font-weight:800;
  color:#805629;
  margin-top:18px;
}


/* =========================================================
   主架構
========================================================= */
#appView{
  min-height:100vh;
}

.app-layout{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  min-height:100vh;
}


/* =========================================================
   左側木質選單
========================================================= */
.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  padding:18px 12px;

  color:white;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.025) 0 2px,
      rgba(0,0,0,.04) 2px 5px
    ),
    linear-gradient(
      90deg,
      var(--wood3),
      var(--wood2) 55%,
      #4e2d1c
    );

  border-right:5px solid #9c6b37;

  box-shadow:
    8px 0 24px rgba(35,22,14,.2);

  overflow:auto;
  z-index:20;
}

.sidebar-title{
  text-align:center;
  padding:14px 8px 18px;
  border-bottom:1px solid rgba(255,255,255,.17);
  margin-bottom:12px;
}

.wheel{
  font-size:46px;
  line-height:1;
  margin-bottom:6px;
}

.sidebar-title b{
  font-size:19px;
}

.sidebar-sub{
  font-size:12px;
  color:#f9d7a4;
  margin-top:5px;
}

.nav{
  display:grid;
  gap:8px;
}

.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;

  border:1px solid transparent;
  border-radius:9px;

  padding:12px 12px;

  color:#fff8ea;
  background:transparent;

  cursor:pointer;
  font-weight:800;
  font-size:15px;

  transition:.18s;
}

.nav button:hover{
  background:rgba(255,255,255,.1);
}

.nav button.active{
  background:
    linear-gradient(
      180deg,
      #2197f1,
      #1072cf
    );

  border-color:#8dd5ff;

  box-shadow:
    0 4px 10px rgba(0,78,145,.35),
    inset 0 1px 0 rgba(255,255,255,.3);
}

.nav-icon{
  width:26px;
  text-align:center;
  font-size:21px;
}

.sidebar-quote{
  margin-top:20px;
  padding:13px;

  color:#5c381c;
  text-align:center;
  line-height:1.7;
  font-weight:800;

  background:
    linear-gradient(
      #fff3c9,
      #eac57f
    );

  border:2px solid #9a6533;
  border-radius:8px;

  transform:rotate(-1deg);

  box-shadow:0 5px 12px rgba(0,0,0,.2);
}


/* =========================================================
   右側
========================================================= */
.main-area{
  min-width:0;
}


/* =========================================================
   航海天空 Header
========================================================= */
.hero{
  min-height:176px;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  padding:24px 32px;

  background:
    radial-gradient(
      circle at 76% -25%,
      #fff7aa 0,
      rgba(255,245,161,.45) 13%,
      transparent 30%
    ),
    linear-gradient(
      165deg,
      #1f9ff0 0,
      #60c5f8 55%,
      #d5f4ff 100%
    );

  border-bottom:5px solid #b47736;
}

.hero::after{
  content:"🌊  🌊  🌊  🌊  🌊";
  position:absolute;
  left:0;
  right:0;
  bottom:-17px;

  font-size:58px;
  letter-spacing:28px;
  opacity:.22;
  white-space:nowrap;
}

.hero-sign{
  position:relative;
  z-index:2;

  max-width:710px;

  padding:17px 24px;

  background:
    linear-gradient(
      180deg,
      #fff7d8,
      #f4d59a
    );

  border:3px solid #996431;
  border-radius:12px;

  box-shadow:
    0 7px 0 #76451f,
    0 15px 26px rgba(50,67,87,.23);

  transform:rotate(-.5deg);
}

.hero-title{
  font-size:31px;
  font-weight:950;
  letter-spacing:2px;
  color:#482a19;
}

.hero-sub{
  margin-top:7px;
  color:#795231;
  font-weight:800;
}

.hero-user{
  position:relative;
  z-index:2;

  min-width:190px;

  padding:12px 15px;

  border-radius:13px;

  background:rgba(255,255,255,.92);

  box-shadow:0 6px 17px rgba(24,85,132,.25);

  border:2px solid rgba(255,255,255,.85);
}

.user-name{
  font-weight:900;
}

.semester-badge{
  display:inline-block;

  margin-top:6px;

  background:#e5f3ff;
  color:#176baf;

  padding:4px 9px;

  border-radius:999px;
  font-size:12px;
  font-weight:850;
}

.header-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap;
}


/* =========================================================
   工作區
========================================================= */
.content{
  padding:18px 20px 38px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:14px;

  font-size:22px;
  font-weight:950;
}

.page-title::before{
  content:"☸️";
  font-size:27px;
}


/* =========================================================
   羊皮紙卡
========================================================= */
.card{
  position:relative;

  background:
    linear-gradient(
      180deg,
      rgba(255,252,237,.98),
      rgba(255,246,216,.98)
    );

  border:2px solid #d5ae6e;
  border-radius:13px;

  padding:16px;

  box-shadow:var(--shadow);
}

.card::after{
  content:"";
  pointer-events:none;
  position:absolute;
  inset:3px;
  border:1px solid rgba(143,96,44,.13);
  border-radius:9px;
}

.section-title{
  font-size:20px;
  font-weight:950;
  margin-bottom:10px;
  color:#51311e;
}


/* =========================================================
   統計卡
========================================================= */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
  margin-bottom:16px;
}

.dashboard-stat{
  min-height:128px;
  overflow:hidden;

  border-radius:13px;
  padding:17px;

  background:#fff;
  border:2px solid;

  box-shadow:0 6px 14px rgba(55,71,95,.1);

  position:relative;
}

.dashboard-stat::after{
  position:absolute;
  right:-5px;
  bottom:-14px;
  font-size:62px;
  opacity:.13;
}

.stat-blue{
  border-color:#80c8f7;
  background:linear-gradient(145deg,#fff,#e8f6ff);
}

.stat-blue::after{
  content:"👥";
}

.stat-green{
  border-color:#86dfae;
  background:linear-gradient(145deg,#fff,#ebfff3);
}

.stat-green::after{
  content:"✅";
}

.stat-orange{
  border-color:#ffc167;
  background:linear-gradient(145deg,#fff,#fff4dd);
}

.stat-orange::after{
  content:"⏳";
}

.stat-purple{
  border-color:#aaa0f3;
  background:linear-gradient(145deg,#fff,#f3efff);
}

.stat-purple::after{
  content:"🚩";
}

.stat-label{
  font-weight:800;
  color:#50463c;
}

.stat-number{
  display:block;
  margin-top:3px;

  font-size:34px;
  line-height:1.05;
  font-weight:950;
}

.stat-blue .stat-number{
  color:#126bc3;
}

.stat-green .stat-number{
  color:#0c8850;
}

.stat-orange .stat-number{
  color:#d3670a;
}

.stat-purple .stat-number{
  color:#6852c5;
}

.stat-msg{
  margin-top:8px;
  color:#796d62;
  font-size:13px;
  font-weight:700;
}


/* =========================================================
   元件
========================================================= */
.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.grid{
  display:grid;
  gap:12px;
}

.g4{
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin:10px 0;
}

.btn{
  border:0;
  border-radius:9px;

  padding:9px 13px;

  cursor:pointer;
  font-weight:850;

  transition:.15s;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 2px 5px rgba(60,47,36,.12);
}

.btn:hover{
  transform:translateY(-1px);
}

.primary{
  color:#fff;
  background:linear-gradient(#2197f4,#1175cf);
}

.gray{
  color:#55483c;
  background:linear-gradient(#f9f6ef,#e8dfcf);
  border:1px solid #cdbd9e;
}

.good{
  color:white;
  background:linear-gradient(#27c67a,#13a75f);
}

.warn{
  color:#fff;
  background:linear-gradient(#ffad35,#ec8613);
}

.danger{
  color:white;
  background:linear-gradient(#f35e6e,#dc364d);
}

.small{
  font-size:13px;
  padding:7px 9px;
}

.field{
  display:grid;
  gap:5px;
  margin:10px 0;
}

.field label{
  font-weight:800;
  color:#61462e;
}

.field input,
.field select,
.field textarea,
.toolbar input,
.toolbar select{
  width:100%;
  border:1px solid #c8a979;
  border-radius:8px;
  padding:9px 10px;

  background:#fffdf5;
  color:#422c1e;

  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus,
.toolbar input:focus,
.toolbar select:focus{
  border-color:#3899df;
  box-shadow:0 0 0 3px rgba(56,153,223,.13);
}

.notice{
  padding:11px 13px;
  border-radius:9px;

  background:#fff0c9;
  color:#80531f;

  border-left:5px solid #e99c2d;

  margin:10px 0;
}

.notice.success,
.success{
  background:#e4f9eb;
  color:#087540;
  border-color:#19ad64;
}

.notice.error,
.error{
  background:#ffe5e7;
  color:#aa2937;
  border-color:#dc4052;
}

.sub,
.meta{
  color:#7f6c57;
  font-size:13px;
}


/* =========================================================
   資料項目
========================================================= */
.item{
  position:relative;

  border:1px solid #dfc693;
  border-radius:10px;

  padding:13px;
  margin:9px 0;

  background:rgba(255,255,255,.63);
}

.item:hover{
  background:rgba(255,255,255,.85);
}

.item-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.item-head b{
  font-size:16px;
}

.pill{
  display:inline-block;
  padding:4px 9px;
  border-radius:999px;

  font-size:12px;
  font-weight:850;

  background:#eee6da;
  color:#5f5246;
}

.pill.good{
  background:#d9f7e7;
  color:#087747;
}

.pill.warn{
  background:#fff0ce;
  color:#b1650c;
}

.pill.bad{
  background:#ffe0e3;
  color:#b02b3a;
}


/* =========================================================
   表格
========================================================= */
.table-wrap{
  overflow:auto;

  border:1px solid #d8bd8d;
  border-radius:10px;

  background:#fffdf6;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,
td{
  padding:9px 10px;
  border-bottom:1px solid #ead9b9;
  text-align:left;
  vertical-align:top;
  font-size:14px;
}

th{
  position:sticky;
  top:0;
  z-index:1;

  color:#55351f;

  background:
    linear-gradient(
      #f5dbab,
      #e9c787
    );
}

tbody tr:nth-child(even){
  background:#fffaf0;
}


/* =========================================================
   班級 / 學生
========================================================= */
.student-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:7px;
}

.student{
  border:1px solid #dcc396;
  border-radius:9px;
  padding:8px;
  background:#fffdf7;
}

.student select,
.student input{
  width:100%;
  padding:7px;
  border:1px solid #ccb286;
  border-radius:7px;
  margin-top:5px;
  background:#fff;
}

.assign{
  background:#fff9e9;
  border:1px solid #e1c799;
  padding:8px 10px;
  border-radius:8px;
  margin:6px 0;
}

.role-row{
  display:grid;
  grid-template-columns:minmax(150px,1fr) minmax(180px,1.4fr);
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px dashed #dfc89e;
}

.role-row select{
  width:100%;
  padding:8px;
  border:1px solid #ccb184;
  border-radius:7px;
  background:#fffef9;
}

.late-note{
  color:#d72638;
  font-weight:900;
  font-size:13px;
  margin-top:5px;
}

.lock-note{
  color:#7d6d5b;
  font-size:12px;
  margin-top:4px;
}


/* =========================================================
   鼓勵區
========================================================= */
.encouragement{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:14px;
  margin-top:14px;
}

.quote-card{
  position:relative;

  padding:20px;

  min-height:130px;

  border-radius:12px;

  background:
    radial-gradient(circle at 86% 50%,rgba(255,255,255,.9),transparent 25%),
    linear-gradient(135deg,#fff2c9,#f1cd8b);

  border:2px solid #b98949;
  box-shadow:var(--shadow);
}

.quote-card::after{
  content:"🧭";
  position:absolute;
  right:20px;
  bottom:12px;
  font-size:64px;
  opacity:.18;
}

.quote-main{
  font-size:20px;
  font-weight:950;
  line-height:1.65;
}

.quote-sub{
  margin-top:5px;
  color:#765638;
  font-size:13px;
}

.ship-card{
  display:flex;
  align-items:center;
  justify-content:center;

  min-height:130px;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #a9e4ff 0,
      #e8f8ff 60%,
      #87cff0 60%,
      #2b9dd4 100%
    );

  border:2px solid #5aa9d5;

  font-size:67px;

  box-shadow:var(--shadow);
}


/* =========================================================
   Modal
========================================================= */
.modal{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:14px;

  background:rgba(35,24,17,.62);
  backdrop-filter:blur(3px);
}

.modal-card{
  width:min(980px,100%);
  max-height:92vh;
  overflow:auto;

  padding:17px;

  background:
    linear-gradient(#fff9e7,#f8e2b7);

  border:3px solid #88562d;
  border-radius:14px;

  box-shadow:0 20px 55px rgba(0,0,0,.35);
}


/* =========================================================
   手機
========================================================= */
.mobile-menu{
  display:none;
}

@media(max-width:900px){

  .app-layout{
    display:block;
  }

  .sidebar{
    position:relative;
    height:auto;

    border-right:0;
    border-bottom:4px solid #9c6b37;
  }

  .sidebar-title{
    display:none;
  }

  .nav{
    display:flex;
    overflow:auto;
    padding-bottom:4px;
  }

  .nav button{
    flex:0 0 auto;
    width:auto;
    white-space:nowrap;
  }

  .sidebar-quote{
    display:none;
  }

  .hero{
    min-height:auto;
    padding:17px;
    flex-direction:column;
    align-items:stretch;
  }

  .hero-title{
    font-size:24px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .two,
  .encouragement{
    grid-template-columns:1fr;
  }

}

@media(max-width:560px){

  .content{
    padding:12px;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .hero-title{
    font-size:21px;
  }

  .hero-sign{
    padding:13px;
  }

  .dashboard-stat{
    min-height:110px;
  }

  .role-row{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<!-- ======================================================
     登入
====================================================== -->
<section id="loginView" class="login-shell">

  <div class="login-card">

    <div class="login-brand">
      ⚓ 班級工作回報－管理後台
    </div>

    <div class="login-sub">
      導師專屬航海指揮中心
    </div>

    <div id="loginMsg"></div>

    <div class="field">
      <label>管理員帳號／Email</label>
      <input
        id="loginUser"
        autocomplete="username"
      >
    </div>

    <div class="field">
      <label>密碼</label>

      <input
        id="loginPass"
        type="password"
        autocomplete="current-password"
      >
    </div>

    <button
      id="loginBtn"
      class="btn primary"
      style="width:100%;font-size:16px"
    >
      ⛵ 登入管理後台
    </button>

    <div class="login-slogan">
      航向更好的班級！每一份努力，都讓未來更閃亮！
    </div>

  </div>

</section>


<!-- ======================================================
     主程式
====================================================== -->
<main
  id="appView"
  class="hidden"
>

<div class="app-layout">

  <!-- 左側 -->
  <aside class="sidebar">

    <div class="sidebar-title">

      <div class="wheel">
        ☸️
      </div>

      <b>
        班級航海管理站
      </b>

      <div class="sidebar-sub">
        一起航向更棒的班級！
      </div>

    </div>


    <div class="nav">

      <button
        class="active"
        data-page="dashboard"
      >
        <span class="nav-icon">🏠</span>
        總覽／學期
      </button>

      <button data-page="roles">
        <span class="nav-icon">📜</span>
        職務派發總表
      </button>

      <button data-page="records">
        <span class="nav-icon">📝</span>
        收繳／成績

function esc(v=""){

  return String(v)
    .replace(
      /[&<>"]/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[m])
    );

}


function emailFor(v){

}


function msg(

  c="notice"

}


function randomPwd(){

  const c=
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

  return Array.from(
    {length:8},
    ()=>
      c[
        Math.floor(
          Math.random()*c.length
        )
      ]
  )
  .join("");

}

}


function dictLabel(
  list,
  v
){

  return(
    list.find(
      x=>x[0]===v
    )
    ||
    [v,v]
  )[1];

}


function hasScore(r){

  return r
    &&
    r.score!==null
    &&
    r.score!==""
    &&
    Number.isFinite(
      Number(r.score)
    );

}


function computeAccess(
  assignments=[],
  semester=currentSemester
){

  const viewKeys=[];
  const collectionWriteKeys=[];
  const scoreWriteKeys=[];
  const classAccess=[];


  assignments
    .filter(
      a=>
        a.semester===semester
    )
    .forEach(
      a=>{

        const key=
          scopeKey(a);


        if(
          !viewKeys.includes(key)
        ){
          viewKeys.push(key);
        }


        if(
          a.canCollection
          &&
          !collectionWriteKeys.includes(key)
        ){
          collectionWriteKeys.push(key);
        }


        if(
          a.canScores
          &&
          !scoreWriteKeys.includes(key)
        ){
          scoreWriteKeys.push(key);
        }


        if(
          !classAccess.includes(
            a.classId
          )
        ){
          classAccess.push(
            a.classId
          );
        }

      }
    );


  return{
    viewKeys,
    collectionWriteKeys,
    scoreWriteKeys,
    classAccess
  };

}

async function ensureSystemSettings(){

  const ref=
    doc(
      db,
      "settings",
      "system"
    );


  const snap=
    await getDoc(ref);


  if(!snap.exists()){

    await setDoc(
      ref,
      {

        currentSemester:
          "115-1",

        semesterHistory:[
          "115-1"
        ],

        updatedAt:
          serverTimestamp()

      }
    );


    currentSemester=
      "115-1";


    semesterHistory=[
      "115-1"
    ];

  }else{

    const data=
      snap.data();


    currentSemester=
      data.currentSemester
      ||
      "115-1";


    semesterHistory=
      Array.isArray(
        data.semesterHistory
      )
      &&
      data.semesterHistory.length
        ?data.semesterHistory
        :[
            currentSemester
          ];


    if(
      !semesterHistory.includes(
        currentSemester
      )
    ){

      semesterHistory.push(
        currentSemester
      );

    }

  }


  recordSemester=
    currentSemester;


  $("#semesterBadge")
    .textContent=
      `本學期 ${currentSemester}`;

}

async function changeCurrentSemester(){

  const semester=
    $("#newSemester")
      .value
      .trim();


  if(
    !/^\d{2,3}-[12]$/
      .test(semester)
  ){

    return alert(
      "學期格式請使用例如 115-1 或 115-2。"
    );

  }


  if(
    semester===currentSemester
  ){

    return alert(
      "目前已經是這個學期。"
    );

  }


  if(
    !confirm(
      `確定將目前學期改成 ${semester}？`
    )
  ){

    return;

  }


  const old=
    currentSemester;


  const history=[
    ...new Set(
      [
        ...semesterHistory,
        old,
        semester
      ]
    )
  ];


  await setDoc(
    doc(
      db,
      "settings",
      "system"
    ),
    {

      currentSemester:
        semester,

      semesterHistory:
        history,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  currentSemester=
    semester;


  semesterHistory=
    history;


  recordSemester=
    semester;


  await recalcAllAccess();


  await audit(
    "change_semester",
    "settings",
    "system",
    `${old} → ${semester}`,
    semester
  );


  $("#semesterBadge")
    .textContent=
      `本學期 ${semester}`;


  await refreshAll();

}


async function recalcAllAccess(){

  for(
    const user
    of users.filter(
      x=>x.type!=="admin"
    )
  ){

    const access=
      computeAccess(
        user.assignments||[],
        currentSemester
      );


    await updateDoc(
      doc(
        db,
        "users",
        user.uid
      ),
      {

        ...access,

        updatedAt:
          serverTimestamp()

      }
    );


    Object.assign(
      user,
      access
    );

  }

}

function getRosterForClass(
  classId
){

  const found=
    classes.find(
      x=>x.id===classId

  if(
    found
    &&
    Array.isArray(
      found.students
    )
  ){

    return found.students;

  }


  return(
    defaultRosters[classId]
    ||
    []
  )
  .map(
    (
      [
        seat,
        name
      ]
    )=>({
      id:String(seat),
      seat,
      name
    })
  );

}


function studentUserFor(
  classId,
  seat
){

  const username=

      .toLowerCase();


  return users.find(

        user.username||""

      .toLowerCase()
      ===username

}

async function saveRoleTable(){

  const classId=
    $("#roleClass").value;


  const semester=
    $("#roleSemester").value;


  if(
    !confirm(
      `確定儲存 ${classId} 班 ${semester} 的職務表？`
    )
  ){

    return;

  }


  const selections=
    $$(".role-select")
      .map(
        select=>({
          uid:select.value,
          kind:select.dataset.kind,
          scopeType:select.dataset.type,
          scopeName:select.dataset.name
        })
      );


  const roleKeys=
    new Set(
      standardRoles.map(
        role=>
          `${role.kind}|${role.scopeType}|${role.scopeName}`
      )
    );


  for(
    const user
    of users.filter(
      x=>x.type==="student"
    )
  ){

    let assignments=
      (
        user.assignments
        ||
        []
      )
      .filter(
        assignment=>
          !(
            assignment.semester===semester
            &&
            assignment.classId===classId
            &&
            roleKeys.has(
              `${assignment.kind}|${assignment.scopeType}|${assignment.scopeName}`
            )
          )
      );


    selections
      .filter(
        x=>x.uid===user.uid
      )
      .forEach(
        selection=>{

          const base=
            standardRoles.find(
              role=>
                role.kind===selection.kind
                &&
                role.scopeType===selection.scopeType
                &&
                role.scopeName===selection.scopeName
            );


          assignments.push({
            semester,
            classId,
            kind:selection.kind,
            scopeType:selection.scopeType,
            scopeName:selection.scopeName,
            canCollection:base.canCollection,
            canScores:base.canScores
          });

        }
      );


    const access=
      computeAccess(
        assignments,
        currentSemester
      );


    await updateDoc(
      doc(
        db,
        "users",
        user.uid
      ),
      {

        assignments,

        ...access,

        updatedAt:
          serverTimestamp()

      }
    );


    user.assignments=
      assignments;


    Object.assign(
      user,
      access
    );

  }


  await audit(
    "save_role_table",
    "roles",
    `${semester}-${classId}`,
    `儲存 ${semester} ${classId} 職務表`,
    semester
  );


  alert(
    "✅ 職務派發已儲存！新的航海任務準備出發！"
  );


  renderRoleTable();

}

   CONFIRM
========================================================= */

async function confirmRecord(
  type,
  id
){

  const collectionName=
    type==="collection"
      ?"collectionItems"
      :"assessments";


  const source=
    type==="collection"
      ?collections
      :assessments;


  const record=
    source.find(
      x=>x.id===id
    );


  if(!record){

    return alert(
      "找不到這筆資料。"
    );

  }


  const confirming=
    record.reviewStatus!=="confirmed";


  if(
    !confirm(
      confirming
        ?
          (
            type==="collection"
            ?`確定確認「${record.itemName}」？

確認後：
• 已繳、免繳鎖定
• 未繳、補交仍可修改
• 後續改為已繳會標記「已繳交（遲交）」`
            :
            `確定確認「${record.name}」？

確認後：
• 已有成績鎖定
• 無成績仍可補登
• 已有成績需解鎖後才能修改`
          )
        :
          `確定取消確認？取消後全部恢復可修改。`
    )
  ){

    return;

  }


  if(type==="collection"){

    const lockedRecords={};


    if(confirming){

      Object.entries(
        record.records||{}
      )
      .forEach(
        (
          [
            studentId,
            status
          ]
        )=>{

          lockedRecords[studentId]=
            status==="submitted"
            ||
            status==="exempt";

        }
      );

    }


    await updateDoc(
      doc(
        db,
        collectionName,
        id
      ),
      {

        reviewStatus:
          confirming
            ?"confirmed"
            :"pending",

        locked:false,

        lockedRecords:
          confirming
            ?lockedRecords
            :{},

        confirmedBy:
          confirming
            ?auth.currentUser.uid
            :null,

        confirmedByName:
          confirming
            ?(
                me.displayName
                ||
                me.username
              )
            :null,

        confirmedAt:
          confirming
            ?serverTimestamp()
            :null,

        updatedAt:
          serverTimestamp()

      }
    );

  }else{

    const scoreLocks={};


    if(confirming){

      Object.entries(
        record.scores||{}
      )
      .forEach(
        (
          [
            studentId,
            score
          ]
        )=>{

          scoreLocks[studentId]=
            hasScore(score);

        }
      );

    }


    await updateDoc(
      doc(
        db,
        collectionName,
        id
      ),
      {

        reviewStatus:
          confirming
            ?"confirmed"
            :"pending",

        locked:false,

        scoreLocks:
          confirming
            ?scoreLocks
            :{},

        confirmedBy:
          confirming
            ?auth.currentUser.uid
            :null,

        confirmedByName:
          confirming
            ?(
                me.displayName
                ||
                me.username
              )
            :null,

        confirmedAt:
          confirming
            ?serverTimestamp()
            :null,

        updatedAt:
          serverTimestamp()

      }
    );

  }


  await audit(
    confirming
      ?"confirm"
      :"unconfirm",
    type,
    id,
    `${confirming?"確認":"取消確認"}：${record.itemName||record.name}`,
    record.semester||currentSemester
  );


  await refreshAll();

}

                    ${

                        ?"disabled"
                        :""
                    }
                  >

                    ${
                      statusOptions.map(
                        (
                          [
                            valueCode,
                            label
                          ]
                        )=>`

                          <option
                            value="${valueCode}"
                            ${
                              valueCode===value
                                ?"selected"
                                :""
                            }
                          >
                            ${label}
                          </option>

                      )
                      .join("")
                    }

                  </select>


                  ${
                    late
                      ?`
                        <div class="late-note">
                          🔴 已繳交（遲交）
                        </div>
                      `
                      :""
                  }


                  ${
                    locked
                      ?`
                        <div class="lock-note">
                          🔒 已確認鎖定
                        </div>
                      `
                      :""
                  }

                </div>
              `;

        }

        <button
          class="btn primary save-modal"
        >
          💾 儲存修改
        </button>

      </div>
    `;

  }else{

    const confirmed=
      record.reviewStatus==="confirmed";


    html+=`

      <div class="notice">

        ${
          confirmed
            ?"✅ 已確認：已有成績鎖定；尚未登記成績仍可補登。"
            :"⏳ 尚未確認：目前所有成績皆可修改。"
        }

      </div>


      <div class="student-grid">

        ${
          roster.map(
            student=>{

              const studentId=
                student.id
                ||
                String(
                  student.seat
                );


              const score=
                (
                  record.scores
                  ||
                  {}
                )[studentId]
                ||
                {};


              const locked=
                confirmed
                &&
                !!(
                  record.scoreLocks
                  ||
                  {}
                )[studentId];


              return`

                <div class="student">

                  <b>
                    ${student.seat}.
                    ${esc(student.name)}
                  </b>


                  <input
                    class="m-score"
                    data-id="${esc(studentId)}"
                    type="number"
                    inputmode="decimal"
                    value="${score.score??""}"
                    min="0"
                    max="${record.maxScore}"
                    ${
                      locked
                        ?"disabled"
                        :""
                    }
                  >


                  <select
                    class="m-status"
                    data-id="${esc(studentId)}"
                    ${
                      locked
                        ?"disabled"
                        :""
                    }
                  >

                    ${
                      scoreStatusOptions.map(
                        (
                          [
                            valueCode,
                            label
                          ]
                        )=>`

                          <option
                            value="${valueCode}"
                            ${
                              valueCode===
                              (
                                score.status
                                ||
                                "not_entered"
                              )
                                ?"selected"
                                :""
                            }
                          >
                            ${label}
                          </option>
                        `
                      )
                      .join("")
                    }

                  </select>


                  ${
                    locked
                      ?`
                        <button
                          class="btn warn small unlock-score-admin"
                          data-id="${esc(studentId)}"
                        >
                          🔓 解鎖修改
                        </button>
                      `
                      :
                      confirmed
                      &&
                      !hasScore(score)
                        ?`
                          <div class="lock-note">
                            ✏️ 尚未有成績，可補登
                          </div>
                        `
                        :""
                  }

                </div>
              `;

            }
          )
          .join("")
        }

      </div>


      <div class="toolbar">

        <button
          class="btn primary save-modal"
        >
          💾 儲存成績
        </button>

      </div>
    `;

  }


  showModal(html);


  if(type==="assessment"){

    $$(".unlock-score-admin")
      .forEach(
        button=>
          button.onclick=
          async()=>{

            const studentId=
              button.dataset.id;


            if(
              !confirm(
                "確定解鎖這位學生的成績？"
              )
            ){

              return;

            }


            const scoreLocks={
              ...(
                record.scoreLocks
                ||
                {}
              ),
              [studentId]:false
            };


            await updateDoc(
              doc(
                db,
                "assessments",
                id
              ),
              {

                scoreLocks,

                updatedAt:
                  serverTimestamp()

              }
            );


            record.scoreLocks=
              scoreLocks;


            await audit(
              "unlock_score",
              "assessment",
              id,
              `導師解鎖 ${record.name}｜座號 ${studentId}`,
              record.semester||currentSemester
            );


            editRecord(
              type,
              id
            );

          }
      );

  }


  $(".save-modal")
    .onclick=
    async()=>{

      if(type==="collection"){

        const records={
          ...(
            record.records
            ||
            {}
          )
        };


        const lateSubmitted={
          ...(
            record.lateSubmitted
            ||
            {}
          )
        };


        const lockedRecords={
          ...(
            record.lockedRecords
            ||
            {}
          )
        };


        const confirmed=
          record.reviewStatus==="confirmed";


        $$(".m-col")
          .forEach(
            select=>{

              if(select.disabled){

                return;
              }


              const studentId=
                select.dataset.id;


              const oldValue=
                select.dataset.old;


              const newValue=
                select.value;


              records[studentId]=
                newValue;


              if(
                confirmed
                &&
                (
                  oldValue==="missing"
                  ||
                  oldValue==="late"
                )
                &&
                newValue==="submitted"
              ){

                lateSubmitted[studentId]=
                  true;


                lockedRecords[studentId]=
                  true;

              }


              if(
                confirmed
                &&
                newValue==="exempt"
              ){

                lockedRecords[studentId]=
                  true;

              }

            }
          );


        await updateDoc(
          doc(
            db,
            "collectionItems",
            id
          ),
          {

            records,

            lateSubmitted,

            lockedRecords,

            updatedAt:
              serverTimestamp()

          }
        );

      }else{

        const scores={
          ...(
            record.scores
            ||
            {}
          )
        };


        const scoreLocks={
          ...(
            record.scoreLocks
            ||
            {}
          )
        };


        const confirmed=
          record.reviewStatus==="confirmed";


        for(
          const input
          of $$(".m-score")
        ){

          if(input.disabled){

            continue;
          }


          const studentId=
            input.dataset.id;


          const statusSelect=
            document.querySelector(
              `.m-status[data-id="${CSS.escape(studentId)}"]`
            );


          const score=
            input.value===""
              ?null
              :Number(
                  input.value
                );


          if(
            score!==null
            &&
            (
              score<0
              ||
              score>Number(
                record.maxScore
              )
            )
          ){

            return alert(
              `座號 ${studentId} 的成績超出範圍。`
            );

          }


          let status=
            statusSelect.value;


          if(
            score!==null
            &&
            status==="not_entered"
          ){

            status=
              "normal";

          }


          scores[studentId]={
            score,
            status
          };


          if(confirmed){

            scoreLocks[studentId]=
              score!==null;

          }

        }


        await updateDoc(
          doc(
            db,
            "assessments",
            id
          ),
          {

            scores,

            scoreLocks,

            updatedAt:
              serverTimestamp()

          }
        );

      }


      await audit(
        "admin_update",
        type,
        id,
        `導師修改：${record.itemName||record.name}`,
        record.semester||currentSemester
      );


      hideModal();


      await refreshAll();


      alert(
        "✅ 已儲存！又完成一項航海任務！"
      );

    };

}

async function deleteRecord(
  type,
  id
){

  const source=
    type==="collection"
      ?collections
      :assessments;


  const record=
    source.find(
      x=>x.id===id
    );


  if(!record){

    return;
  }


  if(
    !confirm(
      `確定刪除「${record.itemName||record.name}」？`
    )
  ){

    return;
  }


  await deleteDoc(
    doc(
      db,
      type==="collection"
        ?"collectionItems"
        :"assessments",
      id
    )
  );


  await audit(
    "delete",
    type,
    id,
    `管理員刪除：${record.itemName||record.name}`,
    record.semester||currentSemester
  );


  await refreshAll();

}

async function ensureXLSX(){

  if(window.XLSX){

    return;
  }


  await new Promise(
    (
      resolve,
      reject
    )=>{

      const script=
        document.createElement(
          "script"
        );


      script.src=
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";


      script.onload=
        resolve;


      script.onerror=
        ()=>reject(
          new Error(
            "Excel 元件載入失敗"
          )
        );


      document.head
        .appendChild(
          script
        );

    }
  );

}


async function downloadXlsx(
  filename,
  sheetName,
  rows
){

  try{

    await ensureXLSX();


    const worksheet=
      XLSX.utils.json_to_sheet(
        rows
      );


    const workbook=
      XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      sheetName
    );


    XLSX.writeFile(
      workbook,
      filename
    );

  }catch(e){

    alert(
      `Excel 下載失敗：${e.message}`
    );

  }

}

            classId,
            student.seat

            username.toLowerCase()
          );


        return`

          <label class="student">

            <input
              class="batch-check"
              type="checkbox"

                  ?"disabled"
                  :""
              }

              ${String(student.seat).padStart(2,"0")}

            </b>

            <div class="meta">

}

async function createAuthAndProfile(
  username,
  displayName,
  type,
  password
){

  let secondaryApp;


  try{

    secondaryApp=
      initializeApp(
        firebaseConfig,
        `secondary-${Date.now()}-${Math.random().toString(36).slice(2)}`
      );


    const secondaryAuth=
      getAuth(
        secondaryApp
      );


    const credential=
      await createUserWithEmailAndPassword(
        secondaryAuth,
        emailFor(username),
        password
      );


    await setDoc(
      doc(
        db,
        "users",
        credential.user.uid
      ),
      {

        username,
        displayName,
        type,

        active:true,

        assignments:[],

        viewKeys:[],
        collectionWriteKeys:[],
        scoreWriteKeys:[],
        classAccess:[],

        mustChangePassword:true,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );


    return{
      uid:credential.user.uid,
      username,
      displayName,
      password
    };

  }finally{

    if(secondaryApp){

      try{

        await deleteApp(
          secondaryApp
        );

      }catch{}

    }

  }

}

  try{

async function batchCreateAccounts(){

  const selected=
    $$(".batch-check:checked")
      .map(
        checkbox=>({
          username:checkbox.dataset.user,
          displayName:checkbox.dataset.name
        })
      );


  if(!selected.length){

    return alert(
      "請先勾選學生。"
    );

  }


  if(
    !confirm(
      `確定建立 ${selected.length} 個帳號？`
    )
  ){

    return;
  }


  const created=[];
  const failed=[];


  for(
    const student
    of selected
  ){

    const password=
      randomPwd();


    try{

      const result=
        await createAuthAndProfile(
          student.username,
          student.displayName,
          "student",
          password
        );


      created.push({
        ...student,
        password,
        uid:result.uid
      });

    }catch(e){

      failed.push({
        ...student,
        error:e.code||e.message
      });

    }

  }


  await refreshAll();


  showBatchResult(
    created,
    failed
  );

}


function showBatchResult(
  created,
  failed
){

  renderAccounts();


  const box=
    $("#batchResult");


  if(!box){

    return;
  }


  box.innerHTML=`

    <div
      class="notice ${
        created.length
          ?"success"
          :"error"
      }"
    >
      🏁 建立完成：
      成功 ${created.length} 人
      ${
        failed.length
          ?`，失敗 ${failed.length} 人`
          :""
      }
    </div>


    ${
      created.length
        ?`
          <div class="table-wrap">

            <table>

              <thead>
                <tr>
                  <th>帳號</th>
                  <th>姓名</th>
                  <th>初始密碼</th>
                </tr>
              </thead>

              <tbody>

                ${
                  created.map(
                    item=>`
                      <tr>
                        <td>${esc(item.username)}</td>
                        <td>${esc(item.displayName)}</td>
                        <td><b>${esc(item.password)}</b></td>
                      </tr>
                    `
                  )
                  .join("")
                }

              </tbody>

            </table>

          </div>
        `
        :""
    }
  `;

}


async function toggleUser(uid){

  const user=

      x=>x.uid===uid

  if(!user){

    return;
  }


  const active=
    !user.active;


  if(
    !confirm(
      `確定${active?"啟用":"停用"} ${user.displayName}？`
    )
  ){

    return;
  }


  await updateDoc(
    doc(
      db,
      "users",
      uid
    ),
    {

      active,

      updatedAt:
        serverTimestamp()

    }
  );


  await audit(
    active
      ?"enable_user"
      :"disable_user",
    "user",
    uid,

}

function editUserPermissions(uid){

  const user=
    users.find(
      x=>x.uid===uid
    );


  if(!user){

    return;
  }


  const assignments=[
    ...(
      user.assignments
      ||
      []
    )
  ];


  const classOptions=
    (
      classes.length
        ?classes.map(
            x=>x.id
          )
        :Object.keys(
            defaultRosters
          )
    )
    .sort()
    .map(
      id=>`
        <option value="${id}">
          ${id}
        </option>
      `
    )
    .join("");


  showModal(`

    <div class="item-head">

      <div>

        <div class="section-title">
          ⚓ ${esc(user.displayName)}
        </div>

        <div class="meta">
          帳號：${esc(user.username)}
        </div>

      </div>

      <button
        class="btn gray close-modal"
      >
        ✖ 關閉
      </button>

    </div>


    <div id="currentAssignments"></div>


    <hr
      style="
        border:0;
        border-top:1px dashed #c49b67;
        margin:18px 0
      "
    >


    <div class="section-title">
      ➕ 新增航海職務
    </div>


    <div class="two">

      <div class="field">

        <label>學期</label>

        <select id="aSemester">
          ${semesterOptions(currentSemester)}
        </select>

      </div>


      <div class="field">

        <label>班級</label>

        <select id="aClass">
          ${classOptions}
        </select>

      </div>

    </div>


    <div class="field">

      <label>身分類型</label>

      <select id="aKind">

        <option value="assistant">
          學科小老師
        </option>

        <option value="teacher">
          任課老師
        </option>

        <option value="officer">
          班級幹部
        </option>

      </select>

    </div>


    <div class="field">

      <label>科目／職務</label>

      <select id="aName">

        ${
          subjects.map(
            subject=>`
              <option>
                ${subject}
              </option>
            `
          )
          .join("")
        }

      </select>

    </div>


    <div class="toolbar">

      <label>
        <input
          id="aCollection"
          type="checkbox"
          checked
        >
        可登記收繳
      </label>

      <label>
        <input
          id="aScores"
          type="checkbox"
          checked
        >
        可登記成績
      </label>

    </div>


    <button
      id="addAssignment"
      class="btn primary"
    >
      ➕ 加入職務
    </button>
  `);


  function rerender(){

    $("#currentAssignments")
      .innerHTML=
        assignments.length
        ?
        assignments.map(
          (
            assignment,
            index
          )=>`

            <div class="assign">

              <b>
                ${esc(assignment.semester)}
              </b>

              ｜${esc(assignment.classId)}班

              ｜${esc(assignment.scopeName)}

              ｜${
                assignment.kind==="teacher"
                  ?"任課老師"
                  :assignment.scopeType==="subject"
                    ?"小老師"
                    :"班級幹部"
              }


              <button
                class="btn danger small remove-assignment"
                data-i="${index}"
              >
                移除
              </button>

            </div>
          `
        )
        .join("")
        :
        `
          <div class="notice">
            目前沒有指派職務。
          </div>
        `;


    $$(".remove-assignment")
      .forEach(
        button=>
          button.onclick=
          async()=>{

            assignments.splice(
              Number(
                button.dataset.i
              ),
              1
            );


            await saveAssignments(
              user,
              assignments
            );


            rerender();

          }
      );

  }


  $("#aKind")
    .onchange=
    ()=>{

      const kind=
        $("#aKind").value;


      $("#aName")
        .innerHTML=
          (
            kind==="officer"
              ?officerRoles
              :subjects
          )
          .map(
            name=>`
              <option>${name}</option>
            `
          )
          .join("");


      $("#aScores")
        .checked=
          kind!=="officer";

    };


  $("#addAssignment")
    .onclick=
    async()=>{

      const kind=
        $("#aKind").value;


      const assignment={

        semester:
          $("#aSemester").value,

        classId:
          $("#aClass").value,

        kind,

        scopeType:
          kind==="officer"
            ?"officer"
            :"subject",

        scopeName:
          $("#aName").value,

        canCollection:
          $("#aCollection").checked,

        canScores:
          kind==="officer"
            ?false
            :$("#aScores").checked

      };


      const duplicate=
        assignments.some(
          x=>
            x.semester===assignment.semester
            &&
            x.classId===assignment.classId
            &&
            x.kind===assignment.kind
            &&
            x.scopeType===assignment.scopeType
            &&
            x.scopeName===assignment.scopeName
        );


      if(duplicate){

        return alert(
          "這筆職務已經存在。"
        );

      }


      assignments.push(
        assignment
      );


      await saveAssignments(
        user,
        assignments
      );


      rerender();

    };


  rerender();

}


async function saveAssignments(
  user,
  assignments
){

  const access=
    computeAccess(
      assignments,
      currentSemester
    );


  await updateDoc(
    doc(
      db,
      "users",
      user.uid
    ),
    {

      assignments,

      ...access,

      updatedAt:
        serverTimestamp()

    }
  );


  user.assignments=
    assignments;


  Object.assign(
    user,
    access
  );


  await audit(
    "permissions",
    "user",
    user.uid,
    `更新權限：${user.username}`
  );

}

          ),

      }

function parseRoster(text){

  return text
    .split(/\r?\n/)
    .map(
      line=>line.trim()
    )
    .filter(Boolean)
    .map(
      line=>{

        const[
          seat,
          ...nameParts
        ]=
          line.split(
            /[,，\t]/
          );


        return{
          id:String(Number(seat)),
          seat:Number(seat),
          name:nameParts.join("").trim()
        };

      }
    )
    .filter(
      student=>
        student.seat
        &&
        student.name
    )
    .sort(
      (
        a,
        b
      )=>
        a.seat-b.seat
    );

}


async function saveClass(
  classId,
  text
){

  classId=
    classId.trim();


  const students=
    parseRoster(text);


  if(
    !classId
    ||
    !students.length
  ){

    return alert(
      "請輸入班級與名單。"
    );

  }


  await setDoc(
    doc(
      db,
      "classes",
      classId
    ),
    {

      classId,
      students,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  await audit(
    "save_class",
    "class",
    classId,
    `更新班級 ${classId}`
  );


  await refreshAll();


  alert(
    "✅ 班級名單已儲存！"
  );

}

function showModal(html){

  $("#modal")
    .classList

    );


  $(".close-modal")
    ?.addEventListener(

    );

    .classList

    );


  $("#modalBody")
    .innerHTML=

}
