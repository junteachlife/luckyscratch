      <div class="grid g4" style="margin-top:10px"><div class="card stat"><div class="sub">🏫 導師班</div><b>${esc(selected)}</b><div class="meta">目前授權班級</div></div><div class="card stat"><div class="sub">👨‍🏫 導師管理員</div><b>${admins.length}</b><div class="meta">${admins.map(u=>u.displayName||u.email||'').join('、')||'—'}</div></div><div class="card stat"><div class="sub">📚 任課設定</div><b>${teacherRows.length}</b><div class="meta">${esc(sem)}</div></div><div class="card stat"><div class="sub">👥 班級人數</div><b>${roster.length}</b><div class="meta">正式班級名單</div></div></div>

      <div class="card" style="margin-top:14px"><div class="section-title">➕ 最高管理員設定本班任課老師</div><div class="notice">同一位老師可以在同一班教授不同科目；唯一設定鍵是「學期＋班級＋科目」。若該科已有人負責，請使用下方「修改」而不是重複新增。</div><div class="toolbar"><label>老師<select id="overviewTeacher">${teachers.map(r=>`<option value="${esc(r.id)}">${esc(r.displayName||r.email)}｜${esc(r.email||r.id)}</option>`).join('')}</select></label><label>科目<select id="overviewSubject">${subjects.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><button id="overviewAssignTeacher" class="btn primary" ${teachers.length?'':'disabled'}>➕ 設定任課老師</button></div></div>

      <div class="two" style="margin-top:14px"><div class="card"><div class="section-title">👨‍🏫 導師管理員</div>${admins.map(u=>`<div class="item"><b>${esc(u.displayName||u.username||'')}</b><div class="meta">${esc(u.email||'')}｜${esc((u.adminClassIds||[]).join('、')||u.homeroomClassId||'')}${u.uid===me.uid?'｜最高管理員本人':''}</div></div>`).join('')||'<div class="sub">尚無導師管理員。</div>'}</div>
      <div class="card"><div class="section-title">📚 任課老師設定</div><div class="table-wrap"><table><thead><tr><th>科目</th><th>任課老師</th><th>Email</th><th>Google</th><th>本科小老師</th><th>來源</th><th>操作</th></tr></thead><tbody>${teacherRows.map(sm=>{const reg=teachers.find(r=>teacherIdentityMatchesManager(r,sm));const ai=subjectAssistantInfo(sm);return `<tr><td><b>${esc(sm.subject)}</b></td><td>${esc(sm.managerName||reg?.displayName||'')}</td><td>${esc(sm.managerEmail||reg?.email||'')}</td><td>${reg?.linkedUid||sm.managerUid?'✅ 已連動':'⚠️ 尚未連動'}</td><td>${ai.student?esc(ai.label):'—'}</td><td><span class="mini-badge">${esc(sourceLabel(sm))}</span></td><td><button class="btn primary small overview-edit-teacher" data-id="${esc(sm.id)}">✏️ 修改</button> <button class="btn danger small overview-delete-teacher" data-id="${esc(sm.id)}">🗑️ 刪除</button></td></tr>`}).join('')||'<tr><td colspan="7">這個學期尚未設定任課老師。</td></tr>'}</tbody></table></div></div></div>
      <div class="two" style="margin-top:14px"><div class="card"><div class="section-title">🏴 班級幹部</div>${standardRoles.filter(r=>r.kind==='officer').map(r=>`<div class="role-row"><b>${esc(r.label)}</b><span>${esc(roleWho(r.kind,r.scopeType,r.scopeName))}</span></div>`).join('')}</div><div class="card"><div class="section-title">⭐ 各科小老師</div>${standardRoles.filter(r=>r.kind==='assistant').map(r=>`<div class="role-row"><b>${esc(r.label)}</b><span>${esc(roleWho(r.kind,r.scopeType,r.scopeName))}</span></div>`).join('')}</div></div>`:'<div class="notice">目前尚未授予任何班級管理員／導師班權限。</div>'}
    </div>`;
  $('#homeroomOverviewSemester')?.addEventListener('change',e=>{window.__homeroomOverviewSemester=e.target.value;renderHomeroomOverview()});
  $('#homeroomOverviewClass')?.addEventListener('change',e=>{window.__homeroomOverviewClass=e.target.value;renderHomeroomOverview()});
  $$('.overview-class-chip').forEach(b=>b.onclick=()=>{window.__homeroomOverviewClass=b.dataset.class;renderHomeroomOverview()});
  $('#overviewAssignTeacher')?.addEventListener('click',async()=>{const reg=teachers.find(r=>r.id===$('#overviewTeacher').value);if(!reg)return alert('請先選擇老師。');const result=await assignTeacherToSubject(reg,sem,selected,$('#overviewSubject').value,{source:'最高管理員設定'});if(!result.ok)return alert(result.message);await refreshAll();renderHomeroomOverview();alert(result.message)});
  $$('.overview-edit-teacher').forEach(b=>b.onclick=()=>editHomeroomTeacherAssignment(b.dataset.id));
  $$('.overview-delete-teacher').forEach(b=>b.onclick=()=>deleteHomeroomTeacherAssignment(b.dataset.id));
}

function renderAdminPermissions(){
  if(!isGlobalAdmin()){ $('#page-adminPermissions').innerHTML='<div class="notice error">只有最高管理員模式可以管理其他班級管理員。</div>';return}
  const candidates=adminTeacherCandidates(),admins=currentClassAdminUsers(),classIds=[...new Set([...classes.map(c=>c.id),...Object.keys(defaultRosters)])].sort();
  $('#page-adminPermissions').innerHTML=`<div class="page-title">管理者權限</div>
    <div class="card"><div class="section-title">🏫 學校班級結構設定</div>
      <div class="notice"><b>目前文化國中：</b>七年級 6 班、八年級 6 班、九年級 7 班。未來新生班級數改變時，直接在這裡修改，不需要再改程式碼。</div>
      <div class="grid g3">
        <div class="field"><label>七年級班級</label><input id="grade7Classes" value="${esc((schoolClassConfig[7]||[]).join(','))}" placeholder="701,702,703,704,705,706"></div>
        <div class="field"><label>八年級班級</label><input id="grade8Classes" value="${esc((schoolClassConfig[8]||[]).join(','))}" placeholder="801,802,803,804,805,806"></div>
        <div class="field"><label>九年級班級</label><input id="grade9Classes" value="${esc((schoolClassConfig[9]||[]).join(','))}" placeholder="901,902,903,904,905,906,907"></div>
      </div>
      <div class="toolbar"><button id="saveSchoolClassConfigBtn" class="btn primary">💾 儲存班級結構</button></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="section-title">🎭 我的多重身分</div><div class="notice success">你的 Google 帳號可以同時是「最高管理員＋導師＋任課老師」。這裡設定導師班，登入後即可用「切換身分」限制自己平常的工作範圍。</div><div class="toolbar"><label>我的導師班<select id="myHomeroomSelect">${schoolClassOptions(homeroomClassId())}</select></label><button id="saveMyHomeroomBtn" class="btn primary">💾 儲存我的導師班</button></div></div>
    <div class="card" style="margin-top:14px"><div class="section-title">🔐 授予班級管理員</div><div class="notice">其他導師先完成 Google UID 連動，再授予「導師班管理」；他仍可另外用任課老師模式自行建立班級 × 科目。</div><div class="toolbar"><label>老師<select id="adminTeacherSelect">${candidates.map(r=>`<option value="${esc(r.id)}">${esc(r.displayName||r.email)}｜${esc(r.email||r.id)}</option>`).join('')}</select></label><label>導師班<select id="adminClassSelect">${schoolClassOptions()}</select></label><button id="grantClassAdminBtn" class="btn primary" ${candidates.length?'':'disabled'}>🔐 授予班級管理員</button></div></div>
    <div class="card" style="margin-top:14px"><div class="section-title">👨‍🏫 目前班級管理員</div><div class="table-wrap"><table><thead><tr><th>姓名</th><th>Email</th><th>導師班</th><th>任課摘要</th><th>任課組數</th><th>操作</th></tr></thead><tbody>${admins.map(u=>{
      const list=(u.assignments||[]).filter(a=>a.kind==='teacher'&&(!a.semester||a.semester===currentSemester)).map(a=>({semester:a.semester||currentSemester,classId:String(a.classId||''),subject:a.scopeName||a.subject||'未命名科目'})).filter(a=>a.classId);
      const grouped={};for(const a of list)(grouped[a.subject]??=[]).push(a.classId);
      const groups=Object.entries(grouped).map(([subject,classIds])=>({subject,classIds:[...new Set(classIds)].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}))}));
      const preview=groups.slice(0,2).map(g=>{const shown=g.classIds.slice(0,4),more=g.classIds.length-shown.length;return `<div class="teacher-summary-line"><span class="teacher-summary-subject">${esc(g.subject)}：</span><span class="teacher-class-chips">${shown.map(c=>`<span class="teacher-class-chip">${esc(c)}</span>`).join('')}${more>0?`<span class="teacher-class-chip">＋${more}</span>`:''}</span></div>`}).join('');
      const hiddenSubjects=Math.max(0,groups.length-2);
      const adminUid=userDocUid(u);
      return `<tr><td><b>${esc(u.displayName||'')}</b></td><td>${esc(u.email||'')}</td><td><select class="class-admin-class" data-uid="${esc(adminUid)}">${schoolClassOptions((u.adminClassIds||[])[0]||u.homeroomClassId||'')}</select></td><td><div class="teacher-summary">${preview||'<span class="meta">目前未設定任課</span>'}${hiddenSubjects?`<div class="teacher-more-note">另有 ${hiddenSubjects} 個科目，請點「查看全部任課」。</div>`:''}</div></td><td><span class="teacher-count-badge">${list.length} 筆</span></td><td><button type="button" class="btn primary small admin-view-assignments" data-uid="${esc(adminUid)}" ${list.length?'':'disabled'}>👁 查看全部任課</button> <button class="btn good small save-class-admin" data-uid="${esc(adminUid)}">💾 儲存導師班</button> <button class="btn danger small revoke-class-admin" data-uid="${esc(adminUid)}">取消管理權限</button></td></tr>`;
    }).join('')||'<tr><td colspan="6">尚未授予其他班級管理員。</td></tr>'}</tbody></table></div></div>`;
  $('#saveSchoolClassConfigBtn')?.addEventListener('click',saveSchoolClassConfig);$('#saveMyHomeroomBtn').onclick=saveMyHomeroom;$('#grantClassAdminBtn')?.addEventListener('click',grantClassAdmin);
  $$('.save-class-admin').forEach(b=>b.onclick=()=>changeClassAdminClass(b.dataset.uid));
  $$('.revoke-class-admin').forEach(b=>b.onclick=()=>revokeClassAdmin(b.dataset.uid));

  // v20260913-M：管理者權限統一使用 Firestore 文件 id／uid 相容識別，修正查看全部任課、儲存導師班與取消管理權限找不到導師資料的問題；事件仍採頁面層級委派。
  // 原先直接逐顆綁定 onclick，在部分重新渲染／平板瀏覽器情境下可能失去事件；
  // 改成委派後，不論表格重新產生幾次都可以正常開啟。
  const adminPermissionPage=$('#page-adminPermissions');
  if(adminPermissionPage){
    adminPermissionPage.onclick=e=>{
      const btn=e.target.closest('.admin-view-assignments');
      if(!btn)return;
      e.preventDefault();
      e.stopPropagation();
      if(btn.disabled)return;

      const uid=String(btn.dataset.uid||'');
      const u=admins.find(x=>userDocUid(x)===uid);
      if(!u){
        alert('找不到這位導師的管理者資料，請重新整理後再試一次。');
        return;
      }

      // 同時讀 users.assignments 與 subjectClassManagers，避免只看到舊資料或漏掉導師／最高管理員新設定。
      const list=[];
      const pushAssignment=(classId,subject,semester=currentSemester)=>{
        classId=String(classId||'').trim();subject=String(subject||'').trim();
        if(!classId||!subject)return;
        const k=`${semester}|${classId}|${subject}`;
        if(!list.some(x=>x.k===k))list.push({k,semester,classId,subject});
      };

      for(const a of (u.assignments||[])){
        if(a.kind!=='teacher')continue;
        const semester=a.semester||currentSemester;
        if(semester!==currentSemester)continue;
        pushAssignment(a.classId,a.scopeName||a.subject,semester);
      }

      const userEmail=String(u.email||'').toLowerCase();
      for(const sm of subjectManagers){
        if(sm.status==='released'||sm.semester!==currentSemester)continue;
        const adminUid=userDocUid(u);
        const sameUid=!!adminUid && String(sm.managerUid||'')===adminUid;
        const sameEmail=!!userEmail && String(sm.managerEmail||'').toLowerCase()===userEmail;
        if(sameUid||sameEmail)pushAssignment(sm.classId,sm.subject,sm.semester);
      }

      list.sort((a,b)=>String(a.subject).localeCompare(String(b.subject),'zh-Hant')||String(a.classId).localeCompare(String(b.classId),undefined,{numeric:true}));
      const grouped={};
      for(const a of list)(grouped[a.subject]??=[]).push(a.classId);
      const groups=Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'));

      showModal(`<div class="section-title">👨‍🏫 ${esc(u.displayName||u.email||'導師')}｜${esc(currentSemester)} 全部任課</div>
        <div class="notice"><b>${esc(u.email||'')}</b><br>共 ${list.length} 筆「班級 × 科目」任課設定；相同科目已自動合併班級顯示。</div>
        <div>${groups.map(([subject,classIds])=>{const ids=[...new Set(classIds)].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));return `<div class="teacher-detail-group"><div class="teacher-detail-title">${esc(subject)}｜${ids.length} 班</div><div class="teacher-class-chips">${ids.map(c=>`<span class="teacher-class-chip">${esc(c)} 班</span>`).join('')}</div></div>`}).join('')||'<div class="meta">目前未設定任課。</div>'}</div>
        <div class="toolbar"><button type="button" class="btn gray close-modal">關閉</button></div>`);
    };
  }
}
async function grantClassAdmin(){
  if(!isGlobalAdmin())return alert('只有最高管理員模式可以授予管理者權限。');
  const regId=$('#adminTeacherSelect')?.value,classId=$('#adminClassSelect')?.value,reg=registries.find(r=>r.id===regId);
  if(!reg||!reg.linkedUid)return alert('請選擇一位已完成 Google 連動的老師。');if(!classId)return alert('請選擇導師班。');
  if(!confirm(`確定授予 ${reg.displayName}「${classId} 導師班管理員」？\n\n他仍可在任課老師模式自行建立其他班級 × 科目。`))return;
  await setDoc(doc(db,'users',reg.linkedUid),{type:'admin',adminScope:'class',adminClassIds:[classId],homeroomClassId:classId,updatedAt:serverTimestamp()},{merge:true});
  await audit('grant_class_admin','user',reg.linkedUid,`授予 ${reg.displayName} ${classId} 導師班管理員`);
  await refreshAll();renderAdminPermissions();alert(`✅ ${reg.displayName} 已成為 ${classId} 導師班管理員。`);
}
async function changeClassAdminClass(uid){
  if(!isGlobalAdmin())return;
  uid=String(uid||'').trim();
  const u=users.find(x=>userDocUid(x)===uid),sel=document.querySelector(`.class-admin-class[data-uid="${CSS.escape(uid)}"]`),classId=sel?.value;if(!u||!classId)return;
  await setDoc(doc(db,'users',uid),{adminScope:'class',adminClassIds:[classId],homeroomClassId:classId,updatedAt:serverTimestamp()},{merge:true});
  await audit('change_class_admin_scope','user',uid,`調整 ${u.displayName||u.email} 導師班為 ${classId}`);await refreshAll();renderAdminPermissions();
}

// 操作紀錄：最高管理員看全部；其他模式只看自己，避免跨班資訊暴露
async function renderAudit(){
  let logs=[];
  try{
    if(isGlobalAdmin()){const s=await getDocs(query(collection(db,'auditLogs'),orderBy('createdAt','desc')));logs=s.docs.slice(0,300).map(d=>d.data())}
    else{const s=await getDocs(query(collection(db,'auditLogs'),where('actorUid','==',auth.currentUser.uid)));logs=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,250)}
  }catch(e){console.error(e)}
  $('#page-audit').innerHTML=`<div class="page-title">操作紀錄</div><div class="card"><div class="notice">${isGlobalAdmin()?'最高管理員模式可查看全系統操作紀錄。':`目前 ${esc(activeModeLabel())}：只顯示你本人後台操作紀錄。`}</div><div class="table-wrap"><table><thead><tr><th>時間</th><th>學期</th><th>操作者</th><th>動作</th><th>內容</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${l.createdAt?.toDate?l.createdAt.toDate().toLocaleString('zh-TW'):''}</td><td>${esc(l.semester||'')}</td><td>${esc(l.actorName||'')}</td><td>${esc(l.action||'')}</td><td>${esc(l.detail||'')}</td></tr>`).join('')||'<tr><td colspan="5">目前沒有紀錄。</td></tr>'}</tbody></table></div></div>`;
}

function showModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden');$('.close-modal')?.addEventListener('click',hideModal)}
function hideModal(){$('#modal').classList.add('hidden');$('#modalBody').innerHTML=''}
</script>
