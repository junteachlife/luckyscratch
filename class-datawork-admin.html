function esc(v=''){
  return String(v).replace(/[&<>"]/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;'
  }[m]))
}

function emailFor(v){

}

function randomPwd(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  return Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join('')
}

function scopeKey(a){
  return `${a.semester}|${a.classId}|${a.scopeType}|${a.scopeName}`
}

function registryId(email){

}

function registryByStudent(classId,seat){
  return registries.find(r=>
    r.type==='student' &&
    String(r.classId)===String(classId) &&
    Number(r.seat)===Number(seat)
  )||null
}

function normalizeStudentName(name){
  const n=String(name||'').trim();
  return n==='趙安瑜'?'趙安褕':n
}

function classDocLocal(classId){
  return classes.find(c=>String(c.id)===String(classId))||null
}

function rolePresetFor(classId,semester){
  return classDocLocal(classId)?.roleAssignments?.[semester]||{}
}

function presetAssignmentsForStudent(classId,seat){
  const c=classDocLocal(classId),out=[];
  if(!c?.roleAssignments)return out;

  for(const[semester,roles]of Object.entries(c.roleAssignments)){
    for(const[roleKey,who]of Object.entries(roles||{})){
      if(Number(who?.seat)!==Number(seat))continue;
      const[kind,scopeType,scopeName]=roleKey.split('|');
      const base=standardRoles.find(r=>
        r.kind===kind &&
        r.scopeType===scopeType &&
        r.scopeName===scopeName
      );
      if(base)out.push({
        semester,
        classId,
        kind,
        scopeType,
        scopeName,
        canCollection:base.canCollection,
        canScores:base.canScores
      })
    }
  }
  return out
}

function linkedUserForRegistry(reg){
  return reg?.linkedUid?users.find(u=>u.uid===reg.linkedUid)||null:null
}

function assignmentKey(a){
  return `${a.semester}|${a.classId}|${a.kind}|${a.scopeType}|${a.scopeName}`
}

function mergeAssignments(base=[],extra=[]){
  const m=new Map();
  [...base,...extra].forEach(a=>{
    if(a&&a.semester&&a.classId&&a.scopeName)m.set(assignmentKey(a),a)
  });
  return [...m.values()]
}

function fmtTs(v){
  try{
    return v?.toDate?v.toDate().toLocaleString('zh-TW'):'—'
  }catch{
    return '—'
  }
}

async function syncLinkedRegistry(reg){
  if(!reg?.linkedUid)return;

  const userRef=doc(db,'users',reg.linkedUid);
  const oldSnap=await getDoc(userRef);
  const oldData=oldSnap.exists()?oldSnap.data():{};
  const assignments=Array.isArray(reg.assignments)?reg.assignments:[];
  const access=computeAccess(assignments,currentSemester);

  const finalType=
    oldData.type==='admin'
      ?'admin'
      :(reg.type||'student');

  await setDoc(userRef,{
    username:reg.username||reg.email,
    displayName:reg.displayName||reg.email,
    type:finalType,
    email:reg.email||reg.id,
    classId:reg.classId||'',
    seat:reg.seat??null,
    active:reg.active!==false,
    assignments,
    ...access,
    mustChangePassword:false,
    authProvider:'google',
    updatedAt:serverTimestamp()
  },{merge:true});
}

async function saveRegistry(reg){
  const id=registryId(reg.email||reg.id);
  if(!id)throw new Error('Email 不可空白');

  const data={
    ...reg,
    email:id,
    updatedAt:serverTimestamp()
  };

  delete data.id;

  await setDoc(
    doc(db,'identityRegistry',id),
    data,
    {merge:true}
  );

  const idx=registries.findIndex(r=>r.id===id);

  if(idx>=0){
    registries[idx]={
      ...registries[idx],
      ...reg,
      id,
      email:id
    }
  }else{
    registries.push({
      ...reg,
      id,
      email:id
    })
  }

  await syncLinkedRegistry({
    ...reg,
    id,
    email:id
  });

  return id
}

function semesterOptions(selected=currentSemester){
  const list=[
    ...new Set([
      ...semesterHistory,
      currentSemester,
      selected
    ])
  ]
  .filter(Boolean)
  .sort()
  .reverse();

  return list.map(s=>
    `<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`
  ).join('')
}

function computeAccess(assignments=[],semester=currentSemester){
  const viewKeys=[];
  const collectionWriteKeys=[];
  const scoreWriteKeys=[];
  const classAccess=[];

  for(const a of assignments.filter(x=>x.semester===semester)){
    const k=scopeKey(a);

    if(!viewKeys.includes(k))viewKeys.push(k);

    if(a.canCollection&&!collectionWriteKeys.includes(k))
      collectionWriteKeys.push(k);

    if(a.canScores&&!scoreWriteKeys.includes(k))
      scoreWriteKeys.push(k);

    if(!classAccess.includes(a.classId))
      classAccess.push(a.classId)
  }

  return{
    viewKeys,
    collectionWriteKeys,
    scoreWriteKeys,
    classAccess
  }
}

async function loginAdminWithGoogle(){
  if(authBusy)return;

  authBusy=true;
  const btn=$('#googleLoginBtn');

  if(btn){
    btn.disabled=true;
    btn.textContent='⏳ 正在開啟 Google 登入…'
  }

  msg($('#loginMsg'),'');

  try{
    await signInWithPopup(auth,googleProvider);
  }catch(e){
    const code=e?.code||'';

    if(
      code==='auth/popup-blocked' ||
      code==='auth/cancelled-popup-request' ||
      code==='auth/operation-not-supported-in-this-environment'
    ){
      try{
        await signInWithRedirect(auth,googleProvider);
        return
      }catch(re){
        msg(
          $('#loginMsg'),
          `Google 登入失敗：${esc(re?.code||re?.message||'未知錯誤')}`,
          'error'
        )
      }
    }else if(code==='auth/popup-closed-by-user'){
      msg($('#loginMsg'),'已取消 Google 登入。','')
    }else{
      msg(
        $('#loginMsg'),
        `Google 登入失敗：${esc(code||e?.message||'未知錯誤')}`,
        'error'
      )
    }
  }finally{
    authBusy=false;

    if(btn){
      btn.disabled=false;
      btn.textContent='🔵 使用 Google 帳號登入管理後台'
    }
  }
}

async function ensureSystemSettings(){

  const s=await getDoc(ref);

  if(!s.exists()){
    await setDoc(ref,{
      currentSemester:'115-1',
      semesterHistory:['115-1'],
      updatedAt:serverTimestamp()
    });

  }else{

      d.currentSemester||'115-1';

    semesterHistory=
      Array.isArray(d.semesterHistory)&&d.semesterHistory.length
        ?d.semesterHistory

    `目前學期：${currentSemester}`
}

async function changeCurrentSemester(){
  const sem=$('#newSemester').value.trim();

  if(!/^\d{2,3}-[12]$/.test(sem))
    return alert(
      '學期格式請使用例如 115-1 或 115-2。'
    );

  if(sem===currentSemester)
    return alert('目前已經是這個學期。');

  const old=currentSemester;

  if(!confirm(
    `確定建立／切換為「${sem}」？\n\n舊資料會完整保留。`
  ))return;

  const copy=confirm(
    `是否把「${old}」的任課教師、幹部與小老師設定複製到「${sem}」？\n\n建議按「確定」，之後只需要修改有變動的人。`
  );

  if(copy){
    for(const reg of registries){
      const oldAssignments=
        (reg.assignments||[])
        .filter(a=>a.semester===old);

      if(!oldAssignments.length)continue;

      const copied=
        oldAssignments.map(a=>({
          ...a,
          semester:sem
        }));

      reg.assignments=
        mergeAssignments(
          reg.assignments||[],
          copied
        );

      await saveRegistry(reg)
    }
  }

  const history=[
    ...new Set([
      ...semesterHistory,
      old,
      sem
    ])
  ];

  await setDoc(
    doc(db,'settings','system'),
    {
      currentSemester:sem,
      semesterHistory:history,
      updatedAt:serverTimestamp()
    },
    {merge:true}
  );

  currentSemester=sem;
  semesterHistory=history;
  recordSemester=sem;

  await recalcAllAccess();

  for(
    const reg of registries.filter(r=>r.linkedUid)
  ){
    await syncLinkedRegistry(reg)
  }

  await audit(
    'change_semester',
    'settings',
    'system',
    `${old} → ${sem}${copy?'（複製設定）':'（不複製設定）'}`,
    sem
  );

  await refreshAll();

  alert(
    copy
      ?`✅ 已切換為 ${sem}，並複製 ${old} 的設定。\n接著只要修改有變動的人即可。`
      :`✅ 已切換為 ${sem}。`
  )
}

async function recalcAllAccess(){
  for(
    const u of users.filter(x=>x.type!=='admin')
  ){
    const access=
      computeAccess(
        u.assignments||[],
        currentSemester
      );

    await updateDoc(
      doc(db,'users',u.uid),
      {
        ...access,
        updatedAt:serverTimestamp()
      }
    );

    Object.assign(u,access)
  }
}

function getRosterForClass(classId){
  const c=classes.find(x=>x.id===classId);

  if(c&&Array.isArray(c.students))
    return c.students
      .filter(s=>s.active!==false)
      .sort(
        (a,b)=>Number(a.seat)-Number(b.seat)
      );

  return(defaultRosters[classId]||[])
    .map(([seat,name])=>({
      seat,
      name,
      id:String(seat),
      active:true
    }))
}

function roleSelectedSeat(
  role,
  classId,
  sem
){
  const preset=
    rolePresetFor(classId,sem);

  const key=
    `${role.kind}|${role.scopeType}|${role.scopeName}`;

  if(preset[key]?.seat!=null)
    return String(preset[key].seat);

  const reg=
    registries.find(r=>
      r.type==='student' &&
      (r.assignments||[]).some(a=>
        a.semester===sem &&
        a.classId===classId &&
        a.kind===role.kind &&
        a.scopeType===role.scopeType &&
        a.scopeName===role.scopeName
      )
    );

  return reg?.seat!=null
    ?String(reg.seat)
    :''
}

async function persistRolePreset(
  classId,
  sem,
  selections
){
  const c=classDocLocal(classId);

  if(!c)
    throw new Error(
      `找不到 ${classId} 班級資料，請先到「班級名單」建立。`
    );

  const roleAssignments={
    ...(c.roleAssignments||{})
  };

  const map={};

  const roster=
    getRosterForClass(classId);

  for(const sel of selections){
    if(!sel.seat)continue;

    const student=
      roster.find(
        s=>Number(s.seat)===Number(sel.seat)
      );

    if(!student)continue;

    map[
      `${sel.kind}|${sel.scopeType}|${sel.scopeName}`
    ]={
      seat:Number(student.seat),
      name:student.name
    }
  }

  roleAssignments[sem]=map;

  await setDoc(
    doc(db,'classes',classId),
    {
      roleAssignments,
      updatedAt:serverTimestamp()
    },
    {merge:true}
  );

  c.roleAssignments=
    roleAssignments
}

async function applyRoleSelectionsToRegistries(
  classId,
  sem,
  selections
){
  const roleKeys=
    new Set(
      standardRoles.map(r=>
        `${r.kind}|${r.scopeType}|${r.scopeName}`
      )
    );

  for(
    const reg of registries.filter(
      r=>
        r.type==='student' &&
        String(r.classId)===String(classId)
    )
  ){
    let assignments=
      (reg.assignments||[])
      .filter(a=>
        !(
          a.semester===sem &&
          a.classId===classId &&
          roleKeys.has(
            `${a.kind}|${a.scopeType}|${a.scopeName}`
          )
        )
      );

    selections
      .filter(
        x=>Number(x.seat)===Number(reg.seat)
      )
      .forEach(sel=>{
        const base=
          standardRoles.find(r=>
            r.kind===sel.kind &&
            r.scopeType===sel.scopeType &&
            r.scopeName===sel.scopeName
          );

        if(base)
          assignments.push({
            semester:sem,
            classId,
            kind:sel.kind,
            scopeType:sel.scopeType,
            scopeName:sel.scopeName,
            canCollection:base.canCollection,
            canScores:base.canScores
          })
      });

    reg.assignments=assignments;

    await saveRegistry(reg)
  }
}

async function ensureSeatLogin(){
  if(seatAuth.currentUser)
    return true;

  const account=
    prompt(
      '第一次從 seat.html 同步時，請輸入 seat.html 的登入帳號／Email：'
    );

  if(!account)return false;

  const password=
    prompt(
      '請輸入 seat.html 的登入密碼：'
    );

  if(password===null)
    return false;

  const email=
    account.includes('@')
      ?account
      :`${account}@seat804.com`;

  try{
    await signInWithEmailAndPassword(
      seatAuth,
      email,
      password
    );

    return true

  }catch(e){
    alert(
      `seat.html 登入失敗：${e.code||e.message}`
    );

    return false
  }
}

function seatRoleToStandard(label){
  const exact=
    standardRoles.find(r=>r.label===label);

  if(exact)return exact;

  if(label.endsWith('小老師')){
    const subject=
      label.replace(/小老師$/,'');

    return standardRoles.find(
      r=>
        r.kind==='assistant' &&
        r.scopeName===subject
    )||null
  }

  return null
}

async function syncRolesFromSeat(){
  if($('#roleClass').value!=='804')
    return alert(
      'seat.html 目前只連動 804 班。'
    );

  const sem=
    $('#roleSemester').value;

  if(!await ensureSeatLogin())
    return;

  const status=
    $('#seatSyncStatus');

  if(status)
    status.textContent=
      '正在讀取 seat.html 雲端設定…';

  try{
    const snap=
      await rtdbGet(
        rtdbRef(
          seatDb,
          'class_804/seat_data/staffAssignments'
        )
      );

    if(!snap.exists())
      throw new Error(
        'seat.html 尚未儲存幹部／小老師資料。'
      );

    const staff=
      snap.val()||{};

    const roster=
      getRosterForClass('804');

    const selections=[];
    const unmatched=[];

    for(
      const[label,rawName]
      of Object.entries(staff)
    ){
      if(!rawName)continue;

      const role=
        seatRoleToStandard(label);

      if(!role)continue;

      const name=
        normalizeStudentName(rawName);

      const student=
        roster.find(
          s=>
            normalizeStudentName(s.name)===name
        );

      if(!student){
        unmatched.push(
          `${label}：${rawName}`
        );
        continue
      }

      selections.push({
        seat:Number(student.seat),
        kind:role.kind,
        scopeType:role.scopeType,
        scopeName:role.scopeName
      })
    }

    $$('.role-select').forEach(
      sel=>sel.value=''
    );

    for(const sel of selections){
      const control=
        $$('.role-select').find(x=>
          x.dataset.kind===sel.kind &&
          x.dataset.type===sel.scopeType &&
          x.dataset.name===sel.scopeName
        );

      if(control)
        control.value=
          String(sel.seat)
    }

    const allSelections=
      $$('.role-select').map(sel=>({
        seat:sel.value
          ?Number(sel.value)
          :null,
        kind:sel.dataset.kind,
        scopeType:sel.dataset.type,
        scopeName:sel.dataset.name
      }));

    await persistRolePreset(
      '804',
      sem,
      allSelections
    );

    await applyRoleSelectionsToRegistries(
      '804',
      sem,
      allSelections
    );

    await audit(
      'sync_seat_roles',
      'roles',
      `${sem}-804`,
      `從 seat.html 同步 804 幹部／小老師，共 ${selections.length} 筆`,
      sem
    );

    if(status)
      status.innerHTML=
        `✅ 已從 seat.html 同步 ${selections.length} 筆到 ${esc(sem)}。${
          unmatched.length
            ?`<br>⚠️ 找不到名單對應：${esc(unmatched.join('、'))}`
            :''
        }`;

    await refreshAll();

    const rs=
      $('#roleSemester');

    if(rs){
      rs.value=sem;
      $('#roleClass').value='804';
      renderRoleTable();
      updateSeatSyncButton()
    }

    alert(
      `✅ 已從 seat.html 同步 804 班 ${sem} 職務。${
        unmatched.length
          ?`\n\n有 ${unmatched.length} 筆姓名無法對應，請看畫面提示。`
          :''
      }`
    );

  }catch(e){
    console.error(e);

    if(status)
      status.textContent=
        `❌ 同步失敗：${e.message}`;

    alert(
      `從 seat.html 同步失敗：${e.message}`
    )
  }
}

async function confirmRecord(type,id){
  const col=
    type==='collection'
      ?'collectionItems'
      :'assessments';

  const arr=
    type==='collection'
      ?collections
      :assessments;

  const x=
    arr.find(y=>y.id===id);

  const confirming=
    x.reviewStatus!=='confirmed';

  await updateDoc(
    doc(db,col,id),
    {
      reviewStatus:
        confirming
          ?'confirmed'
          :'pending',

      locked:confirming,

      confirmedBy:
        confirming
          ?auth.currentUser.uid
          :null,

      confirmedAt:
        confirming
          ?serverTimestamp()
          :null,

      updatedAt:serverTimestamp()
    }
  );

  await audit(
    confirming
      ?'confirm'
      :'unconfirm',

    type,
    id,

    `${confirming?'確認並鎖定':'取消確認'}：${x.itemName||x.name}`,

    x.semester||currentSemester
  );

  await refreshAll()
}

  await audit(
    'delete',
    type,
    id,
    `管理員刪除：${x.itemName||x.name}`,
    x.semester||currentSemester
  );

  await refreshAll()
}

function selectedRecordLabel(x){
  return `${x.scopeName||'未分類'}｜${
    x._type==='collection'
      ?'作業繳交'
      :'成績'
  }｜${
    x._type==='collection'
      ?(x.itemName||'未命名')
      :(x.name||'未命名')
  }`
}

function selectedRecordValue(x,s){
  if(x._type==='collection'){
    const inf=
      collectionInfo(x,s);

    return inf.label
  }

  const inf=
    scoreInfo(x,s);

  return inf.score!==null
    ?String(inf.score)
    :inf.label
}

function selectedExportClassIds(list){
  return[
    ...new Set(
      list.map(x=>x.classId)
        .filter(Boolean)
    )
  ].sort()
}

function selectedWideRowsForClass(
  list,
  classId
){
  const items=
    list.filter(x=>x.classId===classId);

  const roster=
    getRoster(classId);

  return roster.map(s=>{
    const row={
      班級:classId,
      座號:s.seat,
      姓名:s.name
    };

    items.forEach(x=>
      row[selectedRecordLabel(x)]=
        selectedRecordValue(x,s)
    );

    return row
  })
}

function selectedDetailRows(x){
  const roster=
    getRoster(x.classId);

  if(x._type==='collection'){
    return roster.map(s=>{
      const inf=
        collectionInfo(x,s);

      return{
        座號:s.seat,
        姓名:s.name,
        狀態:inf.label
      }
    })
  }

  return roster.map(s=>{
    const inf=
      scoreInfo(x,s);

    return{
      座號:s.seat,
      姓名:s.name,
      成績:inf.score??'',
      狀態:inf.label
    }
  })
}

function safeSheetName(name,used){
  let base=
    String(name||'資料')
    .replace(/[\\\/\?\*\[\]\:]/g,' ')
    .trim()
    .slice(0,31)||'資料';

  let out=base;
  let n=2;

  while(used.has(out)){
    const suffix=` ${n++}`;

    out=
      base.slice(
        0,
        31-suffix.length
      )+suffix
  }

  used.add(out);

  return out
}

/* ===== 各科作業／成績彙整 ===== */

let lastSummaryState=null;

function pad2(n){
  return String(n).padStart(2,'0')
}

function dateStr(d){
  return `${
    d.getFullYear()
  }-${
    pad2(d.getMonth()+1)
  }-${
    pad2(d.getDate())
  }`
}

function weekRange(base=new Date()){
  const d=
    new Date(
      base.getFullYear(),
      base.getMonth(),
      base.getDate()
    );

  const day=
    (d.getDay()+6)%7;

  const st=
    new Date(d);

  st.setDate(
    d.getDate()-day
  );

  const ed=
    new Date(st);

  ed.setDate(
    st.getDate()+6
  );

  return[
    dateStr(st),
    dateStr(ed)
  ]
}

function previousWeekRange(){
  const d=new Date();
  d.setDate(d.getDate()-7);
  return weekRange(d)
}

function monthRange(){
  const d=new Date();

  const st=
    new Date(
      d.getFullYear(),
      d.getMonth(),
      1
    );

  const ed=
    new Date(
      d.getFullYear(),
      d.getMonth()+1,
      0
    );

  return[
    dateStr(st),
    dateStr(ed)
  ]
}

function classOptions(selected){
  const ids=[
    ...new Set([
      ...classes.map(c=>c.id),
      ...Object.keys(defaultRosters)
    ])
  ].sort();

  return ids.map(id=>`
    <option value="${esc(id)}" ${id===selected?'selected':''}>
      ${esc(id)}
    </option>`
  ).join('')
}

function summaryRangeByPeriod(period){
  if(period==='lastweek')
    return previousWeekRange();

  if(period==='month')
    return monthRange();

  return weekRange()
}

function getRoster(classId){
  const c=
    classes.find(x=>x.id===classId);

  if(c?.students?.length)
    return[...c.students]
      .sort(
        (a,b)=>Number(a.seat)-Number(b.seat)
      );

  return(defaultRosters[classId]||[])
    .map(([seat,name])=>({
      id:String(seat),
      seat,
      name
    }))
}

function sidCandidates(s){
  return[
    ...new Set([
      s.id,
      String(s.seat),
      pad2(s.seat),
      `${s.seat}`
    ]
    .filter(
      v=>v!==undefined&&v!==null
    )
    .map(String))
  ]
}

function lookupMap(map,s){
  for(const k of sidCandidates(s)){
    if(
      map &&
      Object.prototype.hasOwnProperty.call(
        map,
        k
      )
    ){
      return map[k]
    }
  }

  return undefined
}

function inRange(x,start,end){
  const d=
    String(x.date||'');

  return d&&d>=start&&d<=end
}

function subjectOnly(x){
  return(
    x.scopeType==='subject' ||
    subjects.includes(x.scopeName)
  )
}

function collectionInfo(item,s){
  const raw=
    lookupMap(
      item.records||{},
      s
    );

  let status=
    raw||'submitted';

  const late=
    !!lookupMap(
      item.lateSubmitted||{},
      s
    )||
    status==='late';

  if(status==='late')
    status='submitted';

  const labels={
    submitted:'已繳',
    missing:'未繳',
    exempt:'免繳'
  };

  return{
    status,
    late,
    label:
      late
        ?'補交'
        :(labels[status]||status)
  }
}

function scoreInfo(item,s){
  const r=
    lookupMap(
      item.scores||{},
      s
    )||{};

  const status=
    r.status||
    (
      r.score!==null &&
      r.score!==undefined &&
      r.score!==''
        ?'normal'
        :'not_entered'
    );

  const labels={
    normal:'正常',
    absent:'缺考',
    makeup:'補考',
    exempt:'免試',
    not_entered:'未登記'
  };

  const has=
    r.score!==null &&
    r.score!==undefined &&
    r.score!=='' &&
    !Number.isNaN(Number(r.score));

  return{
    score:
      has
        ?Number(r.score)
        :null,

    status,

    label:
      labels[status]||status
  }
}

function renderSummaryResult(st){
  const box=
    $('#summaryResult');

  if(!box)return;

  const roster=
    getRoster(st.classId);

  const src=
    (
      st.type==='collection'
        ?collections
        :assessments
    )
    .filter(x=>
      (x.semester||'')===st.semester &&
      x.classId===st.classId &&
      subjectOnly(x) &&
      inRange(
        x,
        st.start,
        st.end
      )
    );

  const usedSubjects=
    subjects.filter(
      sub=>
        src.some(
          x=>x.scopeName===sub
        )
    );

  const extra=[
    ...new Set(
      src.map(x=>x.scopeName)
        .filter(
          x=>
            x &&
            !subjects.includes(x)
        )
    )
  ].sort();

  const subs=[
    ...usedSubjects,
    ...extra
  ];

  const title=
    st.type==='collection'
      ?'各科作業繳交彙整'
      :'各科成績彙整（逐筆成績）';

  box.innerHTML=`
    <div class="summary-info">
      ${esc(st.classId)}班 ｜
      ${esc(st.start)} ～ ${esc(st.end)} ｜
      共 ${src.length} 筆
      ${
        st.type==='collection'

function collectionSummaryTable(
  roster,
  src,
  subs
){
  return `
    <div class="table-wrap">
      <table class="summary-table">

        <thead>
          <tr>
            <th>座號</th>
            <th>姓名</th>

            ${
              subs.map(s=>
                `<th>${esc(s)}</th>`
              ).join('')
            }

            <th>未繳</th>
            <th>遲交</th>
          </tr>
        </thead>

        <tbody>
          ${
            roster.map(s=>{

              let missingTotal=0;
              let lateTotal=0;

              const cells=
                subs.map(sub=>{

                  const items=
                    src
                    .filter(
                      x=>x.scopeName===sub
                    )
                    .sort(
                      (a,b)=>
                        (a.date||'')
                        .localeCompare(
                          b.date||''
                        )
                    );

                  let done=0;
                  const notes=[];

                  for(const it of items){
                    const inf=
                      collectionInfo(
                        it,
                        s
                      );

                    if(inf.status!=='missing')
                      done++;

                    if(inf.status==='missing'){
                      missingTotal++;

                      notes.push(`
                        <div class="summary-item-line bad">
                          未繳 ${esc(it.itemName||'未命名')}
                        </div>
                      `)
                    }

                    if(inf.late){
                      lateTotal++;

                      notes.push(`
                        <div class="summary-item-line late">
                          補交 ${esc(it.itemName||'未命名')}
                        </div>
                      `)
                    }
                  }

                  return `
                    <td>
                      <div class="summary-cell">
                        ${done}/${items.length}
                        ${notes.join('')}
                      </div>
                    </td>`
                }).join('');

              return `
                <tr
                  class="summary-student-row"
                  data-seat="${s.seat}"
                  tabindex="0"
                >
                  <td>${s.seat}</td>

                  <td class="name">
                    ${esc(s.name)}
                  </td>

                  ${cells}

                  <td class="${
                    missingTotal
                      ?'summary-total-bad'
                      :'summary-total-good'
                  }">
                    ${missingTotal}
                  </td>

                  <td>
                    ${lateTotal}
                  </td>
                </tr>`
            }).join('')
          }
        </tbody>
      </table>
    </div>`
}

function scoreSummaryTable(
  roster,
  src,
  subs
){
  return `
    <div class="table-wrap">
      <table class="summary-table">

        <thead>
          <tr>
            <th>座號</th>
            <th>姓名</th>

            ${
              subs.map(s=>
                `<th>${esc(s)}</th>`
              ).join('')
            }
          </tr>
        </thead>

        <tbody>
          ${
            roster.map(s=>{

              const cells=
                subs.map(sub=>{

                  const items=
                    src
                    .filter(
                      x=>x.scopeName===sub
                    )
                    .sort((a,b)=>
                      (a.date||'')
                      .localeCompare(
                        b.date||''
                      ) ||
                      String(a.name||'')
                      .localeCompare(
                        String(b.name||''),
                        'zh-Hant'
                      )
                    );

                  return `
                    <td>
                      ${
                        items.map(it=>{

                          const inf=
                            scoreInfo(
                              it,
                              s
                            );

                          const val=
                            inf.score!==null
                              ?inf.score
                              :inf.label;

                          const extra=
                            inf.score!==null &&
                            inf.status!=='normal'
                              ?`（${inf.label}）`
                              :'';

                          return `
                            <span class="summary-score">
                              <b>
                                ${esc(it.name||'未命名')}：
                              </b>
                              ${esc(val)}
                              ${esc(extra)}
                            </span>`
                        }).join('')||
                        '—'
                      }
                    </td>`
                }).join('');

              return `
                <tr
                  class="summary-student-row"
                  data-seat="${s.seat}"
                  tabindex="0"
                >
                  <td>${s.seat}</td>

                  <td class="name">
                    ${esc(s.name)}
                  </td>

                  ${cells}
                </tr>`
            }).join('')
          }
        </tbody>
      </table>
    </div>`
}

function openStudentSummaryDetail(
  st,
  seat
){
  const roster=
    getRoster(st.classId);

  const student=
    roster.find(
      s=>String(s.seat)===String(seat)
    );

  if(!student)
    return alert(
      '找不到學生資料。'
    );

  const cols=
    collections.filter(x=>
      (x.semester||'')===st.semester &&
      x.classId===st.classId &&
      subjectOnly(x) &&
      inRange(
        x,
        st.start,
        st.end
      )
    );

  const ass=
    assessments.filter(x=>
      (x.semester||'')===st.semester &&
      x.classId===st.classId &&
      subjectOnly(x) &&
      inRange(
        x,
        st.start,
        st.end
      )
    );

  const allSubs=[
    ...new Set([
      ...cols.map(x=>x.scopeName),
      ...ass.map(x=>x.scopeName)
    ])
  ];

  const ordered=[
    ...subjects.filter(
      x=>allSubs.includes(x)
    ),

    ...allSubs
      .filter(
        x=>!subjects.includes(x)
      )
      .sort()
  ];

  const body=
    ordered.map(sub=>{

      const c=
        cols
        .filter(
          x=>x.scopeName===sub
        )
        .sort(
          (a,b)=>
            (a.date||'')
            .localeCompare(
              b.date||''
            )
        );

      const a=
        ass
        .filter(
          x=>x.scopeName===sub
        )
        .sort(
          (x,y)=>
            (x.date||'')
            .localeCompare(
              y.date||''
            )
        );

      return `
        <div class="detail-subject">
          ${esc(sub)}
        </div>

        <div class="detail-list">

          ${
            c.map(it=>{
              const inf=
                collectionInfo(
                  it,
                  student
                );

              return `
                <div class="detail-row">
                  <b>
                    📚 ${esc(it.itemName||'未命名作業')}
                  </b>

                  <span>
                    ${esc(it.date||'')}
                  </span>

                  <span class="status">
                    ${esc(inf.label)}
                  </span>
                </div>`
            }).join('')
          }

          ${
            a.map(it=>{
              const inf=
                scoreInfo(
                  it,
                  student
                );

              const v=
                inf.score!==null
                  ?`${inf.score}${
                    inf.status!=='normal'
                      ?`（${inf.label}）`
                      :''
                  }`
                  :inf.label;

              return `
                <div class="detail-row">
                  <b>
                    📊 ${esc(it.name||'未命名成績')}
                  </b>

                  <span>
                    ${esc(it.date||'')}
                  </span>

                  <span class="status">
                    ${esc(v)}
                    ${
                      it.maxScore
                        ?` / ${esc(it.maxScore)}`
                        :''
                    }
                  </span>
                </div>`
            }).join('')
          }

          ${
            !c.length&&!a.length
              ?'<div class="sub">無資料</div>'
              :''
          }
        </div>`
    }).join('');

  showModal(`
    <div class="summary-head">

      <div>
        <div class="section-title">
          ${student.seat}號
          ${esc(student.name)}｜
          期間明細
        </div>

        <div class="meta">
          ${esc(st.classId)}班｜
          ${esc(st.start)} ～ ${esc(st.end)}
        </div>
      </div>

      <div>
        <button
          class="btn gray"
          id="backSummary"
        >
          ← 返回彙整
        </button>

        <button class="btn gray close-modal">
          ✖ 關閉
        </button>
      </div>
    </div>

    <div class="detail-section">
      ${
        body||
        '<div class="notice">這段期間沒有作業或成績資料。</div>'
      }
    </div>
  `);

  $('#backSummary').onclick=
    ()=>openSummary(
      st.type,
      st
    )
}

function summaryPlainRows(st){
  const roster=
    getRoster(st.classId);

  const src=
    (
      st.type==='collection'
        ?collections
        :assessments
    )
    .filter(x=>
      (x.semester||'')===st.semester &&
      x.classId===st.classId &&
      subjectOnly(x) &&
      inRange(
        x,
        st.start,
        st.end
      )
    );

  if(st.type==='collection'){
    return roster.flatMap(s=>
      src
      .sort((a,b)=>
        (a.scopeName||'')
        .localeCompare(
          b.scopeName||'',
          'zh-Hant'
        ) ||
        (a.date||'')
        .localeCompare(
          b.date||''
        )
      )
      .map(it=>{

        const inf=
          collectionInfo(
            it,
            s
          );

        return{
          學期:st.semester,
          班級:st.classId,
          期間:`${st.start}~${st.end}`,
          座號:s.seat,
          姓名:s.name,
          科目:it.scopeName,
          項目:it.itemName||'',
          日期:it.date||'',
          狀態:inf.label
        }
      })
    )
  }

  return roster.flatMap(s=>
    src
    .sort((a,b)=>
      (a.scopeName||'')
      .localeCompare(
        b.scopeName||'',
        'zh-Hant'
      ) ||
      (a.date||'')
      .localeCompare(
        b.date||''
      )
    )
    .map(it=>{

      const inf=
        scoreInfo(
          it,
          s
        );

      return{
        學期:st.semester,
        班級:st.classId,
        期間:`${st.start}~${st.end}`,
        座號:s.seat,
        姓名:s.name,
        科目:it.scopeName,
        成績項目:it.name||'',
        日期:it.date||'',
        滿分:it.maxScore??'',
        成績:inf.score??'',
        狀態:inf.label
      }
    })
  )
}

async function ensureAdminXLSX(){
  if(window.XLSX)return;

  await new Promise(
    (resolve,reject)=>{
      const e=
        document.createElement('script');

      e.src=
        'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

      e.onload=resolve;

      e.onerror=
        ()=>reject(
          new Error(
            'Excel 元件載入失敗'
          )
        );

      document.head.appendChild(e)
    }
  )
}

async function downloadSummaryExcel(st){
  try{
    await ensureAdminXLSX();

    const rows=
      summaryPlainRows(st);

    const ws=
      XLSX.utils.json_to_sheet(rows);

    const wb=
      XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      st.type==='collection'
        ?'作業繳交'
        :'逐筆成績'
    );

    XLSX.writeFile(
      wb,
      `${st.classId}-${st.start}_${st.end}-${
        st.type==='collection'
          ?'作業繳交彙整'
          :'逐筆成績彙整'
      }.xlsx`
    )

  }catch(e){
    alert(
      e.message||
      '下載 Excel 失敗'
    )
  }
}

function summaryText(st){
  const rows=
    summaryPlainRows(st);

  if(!rows.length)
    return `${st.classId}班 ${st.start}～${st.end}\n無資料。`;

  if(st.type==='collection'){
    const unpaid=
      rows.filter(
        r=>r.狀態==='未繳'
      );

    const late=
      rows.filter(
        r=>r.狀態==='補交'
      );

    return `${st.classId}班｜${st.start}～${st.end}
各科作業繳交

未繳：${
  unpaid.length
    ?`\n${
      unpaid.map(r=>
        `${r.座號}號 ${r.姓名}｜${r.科目}｜${r.項目}`
      ).join('\n')
    }`
    :'無'
}

補交：${
  late.length
    ?`\n${
      late.map(r=>
        `${r.座號}號 ${r.姓名}｜${r.科目}｜${r.項目}`
      ).join('\n')
    }`
    :'無'
}`
  }

  const roster=
    getRoster(st.classId);

  const src=
    assessments.filter(x=>
      (x.semester||'')===st.semester &&
      x.classId===st.classId &&
      subjectOnly(x) &&
      inRange(
        x,
        st.start,
        st.end
      )
    );

  return `${st.classId}班｜${st.start}～${st.end}
各科逐筆成績

`+
  roster.map(s=>
    `${s.seat}號 ${s.name}
`+
    subjects
    .filter(sub=>
      src.some(
        x=>x.scopeName===sub
      )
    )
    .map(sub=>
      `${sub}：`+
      src
      .filter(
        x=>x.scopeName===sub
      )
      .sort(
        (a,b)=>
          (a.date||'')
          .localeCompare(
            b.date||''
          )
      )
      .map(it=>{
        const inf=
          scoreInfo(
            it,
            s
          );

        return `${it.name||'未命名'} ${
          inf.score!==null
            ?inf.score
            :inf.label
        }`
      })
      .join('、')
    )
    .join('\n')
  )
  .join('\n\n')
}

async function copySummary(st,mode){
  const text=
    mode==='text'
      ?summaryText(st)
      :summaryPlainRows(st)
        .map((r,i)=>
          (
            i===0
              ?Object.keys(r).join('\t')+'\n'
              :''
          )+
          Object.values(r).join('\t')
        )
        .join('\n');

  try{
    await navigator.clipboard.writeText(text);

    alert(
      mode==='text'
        ?'文字摘要已複製。'
        :'表格資料已複製，可直接貼到 Excel、試算表或文件。'
    )
  }catch{
    prompt(
      '請手動複製以下內容：',
      text
    )
  }
}

async function saveStudentRegistryClass(){
  const classId=
    $('#registryClass').value;

  const inputs=
    $$('.student-reg-email');

  if(!confirm(
    `確定儲存 ${classId} 班的 Google Email 對照名單？`
  ))return;

  for(const inp of inputs){

    const email=
      registryId(inp.value);

    const seat=
      Number(inp.dataset.seat);

    const name=
      inp.dataset.name;

    const oldId=
      inp.dataset.oldid;

    if(!email)continue;

    const oldReg=
      oldId
        ?registries.find(
          r=>r.id===oldId
        )
        :registryByStudent(
          classId,
          seat
        );

    if(
      oldReg?.linkedUid &&
      oldReg.id!==email
    ){
      alert(
        `${seat}號 ${name} 已完成連動，不能直接更換 Email。請先確認連動身分後再處理。`
      );

      continue
    }

    const assignments=
      mergeAssignments(
        oldReg?.assignments||[],
        presetAssignmentsForStudent(
          classId,
          seat
        )
      );

    await setDoc(
      doc(
        db,
        'identityRegistry',
        email
      ),
      {
        email,
        username:
          `${classId}${String(seat).padStart(2,'0')}`,

        displayName:name,
        type:'student',
        classId,
        seat,

        active:
          oldReg?.active!==false,

        linked:
          !!oldReg?.linkedUid,

        linkedUid:
          oldReg?.linkedUid||null,

        linkedAt:
          oldReg?.linkedAt||null,

        lastLoginAt:
          oldReg?.lastLoginAt||null,

        assignments,

        updatedAt:
          serverTimestamp()
      },
      {merge:true}
    );

    if(
      oldId &&
      oldId!==email &&
      !oldReg?.linkedUid
    ){
      await deleteDoc(
        doc(
          db,
          'identityRegistry',
          oldId
        )
      )
    }
  }

  await audit(
    'save_student_registry',
    'identityRegistry',
    classId,
    `更新 ${classId} 學生 Google Email 對照`
  );

  await refreshAll();

  alert(
    '✅ 學生 Email 對照名單已儲存。'
  )
}

function applyStudentRegistryPaste(){
  const text=
    $('#studentRegistryPaste')
      .value
      .trim();

  if(!text)return;

  const map=
    new Map();

  text
  .split(/\r?\n/)
  .map(x=>x.trim())
  .filter(Boolean)
  .forEach(line=>{
    const p=
      line
      .split(/[,，\t]/)
      .map(x=>x.trim());

    if(p.length>=3)
      map.set(
        Number(p[0]),
        p[p.length-1]
      )
  });

  $$('.student-reg-email')
    .forEach(inp=>{
      const e=
        map.get(
          Number(inp.dataset.seat)
        );

      if(e)
        inp.value=e
    });

  alert(
    '已套用到上方欄位，請再按「儲存這班 Email」。'
  )
}

async function addTeacherRegistry(){

    return alert(

  const existing=
    registries.find(

    );

    type:'teacher',

      existing?.assignments||[],

async function applyTeacherRegistryPaste(){
  const lines=
    $('#teacherPaste')
    .value
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(!lines.length)
    return alert(
      '請貼上教師資料。'
    );

  for(const line of lines){
    const p=
      line
      .split(/[,，\t]/)
      .map(x=>x.trim());

    if(p.length<2)continue;

    const displayName=p[0];

    const email=
      registryId(p[1]);

    if(!email)continue;

    const existing=
      registries.find(
        r=>r.id===email
      );

    await saveRegistry({
      ...(existing||{}),
      email,
      displayName,
      type:'teacher',

      active:
        existing?.active!==false,

      assignments:
        existing?.assignments||[],

      linked:
        !!existing?.linkedUid,

      linkedUid:
        existing?.linkedUid||null
    })
  }

  await audit(
    'batch_teacher_registry',
    'identityRegistry',
    'teachers',
    `批次加入 ${lines.length} 筆教師資料`
  );

  await refreshAll();

  alert(
    '✅ 任課教師名單已加入。'
  )
}

        reg.id,
        `新增任課 ${a.semester} ${a.classId} ${a.scopeName}`,
        a.semester

    };

async function toggleUser(uid){
  const u=
    users.find(x=>x.uid===uid);

  const active=
    !u.active;

  if(!confirm(
    `確定${active?'啟用':'停用'} ${u.displayName} 的帳號？`
  ))return;

  await updateDoc(
    doc(db,'users',uid),
    {
      active,
      updatedAt:serverTimestamp()
    }
  );

  await audit(
    active
      ?'enable_user'
      :'disable_user',
    'user',
    uid,
    `${active?'啟用':'停用'}帳號：${u.username}`
  );

  await refreshAll()
}

async function saveAssignments(
  u,
  assignments
){
  const access=
    computeAccess(
      assignments,
      currentSemester
    );

  await updateDoc(
    doc(db,'users',u.uid),
    {
      assignments,
      ...access,
      updatedAt:serverTimestamp()
    }
  );

  await audit(
    'permissions',
    'user',
    u.uid,
    `更新權限：${u.username}`
  );

  u.assignments=assignments;

  Object.assign(u,access)
}

          不會破壞歷史資料。
        </div>

        <button
          id="seedClasses"
          class="btn primary"
        >
          建立／更新預設班級名單
        </button>

        <hr style="border:none;border-top:1px solid #e4e7ec;margin:15px 0">

        <b>新增自訂班級</b>

        <div class="field">
          <label>班級</label>

          <input
            id="classId"
            placeholder="例如 805"
          >
        </div>

        <div class="field">
          <label>
            名單（每行：座號,姓名）
          </label>

          <textarea
            id="classRoster"
            rows="10"
            placeholder="1,王小明
2,李小華"
          ></textarea>
        </div>

        <button
          id="saveClass"
          class="btn primary"
        >
          儲存班級
        </button>
      </div>
    </div>`;

  $('#seedClasses').onclick=
    seedClasses;

  $('#saveClass').onclick=
    ()=>saveClass(
      $('#classId').value,
      $('#classRoster').value
    );

  $$('.edit-class')
    .forEach(b=>
      b.onclick=
        ()=>editClass(
          b.dataset.id
        )
    )
}

async function seedClasses(){
  for(
    const[id,arr]
    of Object.entries(defaultRosters)
  ){
    const existing=
      classDocLocal(id);

    const oldStudents=
      existing?.students||[];

    const bySeat=
      new Map(
        oldStudents.map(
          s=>[Number(s.seat),s]
        )
      );

    for(const[seat,name]of arr){
      const old=
        bySeat.get(Number(seat));

      if(old){
        bySeat.set(
          Number(seat),
          {
            ...old,
            id:String(seat),
            seat:Number(seat),
            name:old.name||name
          }
        )
      }else{
        bySeat.set(
          Number(seat),
          {
            id:String(seat),
            seat:Number(seat),
            name,
            active:true
          }
        )
      }
    }

    await setDoc(
      doc(db,'classes',id),
      {
        classId:id,

        students:[
          ...bySeat.values()
        ].sort(
          (a,b)=>
            Number(a.seat)-Number(b.seat)
        ),

        updatedAt:
          serverTimestamp()
      },
      {merge:true}
    )
  }

  await audit(
    'seed',
    'classes',
    'default',
    '建立／更新預設班級名單'
  );

  await refreshAll();

  alert(
    '預設班級名單已建立／補齊；既有轉出狀態不會被覆蓋。'
  )
}

function parseRoster(text){
  return text
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean)
    .map(line=>{
      const[seat,...rest]=
        line.split(/[,，\t]/);

      return{
        id:String(Number(seat)),
        seat:Number(seat),
        name:rest.join('').trim(),
        active:true
      }
    })
    .filter(
      x=>x.seat&&x.name
    )
    .sort(
      (a,b)=>a.seat-b.seat
    )
}

async function saveClass(id,text){
  id=id.trim();

  if(!id)
    return alert(
      '請輸入班級'
    );

  const students=
    parseRoster(text);

  if(!students.length)
    return alert(
      '請輸入名單'
    );

  await setDoc(
    doc(db,'classes',id),
    {
      classId:id,
      students,
      updatedAt:serverTimestamp()
    },
    {merge:true}
  );

  await audit(
    'save_class',
    'class',
    id,
    `更新班級名單 ${id}`
  );

  await refreshAll();

  alert('已儲存')
}

        </div>
      </div>

      <button class="btn gray close-modal">
        關閉
      </button>
    </div>

    <div class="toolbar">
      <button
        id="addStudentBtn"
        class="btn primary"
      >
        ＋ 新增學生

function renderClassStudentManager(id){
  const c=
    classDocLocal(id);

  if(!c)return;

  const all=[
    ...(c.students||[])
  ].sort(
    (a,b)=>
      Number(a.seat)-Number(b.seat)
  );

  const active=
    all.filter(
      s=>s.active!==false
    );

  const inactive=
    all.filter(
      s=>s.active===false
    );

  $('#activeStudentList').innerHTML=`
    <div class="section-title">
      目前在班 ${active.length} 人
    </div>

    <div class="table-wrap">
      <table>

        <thead>
          <tr>
            <th>座號</th>
            <th>姓名</th>
            <th>Google 連動</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody>
          ${
            active.map(s=>{

              const reg=
                registryByStudent(
                  id,
                  s.seat
                );

              return `
                <tr>
                  <td>${s.seat}</td>

                  <td>
                    <b>${esc(s.name)}</b>
                  </td>

                  <td>
                    ${
                      reg?.linkedUid
                        ?'🟢 已連動'
                        :reg
                          ?'⚪ Email已建'
                          :'—'
                    }
                  </td>

                  <td>
                    <button
                      class="btn gray small edit-student"
                      data-seat="${s.seat}"
                    >
                      編輯
                    </button>

                    <button
                      class="btn danger small transfer-out"
                      data-seat="${s.seat}"
                    >
                      🚪 標記轉出
                    </button>
                  </td>
                </tr>`
            }).join('')
          }
        </tbody>
      </table>
    </div>`;

  $('#inactiveStudentList').innerHTML=`
    <div class="section-title">
      已轉出 ${inactive.length} 人
    </div>

    ${
      inactive.length
        ?`
          <div class="table-wrap">
            <table>

              <thead>
                <tr>
                  <th>原座號</th>
                  <th>姓名</th>
                  <th>轉出學期</th>
                  <th>操作</th>
                </tr>
              </thead>

              <tbody>
                ${
                  inactive.map(s=>`
                    <tr>
                      <td>${s.seat}</td>

                      <td>
                        <b>${esc(s.name)}</b>
                      </td>

                      <td>
                        ${esc(s.transferredOutSemester||'')}
                      </td>

                      <td>
                        <button
                          class="btn good small restore-student"
                          data-seat="${s.seat}"
                        >
                          ↩ 恢復在班
                        </button>

                        <button
                          class="btn gray small edit-student"
                          data-seat="${s.seat}"
                        >
                          編輯
                        </button>
                      </td>
                    </tr>`
                  ).join('')
                }
              </tbody>
            </table>
          </div>`
        :'<div class="meta">目前沒有轉出學生。</div>'
    }`;

  $$('.edit-student')
    .forEach(b=>
      b.onclick=
        ()=>editStudentInClass(
          id,
          Number(b.dataset.seat)
        )
    );

  $$('.transfer-out')
    .forEach(b=>
      b.onclick=
        ()=>transferOutStudent(
          id,
          Number(b.dataset.seat)
        )
    );

  $$('.restore-student')
    .forEach(b=>
      b.onclick=
        ()=>restoreStudent(
          id,
          Number(b.dataset.seat)
        )
    )
}

async function saveClassStudents(
  id,
  students,
  detail
){
  await setDoc(
    doc(db,'classes',id),
    {
      classId:id,

      students:[
        ...students
      ].sort(
        (a,b)=>
          Number(a.seat)-Number(b.seat)
      ),

      updatedAt:
        serverTimestamp()
    },
    {merge:true}
  );

  const c=
    classDocLocal(id);

  if(c)
    c.students=students;

  await audit(
    'class_students',
    'class',
    id,
    detail
  );

  await refreshAll()
}

async function addStudentToClass(id){
  const c=
    classDocLocal(id);

  if(!c)return;

  const seat=
    Number(
      prompt(
        `新增 ${id} 班學生\n請輸入座號：`
      )
    );

  if(
    !Number.isInteger(seat) ||
    seat<=0
  )
    return alert(
      '座號格式不正確。'
    );

  if(
    (c.students||[])
    .some(
      s=>Number(s.seat)===seat
    )
  )
    return alert(
      `${seat} 號已存在。若是原學生回班，請使用「恢復在班」。`
    );

  const name=
    (
      prompt(
        '請輸入學生姓名：'
      )||''
    ).trim();

  if(!name)return;

  const students=[
    ...(c.students||[]),
    {
      id:String(seat),
      seat,
      name,
      active:true,
      joinedSemester:
        currentSemester
    }
  ];

  await saveClassStudents(
    id,
    students,
    `新增學生：${seat} ${name}`
  );

  editClass(id);

  alert(
    `✅ 已新增 ${id} 班 ${seat}號 ${name}。\n現在到「帳號連動／任課」就會看到他，可再填 Google Email。`
  )
}

async function transferOutStudent(
  id,
  seat
){
  const c=
    classDocLocal(id);

  const student=
    c?.students?.find(
      s=>Number(s.seat)===seat
    );

  if(!student)return;

  if(!confirm(
    `確定將 ${seat}號 ${student.name} 標記為「已轉出」？\n\n舊收繳、成績與歷史紀錄都會保留，但目前在班名單不再顯示；若已連動 Google 帳號，也會停用系統存取。`
  ))return;

  const students=
    c.students.map(s=>
      Number(s.seat)===seat
        ?{
          ...s,
          active:false,
          transferredOutSemester:
            currentSemester,
          transferredOutAt:
            new Date().toISOString()
        }
        :s
    );

  const reg=
    registryByStudent(
      id,
      seat
    );

  if(reg){
    reg.active=false;
    await saveRegistry(reg)
  }

  await saveClassStudents(
    id,
    students,
    `學生轉出：${seat} ${student.name}`
  );

  editClass(id)
}

async function restoreStudent(
  id,
  seat
){
  const c=
    classDocLocal(id);

  const student=
    c?.students?.find(
      s=>Number(s.seat)===seat
    );

  if(!student)return;

  if(!confirm(
    `確定恢復 ${seat}號 ${student.name} 為目前在班學生？`
  ))return;

  const students=
    c.students.map(s=>
      Number(s.seat)===seat
        ?{
          ...s,
          active:true,
          transferredOutSemester:null,
          transferredOutAt:null
        }
        :s
    );

  const reg=
    registryByStudent(
      id,
      seat
    );

  if(reg){
    reg.active=true;
    await saveRegistry(reg)
  }

  await saveClassStudents(
    id,
    students,
    `恢復學生：${seat} ${student.name}`
  );

  editClass(id)
}

async function editStudentInClass(
  id,
  oldSeat
){
  const c=
    classDocLocal(id);

  const student=
    c?.students?.find(
      s=>Number(s.seat)===oldSeat
    );

  if(!student)return;

  const newSeat=
    Number(
      prompt(
        '修改座號：',
        String(student.seat)
      )
    );

  if(
    !Number.isInteger(newSeat) ||
    newSeat<=0
  )
    return alert(
      '座號格式不正確。'
    );

  if(
    newSeat!==oldSeat &&
    (c.students||[])
    .some(
      s=>Number(s.seat)===newSeat
    )
  )
    return alert(
      `${newSeat} 號已有人使用。`
    );

  const newName=
    (
      prompt(
        '修改姓名：',
        student.name
      )||''
    ).trim();

  if(!newName)return;

  const students=
    c.students.map(s=>
      Number(s.seat)===oldSeat
        ?{
          ...s,
          id:String(newSeat),
          seat:newSeat,
          name:newName
        }
        :s
    );

  const roleAssignments=
    structuredClone(
      c.roleAssignments||{}
    );

  for(
    const roles
    of Object.values(roleAssignments)
  ){
    for(
      const who
      of Object.values(roles||{})
    ){
      if(
        Number(who?.seat)===oldSeat
      ){
        who.seat=newSeat;
        who.name=newName
      }
    }
  }

  await setDoc(
    doc(db,'classes',id),
    {
      classId:id,
      students,
      roleAssignments,
      updatedAt:serverTimestamp()
    },
    {merge:true}
  );

  c.students=students;
  c.roleAssignments=roleAssignments;

  const reg=
    registryByStudent(
      id,
      oldSeat
    );

  if(reg){
    reg.seat=newSeat;
    reg.displayName=newName;

    reg.username=
      `${id}${String(newSeat).padStart(2,'0')}`;

    await saveRegistry(reg)
  }

  await audit(
    'edit_student',
    'class',
    id,
    `修改學生：${oldSeat} ${student.name} → ${newSeat} ${newName}`
  );

  await refreshAll();

  editClass(id);

  alert(
    '✅ 學生資料已更新，既有 Google UID 連動會保留。'
  )
}

async function renderAudit(){
  let logs=[];

  try{
    const s=
      await getDocs(
        query(
          collection(db,'auditLogs'),
          orderBy('createdAt','desc')
        )
      );

    logs=
      s.docs
      .slice(0,250)
      .map(d=>d.data());

  }catch(e){
    const s=
      await getDocs(
        collection(db,'auditLogs')
      );

    logs=
      s.docs
      .map(d=>d.data())
      .slice(-250)
      .reverse()
  }

  $('#page-audit').innerHTML=`
    <div class="card">

      <div class="section-title">
        最近操作紀錄
      </div>

      <div class="table-wrap">
        <table>

          <thead>
            <tr>
              <th>時間</th>
              <th>學期</th>
              <th>操作者</th>
              <th>動作</th>
              <th>內容</th>
            </tr>
          </thead>

          <tbody>
            ${
              logs.map(l=>`
                <tr>
                  <td>
                    ${
                      l.createdAt?.toDate
                        ?l.createdAt
                          .toDate()
                          .toLocaleString('zh-TW')
                        :''
                    }
                  </td>

                  <td>
                    ${esc(l.semester||'')}
                  </td>

                  <td>
                    ${esc(l.actorName||'')}
                  </td>

                  <td>
                    ${esc(l.action||'')}
                  </td>

                  <td>
                    ${esc(l.detail||'')}
                  </td>
                </tr>`
              ).join('')
            }
          </tbody>
        </table>
      </div>
    </div>`
}

function showModal(h){
  $('#modalBody').innerHTML=h;
  $('#modal').classList.remove('hidden');

  $('.close-modal')
    ?.addEventListener(
      'click',
      hideModal
    )
}

function hideModal(){
  $('#modal').classList.add('hidden');
  $('#modalBody').innerHTML=''
}
