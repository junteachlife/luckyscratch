<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮水印背景網頁範例</title>
    <style>
        /* 設定基本網頁樣式 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f4f4; /* 網頁底色 */
            position: relative;
            overflow: hidden;
        }

        /* 製作浮水印背景層 */
        .watermark-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('image.png'); /* 替換成你的圖片檔名 */
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain; /* 可改為 cover 鋪滿畫面 */
            opacity: 0.15; /* 調整透明度做出浮水印感覺 (數值越小越淡) */
            pointer-events: none; /* 確保滑鼠點擊事件可以穿透背景，不影響上方內容操作 */
            z-index: -1; /* 確保背景在內容下方 */
        }

        /* 網頁上的主要內容樣式 */
        .content {
            text-align: center;
            z-index: 1;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- 浮水印背景層 -->
    <div class="watermark-bg"></div>

    <!-- 網頁主要內容 -->
    <div class="content">
        <h1>歡迎來到我的網頁</h1>
        <p>這是一個帶有浮水印背景的範例畫面。</p>
    </div>

</body>
</html>
