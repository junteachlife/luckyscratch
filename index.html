<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>教師航海基地｜海賊地圖模式</title>

  <!-- 網頁小圖示：航 -->
  <link
    rel="icon"
    href='data:image/svg+xml,
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="%23131b35"/>
      <circle cx="50" cy="50" r="40" fill="%23f6c344" stroke="%238b4a14" stroke-width="6"/>
      <text x="50" y="66" text-anchor="middle" font-size="56" font-weight="900"
            font-family="Arial,sans-serif" fill="%23a51f2a">航</text>
    </svg>'
  />

  <meta name="theme-color" content="#0b1730" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #f6c453;
      --gold-light: #ffe18b;
      --paper: #e7cd91;
      --paper-light: #f4e0ae;
      --paper-dark: #b58c4f;
      --ink: #3b2818;
      --red: #c83b45;
      --blue: #14325f;
      --deep-blue: #081426;
      --sea: #0f3154;
      --wood: #70401f;
      --wood-dark: #3a2115;
      --white: #fffaf0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);

      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background:
        radial-gradient(circle at 18% 12%, rgba(60,110,200,.22), transparent 28%),
        radial-gradient(circle at 82% 20%, rgba(246,196,83,.14), transparent 24%),
        linear-gradient(180deg, #07111f, #0d2543 56%, #081523);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: .12;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.035) 0,
          rgba(255,255,255,.035) 1px,
          transparent 1px,
          transparent 5px
        );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       背景
    ========================= */

    .sea-glow {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -80px;
      height: 320px;
      pointer-events: none;
      z-index: -1;

      background:
        radial-gradient(
          ellipse at center,
          rgba(43,180,230,.32),
          transparent 68%
        );

      filter: blur(18px);
    }

    .floating-bg {
      position: fixed;
      pointer-events: none;
      z-index: -1;
      opacity: .07;
      user-select: none;
      animation: drift 9s ease-in-out infinite;
    }

    .bg1 {
      top: 8%;
      left: 4%;
      font-size: 120px;
    }

    .bg2 {
      top: 22%;
      right: 3%;
      font-size: 140px;
      animation-delay: -2s;
    }

    .bg3 {
      bottom: 9%;
      left: 6%;
      font-size: 110px;
      animation-delay: -4s;
    }

    .bg4 {
      bottom: 15%;
      right: 7%;
      font-size: 105px;
      animation-delay: -6s;
    }

    @keyframes drift {
      0%, 100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-14px) rotate(4deg);
      }
    }

    /* =========================
       頁首
    ========================= */

    .hero {
      padding: 34px 18px 22px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      margin-bottom: 16px;
      padding: 8px 16px;

      border: 2px solid rgba(246,196,83,.72);
      border-radius: 999px;

      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;

      background: rgba(6,14,28,.72);

      box-shadow:
        0 7px 22px rgba(0,0,0,.28),
        inset 0 0 12px rgba(246,196,83,.08);
    }

    .hero-logo {
      width: 108px;
      height: 108px;
      margin: 0 auto 15px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      border: 6px solid #f4d368;

      background:
        radial-gradient(circle at 35% 30%, #ffe89b, #e8a12b 58%, #804217 100%);

      box-shadow:
        0 0 0 5px #6d3b1b,
        0 15px 30px rgba(0,0,0,.4),
        0 0 28px rgba(246,196,83,.22);

      animation: logoFloat 4s ease-in-out infinite;
    }

    .hero-logo span {
      font-size: 56px;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-7px) rotate(2deg);
      }
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1.08;
      font-weight: 1000;
      letter-spacing: 2px;

      text-shadow:
        0 4px 0 #721b24,
        0 8px 18px rgba(0,0,0,.48);
    }

    .hero h1 .gold {
      color: var(--gold);
    }

    .hero h1 .red {
      color: #e24a52;
    }

    .hero p {
      max-width: 780px;
      margin: 13px auto 0;
      color: #dce7ff;
      font-size: clamp(14px, 2.5vw, 18px);
      line-height: 1.75;
      font-weight: 700;
    }

    /* =========================
       公告
    ========================= */

    .notice {
      width: min(900px, calc(100% - 30px));
      margin: 4px auto 26px;
      padding: 15px 18px;

      color: #332417;
      text-align: center;
      font-weight: 900;
      line-height: 1.65;

      border: 3px solid #76451f;
      border-radius: 10px;

      background:
        radial-gradient(circle at 18% 28%, rgba(110,61,27,.09), transparent 20%),
        radial-gradient(circle at 82% 65%, rgba(110,61,27,.11), transparent 22%),
        linear-gradient(135deg, #f3dfaa, #dbb66d);

      box-shadow:
        0 8px 0 #422417,
        0 17px 32px rgba(0,0,0,.31);
    }

    /* =========================
       地圖外框
    ========================= */

    .map-wrap {
      width: min(1220px, calc(100% - 24px));
      margin: 0 auto 50px;
    }

    .map-frame {
      position: relative;
      padding: 22px;

      border: 7px solid #6b3a1b;
      border-radius: 26px;

      background:
        linear-gradient(145deg, #8a542b, #4b2918);

      box-shadow:
        0 14px 0 #2e1a11,
        0 26px 48px rgba(0,0,0,.46),
        inset 0 0 16px rgba(255,255,255,.08);
    }

    .map {
      position: relative;
      min-height: 920px;
      overflow: hidden;

      border: 4px solid #a6783d;
      border-radius: 18px;

      background:
        radial-gradient(circle at 22% 17%, rgba(120,86,42,.12), transparent 19%),
        radial-gradient(circle at 75% 33%, rgba(120,86,42,.10), transparent 20%),
        radial-gradient(circle at 40% 80%, rgba(120,86,42,.12), transparent 20%),
        linear-gradient(135deg, #efd9a1, #d8b873 55%, #c99d5b);

      box-shadow:
        inset 0 0 55px rgba(73,43,18,.28);
    }

    .map::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .35;

      background:
        repeating-radial-gradient(
          circle at 20% 30%,
          transparent 0 20px,
          rgba(93,55,24,.05) 21px 22px
        );
    }

    /* =========================
       航線
    ========================= */

    .route-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .route {
      fill: none;
      stroke: rgba(91,57,26,.65);
      stroke-width: 5;
      stroke-dasharray: 14 14;
      stroke-linecap: round;
    }

    .route-glow {
      fill: none;
      stroke: rgba(255,239,163,.33);
      stroke-width: 10;
      stroke-linecap: round;
    }

    /* =========================
       羅盤
    ========================= */

    .compass {
      position: absolute;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      z-index: 2;

      width: 130px;
      height: 130px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      border: 6px solid #8b5a2a;

      background:
        radial-gradient(circle, #f2d891 0 36%, #d4ab61 37% 57%, #7a4c26 58% 64%, #e8c46f 65%);

      box-shadow:
        0 10px 24px rgba(69,43,22,.32),
        inset 0 0 16px rgba(87,50,20,.25);

      color: #54351f;
      font-size: 50px;

      animation: compassPulse 4s ease-in-out infinite;
    }

    @keyframes compassPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.04);
      }
    }

    /* =========================
       島嶼
    ========================= */

    .island {
      position: absolute;
      z-index: 3;

      width: 245px;
      min-height: 170px;

      padding: 20px 18px;

      border: 4px solid #77451f;
      border-radius: 44% 56% 50% 50% / 48% 42% 58% 52%;

      cursor: pointer;
      text-align: center;
      color: #302014;

      background:
        radial-gradient(circle at 42% 30%, #f2df9a 0 24%, transparent 25%),
        radial-gradient(circle at 70% 60%, rgba(61,130,70,.28), transparent 28%),
        linear-gradient(150deg, #e4cb83 0%, #c99450 68%, #a66837 100%);

      box-shadow:
        0 12px 0 #6a3c22,
        0 22px 32px rgba(67,40,20,.33),
        inset 0 0 18px rgba(255,255,255,.18);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .island:hover {
      transform: translateY(-10px) scale(1.04) rotate(-1deg);

      box-shadow:
        0 13px 0 #6a3c22,
        0 28px 38px rgba(67,40,20,.42),
        0 0 30px rgba(246,196,83,.33),
        inset 0 0 18px rgba(255,255,255,.2);
    }

    .island-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 8px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      border: 3px solid #885323;

      font-size: 36px;

      background:
        linear-gradient(145deg, #ffe79b, #d99d47);

      box-shadow:
        0 5px 0 #76451f,
        inset 0 2px 7px rgba(255,255,255,.35);
    }

    .island-title {
      font-size: 22px;
      font-weight: 1000;
      margin-bottom: 5px;
      color: #4b2d18;
    }

    .island-desc {
      font-size: 12px;
      line-height: 1.55;
      font-weight: 700;
      color: #6c4c2f;
    }

    .island-count {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 10px;
      border-radius: 999px;

      font-size: 11px;
      font-weight: 1000;

      color: #5c371b;

      background: rgba(255,248,218,.46);
      border: 1px solid rgba(101,62,31,.27);
    }

    /* 島嶼位置 */
    .island-class {
      top: 9%;
      left: 7%;
    }

    .island-learning {
      top: 12%;
      right: 7%;
    }

    .island-activity {
      top: 48%;
      left: 6%;
    }

    .island-life {
      top: 58%;
      right: 7%;
    }

    .island-external {
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
    }

    .island-external:hover {
      transform: translateX(-50%) translateY(-10px) scale(1.04);
    }

    /* =========================
       海浪 / 小船裝飾
    ========================= */

    .decor {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      opacity: .75;
    }

    .ship {
      left: 45%;
      top: 20%;
      font-size: 56px;
      animation: shipMove 6s ease-in-out infinite;
    }

    .waves1 {
      left: 35%;
      top: 34%;
      font-size: 46px;
      opacity: .45;
    }

    .waves2 {
      right: 26%;
      bottom: 18%;
      font-size: 52px;
      opacity: .42;
    }

    .treasure {
      left: 31%;
      bottom: 13%;
      font-size: 52px;
    }

    .cloud {
      right: 21%;
      top: 8%;
      font-size: 55px;
      opacity: .34;
    }

    @keyframes shipMove {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-10px) rotate(3deg);
      }
    }

    /* =========================
       工具面板
    ========================= */

    .panel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 18px;

      background: rgba(3,8,17,.72);
      backdrop-filter: blur(5px);
    }

    .panel-backdrop.show {
      display: flex;
    }

    .tool-panel {
      width: min(760px, 100%);
      max-height: 86vh;
      overflow: auto;

      border: 5px solid #76451f;
      border-radius: 20px;

      background:
        linear-gradient(145deg, #f1dca5, #d5b36d);

      box-shadow:
        0 14px 0 #3f2417,
        0 30px 60px rgba(0,0,0,.55);

      color: #352417;

      animation: panelIn .25s ease;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: scale(.94) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      padding: 18px 20px;

      border-bottom: 2px solid rgba(99,60,30,.25);

      background:
        linear-gradient(180deg, #f4e2af, #e2c47f);
    }

    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-big-icon {
      width: 50px;
      height: 50px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      border: 3px solid #855022;

      background: #f4d888;

      font-size: 28px;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 1000;
      color: #4b2e19;
    }

    .panel-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: #765437;
      font-weight: 700;
    }

    .close-btn {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 12px;

      cursor: pointer;

      background: #8f3d37;
      color: white;

      font-size: 19px;
      font-weight: 1000;

      box-shadow:
        0 4px 0 #53241f;
    }

    .tool-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;

      padding: 18px;
    }

    .tool-link {
      --accent: #3c8ad8;

      position: relative;
      overflow: hidden;

      min-height: 125px;
      padding: 15px;

      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;

      border: 3px solid #8a5a2b;
      border-radius: 16px;

      background:
        linear-gradient(145deg, #fff0c3, #d8b467);

      box-shadow:
        0 6px 0 #75451f,
        0 12px 20px rgba(83,50,24,.2);

      transition: transform .2s ease;
    }

    .tool-link:hover {
      transform: translateY(-4px);
    }

    .tool-link::before {
      content: "";
      position: absolute;

      width: 110px;
      height: 110px;

      top: -48px;
      left: -42px;

      border-radius: 50%;

      background: var(--accent);
      opacity: .13;
    }

    .tool-icon {
      width: 58px;
      height: 58px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      font-size: 29px;

      background:
        linear-gradient(145deg, rgba(255,255,255,.75), rgba(255,231,164,.9));

      border: 2px solid rgba(107,65,30,.34);
    }

    .tool-info {
      min-width: 0;
    }

    .tool-name {
      margin-bottom: 5px;
      font-size: 16px;
      font-weight: 1000;
      color: #3f2818;
    }

    .tool-desc {
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
      color: #795737;
    }

    .tool-open {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      color: #2e1c0d;
      font-weight: 1000;

      background:
        linear-gradient(180deg, #ffe687, #e4a53a);

      border: 1px solid rgba(104,66,28,.3);

      box-shadow:
        0 4px 0 #8a581d;
    }

    .t-class { --accent: #df4750; }
    .t-subclass { --accent: #3a9ce4; }
    .t-studentwork { --accent: #51c8f6; }
    .t-admin { --accent: #ff764e; }
    .t-exam { --accent: #f1c333; }
    .t-math { --accent: #8660e7; }
    .t-scratch { --accent: #f49c2c; }
    .t-seat { --accent: #2ab590; }
    .t-contact { --accent: #e264af; }
    .t-birthday { --accent: #ff7195; }
    .t-running { --accent: #2bc9c1; }
    .t-dojo { --accent: #35bf68; }

    /* =========================
       頁尾
    ========================= */

    footer {
      padding: 0 18px 32px;
      text-align: center;
      color: #90a4c8;
    }

    .footer-title {
      margin-bottom: 6px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .footer-text {
      font-size: 12px;
      line-height: 1.7;
    }

    /* =========================
       平板
    ========================= */

    @media (max-width: 900px) {
      .map {
        min-height: 1020px;
      }

      .island {
        width: 220px;
      }

      .compass {
        width: 115px;
        height: 115px;
      }
    }

    /* =========================
       手機：改成垂直航線
    ========================= */

    @media (max-width: 700px) {

      .hero {
        padding-top: 26px;
      }

      .hero-logo {
        width: 92px;
        height: 92px;
      }

      .hero-logo span {
        font-size: 47px;
      }

      .map-frame {
        padding: 12px;
        border-width: 5px;
        border-radius: 20px;
      }

      .map {
        min-height: auto;
        padding: 26px 14px 34px;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      .route-svg {
        display: none;
      }

      .compass {
        position: static;
        transform: none;

        width: 96px;
        height: 96px;

        margin: 4px auto;

        font-size: 39px;
      }

      .island,
      .island-class,
      .island-learning,
      .island-activity,
      .island-life,
      .island-external {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        left: auto;

        width: min(100%, 330px);
        min-height: 155px;

        transform: none;
      }

      .island:hover,
      .island-external:hover {
        transform: translateY(-6px) scale(1.02);
      }

      .island::after {
        content: "⋮";
        position: absolute;

        left: 50%;
        bottom: -34px;

        transform: translateX(-50%);

        color: rgba(95,59,27,.55);

        font-size: 34px;
        font-weight: 900;
      }

      .island:last-of-type::after {
        display: none;
      }

      .decor {
        display: none;
      }

      .tool-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .panel-header {
        align-items: flex-start;
      }

      .panel-big-icon {
        width: 44px;
        height: 44px;
        font-size: 24px;
      }

      .panel-title {
        font-size: 19px;
      }

      .tool-link {
        grid-template-columns: auto 1fr;
      }

      .tool-open {
        grid-column: 1 / -1;
        width: 100%;
        height: 33px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

  </style>
</head>

<body>

  <div class="sea-glow"></div>

  <div class="floating-bg bg1">⚓</div>
  <div class="floating-bg bg2">🧭</div>
  <div class="floating-bg bg3">🪙</div>
  <div class="floating-bg bg4">🗺️</div>

  <!-- 頁首 -->
  <header class="hero">

    <div class="badge">
      ⚓ TEACHER GRAND LINE ⚓
    </div>

    <div class="hero-logo">
      <span>🏴‍☠️</span>
    </div>

    <h1>
      <span class="gold">教師</span>
      <span class="red">航海地圖</span>
    </h1>

    <p>
      以航海地圖探索不同教學島嶼，
      點選島嶼即可展開該區工具。
      <br>
      所有系統都會以新分頁開啟。
    </p>

  </header>

  <div class="notice">
    🗺️ <strong>航海提示：</strong>
    點選地圖上的島嶼，即可查看該區所有工具。
    找到目的地後，再點選工具直接啟航。
  </div>


  <!-- 地圖 -->
  <main class="map-wrap">

    <div class="map-frame">

      <div class="map">

        <!-- 航線 -->
        <svg
          class="route-svg"
          viewBox="0 0 1000 900"
          preserveAspectRatio="none"
        >

        <!-- 班級管理島 -->
        <button

        <button

        <!-- 活動島 -->
        <button

          onclick="openPanel('activity')"

          <div class="island-desc">

        <!-- 生活島 -->

  <!-- 彈出面板 -->
  <div
    class="panel-backdrop"
    id="panelBackdrop"
    onclick="closePanelByBackdrop(event)"
  >

    <div class="tool-panel">

      <div class="panel-header">

        <div class="panel-title-wrap">

          <div
            class="panel-big-icon"
            id="panelIcon"
          >
            🏝️
          </div>

          <div>

            <div
              class="panel-title"
              id="panelTitle"
            >
              班級管理島
            </div>

            <div
              class="panel-subtitle"
              id="panelSubtitle"
            >
              選擇要前往的系統
            </div>

          </div>

        </div>

        <button
          class="close-btn"
          onclick="closePanel()"
          aria-label="關閉"
        >
          ✕
        </button>

      </div>

      <div
        class="tool-list"
        id="toolList"
      >
      </div>

    </div>

  </div>


  <footer>

    <div class="footer-title">
      ⚓ TEACHER GRAND LINE
    </div>

    <div class="footer-text">
      教師專屬航海工具地圖
      <br>
      Keep Sailing · Keep Teaching
    </div>

  </footer>


  <script>

    const sections = {

      class: {
        title: "班級管理島",
        subtitle: "收繳、學生平台與管理後台",
        icon: "🏝️",

        tools: [

          {
            name: "導師班資料繳交系統",
            desc: "管理導師班學生資料與各項繳交紀錄。",
            icon: "📋",
            className: "t-class",
            url: "https://junteachlife.github.io/luckyscratch/class-tracker.html"
          },

          {
            name: "任課班資料繳交系統",
            desc: "查看與管理各任課班級學生繳交狀況。",
            icon: "📚",
            className: "t-subclass",
            url: "https://junteachlife.github.io/luckyscratch/subclass-tracker.html"
          },

          {
            name: "學生作業成績繳交平台",
            desc: "學生登入後使用作業與成績登記功能。",
            icon: "👨‍🎓",
            className: "t-studentwork",
            url: "https://junteachlife.github.io/luckyscratch/class-work.html"
          },

          {
            name: "作業成績彙整後台",
            desc: "管理帳號、權限、作業、成績與操作紀錄。",
            icon: "🧾",
            className: "t-admin",
            url: "https://junteachlife.github.io/luckyscratch/class-datawork-admin.html"
          }

        ]
      },


      learning: {
        title: "學習成績島",
        subtitle: "數學學習與段考成績查詢",
        icon: "📚",

        tools: [

          {
            name: "學生段考成績查詢系統",
            desc: "查詢段考成績、平均、排名與學習表現。",
            icon: "📊",
            className: "t-exam",
            url: "https://junteachlife.github.io/luckyscratch/examscore.html"
          },

          {
            name: "數學練習網站",
            desc: "數學遊戲、線上練習與各類題型挑戰。",
            icon: "🎮",
            className: "t-math",
            url: "https://junteachlife.github.io/mathteach/"
          }

        ]
      },


      activity: {
        title: "教學活動島",
        subtitle: "課堂互動與班級活動工具",
        icon: "🎪",

        tools: [

          {
            name: "刮刮樂網站",
            desc: "課堂抽獎、幸運挑戰與獎勵活動。",
            icon: "🎟️",
            className: "t-scratch",
            url: "https://junteachlife.github.io/luckyscratch/mixscratch.html"
          },

          {
            name: "座位系統",
            desc: "班級座位安排、學生位置與座位調整。",
            icon: "💺",
            className: "t-seat",
            url: "https://junteachlife.github.io/luckyscratch/seat.html"
          }

        ]
      },


      life: {
        title: "學生生活島",
        subtitle: "班級日常與學生生活管理",
        icon: "🌴",

        tools: [

          {
            name: "聯絡簿登記系統",
            desc: "整理每日聯絡事項、作業與班級提醒。",
            icon: "📒",
            className: "t-contact",
            url: "https://junteachlife.github.io/luckyscratch/contact-book.html"
          },

          {
            name: "生日提醒系統",
            desc: "查看今日、近期與每月壽星並製作祝福。",
            icon: "🎂",
            className: "t-birthday",
            url: "https://junteachlife.github.io/luckyscratch/birthday.html"
          },

          {
            name: "跑步系統",
            desc: "登記學生跑步圈數與查看累積成果。",
            icon: "🏃",
            className: "t-running",
            url: "https://junteachlife.github.io/luckyscratch/running.html"
          }

        ]
      },


      external: {
        title: "外部工具港口",
        subtitle: "連接其他常用平台",
        icon: "⚓",

        tools: [

          {
            name: "ClassDojo",
            desc: "班級經營、學生互動與親師聯繫平台。",
            icon: "🏫",
            className: "t-dojo",
            url: "https://www.classdojo.com/"
          }

        ]
      }

    };


    function openPanel(sectionKey) {

      const section = sections[sectionKey];

      if (!section) return;

      document.getElementById("panelTitle").textContent =
        section.title;

      document.getElementById("panelSubtitle").textContent =
        section.subtitle;

      document.getElementById("panelIcon").textContent =
        section.icon;


      const toolList =
        document.getElementById("toolList");


      toolList.innerHTML =
        section.tools
          .map(tool => {

            return `
              <a
                class="tool-link ${tool.className}"
                href="${tool.url}"
                target="_blank"
                rel="noopener noreferrer"
              >

                <div class="tool-icon">
                  ${tool.icon}
                </div>

                <div class="tool-info">

                  <div class="tool-name">
                    ${tool.name}
                  </div>

                  <div class="tool-desc">
                    ${tool.desc}
                  </div>

                </div>

                <div class="tool-open">
                  ↗
                </div>

              </a>
            `;

          })
          .join("");


      document
        .getElementById("panelBackdrop")
        .classList
        .add("show");


      document.body.style.overflow =
        "hidden";

    }


    function closePanel() {

      document
        .getElementById("panelBackdrop")
        .classList
        .remove("show");


      document.body.style.overflow =
        "";

    }


    function closePanelByBackdrop(event) {

      if (
        event.target.id ===
        "panelBackdrop"
      ) {

        closePanel();

      }

    }


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closePanel();

        }

      }
    );

  </script>

</body>
</html>
