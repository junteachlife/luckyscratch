<style>
:root{
  --blue:#304b84;
  --blue-dark:#1f315a;
  --gold:#d39f26;
  --gold-dark:#946406;
  --cream:#fffaf0;
  --text:#443920;
  --shadow:0 16px 38px rgba(45,42,75,.18);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;

  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(255,255,255,.9) 0 3px,
      transparent 4px
    ),
    linear-gradient(
      145deg,
      #fffaf0,
      #efe3c2
    );
}

button{
  font:inherit;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none !important;
}

.app{
  width:min(1320px,100%);
  margin:auto;
  padding:18px 14px 55px;
  text-align:center;
}


/* =========================================================
   學生身分
========================================================= */

.login-panel{
  width:min(900px,100%);
  margin:0 auto 18px;
  padding:18px;

  border-radius:20px;

  background:rgba(255,255,255,.88);

  border:2px solid rgba(190,155,70,.16);

  box-shadow:
    0 8px 22px rgba(70,55,25,.09);
}

.login-title{
  color:#304b84;
  font-size:20px;
  font-weight:1000;
}

.login-tip{
  margin:7px 0 14px;

  color:#6f603f;

  font-size:13px;
  font-weight:800;
  line-height:1.6;
}

.identity-form{
  width:min(540px,100%);
  margin:0 auto;

  display:grid;
  grid-template-columns:1fr 1.5fr auto;
  gap:10px;
  align-items:end;
}

.identity-field{
  text-align:left;
}

.identity-field label{
  display:block;
  margin:0 0 5px 4px;

  color:#6d5730;
  font-size:13px;
  font-weight:1000;
}

.identity-field select,
.identity-name-box{
  width:100%;
  min-height:48px;

  padding:10px 13px;

  border:2px solid #d6c18b;
  border-radius:14px;

  background:#fffdf7;
  color:#304b84;

  font-size:17px;
  font-weight:1000;
}

.identity-name-box{
  display:flex;
  align-items:center;
}

.identity-status{
  margin-top:11px;

  color:#8b6924;

  font-size:13px;
  font-weight:900;
}

.identity-status.error{
  color:#a43c3c;
}

.identity-status.ok{
  color:#26714b;
}

.selected-student{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.selected-student-badge{
  padding:11px 18px;

  border-radius:999px;

  color:#fff;
  background:linear-gradient(#5879bd,#304b84);

  font-size:18px;
  font-weight:1000;

  box-shadow:0 5px 0 #1e3159;
}

.current-player-banner{
  width:min(780px,100%);
  margin:0 auto 14px;
  padding:14px 18px;

  position:sticky;
  top:8px;
  z-index:9000;

  border:3px solid #f0d37a;
  border-radius:18px;

  background:rgba(255,253,244,.96);

  color:#304b84;

  font-size:clamp(18px,3vw,24px);
  font-weight:1000;

  box-shadow:0 9px 22px rgba(50,45,70,.17);
}

@media(max-width:650px){
  .identity-form{
    grid-template-columns:1fr;
  }

  .identity-form .btn{
    width:100%;
  }
}


/* =========================================================
   按鈕
========================================================= */

.btn{
  border:0;
  border-radius:999px;

  padding:12px 23px;

  color:white;

  font-weight:1000;

  cursor:pointer;

  background:
    linear-gradient(
      #5879bd,
      #304b84
    );

  box-shadow:
    0 6px 0 #1e3159,
    0 10px 18px rgba(45,45,75,.14);

  transition:
    transform .15s,
    opacity .15s,
    filter .15s;
}

.btn:hover{
  filter:brightness(1.05);
}

.btn:active{
  transform:translateY(4px);
}

.btn.gold{
  color:#624500;

  background:
    linear-gradient(
      #ffe79d,
      #edb840
    );

  box-shadow:
    0 6px 0 #aa7714,
    0 10px 18px rgba(80,55,10,.14);
}

.btn.light{
  color:#594a2e;

  background:
    linear-gradient(
      #fffdf7,
      #e9dfc8
    );

  box-shadow:
    0 5px 0 #b5a485;
}

.btn.records{
  background:
    linear-gradient(
      #6f66af,
      #4c467f
    );

  box-shadow:
    0 6px 0 #36315d;
}

.btn.danger{
  padding:10px 18px;

  color:#664c24;

  background:
    linear-gradient(
      #faf4df,
      #e4d2a8
    );

  box-shadow:
    0 5px 0 #a99772;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =========================================================
   音樂控制
========================================================= */

.sound-control{
  position:fixed;

  right:18px;
  bottom:18px;

  z-index:999999;

  border:0;
  border-radius:999px;

  padding:11px 16px;

  cursor:pointer;

  color:white;

  font-size:14px;
  font-weight:1000;

  background:
    linear-gradient(
      #6e7fbc,
      #344c85
    );

  box-shadow:
    0 6px 0 #21345e,
    0 10px 22px rgba(40,45,75,.20);
}

.sound-control:active{
  transform:translateY(4px);
}

.music-tip{
  position:fixed;

  right:18px;
  bottom:78px;

  z-index:999998;

  max-width:250px;

  padding:8px 12px;

  border-radius:12px;

  background:rgba(255,255,255,.94);

  color:#6c5424;

  font-size:12px;
  font-weight:900;

  box-shadow:
    0 6px 15px rgba(50,40,20,.12);

  pointer-events:none;

  transition:opacity .5s;
}

.music-tip.hide{
  opacity:0;
}


/* =========================================================
   首頁
========================================================= */

.home-title{
  margin:10px 0 5px;

  color:#30466f;

  font-size:clamp(34px,6vw,58px);
  font-weight:1000;

  text-shadow:
    0 3px 0 white,
    0 6px 12px rgba(40,45,70,.12);
}

.home-subtitle{
  margin:0 0 24px;

  color:#77561d;

  font-size:clamp(15px,2.5vw,20px);
  font-weight:900;
}

.mode-grid{
  width:min(900px,100%);
  margin:25px auto;

  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:25px;
}

.mode-card{
  min-height:320px;

  padding:28px;

  border:6px solid white;
  border-radius:30px;

  cursor:pointer;

  box-shadow:var(--shadow);

  transition:
    transform .22s,
    box-shadow .22s;
}

.mode-card:hover{
  transform:translateY(-7px);

  box-shadow:
    0 22px 42px rgba(45,42,75,.24);
}

.mode-card.silver{
  color:#fff8d9;

  background:
    linear-gradient(
      150deg,
      #6d87c6,
      #405b95 55%,
      #242c59
    );

  border-color:#f0d37a;
}

.mode-card.gold{
  color:#fffbea;

  background:
    linear-gradient(
      150deg,
      #ffe48a,
      #d4a128 50%,
      #976607
    );

  border-color:#fff0ad;
}

.mode-icon{
  font-size:88px;
}

.mode-title{
  margin-top:8px;

  font-size:clamp(30px,4.5vw,42px);
  font-weight:1000;
}

.mode-text{
  margin-top:14px;

  font-size:16px;
  font-weight:900;
  line-height:1.65;
}

.home-tools{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:12px;

  margin-top:12px;
}


/* =========================================================
   遊戲標題
========================================================= */

.game-header{
  width:min(900px,100%);
  margin:auto;
}

.back-row{
  display:flex;
  justify-content:flex-start;

  margin-bottom:8px;
}

.game-title{
  margin:4px 0 5px;

  font-size:clamp(32px,5vw,50px);
  font-weight:1000;
}

.game-title.silver{
  color:#304b84;
}

.game-title.gold{
  color:#946507;
}

.info-bar{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:9px;

  margin:12px 0 15px;
}

.info-chip{
  padding:8px 15px;

  border-radius:999px;

  background:rgba(255,255,255,.78);

  border:2px solid rgba(200,165,75,.18);

  font-size:14px;
  font-weight:900;
}

.info-chip strong{
  color:#304b84;
  font-size:17px;
}


/* =========================================================
   舞台
========================================================= */

.stage{
  position:relative;

  min-height:560px;

  padding:24px;

  border-radius:30px;

  background:rgba(255,255,255,.52);

  border:3px solid rgba(175,137,51,.12);

  box-shadow:
    inset 0 0 50px rgba(255,255,255,.75),
    var(--shadow);

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.stage.spread-stage{
  min-height:760px;

  align-items:flex-start;

  padding:18px 8px 25px;

  overflow:visible;
}

.hint{
  min-height:30px;

  margin:15px 0 11px;

  color:#73531b;

  font-size:clamp(16px,2.5vw,20px);
  font-weight:1000;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:12px;
}


/* =========================================================
   獎項一覽
========================================================= */

.prize-section{
  width:min(980px,100%);

  margin:28px auto 0;
  padding:20px;

  border-radius:26px;

  background:rgba(255,255,255,.77);

  border:3px solid rgba(190,150,55,.15);

  box-shadow:
    0 12px 28px rgba(65,50,25,.10);
}

.prize-section.silver{
  border-color:rgba(67,91,150,.22);
}

.prize-section.gold{
  border-color:rgba(196,143,20,.28);
}

.prize-section-title{
  margin:0 0 5px;

  color:#304b84;

  font-size:clamp(24px,4vw,32px);
  font-weight:1000;
}

.prize-section.gold
.prize-section-title{
  color:#956607;
}

.prize-section-subtitle{
  margin:0 0 16px;

  color:#776543;

  font-size:13px;
  font-weight:900;
}

.prize-list{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.prize-item{
  display:grid;

  grid-template-columns:
    58px 1fr auto;

  align-items:center;

  gap:11px;

  min-height:86px;

  padding:11px 13px;

  border-radius:17px;

  background:rgba(255,250,239,.95);

  border:2px solid rgba(180,145,60,.12);

  text-align:left;
}

.prize-section.silver
.prize-item{
  background:
    linear-gradient(
      135deg,
      #f8faff,
      #edf1fc
    );
}

.prize-section.gold
.prize-item{
  background:
    linear-gradient(
      135deg,
      #fffdee,
      #fff3c3
    );
}

.prize-item-icon{
  width:58px;
  height:58px;

  display:flex;
  justify-content:center;
  align-items:center;

  border-radius:15px;

  background:rgba(255,255,255,.8);

  font-size:34px;
}

.prize-item-name{
  color:#304b84;

  font-size:17px;
  font-weight:1000;
}

.prize-section.gold
.prize-item-name{
  color:#8e6105;
}

.prize-item-description{
  margin-top:3px;

  color:#73664d;

  font-size:12px;
  font-weight:800;
  line-height:1.45;
}

.prize-item-count{
  min-width:50px;

  padding:7px 9px;

  border-radius:999px;

  background:#304b84;

  color:white;

  font-size:13px;
  font-weight:1000;

  text-align:center;
}

.prize-section.gold
.prize-item-count{
  background:#a6750b;
}

.prize-total-box{
  margin-top:14px;

  padding:11px 15px;

  border-radius:15px;

  background:rgba(246,238,214,.7);

  color:#69511e;

  font-size:14px;
  font-weight:1000;
}


/* =========================================================
   卡片
========================================================= */

.ticket-face{
  position:relative;

  width:100%;
  height:100%;

  border-radius:inherit;

  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.ticket-face::before,
.ticket-face::after{
  content:"✦";

  position:absolute;

  color:rgba(255,255,255,.22);

  font-size:56px;
}

.ticket-face::before{
  left:8px;
  top:8px;
}

.ticket-face::after{
  right:8px;
  bottom:8px;
}

.ticket-face.silver{
  color:#fff7d6;

  background:
    linear-gradient(
      155deg,
      #667fc0,
      #3d558e 55%,
      #292d5f
    );

  border:3px solid #f2c75c;
}

.ticket-face.gold{
  color:#fffbea;

  background:
    linear-gradient(
      155deg,
      #ffe48b,
      #d4a028 48%,
      #946506
    );

  border:3px solid #fff1b8;
}

.ticket-icon{
  font-size:55px;
}

.ticket-title{
  margin-top:6px;

  font-size:30px;
  font-weight:1000;

  line-height:1.08;
}

.ticket-text{
  margin-top:8px;

  font-size:10px;
  font-weight:900;

  letter-spacing:1.5px;
}


/* =========================================================
   疊牌
========================================================= */

.deck{
  position:relative;

  width:min(285px,68vw);

  aspect-ratio:2/3;
}

.deck-card{
  position:absolute;
  inset:0;

  border-radius:22px;

  border:5px solid white;

  background:white;

  box-shadow:
    0 11px 25px rgba(45,40,70,.22);
}

.deck-card:nth-child(1){
  transform:translate(-24px,13px) rotate(-7deg);
}

.deck-card:nth-child(2){
  transform:translate(-17px,9px) rotate(-5deg);
}

.deck-card:nth-child(3){
  transform:translate(-10px,5px) rotate(-3deg);
}

.deck-card:nth-child(4){
  transform:translate(-4px,2px) rotate(-1deg);
}

.deck-card:nth-child(5){
  transform:translate(4px,2px) rotate(1deg);
}

.deck-card:nth-child(6){
  transform:translate(10px,5px) rotate(3deg);
}

.deck-card:nth-child(7){
  transform:translate(17px,9px) rotate(5deg);
}

.deck-card:nth-child(8){
  transform:translate(24px,13px) rotate(7deg);
}


/* =========================================================
   洗牌動畫
========================================================= */

.shuffle-table{
  position:relative;

  width:520px;
  height:470px;
}

.shuffle-hand{
  position:absolute;

  width:105px;
  height:140px;

  border-radius:55% 55% 45% 45%;

  background:
    linear-gradient(
      155deg,
      #f1c29f,
      #d89b73
    );

  opacity:.9;

  z-index:40;
}

.shuffle-hand::after{
  content:"";

  position:absolute;

  width:42px;
  height:115px;

  top:-34px;
  left:31px;

  border-radius:30px;

  background:inherit;
}

.shuffle-hand.left{
  left:48px;
  top:165px;

  animation:
    handLeft 1.45s ease-in-out infinite;
}

.shuffle-hand.right{
  right:48px;
  top:116px;

  animation:
    handRight 1.45s ease-in-out infinite;
}

@keyframes handLeft{
  0%,100%{
    transform:
      translateY(13px)
      rotate(20deg);
  }

  50%{
    transform:
      translateY(-12px)
      rotate(15deg);
  }
}

@keyframes handRight{
  0%,100%{
    transform:
      translateY(-12px)
      rotate(-20deg);
  }

  50%{
    transform:
      translateY(13px)
      rotate(-15deg);
  }
}

.shuffle-stack,
.shuffle-drop{
  position:absolute;

  width:180px;
  height:270px;

  border-radius:19px;

  border:5px solid white;

  background:white;

  box-shadow:
    0 12px 25px rgba(45,40,70,.22);
}

.shuffle-stack.upper{
  left:168px;
  top:34px;

  z-index:15;

  animation:
    upperStack 1.45s ease-in-out infinite;
}

.shuffle-stack.lower{
  left:185px;
  top:165px;

  z-index:8;

  animation:
    lowerStack 1.45s ease-in-out infinite;
}

@keyframes upperStack{
  0%,100%{
    transform:
      translateY(-9px)
      rotate(-6deg);
  }

  50%{
    transform:
      translateY(11px)
      rotate(-3deg);
  }
}

@keyframes lowerStack{
  0%,100%{
    transform:
      translateY(8px)
      rotate(5deg);
  }

  50%{
    transform:
      translateY(-7px)
      rotate(3deg);
  }
}

.shuffle-drop{
  width:168px;
  height:252px;

  left:177px;
  top:75px;

  z-index:12;

  opacity:0;
}

.shuffle-drop.p1{
  animation:
    overhand1 1.75s ease-in-out infinite;
}

.shuffle-drop.p2{
  animation:
    overhand2 1.75s ease-in-out infinite;
}

.shuffle-drop.p3{
  animation:
    overhand3 1.75s ease-in-out infinite;
}

.shuffle-drop.p4{
  animation:
    overhand4 1.75s ease-in-out infinite;
}

@keyframes overhand1{
  0%{
    opacity:0;
    transform:translate(28px,-95px);
  }

  7%{
    opacity:1;
  }

  28%{
    opacity:1;
    transform:translate(-1px,66px);
  }

  34%,100%{
    opacity:0;
  }
}

@keyframes overhand2{
  0%,22%{
    opacity:0;
  }

  29%{
    opacity:1;
    transform:translate(25px,-92px);
  }

  50%{
    opacity:1;
    transform:translate(1px,72px);
  }

  56%,100%{
    opacity:0;
  }
}

@keyframes overhand3{
  0%,45%{
    opacity:0;
  }

  52%{
    opacity:1;
    transform:translate(20px,-88px);
  }

  73%{
    opacity:1;
    transform:translate(-2px,78px);
  }

  79%,100%{
    opacity:0;
  }
}

@keyframes overhand4{
  0%,68%{
    opacity:0;
  }

  75%{
    opacity:1;
    transform:translate(17px,-85px);
  }

  95%{
    opacity:1;
    transform:translate(2px,84px);
  }

  100%{
    opacity:0;
  }
}

.shuffle-label{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  color:#6e531d;

  font-size:20px;
  font-weight:1000;
}


/* =========================================================
   攤牌
========================================================= */

.spread-board{
  width:100%;

  display:flex;
  flex-direction:column;

  gap:24px;

  padding:10px 0 20px;
}

.spread-row{
  position:relative;

  width:min(1180px,96vw);
  height:175px;

  margin:auto;

  display:flex;
  justify-content:center;

  overflow:visible;
}

.spread-row-inner{
  position:relative;
  height:100%;
}

.spread-card{
  position:absolute;

  top:0;

  width:108px;
  height:162px;

  border-radius:15px;

  border:4px solid white;

  background:white;

  overflow:hidden;

  cursor:pointer;

  box-shadow:
    0 10px 20px rgba(45,40,70,.2);

  transition:
    transform .22s,
    opacity .22s,
    filter .22s;

  animation:
    spreadIn .45s ease both;
}

@keyframes spreadIn{
  from{
    opacity:0;

    transform:
      translateX(-80px)
      scale(.82);
  }

  to{
    opacity:1;
  }
}

.spread-card:hover,
.spread-card:active{
  z-index:9999 !important;

  transform:
    translateY(-12px)
    scale(1.07);
}

.spread-card.selected{
  z-index:99999 !important;

  transform:
    translateY(-24px)
    scale(1.13);
}

.spread-card.dimmed{
  opacity:.13;
  filter:grayscale(.7);

function initAudio(){

  if(
    !audioContext
  ){

    audioContext =
      new(
        window.AudioContext
        ||
        window.webkitAudioContext
      )();


    masterGain =
      audioContext.createGain();


    masterGain.gain.value =
      .55;


    masterGain.connect(
      audioContext.destination
    );

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =========================================================
   單音
========================================================= */

function playTone(
  frequency,
  duration=.15,
  volume=.08,
  type="sine",
  delay=0
){

  if(
    !musicEnabled
  ){

    return;

  }


  initAudio();


  const now =
    audioContext.currentTime
    +
    delay;


  const oscillator =
    audioContext.createOscillator();


  const gain =
    audioContext.createGain();


  oscillator.type =
    type;


  oscillator.frequency.setValueAtTime(
    frequency,
    now
  );


  gain.gain.setValueAtTime(
    .0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.02
  );


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    masterGain
  );


  oscillator.start(
    now
  );


  oscillator.stop(
    now
    +
    duration
    +
    .05
  );

}

  playTone(

    "triangle"
  );


  bgIndex =

    bgMelody.length;

    !raw
  ){

    return result;

  }


  /*
    支援：
    1. {"1":"姓名"}
    2. {"1":{"id":1,"name":"姓名"}}
    3. [{id:1,name:"姓名"}]
  */

  Object
    .entries(
      raw
    )
    .forEach(
      ([key,value]) => {

        if(
          typeof value ===
          "string"
        ){

          result[String(key)] =
            value;

          return;

        }


        if(
          value
          &&
          typeof value ===
          "object"
        ){

          const seat =
            value.id
            ??
            value.seat
            ??
            key;


          const name =
            value.name
            ??
            value.studentName
            ??
            "";


          if(
            name
          ){

            result[String(seat)] =
              String(name);

          }

        }

      }
    );


  return result;

}


async function loadSharedStudents(){

  identityStatus.className =
    "identity-status";

  identityStatus.textContent =
    "正在連線座位系統學生名單……";


  seatSelect.disabled =
    true;

  confirmStudentBtn.disabled =
    true;


  try{

    const snapshot =
      await realtimeGet(
        realtimeRef(
          seatDb,
          "class_804/students"
        )
      );


    if(
      !snapshot.exists()
    ){

      throw new Error(
        "座位系統尚未建立 class_804/students 共用名單"
      );

    }


    studentDirectory =
      normalizeStudentDirectory(
        snapshot.val()
      );


    const seats =
      Object
        .keys(
          studentDirectory
        )
        .sort(
          (a,b) =>
            Number(a)-Number(b)
        );


    if(
      seats.length ===
      0
    ){

      throw new Error(
        "共用學生名單是空的"
      );

    }


    seatSelect.innerHTML = `

      <option value="">
        請選擇座號
      </option>

      ${
        seats
          .map(
            seat => `

              <option value="${seat}">
                ${seat} 號
              </option>

            `
          )
          .join("")
      }

    `;


    seatSelect.disabled =
      false;


    identityStatus.className =
      "identity-status ok";

    identityStatus.textContent =
      `✅ 已載入 ${seats.length} 位學生，請選擇座號。`;

  }


  catch(error){

    console.error(
      "讀取共用學生名單失敗：",
      error
    );


    seatSelect.innerHTML =
      `<option value="">名單讀取失敗</option>`;


    identityStatus.className =
      "identity-status error";


    identityStatus.textContent =
      "⚠️ 無法讀取座位系統共用名單，請確認 class_804/students 與 Realtime Database 規則。";

  }

}

/* =========================================================
   建立獎池
========================================================= */

function createFreshPool(){

  const pool =
    [];


  currentGame
    .prizes
    .forEach(
      prize => {

        for(
          let i=0;
          i<prize.count;
          i++
        ){

          pool.push({

            ...prize,

            serial:
              `${prize.id}-${i+1}`

          });

        }

      }
    );


  return shuffleArray(
    pool
  );

}


/* =========================================================
   Fisher-Yates
========================================================= */

function shuffleArray(
  array
){

  const result =
    [...array];


  for(
    let i=result.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()
        *
        (i+1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =========================================================
   載入獎池
========================================================= */

function loadPool(){

  const saved =
    localStorage.getItem(
      currentGame.storageKey
    );


  if(
    saved
  ){

    try{

      const parsed =
        JSON.parse(
          saved
        );


      if(
        Array.isArray(
          parsed
        )
      ){

        prizePool =
          parsed;

      }

      else{

        prizePool =
          createFreshPool();

      }

    }

    catch{

      prizePool =
        createFreshPool();

    }

  }

  else{

    prizePool =
      createFreshPool();

  }


  savePool();

}

/* =========================================================
   攤牌
========================================================= */

function dealHorizontalRows(){

  stage
    .classList
    .add(
      "spread-stage"
    );


  const rows =
    [];


  for(
    let i=0;
    i<prizePool.length;
    i+=10
  ){

    rows.push(
      prizePool.slice(
        i,
        i+10
      )
    );

  }


  let globalIndex =
    0;


  let html =
    "";


  rows.forEach(
    row => {

      let cardWidth =
        108;


      let overlap =
        56;


      if(
        window.innerWidth <=
        900
      ){

        cardWidth =
          92;

        overlap =
          47;

      }


      if(
        window.innerWidth <=
        650
      ){

        cardWidth =
          76;

        overlap =
          38;

      }


      const rowWidth =
        cardWidth

        +

        Math.max(
          0,
          row.length-1
        )

        *

        overlap;


      let rowHTML =
        "";


      row.forEach(
        (
          prize,
          localIndex
        ) => {

          const delay =
            Math.min(
              globalIndex
              *
              .025,
              .7
            );


          rowHTML += `

            <div
              class="spread-card"

              data-index="${globalIndex}"

              style="
                left:
                ${
                  localIndex
                  *
                  overlap
                }px;

                z-index:
                ${localIndex+1};

                animation-delay:
                ${delay}s;
              "
            >

              <div class="spread-number">

                ${globalIndex+1}

              </div>


              ${ticketFaceHTML()}

            </div>

          `;


          globalIndex++;

        }
      );


      html += `

        <div class="spread-row">

          <div
            class="spread-row-inner"

            style="
              width:${rowWidth}px;
            "
          >

            ${rowHTML}

          </div>

        </div>

      `;

    }
  );


  stage.innerHTML = `

    <div class="spread-board">

      ${html}

    </div>

  `;


  hint.textContent =
    `全部 ${prizePool.length} 張已攤開，請挑一張！ 👆`;


  /*
    ★ 準備抽牌音效
  */

  playReadySound();


  document
    .querySelectorAll(
      ".spread-card"
    )
    .forEach(
      card => {

        card.addEventListener(
          "click",
          () => {

            selectCard(
              card
            );

          }
        );

      }
    );

}

  `;


  hint.textContent =
    "開始刮吧！獎項就在塗層下面！";


  initScratch();

}


/* =========================================================
   刮除層
========================================================= */

function initScratch(){

  const canvas =
    document.getElementById(
      "scratchCanvas"
    );


  const area =
    document.getElementById(
      "scratchArea"
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  const rect =
    area.getBoundingClientRect();


  const dpr =
    Math.max(
      1,
      window.devicePixelRatio
      ||
      1
    );


  canvas.width =
    Math.round(
      rect.width
      *
      dpr
    );


  canvas.height =
    Math.round(
      rect.height
      *
      dpr
    );


  canvas.style.width =
    "100%";


  canvas.style.height =
    "100%";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      rect.width,
      rect.height
    );


  if(
    currentGame.key ===
    "silver"
  ){

    gradient.addColorStop(
      0,
      "#858d96"
    );

    gradient.addColorStop(
      .15,
      "#e9edf0"
    );

    gradient.addColorStop(
      .32,
      "#a5abb2"
    );

    gradient.addColorStop(
      .48,
      "#f7f8f8"
    );

    gradient.addColorStop(
      .65,
      "#a3a8af"
    );

    gradient.addColorStop(
      .82,
      "#e2e5e8"
    );

    gradient.addColorStop(
      1,
      "#8d949d"
    );

  }

  else{

    gradient.addColorStop(
      0,
      "#91640d"
    );

    gradient.addColorStop(
      .14,
      "#ffe999"
    );

    gradient.addColorStop(
      .31,
      "#bd8612"
    );

    gradient.addColorStop(
      .48,
      "#fff3b7"
    );

    gradient.addColorStop(
      .65,
      "#c58e19"
    );

    gradient.addColorStop(
      .82,
      "#ffe68a"
    );

    gradient.addColorStop(
      1,
      "#946406"
    );

  }


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );


  ctx.fillStyle =
    "rgba(255,255,255,.3)";


  for(
    let i=0;
    i<95;
    i++
  ){

    ctx.beginPath();


    ctx.arc(

      Math.random()
      *
      rect.width,

      Math.random()
      *
      rect.height,

      Math.random()
      *
      2.5
      +
      .4,

      0,

      Math.PI
      *
      2

    );


    ctx.fill();

  }


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillStyle =
    "rgba(255,255,255,.88)";


  ctx.font =
    "900 27px sans-serif";


  ctx.fillText(

    "✨ 刮 開 看 看 ✨",

    rect.width/2,

    rect.height/2-12

  );


  ctx.font =
    "900 14px sans-serif";


  ctx.fillText(

    "SCRATCH HERE",

    rect.width/2,

    rect.height/2+26

  );


  ctx.globalCompositeOperation =
    "destination-out";


  let drawing =
    false;


  let lastPoint =
    null;


  let moveCounter =
    0;


  function point(
    event
  ){

    const canvasRect =
      canvas.getBoundingClientRect();


    return{

      x:
        event.clientX
        -
        canvasRect.left,

      y:
        event.clientY
        -
        canvasRect.top

    };

  }


  function erase(
    x,
    y
  ){

    ctx.beginPath();


    ctx.arc(
      x,
      y,
      14,
      0,
      Math.PI*2
    );


    ctx.fill();

  }


  function start(
    event
  ){

    drawing =
      true;


    lastPoint =
      point(
        event
      );


    erase(
      lastPoint.x,
      lastPoint.y
    );


    try{

      canvas.setPointerCapture(
        event.pointerId
      );

    }

    catch{}

  }


  function move(
    event
  ){

    if(
      !drawing
    ){

      return;

    }


    event.preventDefault();


    const p =
      point(
        event
      );


    if(
      lastPoint
    ){

      const dx =
        p.x
        -
        lastPoint.x;


      const dy =
        p.y
        -
        lastPoint.y;


      const distance =
        Math.sqrt(
          dx*dx
          +
          dy*dy
        );


      const steps =
        Math.max(
          1,
          Math.ceil(
            distance/6
          )
        );


      for(
        let i=0;
        i<=steps;
        i++
      ){

        const t =
          i/steps;


        erase(

          lastPoint.x
          +
          dx*t,

          lastPoint.y
          +
          dy*t

        );

      }

    }


    lastPoint =
      p;


    /*
      採用較細刮痕，避免一次刮除太大範圍。
      刮到較高比例後才會自動揭曉。
    */

    moveCounter++;


    if(
      moveCounter % 8 ===
      0
    ){

      checkScratch(
        ctx,
        canvas
      );

    }

  }


  function end(){

    if(
      !drawing
    ){

      return;

    }


    drawing =
      false;


    lastPoint =
      null;


    checkScratch(
      ctx,
      canvas
    );

  }


  canvas.addEventListener(
    "pointerdown",
    start
  );


  canvas.addEventListener(
    "pointermove",
    move
  );


  canvas.addEventListener(
    "pointerup",
    end
  );


  canvas.addEventListener(
    "pointercancel",
    end
  );

}


/* =========================================================
   刮除比例
========================================================= */

function checkScratch(
  ctx,
  canvas
){

  if(
    scratchFinished
  ){

    return;

  }


  const pixels =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    ).data;


  let transparent =
    0;


  let checked =
    0;


  /*
    不逐點全部檢查，
    手機效能會比較好。
  */

  for(
    let i=3;
    i<pixels.length;
    i+=20
  ){

    checked++;


    if(
      pixels[i] <
      20
    ){

      transparent++;

    }

  }


  const ratio =
    transparent
    /
    checked;


  if(
    ratio >=
    .85
  ){

    finishScratch(
      canvas
    );

  }

}


/* =========================================================
   Firebase 紀錄
========================================================= */

async function saveDrawRecord(){

  if(
    !currentStudent
    ||
    !currentGame
    ||
    !currentPrize
  ){

    return;

  }


  await addDoc(

    collection(
      db,
      "drawRecords"
    ),

    {

      seatNumber:
        currentStudent.seatNumber,

      studentName:
        currentStudent.studentName,

      gameType:
        currentGame.key,

      gameName:
        currentGame.name,

      prizeId:
        currentPrize.id,

      prizeName:
        currentPrize.name,

      prizeIcon:
        currentPrize.icon,

      prizeType:
        currentPrize.type,

      remainingAfter:
        prizePool.length,

      redeemed:
        false,

      drawnAt:
        serverTimestamp()

    }

  );

}


/* =========================================================
   刮完
========================================================= */


async function finishScratch(
  canvas
){

  if(
    scratchFinished
  ){

    return;

  }


  scratchFinished =
    true;


  canvas.style.transition =
    "opacity .55s ease";


  canvas.style.opacity =
    "0";


  canvas.style.pointerEvents =
    "none";


  const result =
    document.getElementById(
      "result"
    );


  /*
    ★ 根據獎項播放不同音效
  */

  if(
    currentPrize.type ===
    "none"
  ){

    result.textContent =
      "🍀 再接再厲！下一次一定更幸運！";


    playTryAgainSound();

  }


  else if(
    currentPrize.type ===
    "again"
  ){

    result.textContent =
      "🎟️ 恭喜獲得「再抽一次」！";


    playBonusSound();

  }


  else{

    result.textContent =
      `🎉 恭喜獲得「${currentPrize.name}」！`;


    playPrizeSound();

  }


  resetPoolBtn
    .classList
    .add(
      "hidden"
    );


  saveStatus
    .classList
    .remove(
      "hidden",
      "ok",
      "guest",
      "error"
    );


  /*
    每次完成都寫入 Firebase。
    學生身分來自座位系統共用名單。
  */

  hint.textContent =
    "正在儲存抽獎紀錄……";


  saveStatus.textContent =
    "☁️ 正在寫入 Firebase……";


  try{

    await saveDrawRecord();


    saveStatus
      .classList
      .add(
        "ok"
      );


    saveStatus.textContent =
      `✅ 已記錄：${currentStudent.seatNumber}號 ${currentStudent.studentName}｜${currentGame.name}｜${currentPrize.name}`;


    hint.textContent =
      `本次完成，目前剩餘 ${prizePool.length} 張。`;

  }


  catch(error){

    console.error(
      error
    );


    saveStatus
      .classList
      .add(
        "error"
      );


    saveStatus.textContent =
      "⚠️ 獎項已抽出，但 Firebase 紀錄寫入失敗。";


    hint.textContent =
      "請通知老師確認 Firebase 設定。";

  }


  /*
    再抽一次
  */

  if(
    currentPrize.type ===
    "again"
  ){

    drawAgainBtn
      .classList
      .remove(
        "hidden"
      );


    nextBtn
      .classList
      .add(
        "hidden"
      );

  }

  else{

    nextBtn
      .classList
      .remove(
        "hidden"
      );


    drawAgainBtn
      .classList
      .add(
        "hidden"
      );

  }

}

resetPoolBtn.addEventListener(
  "click",
  () => {

    }


    const confirmed =
      window.confirm(

        `確定要重設「${currentGame.name}」嗎？\n\n`

        +

        `所有已抽出的牌都會恢復，重新變成完整 ${currentGame.total} 張。\n\n`

        +

      !confirmed
    ){

    }

      createFreshPool();

    showDeck(
      true
    );


    playReadySound();

);

    );
